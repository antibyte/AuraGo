name: Build aurago-tui

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            suffix: .exe
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: ""
          - target: x86_64-apple-darwin
            os: macos-latest
            suffix: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            suffix: ""
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tools/aurago-tui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1 (pin refreshed by hand, not by Dependabot)
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build (Windows / macOS)
        if: runner.os != 'Linux' || matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build (Linux from Ubuntu)
        if: runner.os == 'Linux'
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p ../../dist
          cp target/${{ matrix.target }}/release/aurago-tui${{ matrix.suffix }} ../../dist/aurago-tui-${{ matrix.target }}${{ matrix.suffix }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aurago-tui-${{ matrix.target }}
          path: dist/aurago-tui-${{ matrix.target }}${{ matrix.suffix }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: aurago-tui-*
          merge-multiple: true

      - name: Create short SHA
        id: sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Releases (rolling)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: aurago-tui-rolling
          name: aurago-tui Rolling Build (${{ steps.sha.outputs.sha }})
          body: |
            Automated rolling build of `aurago-tui`.
            Downloads:
            - `aurago-tui-x86_64-pc-windows-msvc.exe` → Windows
            - `aurago-tui-x86_64-unknown-linux-gnu` → Linux
            - `aurago-tui-x86_64-apple-darwin` → Intel macOS
            - `aurago-tui-aarch64-apple-darwin` → Apple Silicon macOS
          files: dist/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
