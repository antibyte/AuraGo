name: RTL-SDR receiver

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - internal/rtlsdr/runtime/**
      - .github/workflows/rtl-sdr.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested receiver package to GHCR
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  decoder-tests:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build pinned native receivers and run unit tests
        run: docker build -f internal/rtlsdr/runtime/Dockerfile -t ghcr.io/antibyte/aurago-rtl-sdr:3 .
      - name: Build offline IQ fixtures
        run: docker build -f internal/rtlsdr/runtime/Dockerfile.fixtures -t aurago-rtl-sdr-fixtures .
      - name: Decode analog, stereo and DAB+ IQ without USB or network
        run: docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges:true aurago-rtl-sdr-fixtures

  publish:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: decoder-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish receiver package
        id: receiver
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: internal/rtlsdr/runtime/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/aurago-rtl-sdr:3
          provenance: true
          sbom: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign receiver digest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/aurago-rtl-sdr
          DIGEST: ${{ steps.receiver.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
