name: RTL-SDR receiver

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - internal/rtlsdr/runtime/**
      - .github/workflows/rtl-sdr.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested receiver package to GHCR
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/aurago-rtl-sdr

jobs:
  decoder-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build pinned native receivers and run unit tests
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: internal/rtlsdr/runtime/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ghcr.io/antibyte/aurago-rtl-sdr:4
      - name: Build offline IQ fixtures
        run: docker build --builder default -f internal/rtlsdr/runtime/Dockerfile.fixtures -t aurago-rtl-sdr-fixtures .
      - name: Decode analog, stereo and DAB+ IQ without USB or network
        run: docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges:true aurago-rtl-sdr-fixtures
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested native build by digest
        if: env.PUBLISH == 'true'
        id: receiver
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: internal/rtlsdr/runtime/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: true
          sbom: true
      - name: Export native digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.receiver.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.PUBLISH == 'true'
        with:
          name: sdr-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: decoder-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sdr-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested native receiver digests
        id: receiver
        run: |
          image="${IMAGE,,}"
          sources="$(cd "${RUNNER_TEMP}/digests" && printf "${image}@sha256:%s " *)"
          docker buildx imagetools create -t "${image}:4" ${sources}
          digest="$(docker buildx imagetools inspect "${image}:4" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign receiver digest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/aurago-rtl-sdr
          DIGEST: ${{ steps.receiver.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
