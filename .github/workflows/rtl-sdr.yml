name: RTL-SDR receiver

on:
  pull_request:
    paths:
      - internal/rtlsdr/runtime/**
      - .github/workflows/rtl-sdr.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested receiver package to GHCR
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  decoder-tests:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - name: Build pinned native receivers and run unit tests
        run: docker build -f internal/rtlsdr/runtime/Dockerfile -t ghcr.io/antibyte/aurago-rtl-sdr:2 .
      - name: Build offline IQ fixtures
        run: docker build -f internal/rtlsdr/runtime/Dockerfile.fixtures -t aurago-rtl-sdr-fixtures .
      - name: Decode analog, stereo and DAB+ IQ without USB or network
        run: docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges:true aurago-rtl-sdr-fixtures

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: decoder-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish receiver package
        id: receiver
        uses: docker/build-push-action@v7
        with:
          context: .
          file: internal/rtlsdr/runtime/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/aurago-rtl-sdr:2
          provenance: true
          sbom: true
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Sign receiver digest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/aurago-rtl-sdr
          DIGEST: ${{ steps.receiver.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
