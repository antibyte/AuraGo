name: Native release
run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag, for example v2026.10.30
        required: true
        type: string
      expected_sha:
        description: Expected main commit (optional for manual runs)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: native-release
  cancel-in-progress: false

jobs:
  verify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    steps:
      - name: Validate source and wait for its required checks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" = refs/heads/main ]] || { echo 'Release only reviewed main commits.'; exit 1; }
          [[ "$RELEASE_VERSION" =~ ^v[0-9][0-9A-Za-z._-]*$ ]] || { echo 'Invalid release tag.'; exit 1; }
          [[ -z "$EXPECTED_SHA" || "$EXPECTED_SHA" = "$GITHUB_SHA" ]] || { echo 'main advanced before dispatch; review and retry.'; exit 1; }
          gate=''
          for attempt in $(seq 1 60); do
            gate="$(gh run list --workflow security-gates.yml --commit "$GITHUB_SHA" --event push --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            [ -z "$gate" ] || break
            sleep 5
          done
          [ -n "$gate" ] || { echo 'No Security Gates run exists for this exact source commit.'; exit 1; }
          gh run watch "$gate" --exit-status --interval 20
          training_gate="$(gh run list --workflow training-dataset.yml --commit "$GITHUB_SHA" --event push --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -n "$training_gate" ]; then
            gh run watch "$training_gate" --exit-status --interval 20
          fi

  release:
    needs: verify-source
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      actions: write
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      AURAGO_KEEP_RELEASES: '1'
      PYTHONUTF8: '1'
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Install reviewed UI build dependencies
        run: npm ci --no-audit --no-fund
      - name: Check release dispatch and prepare pinned speech resources
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-release-ci.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell release dispatch checks failed.' }
          ./scripts/test-release-ci.ps1
          $python = & ./scripts/find-release-python.ps1
          & $python scripts/prepare-phonon.py --from-release latest
          if ($LASTEXITCODE -ne 0) { throw 'Cannot prepare verified Phonon resources.' }
      - name: Build all native assets, sign with GitHub identity and publish the verified draft
        shell: pwsh
        run: ./make_release.ps1 -Version $env:RELEASE_VERSION
      - name: Start Docker publication for the completed release tag
        shell: pwsh
        run: |
          gh workflow run docker-publish.yml --repo $env:GITHUB_REPOSITORY --ref $env:RELEASE_VERSION -f image=all
          if ($LASTEXITCODE -ne 0) { throw 'Native release published but Docker publication could not be started.' }
