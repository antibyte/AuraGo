name: Training Dataset Gates

on:
  push:
    branches:
      - main
    paths:
      - "disposable/export_tools/**"
      - "disposable/import_training_traces/**"
      - "internal/agent/native_tools*.go"
      - "internal/agent/tool_catalog*.go"
      - "internal/prompts/**"
      - "prompts/tools_manuals/**"
      - "training/**"
      - ".github/workflows/training-dataset.yml"
  pull_request:
    branches:
      - main
    paths:
      - "disposable/export_tools/**"
      - "disposable/import_training_traces/**"
      - "internal/agent/native_tools*.go"
      - "internal/agent/tool_catalog*.go"
      - "internal/prompts/**"
      - "prompts/tools_manuals/**"
      - "training/**"
      - ".github/workflows/training-dataset.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Regeneration, contracts, privacy, and loaders
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: training/requirements.txt

      - name: Verify uv lockfiles
        run: |
          python -m pip install uv==0.11.15
          echo "::group::uv lock --check (training)"
          uv lock --check --project training
          echo "::endgroup::"
          echo "::group::uv lock --check (training/needle3)"
          uv lock --check --project training/needle3
          echo "::endgroup::"

      - name: Install CPU validation dependencies
        run: python -m pip install jsonschema==4.26.0

      - name: Test exporter and explicit trace importer
        run: go test ./disposable/export_tools ./disposable/import_training_traces

      - name: Reject generated artifact drift
        run: go run ./disposable/export_tools --out training --check

      - name: Validate datasets, contracts, splits, hashes, and secret patterns
        run: python training/validate_dataset.py --all

      - name: Check canonical manual router catalog
        run: go run ./disposable/export_tools --manual-router-out training/needle3/catalog.json --check

      - name: Test offline manual selector contracts and spend guards
        run: python -m unittest training.needle3.test_pipeline training.needle3.test_diagnostic training.needle3.test_local_pilot training.needle3.test_category

      - name: Test loaders, templates, masking preconditions, and evaluation
        run: python -m unittest training.test_training_pipeline

      - name: Check Python syntax without loading CUDA
        run: >-
          python -m py_compile
          training/validate_dataset.py
          training/evaluate_tool_calls.py
          training/preflight_models.py
          training/train_unsloth.py
