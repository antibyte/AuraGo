name: Training Dataset Gates

on:
  push:
    branches: [main]
    paths:
      - "disposable/export_tools/**"
      - "disposable/import_training_traces/**"
      - "internal/agent/**"
      - "internal/layerling/**"
      - "internal/prompts/**"
      - "prompts/tools_manuals/**"
      - "go.mod"
      - "go.sum"
      - ".github/agotrain-revision"
      - ".github/workflows/training-dataset.yml"
  pull_request:
    branches: [main]
    paths:
      - "disposable/export_tools/**"
      - "disposable/import_training_traces/**"
      - "internal/agent/**"
      - "internal/layerling/**"
      - "internal/prompts/**"
      - "prompts/tools_manuals/**"
      - "go.mod"
      - "go.sum"
      - ".github/agotrain-revision"
      - ".github/workflows/training-dataset.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Runtime compatibility with pinned agotrain pack
    runs-on: ubuntu-latest
    env:
      AURAGO_TRAINING_DIR: ${{ github.workspace }}/.training/agotrain/training
    steps:
      - name: Checkout AuraGo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned training revision
        id: training
        shell: bash
        run: |
          revision=$(cat .github/agotrain-revision)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Checkout compatible training contracts and artifacts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: antibyte/agotrain
          ref: ${{ steps.training.outputs.revision }}
          path: .training/agotrain
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test exporter, explicit trace importer and Layerling contracts
        run: go test ./disposable/export_tools ./disposable/import_training_traces ./internal/layerling

      - name: Reject generated dataset and manual catalog drift
        run: |
          go run ./disposable/export_tools --out "$AURAGO_TRAINING_DIR" --check
          go run ./disposable/export_tools --source "$AURAGO_TRAINING_DIR" --manual-router-out "$AURAGO_TRAINING_DIR/needle3/catalog.json" --check
