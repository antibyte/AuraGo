name: Build & Push Docker Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      image:
        description: Images to publish
        type: choice
        options:
          - all
          - gods-eye-view
        default: all

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CODE_STUDIO_IMAGE_NAME: ${{ github.repository_owner }}/aurago-code-studio
  COMMANDCODE_IMAGE_NAME: ${{ github.repository_owner }}/aurago-commandcode
  GODS_EYE_IMAGE_NAME: ${{ github.repository_owner }}/aurago-gods-eye-view
  SUPERTONIC_IMAGE_NAME: ${{ github.repository_owner }}/aurago-supertonic

jobs:
  build-and-push:
    name: Build & push multi-arch image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        if: inputs.image != 'gods-eye-view'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Build CodeMirror bundle
        if: inputs.image != 'gods-eye-view'
        run: |
          npm ci --no-audit --no-fund
          node scripts/build-codemirror.js

      # Docker registry requires all-lowercase image names.
      # github.repository may contain uppercase letters (e.g. antibyte/AuraGo).
      - name: Lowercase image name
        run: |
          echo "IMAGE_LC=${IMAGE_NAME,,}" >> "$GITHUB_ENV"
          echo "CODE_STUDIO_IMAGE_LC=${CODE_STUDIO_IMAGE_NAME,,}" >> "$GITHUB_ENV"
          echo "COMMANDCODE_IMAGE_LC=${COMMANDCODE_IMAGE_NAME,,}" >> "$GITHUB_ENV"
          echo "GODS_EYE_IMAGE_LC=${GODS_EYE_IMAGE_NAME,,}" >> "$GITHUB_ENV"
          echo "SUPERTONIC_IMAGE_LC=${SUPERTONIC_IMAGE_NAME,,}" >> "$GITHUB_ENV"

      # Needed for multi-platform (arm64) emulation
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Compute image tags:
      #   push a v* tag        → ghcr.io/antibyte/aurago:<exact-tag> + :latest + :sha-<short>
      # Date-based release tags such as v2026.04.23.3 are intentionally handled
      # as raw refs rather than semver because docker/metadata-action warns on
      # non-semver tag strings.
      - name: Extract metadata (tags, labels)
        if: inputs.image != 'gods-eye-view'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_LC }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push
        if: inputs.image != 'gods-eye-view'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          # Cache layers in the registry to speed up subsequent builds
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_LC }}:buildcache
          cache-to:   type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_LC }}:buildcache,mode=max

      - name: Sign AuraGo image tags
        if: inputs.image != 'gods-eye-view'
        run: |
          while IFS= read -r image; do
            [ -n "$image" ] || continue
            cosign sign --yes "$image"
          done <<< "${{ steps.meta.outputs.tags }}"

      - name: Extract Code Studio metadata (tags, labels)
        if: inputs.image != 'gods-eye-view'
        id: code-studio-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.CODE_STUDIO_IMAGE_LC }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push Code Studio image
        if: inputs.image != 'gods-eye-view'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile.code-studio
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.code-studio-meta.outputs.tags }}
          labels: ${{ steps.code-studio-meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.CODE_STUDIO_IMAGE_LC }}:buildcache
          cache-to:   type=registry,ref=${{ env.REGISTRY }}/${{ env.CODE_STUDIO_IMAGE_LC }}:buildcache,mode=max

      - name: Sign Code Studio image tags
        if: inputs.image != 'gods-eye-view'
        run: |
          while IFS= read -r image; do
            [ -n "$image" ] || continue
            cosign sign --yes "$image"
          done <<< "${{ steps.code-studio-meta.outputs.tags }}"

      - name: Extract CommandCode metadata (tags, labels)
        if: inputs.image != 'gods-eye-view'
        id: commandcode-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.COMMANDCODE_IMAGE_LC }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push CommandCode image
        if: inputs.image != 'gods-eye-view'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: internal/desktopstore/commandcode_assets
          file: internal/desktopstore/commandcode_assets/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.commandcode-meta.outputs.tags }}
          labels: ${{ steps.commandcode-meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.COMMANDCODE_IMAGE_LC }}:buildcache
          cache-to:   type=registry,ref=${{ env.REGISTRY }}/${{ env.COMMANDCODE_IMAGE_LC }}:buildcache,mode=max

      - name: Sign CommandCode image tags
        if: inputs.image != 'gods-eye-view'
        run: |
          while IFS= read -r image; do
            [ -n "$image" ] || continue
            cosign sign --yes "$image"
          done <<< "${{ steps.commandcode-meta.outputs.tags }}"

      - name: Build and push God's Eye View image
        id: gods-eye-build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: internal/desktopstore/gods_eye_assets
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.GODS_EYE_IMAGE_LC }}:gev-7596522-1
          provenance: true
          sbom: true
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.GODS_EYE_IMAGE_LC }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.GODS_EYE_IMAGE_LC }}:buildcache,mode=max

      - name: Sign God's Eye View image
        env:
          IMAGE_DIGEST: ${{ steps.gods-eye-build.outputs.digest }}
        run: cosign sign --yes "${REGISTRY}/${GODS_EYE_IMAGE_LC}@${IMAGE_DIGEST}"

      - name: Verify God's Eye View signature
        env:
          IMAGE_DIGEST: ${{ steps.gods-eye-build.outputs.digest }}
        run: >-
          cosign verify
          --certificate-oidc-issuer https://token.actions.githubusercontent.com
          --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}"
          "${REGISTRY}/${GODS_EYE_IMAGE_LC}@${IMAGE_DIGEST}"

      - name: Extract Supertonic metadata (tags, labels)
        if: inputs.image != 'gods-eye-view'
        id: supertonic-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.SUPERTONIC_IMAGE_LC }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push Supertonic image
        if: inputs.image != 'gods-eye-view'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile.supertonic
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.supertonic-meta.outputs.tags }}
          labels: ${{ steps.supertonic-meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.SUPERTONIC_IMAGE_LC }}:buildcache
          cache-to:   type=registry,ref=${{ env.REGISTRY }}/${{ env.SUPERTONIC_IMAGE_LC }}:buildcache,mode=max

      - name: Sign Supertonic image tags
        if: inputs.image != 'gods-eye-view'
        run: |
          while IFS= read -r image; do
            [ -n "$image" ] || continue
            cosign sign --yes "$image"
          done <<< "${{ steps.supertonic-meta.outputs.tags }}"
