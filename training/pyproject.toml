[project]
name = "aurago-tool-training"
version = "2.0.0"
description = "Reproducible AuraGo native tool-calling dataset validation and Unsloth SFT"
requires-python = ">=3.11,<3.14"
dependencies = [
    "accelerate>=1.10,<2",
    "bitsandbytes>=0.49,<0.51",
    "datasets>=4.0,<5",
    "huggingface-hub>=0.34,<2",
    "jsonschema>=4.25,<5",
    "peft>=0.17,<0.19",
    "protobuf>=5,<7",
    "sentencepiece>=0.2,<0.3",
    "torch>=2.7,<2.12",
    "trackio>=0.8,<1",
    "transformers>=4.51,<4.58",
    "trl>=0.24,<0.25",
    "unsloth==2026.7.5",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
