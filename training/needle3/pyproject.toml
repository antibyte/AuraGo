[project]
name = "aurago-needle3"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "cactus-needle @ git+https://github.com/cactus-compute/needle@42bf1f2d0a7784b0d4d1ec94bb5ade425cf9a67c",
  "numpy>=2.2,<3",
  "sentencepiece>=0.2,<0.3",
  "huggingface-hub>=0.34,<2",
  "safetensors>=0.6,<1",
  "lingua-language-detector>=2.1,<3",
]

[dependency-groups]
retrieval = ["sentence-transformers>=5,<6"]
train = ["jax[cuda12]>=0.6; sys_platform == 'linux'", "flax>=0.10.2", "optax>=0.2"]
cpu-train = ["jax>=0.6", "flax>=0.10.2", "optax>=0.2"]
transfer = ["boto3>=1.40,<2"]

[tool.uv]
package = false
conflicts = [[{group = "train"}, {group = "cpu-train"}]]
