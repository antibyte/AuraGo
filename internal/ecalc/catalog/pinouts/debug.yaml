  name: {cs: "OBD-II (SAE J1962)", da: "OBD-II (SAE J1962)", de: "OBD-II (SAE J1962)", el: "OBD-II (SAE J1962)", en: "OBD-II (SAE J1962)", es: "OBD-II (SAE J1962)", fr: "OBD-II (SAE J1962)", hi: "OBD-II (SAE J1962)", it: "OBD-II (SAE J1962)", ja: "OBD-II (SAE J1962)", nl: "OBD-II (SAE J1962)", no: "OBD-II (SAE J1962)", pl: "OBD-II (SAE J1962)", pt: "OBD-II (SAE J1962)", sv: "OBD-II (SAE J1962)", zh: "OBD-II (SAE J1962)"}
  doc: {en: "The 16-way diagnostic connector of road vehicles under SAE J1962 and ISO 15031-3. The drawing shows the vehicle's socket, looking into it with the wide side up; the other view is the tester's plug.", de: "Der 16-polige Diagnoseanschluss von Straßenfahrzeugen nach SAE J1962 und ISO 15031-3. Die Zeichnung zeigt die Buchse im Fahrzeug, von vorn gesehen mit der breiten Seite oben; die andere Ansicht ist der Stecker des Testers."}
  notes: {en: "Pin 16 stays live with the ignition off: nominally 12 V on a type A connector and 24 V on type B. Fuse your own adapter. Pins 2, 6, 7, 10, 14 and 15 carry their listed signal only if the vehicle uses that protocol for OBD; otherwise the manufacturer may use them for something else. A few vehicles are reported to lack pin 5: use pin 4 for ground there.", de: "Pin 16 bleibt auch bei ausgeschalteter Zündung unter Spannung: nominal 12 V beim Typ A und 24 V beim Typ B. Den eigenen Adapter absichern. Die Pins 2, 6, 7, 10, 14 und 15 führen das genannte Signal nur, wenn das Fahrzeug dieses Protokoll für OBD nutzt; sonst darf der Hersteller sie anders verwenden. Bei wenigen Fahrzeugen fehlt Berichten zufolge Pin 5: Dort Pin 4 als Masse nehmen."}
  tags: [obd, obd2, obdii, "obd-ii", eobd, j1962, "sae j1962", "iso 15031-3", dlc, diagnose, diagnostic, auto, car, fahrzeug, kfz, can, "k-line", "k-leitung", "l-line", j1850, elm327, "16-pin", "16-polig"]
