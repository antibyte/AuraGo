  pins:
    - {number: "1", name: "VTref", function: {en: "Target voltage, sets the logic levels of the probe", de: "Zielspannung, legt die Logikpegel des Debuggers fest"}, type: power, notes: {en: "An input of the probe. Arm allows at most 100 Ω if this pin is pulled up through a resistor.", de: "Ein Eingang des Debuggers. Arm erlaubt höchstens 100 Ω, wenn dieser Pin über einen Widerstand hochgezogen wird."}}
    - {number: "2", name: "SWDIO/TMS", function: {en: "Serial wire data; JTAG mode select", de: "Serielle Datenleitung; JTAG-Modusauswahl"}, type: data}
