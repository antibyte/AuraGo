- id: arm_jtag_20
  kind: pinout
  category: pinouts
  group: debug
  name: {cs: "ARM JTAG (20 pinů)", da: "ARM JTAG (20 ben)", de: "ARM JTAG (20-polig)", el: "ARM JTAG (20 ακίδες)", en: "ARM JTAG (20-pin)", es: "ARM JTAG (20 pines)", fr: "ARM JTAG (20 broches)", hi: "ARM JTAG (20-पिन)", it: "ARM JTAG (20 pin)", ja: "ARM JTAG(20ピン)", nl: "ARM JTAG (20-pins)", no: "ARM JTAG (20 pinner)", pl: "ARM JTAG (20 pinów)", pt: "ARM JTAG (20 pinos)", sv: "ARM JTAG (20 stift)", zh: "ARM JTAG(20 针)"}
  doc: {en: "The classic 20-way, 0.1 inch debug header of ARM targets. It also works in Serial Wire Debug mode, where TMS, TCK and TDO carry SWDIO, SWCLK and SWO.", de: "Der klassische 20-polige Debug-Anschluss im 2,54-mm-Raster für ARM-Ziele. Er funktioniert auch im Modus Serial Wire Debug, dann führen TMS, TCK und TDO die Signale SWDIO, SWCLK und SWO."}
  notes: {en: "In Arm's table every even pin from 4 to 20 is ground. A SEGGER J-Link differs: pins 14, 16, 18 and 20 are reserved there, and pin 19 is a 5 V output. Check the manual of your probe before relying on these pins. On a boxed header the notch lies on the side of the odd pins.", de: "In Arms Tabelle ist jeder gerade Pin von 4 bis 20 Masse. Ein SEGGER J-Link weicht ab: Dort sind die Pins 14, 16, 18 und 20 reserviert, und Pin 19 ist ein 5-V-Ausgang. Vor der Nutzung dieser Pins das Handbuch des Debuggers prüfen. Beim Wannenstecker liegt die Aussparung auf der Seite der ungeraden Pins."}
  tags: [jtag, swd, arm, "20-pin", "20-polig", debug, debugger, tck, tms, tdi, tdo, rtck, ntrst, nsrst, vtref, swdio, swclk, swo, j-link, jlink, segger, idc, "box header", wannenstecker]
  source: "ARM 100956_0527_00_en, ARM DSTREAM System and Interface Design Reference Guide, section 2.4 (tables 2-6 and 2-7, read in the ManualsLib copy); Arm, Cortex-M Debug Connectors (20-pin IDC diagram); SEGGER Knowledge Base, 20-pin J-Link Connector; Keil ULINKpro User's Guide, Connectors"
  views:
    plug: {en: "Box header on the board (pins)", de: "Wannenstecker auf der Platine (Stifte)"}
    socket: {en: "Socket of the ribbon cable", de: "Buchse am Flachbandkabel"}
  shape:
    type: rows
    outline: rect
    contact: square
    drawn: plug
    key: left
    rows:
      - {pins: ["1", "2"]}
      - {pins: ["3", "4"]}
      - {pins: ["5", "6"]}
      - {pins: ["7", "8"]}
      - {pins: ["9", "10"]}
      - {pins: ["11", "12"]}
      - {pins: ["13", "14"]}
      - {pins: ["15", "16"]}
      - {pins: ["17", "18"]}
      - {pins: ["19", "20"]}
  pins:
    - {number: "1", name: "VTref", function: {en: "Target voltage, sets the logic levels of the probe", de: "Zielspannung, legt die Logikpegel des Debuggers fest"}, type: power, notes: {en: "An input of the probe. Arm allows at most 100 Ω if this pin is pulled up through a resistor.", de: "Ein Eingang des Debuggers. Arm erlaubt höchstens 100 Ω, wenn dieser Pin über einen Widerstand hochgezogen wird."}}
    - {number: "2", name: "NC", function: {en: "Not connected", de: "Nicht belegt"}, type: nc, notes: {en: "Some targets feed VCC here (Keil's drawing: VCC optional). A J-Link ignores this pin, so such a target needs pins 1 and 2 joined.", de: "Manche Ziele speisen hier VCC ein (Keil-Zeichnung: VCC optional). Ein J-Link ignoriert diesen Pin, solche Ziele brauchen daher eine Brücke zwischen Pin 1 und 2."}}
    - {number: "3", name: "nTRST", function: {en: "JTAG TAP reset, normally active low", de: "JTAG-TAP-Reset, normalerweise aktiv low"}, type: signal}
    - {number: "4", name: "GND", function: {en: "Ground", de: "Masse"}, type: ground}
    - {number: "5", name: "TDI", function: {en: "JTAG test data to the target", de: "JTAG-Testdaten zum Ziel"}, type: data, notes: {en: "Not used in SWD mode.", de: "Im SWD-Modus unbenutzt."}}
    - {number: "6", name: "GND", function: {en: "Ground", de: "Masse"}, type: ground}
    - {number: "7", name: "TMS/SWDIO", function: {en: "JTAG mode select; serial wire data in SWD mode", de: "JTAG-Modusauswahl; im SWD-Modus die serielle Datenleitung"}, type: data}
    - {number: "8", name: "GND", function: {en: "Ground", de: "Masse"}, type: ground}
    - {number: "9", name: "TCK/SWCLK", function: {en: "JTAG clock; serial wire clock in SWD mode", de: "JTAG-Takt; im SWD-Modus der serielle Takt"}, type: data}
    - {number: "10", name: "GND", function: {en: "Ground", de: "Masse"}, type: ground}
    - {number: "11", name: "RTCK", function: {en: "Clock returned by the target for adaptive clocking", de: "Vom Ziel zurückgegebener Takt für adaptives Takten"}, type: data, notes: {en: "Tie it to a fixed level when unused: Arm allows high or low, SEGGER asks for GND.", de: "Unbenutzt auf einen festen Pegel legen: Arm erlaubt high oder low, SEGGER verlangt GND."}}
    - {number: "12", name: "GND", function: {en: "Ground", de: "Masse"}, type: ground}
    - {number: "13", name: "TDO/SWO", function: {en: "JTAG test data from the target; trace output in SWD mode", de: "JTAG-Testdaten vom Ziel; im SWD-Modus der Trace-Ausgang"}, type: data}
    - {number: "14", name: "GND", function: {en: "Ground", de: "Masse"}, type: ground, notes: {en: "Reserved on a SEGGER J-Link, not guaranteed to be ground.", de: "Beim SEGGER J-Link reserviert, nicht sicher Masse."}}
    - {number: "15", name: "nSRST", function: {en: "System reset of the target, driven by probe or target", de: "System-Reset des Ziels, vom Debugger oder vom Ziel getrieben"}, type: signal, notes: {en: "Called nRESET by SEGGER and RESET by Keil. Normally active low.", de: "Bei SEGGER nRESET, bei Keil RESET genannt. Normalerweise aktiv low."}}
    - {number: "16", name: "GND", function: {en: "Ground", de: "Masse"}, type: ground, notes: {en: "Reserved on a SEGGER J-Link, not guaranteed to be ground.", de: "Beim SEGGER J-Link reserviert, nicht sicher Masse."}}
    - {number: "17", name: "DBGRQ", function: {en: "Debug request to the target", de: "Debug-Anforderung an das Ziel"}, type: signal, notes: {en: "Rarely used today and usually pulled low on the target. Not connected in a J-Link.", de: "Heute selten genutzt und auf dem Ziel meist nach low gezogen. Im J-Link nicht angeschlossen."}}
    - {number: "18", name: "GND", function: {en: "Ground", de: "Masse"}, type: ground, notes: {en: "Reserved on a SEGGER J-Link, not guaranteed to be ground.", de: "Beim SEGGER J-Link reserviert, nicht sicher Masse."}}
    - {number: "19", name: "DBGACK", function: {en: "Debug acknowledge from the target", de: "Debug-Bestätigung vom Ziel"}, type: signal, notes: {en: "Rarely used today and usually pulled low on the target. Caution: a SEGGER J-Link has a 5 V supply output here (max. 300 mA).", de: "Heute selten genutzt und auf dem Ziel meist nach low gezogen. Vorsicht: Ein SEGGER J-Link hat hier einen 5-V-Versorgungsausgang (max. 300 mA)."}}
    - {number: "20", name: "GND", function: {en: "Ground", de: "Masse"}, type: ground, notes: {en: "Reserved on a SEGGER J-Link, not guaranteed to be ground.", de: "Beim SEGGER J-Link reserviert, nicht sicher Masse."}}

