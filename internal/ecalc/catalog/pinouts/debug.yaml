  doc: {en: "The small 10-way, 0.05 inch debug header of Cortex-M boards. Serial Wire Debug with SWO and JTAG share its pins.", de: "Der kleine 10-polige Debug-Anschluss im 1,27-mm-Raster von Cortex-M-Platinen. Serial Wire Debug mit SWO und JTAG teilen sich die Pins."}
