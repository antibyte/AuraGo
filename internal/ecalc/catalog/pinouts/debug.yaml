    - {number: "4", name: "SWCLK/TCK", function: {en: "Serial wire clock (also written SWDCLK); JTAG clock", de: "Serieller Takt (auch SWDCLK geschrieben); JTAG-Takt"}, type: data}
    - {number: "5", name: "GND", function: {en: "Ground", de: "Masse"}, type: ground}
    - {number: "6", name: "SWO/TDO", function: {en: "Trace output in SWD mode; JTAG test data from the target", de: "Trace-Ausgang im SWD-Modus; JTAG-Testdaten vom Ziel"}, type: data}
    - {number: "7", name: "KEY", function: {en: "Key position, no pin", de: "Codierposition, kein Stift"}, type: nc, notes: {en: "Arm: the pin must not be present on the target's connector.", de: "Arm: Auf dem Anschluss des Ziels darf dieser Stift nicht vorhanden sein."}}
    - {number: "8", name: "NC/TDI", function: {en: "Unused in SWD mode; JTAG test data to the target", de: "Im SWD-Modus unbenutzt; JTAG-Testdaten zum Ziel"}, type: data}
    - {number: "9", name: "GNDDetect", function: {en: "Ground, also used for ground detection", de: "Masse, dient auch der Masseerkennung"}, type: ground, notes: {en: "Arm's DSTREAM guide simply lists GND here.", de: "Arms DSTREAM-Handbuch nennt hier einfach GND."}}
    - {number: "10", name: "nRESET", function: {en: "Target reset, driven by probe or target", de: "Reset des Ziels, vom Debugger oder vom Ziel getrieben"}, type: signal, notes: {en: "Called nSRST in Arm's DSTREAM guide.", de: "In Arms DSTREAM-Handbuch nSRST genannt."}}

- id: avr_isp_6
  kind: pinout
  category: pinouts
  group: debug
  name: {cs: "AVR ISP (6 pinů)", da: "AVR ISP (6 ben)", de: "AVR ISP (6-polig)", el: "AVR ISP (6 ακίδες)", en: "AVR ISP (6-pin)", es: "AVR ISP (6 pines)", fr: "AVR ISP (6 broches)", hi: "AVR ISP (6-पिन)", it: "AVR ISP (6 pin)", ja: "AVR ISP(6ピン)", nl: "AVR ISP (6-pins)", no: "AVR ISP (6 pinner)", pl: "AVR ISP (6 pinów)", pt: "AVR ISP (6 pinos)", sv: "AVR ISP (6 stift)", zh: "AVR ISP(6 针)"}
  doc: {en: "The 2 × 3 pin, 0.1 inch programming header of AVR microcontrollers, working over the chip's SPI lines.", de: "Der Programmieranschluss von AVR-Mikrocontrollern mit 2 × 3 Stiften im 2,54-mm-Raster, er arbeitet über die SPI-Leitungen des Chips."}
  notes: {en: "Connect like to like: MISO to MISO and MOSI to MOSI, there is no crossover. A boxed header has its notch on the side of pins 1, 3 and 5; many boards use bare pins without a notch. Microchip's other 6-way headers (PDI, TPI, UPDI) assign the pins differently.", de: "Gleiches mit Gleichem verbinden: MISO an MISO und MOSI an MOSI, nichts wird gekreuzt. Ein Wannenstecker hat die Aussparung auf der Seite der Pins 1, 3 und 5; viele Platinen haben nur blanke Stifte ohne Aussparung. Microchips andere 6-polige Anschlüsse (PDI, TPI, UPDI) sind anders belegt."}
  tags: [avr, isp, icsp, spi, miso, mosi, sck, reset, vtg, atmel, microchip, atmega, attiny, programmer, programmieren, "6-pin", "6-polig", "atmel-ice", avrisp, usbasp]
  source: "Microchip (Atmel) AVR910 In-System Programming, Atmel-0943F, figure 1-2; Microchip AN2519 AVR Microcontroller Hardware Design Considerations, DS00002519B, figure 4-1; Atmel-ICE User Guide, Atmel-42330C, figure 4-10 and table 3-6"
  views:
    plug: {en: "Header on the board (pins)", de: "Stiftleiste auf der Platine"}
    socket: {en: "Socket of the programmer cable", de: "Buchse am Programmierkabel"}
  shape:
    type: rows
    outline: rect
    contact: square
    drawn: plug
    key: left
    rows:
      - {pins: ["1", "2"]}
      - {pins: ["3", "4"]}
      - {pins: ["5", "6"]}
  pins:
    - {number: "1", name: "MISO", function: {en: "Data from the target AVR to the programmer", de: "Daten vom Ziel-AVR zum Programmiergerät"}, type: data}
    - {number: "2", name: "VCC", function: {en: "Target supply voltage (VTG)", de: "Versorgungsspannung des Ziels (VTG)"}, type: power, notes: {en: "Programmers use it to match the target's level, and some draw their power from it. Others can power the target through it: the target's own supply must then stay off.", de: "Programmiergeräte passen sich damit an den Pegel des Ziels an, manche beziehen hier ihren Strom. Andere können das Ziel darüber versorgen: Dessen eigene Versorgung muss dann aus bleiben."}}
    - {number: "3", name: "SCK", function: {en: "Programming clock from the programmer", de: "Programmiertakt vom Programmiergerät"}, type: data}
    - {number: "4", name: "MOSI", function: {en: "Data from the programmer to the target AVR", de: "Daten vom Programmiergerät zum Ziel-AVR"}, type: data}
    - {number: "5", name: "RESET", function: {en: "Reset of the target AVR, held low while programming", de: "Reset des Ziel-AVR, beim Programmieren auf low gehalten"}, type: signal}
    - {number: "6", name: "GND", function: {en: "Common ground", de: "Gemeinsame Masse"}, type: ground}

- id: ftdi_6
  kind: pinout
  category: pinouts
  group: debug
  name: {cs: "FTDI TTL-232R (6 pinů)", da: "FTDI TTL-232R (6 ben)", de: "FTDI TTL-232R (6-polig)", el: "FTDI TTL-232R (6 ακίδες)", en: "FTDI TTL-232R (6-pin)", es: "FTDI TTL-232R (6 pines)", fr: "FTDI TTL-232R (6 broches)", hi: "FTDI TTL-232R (6-पिन)", it: "FTDI TTL-232R (6 pin)", ja: "FTDI TTL-232R(6ピン)", nl: "FTDI TTL-232R (6-pins)", no: "FTDI TTL-232R (6 pinner)", pl: "FTDI TTL-232R (6 pinów)", pt: "FTDI TTL-232R (6 pinos)", sv: "FTDI TTL-232R (6 stift)", zh: "FTDI TTL-232R(6 针)"}
  doc: {en: "The single-row, 6-way, 0.1 inch connector at the end of the TTL-232R-5V and TTL-232R-3V3 USB serial cables.", de: "Der einreihige, 6-polige Anschluss im 2,54-mm-Raster am Ende der USB-Seriell-Kabel TTL-232R-5V und TTL-232R-3V3."}
  notes: {en: "VCC is +5 V on both cables (75 mA at most): on the TTL-232R-3V3 only the signals run at 3.3 V, so do not feed a 3.3 V board from it directly. TXD is an output and RXD an input of the cable: join cable TXD to the target's RX and cable RXD to the target's TX. A triangle on the housing marks pin 1. The audio jack, wire end and 2 mm versions of this cable range are laid out differently.", de: "VCC führt bei beiden Kabeln +5 V (höchstens 75 mA): Beim TTL-232R-3V3 arbeiten nur die Signale mit 3,3 V, eine 3,3-V-Platine also nicht direkt daraus versorgen. TXD ist ein Ausgang und RXD ein Eingang des Kabels: TXD des Kabels an RX des Ziels und RXD des Kabels an TX des Ziels. Ein Dreieck auf dem Gehäuse markiert Pin 1. Die Versionen mit Klinke, offenen Enden und 2-mm-Raster sind anders belegt."}
  tags: [ftdi, "ttl-232r", ttl232r, "ttl-232r-5v", "ttl-232r-3v3", uart, serial, seriell, usb, adapter, kabel, cable, txd, rxd, cts, rts, ft232, "6-pin", "6-polig"]
  source: "FTDI, TTL-232R TTL to USB Serial Converter Range of Cables Datasheet, FT_000054 version 2.01 (2008); Connective Peripherals, same datasheet, CP_000069 version 1.1 (figures 4.1 and 4.2, table 4.1)"
  views:
    plug: {en: "Matching pin header on the board", de: "Passende Stiftleiste auf der Platine"}
    socket: {en: "Connector at the end of the cable", de: "Buchsenleiste am Kabelende"}
  shape:
    type: rows
    outline: rect
    contact: square
    drawn: socket
    rows:
      - {pins: ["1"]}
      - {pins: ["2"]}
      - {pins: ["3"]}
      - {pins: ["4"]}
      - {pins: ["5"]}
      - {pins: ["6"]}
  pins:
    - {number: "1", name: "GND", function: {en: "Ground", de: "Masse"}, type: ground, wire: black}
    - {number: "2", name: "CTS#", function: {en: "Clear to send, handshake input of the cable", de: "Sendefreigabe, Handshake-Eingang des Kabels"}, type: signal, wire: brown}
    - {number: "3", name: "VCC", function: {en: "+5 V output of the cable", de: "+5-V-Ausgang des Kabels"}, type: power, wire: red}
    - {number: "4", name: "TXD", function: {en: "Transmit data, output of the cable", de: "Sendedaten, Ausgang des Kabels"}, type: data, wire: orange}
    - {number: "5", name: "RXD", function: {en: "Receive data, input of the cable", de: "Empfangsdaten, Eingang des Kabels"}, type: data, wire: yellow}
    - {number: "6", name: "RTS#", function: {en: "Request to send, handshake output of the cable", de: "Sendeanforderung, Handshake-Ausgang des Kabels"}, type: signal, wire: green}

- id: qwiic
  kind: pinout
  category: pinouts
  group: debug
  name: {cs: "Qwiic / STEMMA QT", da: "Qwiic / STEMMA QT", de: "Qwiic / STEMMA QT", el: "Qwiic / STEMMA QT", en: "Qwiic / STEMMA QT", es: "Qwiic / STEMMA QT", fr: "Qwiic / STEMMA QT", hi: "Qwiic / STEMMA QT", it: "Qwiic / STEMMA QT", ja: "Qwiic / STEMMA QT", nl: "Qwiic / STEMMA QT", no: "Qwiic / STEMMA QT", pl: "Qwiic / STEMMA QT", pt: "Qwiic / STEMMA QT", sv: "Qwiic / STEMMA QT", zh: "Qwiic / STEMMA QT"}
  doc: {en: "4-pin, 1 mm JST SH connector for I2C modules, used by SparkFun Qwiic and Adafruit STEMMA QT.", de: "4-poliger JST-SH-Stecker im 1-mm-Raster für I2C-Module, verwendet von SparkFun Qwiic und Adafruit STEMMA QT."}
  notes: {en: "STEMMA QT is compatible with Qwiic: connector, pin order and wire colours are the same, and Adafruit states that both kinds of device work together. They differ in the supply. Qwiic boards run on 3.3 V only, while STEMMA QT devices accept 3 to 5 V and carry their own regulator and level shifting. So keep V+ at 3.3 V when a Qwiic device is on the bus. Pin numbers are not uniform: the schematics of both makers count GND as pin 1, SparkFun's cable drawing counts the yellow SCL wire as 1. Go by signal and wire colour, not by number.", de: "STEMMA QT ist mit Qwiic kompatibel: Stecker, Pinfolge und Aderfarben sind gleich, und Adafruit nennt beide Gerätearten ausdrücklich zusammen verwendbar. Der Unterschied liegt in der Versorgung. Qwiic-Platinen laufen nur mit 3,3 V, STEMMA-QT-Geräte vertragen 3 bis 5 V und haben eigenen Regler und Pegelwandler. Ist ein Qwiic-Gerät am Bus, muss V+ also 3,3 V bleiben. Die Pinnummern sind nicht einheitlich: Die Schaltpläne beider Hersteller zählen GND als Pin 1, SparkFuns Kabelzeichnung zählt die gelbe SCL-Ader als 1. Nach Signal und Aderfarbe gehen, nicht nach der Nummer."}
  tags: [qwiic, stemma, "stemma qt", sparkfun, adafruit, jst, "jst sh", "jst-sh", i2c, iic, sda, scl, "3.3v", "4-pin", "4-polig", sensor, sm04b, shr-04v, kabel, cable]
  source: "SparkFun, Qwiic Connect System page (sparkfun.com/qwiic), Qwiic cable drawing ACCA-1571 and SparkFun-Connectors.lbr (device QWIIC_CONNECTOR); Adafruit, Adafruit STEMMA & STEMMA QT guide (What is STEMMA QT?, Technical Specs, comparison page) and Adafruit QT Py schematic (device STEMMA_I2C)"
  views:
    plug: {en: "Header on the board (pins)", de: "Stiftleiste auf der Platine"}
    socket: {en: "Housing on the cable (sockets)", de: "Gehäuse am Kabel (Buchsenkontakte)"}
  shape:
    type: rows
    outline: jst
    contact: square
    drawn: plug
    rows:
      - {pins: ["1"]}
      - {pins: ["2"]}
      - {pins: ["3"]}
      - {pins: ["4"]}
  pins:
    - {number: "1", name: "GND", function: {en: "Ground", de: "Masse"}, type: ground, wire: black}
    - {number: "2", name: "3.3V", function: {en: "3.3 V supply on Qwiic; V+ of 3 to 5 V on STEMMA QT", de: "3,3-V-Versorgung bei Qwiic; V+ von 3 bis 5 V bei STEMMA QT"}, type: power, wire: red}
    - {number: "3", name: "SDA", function: {en: "I2C data", de: "I2C-Daten"}, type: data, wire: blue}
    - {number: "4", name: "SCL", function: {en: "I2C clock", de: "I2C-Takt"}, type: data, wire: yellow}

