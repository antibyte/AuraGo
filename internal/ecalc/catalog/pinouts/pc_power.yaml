- id: fan_3
  kind: pinout
  category: pinouts
  group: pc_power
  name: {cs: "Ventilátor, 3 piny", da: "Blæser, 3-polet", de: "Lüfter, 3-polig", el: "Ανεμιστήρας, 3 ακίδων", en: "Fan, 3-pin", es: "Ventilador, 3 pines", fr: "Ventilateur, 3 broches", hi: "पंखा, 3-पिन", it: "Ventola, 3 pin", ja: "ファン 3 ピン", nl: "Ventilator, 3-polig", "no": "Vifte, 3-polet", pl: "Wentylator, 3-pinowy", pt: "Ventoinha, 3 pinos", sv: "Fläkt, 3-polig", zh: "风扇 3 针"}
  doc: {en: "Three-wire fan connector with a speed signal and no PWM input. The notch stands for the guide rails on the plug, which take the wall of the header.", de: "Dreiadriger Lüfteranschluss mit Drehzahlsignal, ohne PWM-Eingang. Die Kerbe steht für die Führungsschienen am Stecker, in die der Steg der Stiftleiste greift."}
  notes: {en: "It fits pins 1 to 3 of a 4-pin header. The colours are the makers' habit, not a standard: the third wire can also be white, and on 4-wire fans yellow is +12 V. Go by position.", de: "Er passt auf die Pins 1 bis 3 einer vierpoligen Stiftleiste. Die Farben sind Herstellergewohnheit, kein Standard: Die dritte Ader kann auch weiß sein, und bei vieradrigen Lüftern ist Gelb +12 V. Nach Position gehen."}
  tags: ["fan", "lüfter", "luefter", "3-pin", "3-polig", "tach", "tacho", "rpm", "sense", "chassis fan", "gehäuselüfter", "cpu fan", "noctua", "sunon"]
  source: "Noctua FAQ, What pin configuration do Noctua fans use?; Sunon, Fan 3rd Wire Signal (PMD1212PTB3-A datasheet); ASRock B450 Steel Legend manual, fan connectors; Intel 4-Wire PWM Controlled Fans Specification Rev. 1.2, figures 6 and 7 (key and view of the family)"
  views:
    plug: {en: "Fan cable plug (socket contacts)", de: "Lüfterstecker am Kabel (Buchsenkontakte)"}
    socket: {en: "Header on the board (pin contacts)", de: "Stiftleiste auf der Platine (Stiftkontakte)"}
  shape:
