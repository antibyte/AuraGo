  source: "PCI Express Card Electromechanical Specification Rev. 4.0 Version 1.0, figure 60 and table 53; Intel ATX Version 3 Multi Rail Desktop Platform Power Supply Design Guide (336521) Rev. 2.1a, table 5-4"
  views:
