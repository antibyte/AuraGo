  pins:
    - {number: "1", name: "GND", function: {en: "Ground", de: "Masse"}, type: ground, wire: black}
    - {number: "2", name: "12 V", function: {en: "Fan supply, +12 V", de: "Lüfterversorgung, +12 V"}, type: power, wire: yellow}
