  pins:
    - {number: "1", name: "GND", function: {en: "Ground", de: "Masse"}, type: ground, wire: black}
    - {number: "2", name: "+12V", function: {en: "Fan supply, +12 V or a voltage the board varies", de: "Lüfterversorgung, +12 V oder von der Platine geregelte Spannung"}, type: power, wire: red}
    - {number: "3", name: "RPM", function: {en: "Speed signal from the fan (tachometer)", de: "Drehzahlsignal des Lüfters (Tacho)"}, type: signal, wire: yellow}

- id: fan_4
  kind: pinout
  category: pinouts
  group: pc_power
  name: {cs: "Ventilátor, 4 piny PWM", da: "Blæser, 4-polet PWM", de: "Lüfter, 4-polig PWM", el: "Ανεμιστήρας, 4 ακίδων PWM", en: "Fan, 4-pin PWM", es: "Ventilador, 4 pines PWM", fr: "Ventilateur, 4 broches PWM", hi: "पंखा, 4-पिन PWM", it: "Ventola, 4 pin PWM", ja: "ファン 4 ピン PWM", nl: "Ventilator, 4-polig PWM", "no": "Vifte, 4-polet PWM", pl: "Wentylator, 4-pinowy PWM", pt: "Ventoinha, 4 pinos PWM", sv: "Fläkt, 4-polig PWM", zh: "风扇 4 针 PWM"}
  doc: {en: "Four-wire fan connector to Intel's PWM specification, 2.54 mm pitch. The notch stands for the guide rails on the plug; they span pins 1 to 3 and take the wall of the header.", de: "Vieradriger Lüfteranschluss nach Intels PWM-Spezifikation, Raster 2,54 mm. Die Kerbe steht für die Führungsschienen am Stecker; sie umfassen die Pins 1 bis 3 und nehmen den Steg der Stiftleiste auf."}
  notes: {en: "A 3-pin fan fits pins 1 to 3 of the header and has no control input. Without a control signal a 4-wire fan runs at full speed. Some boards also vary the voltage on pin 2.", de: "Ein dreipoliger Lüfter passt auf die Pins 1 bis 3 der Stiftleiste und hat keinen Steuereingang. Ohne Steuersignal läuft ein vieradriger Lüfter mit voller Drehzahl. Manche Platinen regeln zusätzlich die Spannung an Pin 2."}
  tags: ["fan", "lüfter", "luefter", "4-pin", "4-polig", "pwm", "tach", "tacho", "rpm", "sense", "control", "cpu fan", "cpu_fan", "sys_fan", "25 khz", "intel", "noctua"]
  source: "Intel 4-Wire Pulse Width Modulation (PWM) Controlled Fans Specification Rev. 1.2 (July 2004), table 1, sections 2 and 3, figures 6 and 7; Noctua FAQ, What pin configuration do Noctua fans use?; Gigabyte B450M K and ASRock B450 Steel Legend manuals"
