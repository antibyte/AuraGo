    - {number: "P2", name: "V33", function: {en: "3.3 V supply (retired)", de: "3,3-V-Versorgung (gestrichen)"}, type: power, wire: orange}
    - {number: "P3", name: "V33", function: {en: "3.3 V supply, pre-charge (retired)", de: "3,3-V-Versorgung, Vorladung (gestrichen)"}, type: power, wire: orange, notes: {en: "Newer enterprise drives can use this pin as Power Disable: 3.3 V here holds them in reset, so they do not spin up.", de: "Neuere Enterprise-Laufwerke können diesen Pin als Power Disable nutzen: 3,3 V halten sie hier im Reset, sie laufen dann nicht an."}}
    - {number: "P4", name: "GND", function: {en: "Ground", de: "Masse"}, type: ground, wire: black, notes: {en: "Mates first on a backplane.", de: "Schließt an einer Backplane zuerst."}}
    - {number: "P5", name: "GND", function: {en: "Ground", de: "Masse"}, type: ground, wire: black}
    - {number: "P6", name: "GND", function: {en: "Ground", de: "Masse"}, type: ground, wire: black}
    - {number: "P7", name: "V5", function: {en: "5 V supply, pre-charge", de: "5-V-Versorgung, Vorladung"}, type: power, wire: red}
    - {number: "P8", name: "V5", function: {en: "5 V supply", de: "5-V-Versorgung"}, type: power, wire: red}
    - {number: "P9", name: "V5", function: {en: "5 V supply", de: "5-V-Versorgung"}, type: power, wire: red}
