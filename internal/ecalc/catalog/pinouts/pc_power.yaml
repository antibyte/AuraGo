- id: pcie_6
  kind: pinout
  category: pinouts
  group: pc_power
  name: {cs: "Napájení PCIe, 6 pinů (2x3)", da: "PCIe-strøm, 6-polet (2x3)", de: "PCIe-Strom, 6-polig (2x3)", el: "Τροφοδοσία PCIe, 6 ακίδων (2x3)", en: "PCIe power, 6-pin (2x3)", es: "Alimentación PCIe, 6 pines (2x3)", fr: "Alimentation PCIe, 6 broches (2x3)", hi: "PCIe पावर, 6-पिन (2x3)", it: "Alimentazione PCIe, 6 pin (2x3)", ja: "PCIe 電源 6 ピン (2x3)", nl: "PCIe-voeding, 6-polig (2x3)", "no": "PCIe-strøm, 6-polet (2x3)", pl: "Zasilanie PCIe, 6-pinowe (2x3)", pt: "Alimentação PCIe, 6 pinos (2x3)", sv: "PCIe-ström, 6-polig (2x3)", zh: "PCIe 电源 6 针 (2x3)"}
  doc: {en: "Extra 12 V supply of a graphics card, up to 75 W. A plug of 4.2 mm pitch with two rows of three; the latch sits on the row with pins 4 to 6 and is drawn on top.", de: "Zusätzliche 12-V-Versorgung einer Grafikkarte, bis 75 W. Ein Stecker im Raster 4,2 mm mit zwei Dreierreihen; die Rastnase sitzt an der Reihe mit den Pins 4 bis 6 und ist oben gezeichnet."}
  notes: {en: "In an 8-pin header this plug reaches pins 1 to 3 and 5 to 7, so its sense pin meets Sense0 and Sense1 stays open: the card then draws at most 75 W. Some older cables leave pin 2 unconnected.", de: "In einer 8-poligen Stiftleiste erreicht dieser Stecker die Pins 1 bis 3 und 5 bis 7. Sein Sense-Pin trifft auf Sense0, Sense1 bleibt offen: Die Karte zieht dann höchstens 75 W. Manche älteren Kabel lassen Pin 2 unbelegt."}
