    - {number: "S2", name: "A+", function: {en: "Pair A, positive line (TXP on a board connector)", de: "Paar A, positive Leitung (TXP am Platinenanschluss)"}, type: data}
    - {number: "S3", name: "A-", function: {en: "Pair A, negative line (TXN on a board connector)", de: "Paar A, negative Leitung (TXN am Platinenanschluss)"}, type: data}
    - {number: "S4", name: "GND", function: {en: "Ground", de: "Masse"}, type: ground}
    - {number: "S5", name: "B-", function: {en: "Pair B, negative line (RXN on a board connector)", de: "Paar B, negative Leitung (RXN am Platinenanschluss)"}, type: data}
