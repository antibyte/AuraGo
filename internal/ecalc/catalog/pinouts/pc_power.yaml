    socket: {en: "Header on the graphics card (pin contacts)", de: "Stiftleiste auf der Grafikkarte (Stiftkontakte)"}
  shape:
    type: rows
    outline: minifit
    contact: square
    drawn: plug
    rows:
      - {pins: ["4", "5", "6"]}
      - {pins: ["1", "2", "3"]}
  pins:
    - {number: "1", name: "+12V", function: {en: "+12 V supply", de: "+12-V-Versorgung"}, type: power, wire: yellow}
    - {number: "2", name: "+12V", function: {en: "+12 V supply", de: "+12-V-Versorgung"}, type: power, wire: yellow}
    - {number: "3", name: "+12V", function: {en: "+12 V supply", de: "+12-V-Versorgung"}, type: power, wire: yellow}
    - {number: "4", name: "COM", function: {en: "Ground return", de: "Masserückleitung"}, type: ground, wire: black}
    - {number: "5", name: "Sense", function: {en: "Tells the card that a plug is attached", de: "Meldet der Karte einen gesteckten Stecker"}, type: signal, wire: black, notes: {en: "Grounded in the supply or by a jumper to a neighbouring ground pin.", de: "Im Netzteil oder per Brücke zu einem benachbarten Masse-Pin auf Masse gelegt."}}
    - {number: "6", name: "COM", function: {en: "Ground return", de: "Masserückleitung"}, type: ground, wire: black}

