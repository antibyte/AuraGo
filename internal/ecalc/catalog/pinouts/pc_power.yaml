    type: rows
    outline: minifit
    contact: square
    drawn: plug
    rows:
      - {pins: ["5", "6", "7", "8"]}
      - {pins: ["1", "2", "3", "4"]}
  pins:
    - {number: "1", name: "COM", function: {en: "Ground return", de: "Masserückleitung"}, type: ground, wire: black}
    - {number: "2", name: "COM", function: {en: "Ground return", de: "Masserückleitung"}, type: ground, wire: black}
    - {number: "3", name: "COM", function: {en: "Ground return", de: "Masserückleitung"}, type: ground, wire: black}
    - {number: "4", name: "COM", function: {en: "Ground return", de: "Masserückleitung"}, type: ground, wire: black}
    - {number: "5", name: "+12V2", function: {en: "+12 V supply for the CPU", de: "+12-V-Versorgung der CPU"}, type: power, wire: yellow}
    - {number: "6", name: "+12V2", function: {en: "+12 V supply for the CPU", de: "+12-V-Versorgung der CPU"}, type: power, wire: yellow}
