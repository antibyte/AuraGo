- id: eps_8
  kind: pinout
  category: pinouts
  group: pc_power
  name: {cs: "Napájení CPU EPS12V, 8 pinů", da: "EPS12V CPU-strøm, 8-polet", de: "EPS12V-CPU-Strom, 8-polig", el: "Τροφοδοσία CPU EPS12V, 8 ακίδων", en: "EPS12V CPU power, 8-pin", es: "Alimentación CPU EPS12V, 8 pines", fr: "Alimentation CPU EPS12V, 8 broches", hi: "EPS12V CPU पावर, 8-पिन", it: "Alimentazione CPU EPS12V, 8 pin", ja: "EPS12V CPU 電源 8 ピン", nl: "EPS12V-CPU-voeding, 8-polig", "no": "EPS12V CPU-strøm, 8-polet", pl: "Zasilanie CPU EPS12V, 8-pinowe", pt: "Alimentação CPU EPS12V, 8 pinos", sv: "EPS12V CPU-ström, 8-polig", zh: "EPS12V CPU 电源 8 针"}
  doc: {en: "The extra 12 V supply of the CPU on the board, a Mini-Fit Jr. housing with two rows of four. The latch sits on the row with the +12 V pins 5 to 8; it is drawn on top.", de: "Die zusätzliche 12-V-Versorgung der CPU auf der Platine, ein Mini-Fit-Jr.-Gehäuse mit zwei Viererreihen. Die Rastnase sitzt an der Reihe mit den +12-V-Pins 5 bis 8 und ist oben gezeichnet."}
  notes: {en: "It looks like the 8-pin PCIe plug, but there the row at the latch is ground and the housing is keyed differently. Never force one into the other: +12 V would meet ground. A 4-pin ATX12V plug goes along pins 1 and 5.", de: "Er sieht aus wie der 8-polige PCIe-Stecker, dort liegt an der Rastnase aber die Masse-Reihe, und das Gehäuse ist anders kodiert. Nie mit Gewalt tauschen: +12 V träfe auf Masse. Ein 4-poliger ATX12V-Stecker sitzt bündig an den Pins 1 und 5."}
