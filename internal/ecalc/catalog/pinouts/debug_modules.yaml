  name: {cs: "Pmod (2×6)", da: "Pmod (2×6)", de: "Pmod (2×6)", el: "Pmod (2×6)", en: "Pmod (2×6)", es: "Pmod (2×6)", fr: "Pmod (2×6)", hi: "Pmod (2×6)", it: "Pmod (2×6)", ja: "Pmod (2×6)", nl: "Pmod (2×6)", no: "Pmod (2×6)", pl: "Pmod (2×6)", pt: "Pmod (2×6)", sv: "Pmod (2×6)", zh: "Pmod (2×6)"}
  doc: {en: "The generic 12-pin Digilent Pmod connector (2 × 6, 0.1 inch): eight signal pins, two ground pins and two supply pins, two six-pin interfaces stacked.", de: "Der allgemeine 12-polige Pmod-Anschluss von Digilent (2 × 6, 2,54 mm): acht Signalpins, zwei Massepins und zwei Versorgungspins, zwei sechspolige Schnittstellen übereinander."}
  notes: {en: "This page shows the generic layout, with the eight signals as general I/O. The Pmod type of the module decides what each signal does (SPI, UART, I2C, H-bridge and others); the type tables differ between the editions of the Digilent specification, so read the manual of the module. For SPI (type 2) both the 2011 specification and Wikipedia give pin 1 CS, 2 MOSI, 3 MISO, 4 SCK. VCC is normally 3.3 V; some hosts can switch it to 5 V, and both VCC pins always carry the same voltage. The pin numbering is mirrored between the host connector and the module. Pin 1 is the square pad, in the column farther from the board edge.", de: "Diese Seite zeigt die allgemeine Belegung mit den acht Signalen als allgemeine E/A. Der Pmod-Typ des Moduls bestimmt, was jedes Signal tut (SPI, UART, I2C, H-Brücke und weitere); die Typtabellen unterscheiden sich zwischen den Ausgaben der Digilent-Spezifikation, daher das Handbuch des Moduls lesen. Für SPI (Typ 2) geben die Spezifikation von 2011 und Wikipedia übereinstimmend an: Pin 1 CS, 2 MOSI, 3 MISO, 4 SCK. VCC beträgt normalerweise 3,3 V; manche Hosts können auf 5 V umschalten, und beide VCC-Pins führen immer dieselbe Spannung. Die Pinnummerierung ist zwischen Host-Anschluss und Modul gespiegelt. Pin 1 ist das quadratische Pad in der Spalte, die weiter vom Platinenrand entfernt liegt."}
  tags: [pmod, digilent, fpga, "12-pin", "12-polig", "2x6", spi, uart, i2c, gpio, "peripheral module", host, modul, module, vcc, gnd]
  source: "Digilent, Digilent Pmod Interface Specification, Doc 510-002, revision of November 20, 2011 (pages 1 to 4, 6, 7); Wikipedia, Pmod Interface (generic pin table and list of specification editions)"
