        - {number: "1", name: "TX+ / A+", function: {en: "10/100BASE-T transmit +, 1000BASE-T pair A +", de: "10/100BASE-T Senden +, 1000BASE-T Paar A +"}, type: data, wire: white_orange, notes: {en: "PoE Mode A and four-pair: DC, same pole as pin 2.", de: "PoE Mode A und vierpaarig: Gleichstrom, derselbe Pol wie Pin 2."}}
