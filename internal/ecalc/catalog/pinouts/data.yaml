- id: usb_a
  kind: pinout
  category: pinouts
  group: data
  name: {cs: "USB 2.0 Type-A", da: "USB 2.0 Type-A", de: "USB 2.0 Type-A", el: "USB 2.0 Type-A", en: "USB 2.0 Type-A", es: "USB 2.0 Type-A", fr: "USB 2.0 Type-A", hi: "USB 2.0 Type-A", it: "USB 2.0 Type-A", ja: "USB 2.0 Type-A", nl: "USB 2.0 Type-A", no: "USB 2.0 Type-A", pl: "USB 2.0 Type-A", pt: "USB 2.0 Type-A", sv: "USB 2.0 Type-A", zh: "USB 2.0 Type-A"}
  doc: {en: "The flat USB connector of hosts and hubs, with four contacts inside a metal shell.", de: "Der flache USB-Anschluss an Hosts und Hubs, mit vier Kontakten in einem Metallgehäuse."}
  notes: {en: "The shell is the shield and goes to the drain wire of the cable. The drawn order holds for a receptacle whose contact tongue fills the upper half of the shell, with the contacts on its underside. The wire colours are the typical wiring named by the specification.", de: "Das Gehäuse ist die Abschirmung und führt zur Beilauflitze des Kabels. Die gezeichnete Reihenfolge gilt für eine Buchse, deren Kontaktzunge in der oberen Hälfte des Gehäuses liegt, mit den Kontakten auf der Unterseite. Die Aderfarben sind die von der Spezifikation genannte übliche Belegung."}
  tags: [usb, usb-a, usb2, "usb 2.0", type-a, "typ a", vbus, "d+", "d-", host, plug, stecker, receptacle, buchse, socket]
  source: "USB 2.0 Specification (USB-IF, package usb_20_20250603), table 6-1 and figures 6-7 and 6-9"
  views:
    plug: {en: "Plug (cable end)", de: "Stecker (Kabelende)"}
    socket: {en: "Receptacle (on the host or hub)", de: "Buchse (am Host oder Hub)"}
  shape:
    type: rows
    outline: usb_a
    contact: blade
    drawn: socket
    rows:
      - {pins: ["1", "2", "3", "4"]}
  pins:
    - {number: "1", name: VBUS, function: {en: "Bus supply, nominally +5 V", de: "Busversorgung, nominell +5 V"}, type: power, wire: red}
    - {number: "2", name: "D-", function: {en: "USB data, negative line", de: "USB-Daten, negative Leitung"}, type: data, wire: white}
    - {number: "3", name: "D+", function: {en: "USB data, positive line", de: "USB-Daten, positive Leitung"}, type: data, wire: green}
    - {number: "4", name: GND, function: {en: "Ground return", de: "Masserückleitung"}, type: ground, wire: black}

- id: usb_a_3
  kind: pinout
  category: pinouts
  group: data
  name: {cs: "USB 3.x Type-A", da: "USB 3.x Type-A", de: "USB 3.x Type-A", el: "USB 3.x Type-A", en: "USB 3.x Type-A", es: "USB 3.x Type-A", fr: "USB 3.x Type-A", hi: "USB 3.x Type-A", it: "USB 3.x Type-A", ja: "USB 3.x Type-A", nl: "USB 3.x Type-A", no: "USB 3.x Type-A", pl: "USB 3.x Type-A", pt: "USB 3.x Type-A", sv: "USB 3.x Type-A", zh: "USB 3.x Type-A"}
  doc: {en: "The Standard-A connector with SuperSpeed: the four USB 2.0 contacts plus five more, nine in all.", de: "Der Standard-A-Anschluss mit SuperSpeed: die vier USB-2.0-Kontakte und fünf weitere, zusammen neun."}
  notes: {en: "RX and TX are named from the host's point of view. Pins 1 to 4 are the USB 2.0 contacts, pins 5 to 9 the SuperSpeed contacts. The two rows lie at different depths of the connector, so face-on they are not really above each other; the left-right position is as drawn. The drawn receptacle has its contact tongue in the upper half of the shell. The shell is the shield and mates first. The specification names no wire colours for this connector.", de: "RX und TX sind aus Sicht des Hosts benannt. Die Pins 1 bis 4 sind die USB-2.0-Kontakte, die Pins 5 bis 9 die SuperSpeed-Kontakte. Die beiden Reihen liegen unterschiedlich tief im Anschluss, stehen von vorn gesehen also nicht wirklich übereinander; die Lage von links nach rechts stimmt mit der Zeichnung überein. Die gezeichnete Buchse hat ihre Kontaktzunge in der oberen Hälfte des Gehäuses. Das Gehäuse ist die Abschirmung und kontaktiert zuerst. Die Spezifikation nennt für diesen Anschluss keine Aderfarben."}
  tags: [usb, usb-a, usb3, "usb 3.0", "usb 3.1", "usb 3.2", superspeed, type-a, "typ a", standard-a, stda_ssrx, stda_sstx, ssrx, sstx, gnd_drain, vbus, stecker, buchse, receptacle, plug]
  source: "USB 3.1 Legacy Cable and Connector Specification, Revision 1.0 (22 September 2017), table 5-2 and figures 5-1, 5-4 (detail G) and 5-5"
  views:
    plug: {en: "Plug (cable end)", de: "Stecker (Kabelende)"}
    socket: {en: "Receptacle (on the host or hub)", de: "Buchse (am Host oder Hub)"}
  shape:
    type: rows
    outline: usb_a
    contact: blade
    drawn: socket
    rows:
      - {pins: ["9", "8", "7", "6", "5"]}
      - {pins: ["1", "2", "3", "4"], offset: 0.5}
  pins:
    - {number: "1", name: VBUS, function: {en: "Bus supply", de: "Busversorgung"}, type: power}
    - {number: "2", name: "D-", function: {en: "USB 2.0 data, negative line", de: "USB-2.0-Daten, negative Leitung"}, type: data}
    - {number: "3", name: "D+", function: {en: "USB 2.0 data, positive line", de: "USB-2.0-Daten, positive Leitung"}, type: data}
    - {number: "4", name: GND, function: {en: "Ground return of the supply", de: "Masserückleitung der Versorgung"}, type: ground}
    - {number: "5", name: "StdA_SSRX-", function: {en: "SuperSpeed receive pair, negative", de: "SuperSpeed-Empfangspaar, negativ"}, type: data}
    - {number: "6", name: "StdA_SSRX+", function: {en: "SuperSpeed receive pair, positive", de: "SuperSpeed-Empfangspaar, positiv"}, type: data}
    - {number: "7", name: GND_DRAIN, function: {en: "Ground return of the signals", de: "Masserückleitung der Signale"}, type: ground}
    - {number: "8", name: "StdA_SSTX-", function: {en: "SuperSpeed transmit pair, negative", de: "SuperSpeed-Sendepaar, negativ"}, type: data}
    - {number: "9", name: "StdA_SSTX+", function: {en: "SuperSpeed transmit pair, positive", de: "SuperSpeed-Sendepaar, positiv"}, type: data}

