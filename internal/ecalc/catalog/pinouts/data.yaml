        - {number: "5", name: "C-", function: {en: "Unused at 10/100BASE-T, 1000BASE-T pair C -", de: "Bei 10/100BASE-T frei, 1000BASE-T Paar C -"}, type: data, wire: white_blue, notes: {en: "PoE Mode B and four-pair: DC, same pole as pin 4.", de: "PoE Mode B und vierpaarig: Gleichstrom, derselbe Pol wie Pin 4."}}
        - {number: "6", name: "RX- / B-", function: {en: "10/100BASE-T receive -, 1000BASE-T pair B -", de: "10/100BASE-T Empfangen -, 1000BASE-T Paar B -"}, type: data, wire: orange, notes: {en: "PoE Mode A and four-pair: DC, same pole as pin 3.", de: "PoE Mode A und vierpaarig: Gleichstrom, derselbe Pol wie Pin 3."}}
        - {number: "7", name: "D+", function: {en: "Unused at 10/100BASE-T, 1000BASE-T pair D +", de: "Bei 10/100BASE-T frei, 1000BASE-T Paar D +"}, type: data, wire: white_brown, notes: {en: "PoE Mode B and four-pair: DC, same pole as pin 8.", de: "PoE Mode B und vierpaarig: Gleichstrom, derselbe Pol wie Pin 8."}}
        - {number: "8", name: "D-", function: {en: "Unused at 10/100BASE-T, 1000BASE-T pair D -", de: "Bei 10/100BASE-T frei, 1000BASE-T Paar D -"}, type: data, wire: brown, notes: {en: "PoE Mode B and four-pair: DC, same pole as pin 7.", de: "PoE Mode B und vierpaarig: Gleichstrom, derselbe Pol wie Pin 7."}}
    - id: t568b
      name: {en: "T568B", de: "T568B"}
