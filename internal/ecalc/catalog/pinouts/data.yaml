        - {number: "3", name: "RX+ / B+", function: {en: "10/100BASE-T receive +, 1000BASE-T pair B +", de: "10/100BASE-T Empfangen +, 1000BASE-T Paar B +"}, type: data, wire: white_green, notes: {en: "PoE Mode A and four-pair: DC, same pole as pin 6.", de: "PoE Mode A und vierpaarig: Gleichstrom, derselbe Pol wie Pin 6."}}
