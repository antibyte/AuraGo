    - {number: "7", name: GREEN_RTN, function: {en: "Return of green video", de: "Rückleitung Video Grün"}, type: ground}
    - {number: "8", name: BLUE_RTN, function: {en: "Return of blue video", de: "Rückleitung Video Blau"}, type: ground}
    - {number: "9", name: KEY/PWR, function: {en: "Supply from the computer for the monitor's EDID memory, once a key", de: "Versorgung vom Computer für den EDID-Speicher des Monitors, früher Kodierung"}, type: power, notes: {en: "May be missing on older equipment. Sources name +5 V, one monitor maker 5 V or 3.3 V.", de: "Kann bei älteren Geräten fehlen. Die Quellen nennen +5 V, ein Monitorhersteller 5 V oder 3,3 V."}}
    - {number: "10", name: GND, function: {en: "Ground for sync and DDC", de: "Masse für Sync und DDC"}, type: ground}
    - {number: "11", name: ID0/RES, function: {en: "Reserved, once monitor ID bit 0", de: "Reserviert, früher Monitor-ID-Bit 0"}, type: nc, notes: {en: "Ground on some monitors.", de: "Bei manchen Monitoren Masse."}}
    - {number: "12", name: ID1/SDA, function: {en: "DDC data (I²C), once monitor ID bit 1", de: "DDC-Daten (I²C), früher Monitor-ID-Bit 1"}, type: data}
