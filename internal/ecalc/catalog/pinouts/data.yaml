      - {pins: ["15", "14", "13", "12", "11"]}
  pins:
    - {number: "1", name: RED, function: {en: "Red video", de: "Video Rot"}, type: signal}
    - {number: "2", name: GREEN, function: {en: "Green video", de: "Video Grün"}, type: signal}
    - {number: "3", name: BLUE, function: {en: "Blue video", de: "Video Blau"}, type: signal}
    - {number: "4", name: ID2/RES, function: {en: "Reserved, once monitor ID bit 2", de: "Reserviert, früher Monitor-ID-Bit 2"}, type: nc, notes: {en: "Ground on some monitors.", de: "Bei manchen Monitoren Masse."}}
    - {number: "5", name: GND, function: {en: "Ground", de: "Masse"}, type: ground, notes: {en: "DDC return on some monitors, self-test on others.", de: "Bei manchen Monitoren DDC-Rückleitung, bei anderen Selbsttest."}}
