- id: usb_c
  kind: pinout
  category: pinouts
  group: data
  name: {cs: "USB Type-C", da: "USB Type-C", de: "USB Type-C", el: "USB Type-C", en: "USB Type-C", es: "USB Type-C", fr: "USB Type-C", hi: "USB Type-C", it: "USB Type-C", ja: "USB Type-C", nl: "USB Type-C", no: "USB Type-C", pl: "USB Type-C", pt: "USB Type-C", sv: "USB Type-C", zh: "USB Type-C"}
  doc: {en: "The reversible 24-contact USB connector. The contact plan repeats after a half turn, so the plug fits both ways; the CC lines show which way it is in.", de: "Der umsteckbare USB-Anschluss mit 24 Kontakten. Der Kontaktplan wiederholt sich nach einer halben Drehung, darum passt der Stecker in beiden Lagen; die CC-Leitungen zeigen, wie er steckt."}
  notes: {en: "CC resistors, from tables 4-27 and 4-28 of the Type-C specification. Sink: Rd 5.1 kΩ to GND on CC1 and on CC2 (±10% if it reads the advertised current, otherwise ±20% is allowed). Source: Rp to 4.75–5.5 V on CC1 and on CC2: 56 kΩ ±20% for default USB power, 22 kΩ ±5% for 1.5 A, 10 kΩ ±5% for 3.0 A. With a pull-up to 3.3 V: 36 kΩ ±20%, 12 kΩ ±5%, 4.7 kΩ ±5%. A cable or adapter whose Type-C plug stands for a legacy USB host uses 56 kΩ ±5%. All VBUS contacts are tied together, and so are all GND contacts. A USB 2.0 receptacle leaves A2, A3, A10, A11, B2, B3, B10 and B11 unconnected.", de: "CC-Widerstände aus den Tabellen 4-27 und 4-28 der Type-C-Spezifikation. Senke: Rd 5,1 kΩ gegen GND an CC1 und an CC2 (±10 %, wenn sie den angebotenen Strom auswertet, sonst sind ±20 % erlaubt). Quelle: Rp nach 4,75–5,5 V an CC1 und an CC2: 56 kΩ ±20 % für die normale USB-Leistung, 22 kΩ ±5 % für 1,5 A, 10 kΩ ±5 % für 3,0 A. Mit Pull-up nach 3,3 V: 36 kΩ ±20 %, 12 kΩ ±5 %, 4,7 kΩ ±5 %. Ein Kabel oder Adapter, dessen Type-C-Stecker für einen älteren USB-Host steht, nutzt 56 kΩ ±5 %. Alle VBUS-Kontakte sind miteinander verbunden, ebenso alle GND-Kontakte. Eine USB-2.0-Buchse lässt A2, A3, A10, A11, B2, B3, B10 und B11 unbeschaltet."}
  tags: [usb, usb-c, type-c, "typ c", usb4, "usb 3.2", thunderbolt, cc, cc1, cc2, vconn, sbu, vbus, rd, rp, "5.1 k", "5,1 k", tx, rx, "power delivery", stecker, buchse, receptacle, plug]
  source: "USB Type-C Cable and Connector Specification, Release 2.5 (March 2026), figures 2-1 and 2-2, tables 3-4, 3-5, 4-27 and 4-28"
  views:
    plug: {en: "Plug (cable end)", de: "Stecker (Kabelende)"}
    socket: {en: "Receptacle (on the device)", de: "Buchse (am Gerät)"}
  shape:
    type: rows
    outline: usb_c
    contact: blade
    drawn: socket
    rows:
      - {pins: ["A1", "A2", "A3", "A4", "A5", "A6", "A7", "A8", "A9", "A10", "A11", "A12"]}
      - {pins: ["B12", "B11", "B10", "B9", "B8", "B7", "B6", "B5", "B4", "B3", "B2", "B1"]}
  pins:
    - {number: "A1", name: GND, function: {en: "Ground return", de: "Masserückleitung"}, type: ground}
    - {number: "A2", name: "TX1+", function: {en: "First transmit pair, positive", de: "Erstes Sendepaar, positiv"}, type: data}
    - {number: "A3", name: "TX1-", function: {en: "First transmit pair, negative", de: "Erstes Sendepaar, negativ"}, type: data}
    - {number: "A4", name: VBUS, function: {en: "Bus power", de: "Busversorgung"}, type: power}
    - {number: "A5", name: CC1, function: {en: "Configuration channel 1", de: "Konfigurationskanal 1"}, type: signal, notes: {en: "In a plug this contact is the CC line of the cable.", de: "Im Stecker ist dieser Kontakt die CC-Leitung des Kabels."}}
    - {number: "A6", name: "D+", function: {en: "USB 2.0 data, positive, position 1", de: "USB-2.0-Daten, positiv, Position 1"}, type: data}
    - {number: "A7", name: "D-", function: {en: "USB 2.0 data, negative, position 1", de: "USB-2.0-Daten, negativ, Position 1"}, type: data}
    - {number: "A8", name: SBU1, function: {en: "Sideband use 1", de: "Seitenband-Nutzung 1"}, type: signal}
    - {number: "A9", name: VBUS, function: {en: "Bus power", de: "Busversorgung"}, type: power}
    - {number: "A10", name: "RX2-", function: {en: "Second receive pair, negative", de: "Zweites Empfangspaar, negativ"}, type: data}
    - {number: "A11", name: "RX2+", function: {en: "Second receive pair, positive", de: "Zweites Empfangspaar, positiv"}, type: data}
    - {number: "A12", name: GND, function: {en: "Ground return", de: "Masserückleitung"}, type: ground}
    - {number: "B1", name: GND, function: {en: "Ground return", de: "Masserückleitung"}, type: ground}
    - {number: "B2", name: "TX2+", function: {en: "Second transmit pair, positive", de: "Zweites Sendepaar, positiv"}, type: data}
    - {number: "B3", name: "TX2-", function: {en: "Second transmit pair, negative", de: "Zweites Sendepaar, negativ"}, type: data}
    - {number: "B4", name: VBUS, function: {en: "Bus power", de: "Busversorgung"}, type: power}
    - {number: "B5", name: CC2, function: {en: "Configuration channel 2", de: "Konfigurationskanal 2"}, type: signal, notes: {en: "In a plug this contact is VCONN, the supply for electronics in the plug.", de: "Im Stecker ist dieser Kontakt VCONN, die Versorgung für Elektronik im Stecker."}}
    - {number: "B6", name: "D+", function: {en: "USB 2.0 data, positive, position 2", de: "USB-2.0-Daten, positiv, Position 2"}, type: data, notes: {en: "Not meant to exist in a plug. The receptacle has both positions because the plug can be turned.", de: "Im Stecker nicht vorgesehen. Die Buchse hat beide Positionen, weil der Stecker gedreht werden kann."}}
    - {number: "B7", name: "D-", function: {en: "USB 2.0 data, negative, position 2", de: "USB-2.0-Daten, negativ, Position 2"}, type: data, notes: {en: "Not meant to exist in a plug. The receptacle has both positions because the plug can be turned.", de: "Im Stecker nicht vorgesehen. Die Buchse hat beide Positionen, weil der Stecker gedreht werden kann."}}
    - {number: "B8", name: SBU2, function: {en: "Sideband use 2", de: "Seitenband-Nutzung 2"}, type: signal}
    - {number: "B9", name: VBUS, function: {en: "Bus power", de: "Busversorgung"}, type: power}
    - {number: "B10", name: "RX1-", function: {en: "First receive pair, negative", de: "Erstes Empfangspaar, negativ"}, type: data}
    - {number: "B11", name: "RX1+", function: {en: "First receive pair, positive", de: "Erstes Empfangspaar, positiv"}, type: data}
    - {number: "B12", name: GND, function: {en: "Ground return", de: "Masserückleitung"}, type: ground}

- id: hdmi_a
  kind: pinout
  category: pinouts
  group: data
  name: {cs: "HDMI Type A", da: "HDMI Type A", de: "HDMI Type A", el: "HDMI Type A", en: "HDMI Type A", es: "HDMI Type A", fr: "HDMI Type A", hi: "HDMI Type A", it: "HDMI Type A", ja: "HDMI Type A", nl: "HDMI Type A", no: "HDMI Type A", pl: "HDMI Type A", pt: "HDMI Type A", sv: "HDMI Type A", zh: "HDMI Type A"}
  doc: {en: "The full-size 19-contact HDMI connector: three TMDS data channels and a clock, each with its own shield, plus DDC, CEC, +5 V and hot plug detect.", de: "Der große 19-polige HDMI-Anschluss: drei TMDS-Datenkanäle und ein Takt, jeder mit eigener Abschirmung, dazu DDC, CEC, +5 V und Hot-Plug-Erkennung."}
  notes: {en: "The drawing has the wider side of the shell at the top, with the odd pins in the upper row. From HDMI 1.4 pins 14 and 19 can also carry the HDMI Ethernet and audio return channel (HEAC+ on 14, HEAC- on 19). Older cables and devices leave pin 14 unused. The +5 V line is only for low currents: the sources name 50 mA or 55 mA.", de: "In der Zeichnung liegt die breitere Seite des Gehäuses oben, die ungeraden Pins in der oberen Reihe. Ab HDMI 1.4 können die Pins 14 und 19 auch den HDMI-Ethernet- und Audio-Rückkanal führen (HEAC+ auf 14, HEAC- auf 19). Ältere Kabel und Geräte lassen Pin 14 ungenutzt. Die +5-V-Leitung ist nur für kleine Ströme gedacht: Die Quellen nennen 50 mA oder 55 mA."}
  tags: [hdmi, "type a", "typ a", tmds, ddc, edid, cec, hpd, "hot plug", heac, arc, hec, scl, sda, video, stecker, buchse, receptacle, plug]
  source: "Amphenol Socapex drawing 191-PLC-1038-00 (HDMIF TV 7 x x); Rohde & Schwarz HDMI poster 3606.8489.82, version 03.02 (June 2014); Schlegel RRJ_HDMI_STB data sheet; TRU Components 15 71 072 data sheet; Barco Event Master user guide R5905948, A.24; Sony VPL-PHZ50 help guide, Pin Assignment (HDMI Terminal); Sony patent EP2405654B1"
  views:
    plug: {en: "Plug (cable end)", de: "Stecker (Kabelende)"}
    socket: {en: "Receptacle (on the device)", de: "Buchse (am Gerät)"}
  shape:
    type: rows
    outline: hdmi_a
    contact: blade
    drawn: socket
    rows:
      - {pins: ["19", "17", "15", "13", "11", "9", "7", "5", "3", "1"]}
