- id: rs232_db9
  kind: pinout
  category: pinouts
  group: data
  name: {cs: "RS-232 (DE-9)", da: "RS-232 (DE-9)", de: "RS-232 (DE-9)", el: "RS-232 (DE-9)", en: "RS-232 (DE-9)", es: "RS-232 (DE-9)", fr: "RS-232 (DE-9)", hi: "RS-232 (DE-9)", it: "RS-232 (DE-9)", ja: "RS-232 (DE-9)", nl: "RS-232 (DE-9)", no: "RS-232 (DE-9)", pl: "RS-232 (DE-9)", pt: "RS-232 (DE-9)", sv: "RS-232 (DE-9)", zh: "RS-232 (DE-9)"}
  doc: {en: "The 9-pin serial port of PCs, often called DB9. The DTE (a PC or terminal) has the male connector with pins; the DCE (a modem) has the female connector with sockets.", de: "Der 9-polige serielle Anschluss von PCs, oft DB9 genannt. Die DTE (PC oder Terminal) hat den Stecker mit Stiften, die DCE (Modem) die Buchse."}
  notes: {en: "Every signal name and direction is from the DTE's point of view. A pin carries the same signal at both ends, so the DCE drives what the DTE reads: pin 2 is an output on a DCE. The genders are the usual rule and some devices break it, so check the pin directions on the device before you connect a cable. To join two DTEs you need a cable that crosses TXD and RXD. The levels are RS-232 voltages, not logic levels.", de: "Alle Signalnamen und Richtungen sind aus Sicht der DTE angegeben. Ein Pin führt an beiden Enden dasselbe Signal, die DCE treibt also, was die DTE liest: Pin 2 ist an einer DCE ein Ausgang. Die Steckerformen sind die übliche Regel, manche Geräte halten sich nicht daran, darum vor dem Anschließen die Pinrichtungen am Gerät prüfen. Zwei DTEs verbindet ein Kabel, das TXD und RXD kreuzt. Die Pegel sind RS-232-Spannungen, keine Logikpegel."}
  tags: [rs232, rs-232, "rs 232", db9, de9, de-9, d-sub, dsub, serial, seriell, com, uart, txd, rxd, rts, cts, dtr, dsr, dcd, dte, dce, modem, tia-574, stecker, buchse]
  source: "Texas Instruments SLLA037A, Interface Circuits for TIA/EIA-232-F; Moxa NPort 6110 user's manual, Pin assignments; Crypto Museum, D-sub connectors; serial_pinout.txt (xmtel archive, University of Louisville); CS Club Waterloo wiki, Serial Pin-outs"
  views:
    plug: {en: "Male connector, pins (DTE, such as a PC)", de: "Stecker mit Stiften (DTE, etwa ein PC)"}
    socket: {en: "Female connector, sockets (DCE, such as a modem)", de: "Buchse (DCE, etwa ein Modem)"}
  shape:
    type: rows
    outline: dsub
    contact: round
    drawn: plug
    rows:
      - {pins: ["1", "2", "3", "4", "5"]}
      - {pins: ["6", "7", "8", "9"], offset: 0.5}
  pins:
    - {number: "1", name: DCD, function: {en: "Data carrier detect: input at the DTE, output at the DCE", de: "Trägersignal erkannt: Eingang an der DTE, Ausgang an der DCE"}, type: signal}
    - {number: "2", name: RXD, function: {en: "Received data: input at the DTE, output at the DCE", de: "Empfangsdaten: Eingang an der DTE, Ausgang an der DCE"}, type: data}
    - {number: "3", name: TXD, function: {en: "Transmitted data: output at the DTE, input at the DCE", de: "Sendedaten: Ausgang an der DTE, Eingang an der DCE"}, type: data}
    - {number: "4", name: DTR, function: {en: "Data terminal ready: output at the DTE, input at the DCE", de: "Endgerät bereit: Ausgang an der DTE, Eingang an der DCE"}, type: signal}
    - {number: "5", name: GND, function: {en: "Signal ground, common reference of all circuits", de: "Signalmasse, gemeinsamer Bezug aller Leitungen"}, type: ground}
    - {number: "6", name: DSR, function: {en: "Data set ready: input at the DTE, output at the DCE", de: "Modem bereit: Eingang an der DTE, Ausgang an der DCE"}, type: signal}
    - {number: "7", name: RTS, function: {en: "Request to send: output at the DTE, input at the DCE", de: "Sendeanforderung: Ausgang an der DTE, Eingang an der DCE"}, type: signal}
    - {number: "8", name: CTS, function: {en: "Clear to send: input at the DTE, output at the DCE", de: "Sendefreigabe: Eingang an der DTE, Ausgang an der DCE"}, type: signal}
    - {number: "9", name: RI, function: {en: "Ring indicator: input at the DTE, output at the DCE", de: "Klingelsignal: Eingang an der DTE, Ausgang an der DCE"}, type: signal}
