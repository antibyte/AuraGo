  name: {cs: "Arduino Leonardo", da: "Arduino Leonardo", de: "Arduino Leonardo", el: "Arduino Leonardo", en: "Arduino Leonardo", es: "Arduino Leonardo", fr: "Arduino Leonardo", hi: "Arduino Leonardo", it: "Arduino Leonardo", ja: "Arduino Leonardo", nl: "Arduino Leonardo", no: "Arduino Leonardo", pl: "Arduino Leonardo", pt: "Arduino Leonardo", sv: "Arduino Leonardo", zh: "Arduino Leonardo"}
  doc: {en: "Arduino Leonardo from above in the Uno form factor, with the Micro-USB socket at the top and the DC jack beside it. The board carries no pin numbers, so each pin is named after its header in the Arduino schematic (J3, J4, JP1, J2, ICSP) plus its position there. These names differ from the Uno's although the positions are the same.", de: "Arduino Leonardo von oben im Uno-Format, die Micro-USB-Buchse oben, daneben die Hohlbuchse. Die Platine trägt keine Pinnummern, daher heißt jeder Pin nach seiner Stiftleiste im Arduino-Schaltplan (J3, J4, JP1, J2, ICSP) plus Position. Diese Namen weichen von denen des Uno ab, die Positionen sind gleich."}
  notes: {en: "Logic level 5 V. Current per I/O pin: Arduino's pinout says 20 mA at most, the tech specs say 10 mA; stay at 10 mA. The 3V3 pin gives 50 mA at most. VIN: the pinout says 6–20 V, the tech specs 7–12 V nominal; stay within 7–12 V. I2C is on D2 (SDA) and D3 (SCL) and on the two pins beside AREF, not on A4 and A5. SPI is only on the ICSP block, not on D11 to D13. The USB serial port is native (Serial); D0 and D1 are a separate hardware UART (Serial1), not linked to USB, so a circuit on them does not disturb uploads. A6 to A11 are extra analog inputs on D4, D6, D8, D9, D10 and D12. PWM is on D3, D5, D6, D9, D10, D11 and D13. There is no ATmega16U2 and no second ICSP header on this board.", de: "Logikpegel 5 V. Strom je I/O-Pin: Arduinos Pinout nennt höchstens 20 mA, die Tech Specs 10 mA; bleiben Sie bei 10 mA. Der 3V3-Pin liefert höchstens 50 mA. VIN: das Pinout nennt 6–20 V, die Tech Specs 7–12 V nominal; bleiben Sie bei 7–12 V. I2C liegt an D2 (SDA) und D3 (SCL) und an den zwei Pins neben AREF, nicht an A4 und A5. SPI liegt nur am ICSP-Block, nicht an D11 bis D13. Die serielle USB-Schnittstelle ist nativ (Serial); D0 und D1 sind ein eigener Hardware-UART (Serial1) ohne Verbindung zu USB, eine Schaltung daran stört das Hochladen nicht. A6 bis A11 sind zusätzliche Analogeingänge an D4, D6, D8, D9, D10 und D12. PWM gibt es an D3, D5, D6, D9, D10, D11 und D13. Die Platine hat keinen ATmega16U2 und keine zweite ICSP-Leiste."}
