  doc: {en: "Arduino Pro Mini in the layout of the maker SparkFun (PCB v14), seen from the component side with the 6-pin FTDI header at the top edge. The board carries no pin numbers, so each pin is named after its header in the SparkFun schematic: JP1 (FTDI), JP7 (left edge), JP6 (right edge) and the two inner pads JP2 (A4, A5) and JP3 (A6, A7) plus its position there. The drawing places the FTDI header (BLK end at the left, GRN end at the right) and the inner pads, which sit inside the board off the 0.1 inch grid of the edge rows, as small groups in the middle of the board, not at their real places. Clone boards sold as Pro Mini are not covered.", de: "Arduino Pro Mini im Layout des Herstellers SparkFun (Platine v14), von der Bauteilseite gesehen, die 6-polige FTDI-Leiste am oberen Rand. Die Platine trägt keine Pinnummern, daher heißt jeder Pin nach seiner Stiftleiste im SparkFun-Schaltplan: JP1 (FTDI), JP7 (linke Kante), JP6 (rechte Kante) und die beiden inneren Pads JP2 (A4, A5) und JP3 (A6, A7) plus Position. Die inneren Pads liegen innerhalb der Platine, abseits des 0,1-Zoll-Rasters der Randreihen; die Zeichnung setzt die FTDI-Leiste (BLK-Ende links, GRN-Ende rechts) und die inneren Pads als kleine Gruppen in die Mitte der Platine, nicht an ihre wirklichen Orte. Klone, die als Pro Mini verkauft werden, sind nicht abgedeckt."}
  notes: {en: "One PCB for two models, 5 V / 16 MHz and 3.3 V / 8 MHz: the logic level of every I/O pin is the VCC of the model, so do not drive the pins of the 3.3 V model with 5 V. RAW feeds the on-board regulator (150 mA): Arduino's tech specs give 5–12 V for the 5 V model and 3.35–12 V for the 3.3 V model, SparkFun up to 16 V; stay within 12 V and feed unregulated power to RAW, not to VCC. Current per I/O pin: 40 mA at most (Arduino and SparkFun), 20 mA recommended by SparkFun; use 20 mA. The FTDI header takes a 3.3 V or 5 V FTDI cable or breakout; JP1.6 (marked BLK) is the ground end and JP1.1 (marked GRN) is DTR. TXO and RXI are the board's own TX and RX, which the adapter crosses. The board has no USB. A6 and A7 are analog inputs only.", de: "Eine Platine für zwei Modelle, 5 V / 16 MHz und 3,3 V / 8 MHz: der Logikpegel jedes I/O-Pins ist die VCC des Modells, die Pins des 3,3-V-Modells daher nicht mit 5 V treiben. RAW speist den Regler auf der Platine (150 mA): Arduinos Tech Specs nennen 5–12 V für das 5-V-Modell und 3,35–12 V für das 3,3-V-Modell, SparkFun bis 16 V; bleiben Sie unter 12 V und speisen Sie ungeregelte Spannung an RAW, nicht an VCC. Strom je I/O-Pin: höchstens 40 mA (Arduino und SparkFun), 20 mA empfohlen von SparkFun; rechnen Sie mit 20 mA. Die FTDI-Leiste nimmt ein FTDI-Kabel oder -Breakout mit 3,3 V oder 5 V auf; JP1.6 (BLK) ist das Masse-Ende, JP1.1 (GRN) ist DTR. TXO und RXI sind das eigene TX und RX der Platine, die der Adapter kreuzt. Die Platine hat kein USB. A6 und A7 sind nur Analogeingänge."}
