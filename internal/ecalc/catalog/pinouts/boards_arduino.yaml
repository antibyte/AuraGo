  name: {cs: "BBC micro:bit V2", da: "BBC micro:bit V2", de: "BBC micro:bit V2", el: "BBC micro:bit V2", en: "BBC micro:bit V2", es: "BBC micro:bit V2", fr: "BBC micro:bit V2", hi: "BBC micro:bit V2", it: "BBC micro:bit V2", ja: "BBC micro:bit V2", nl: "BBC micro:bit V2", no: "BBC micro:bit V2", pl: "BBC micro:bit V2", pt: "BBC micro:bit V2", sv: "BBC micro:bit V2", zh: "BBC micro:bit V2"}
  doc: {en: "Edge connector of the BBC micro:bit V2 in the front view: the side with the LED matrix and the buttons A and B, upright, the connector along the bottom edge and read from left to right. The board prints no pin numbers, so each contact is numbered like the pins of J1 in the V2.2.1 schematic (1 to 40 along the edge): the five large rings are 2 (ring 0), 10 (ring 1), 19 (ring 2), 28 (3V) and 36 (GND), the others are the small strips between them. Every ring is drawn as one position, although it is four strip widths wide. Only the front contacts are listed: the rings on the back are the same nets and the small strips on the back are not connected. The USB socket, marked at the top as an orientation aid, is on the back of the board.", de: "Randstecker des BBC micro:bit V2 in der Vorderansicht: die Seite mit LED-Matrix und den Tastern A und B, aufrecht, der Stecker am unteren Rand und von links nach rechts gelesen. Die Platine druckt keine Pinnummern, daher sind die Kontakte wie die Pins von J1 im V2.2.1-Schaltplan nummeriert (1 bis 40 entlang der Kante): die fünf großen Ringe sind 2 (Ring 0), 10 (Ring 1), 19 (Ring 2), 28 (3V) und 36 (GND), die übrigen sind die kleinen Streifen dazwischen. Jeder Ring ist als eine Position gezeichnet, obwohl er vier Streifenbreiten breit ist. Es sind nur die Kontakte der Vorderseite aufgeführt: die Ringe auf der Rückseite sind dieselben Netze, die kleinen Streifen auf der Rückseite sind nicht verbunden. Die USB-Buchse, oben als Orientierungshilfe markiert, sitzt auf der Rückseite der Platine."}
  notes: {en: "All signal contacts are 3.3 V logic and not 5 V tolerant: the pin voltage must stay between −0.3 V and VDD + 0.3 V, and the board supply is 1.7 to 3.6 V. Drive is 1 to 4 mA standard and 6 to 15 mA high. The edge connector may supply 190 mA (300 mA regulator minus the on-board budget); the edge-connector page says 270 mA and marks it as to be confirmed, so use 190 mA. Only three pins can do PWM at the same time. P3, P4, P6, P7 and P10 belong to the LED display: switch the display off in software before using them otherwise. P5 and P11 are the buttons A and B, P12 is reserved for the accessibility mode. P19 and P20 are the external I2C bus with 4.7 kΩ pull-ups; on V2 the motion sensor is on a separate internal I2C bus. Do not connect speakers, motors or piezos directly. To power the board through the 3V ring use a regulated supply and a protection diode.", de: "Alle Signalkontakte arbeiten mit 3,3-V-Logik und sind nicht 5-V-tolerant: die Pinspannung muss zwischen −0,3 V und VDD + 0,3 V bleiben, die Versorgung der Platine beträgt 1,7 bis 3,6 V. Die Treiberstärke ist 1 bis 4 mA normal und 6 bis 15 mA hoch. Der Randstecker darf 190 mA liefern (300-mA-Regler minus Bedarf auf der Platine); die Seite zum Randstecker nennt 270 mA und markiert sie als zu bestätigen, rechnen Sie daher mit 190 mA. Nur drei Pins können gleichzeitig PWM. P3, P4, P6, P7 und P10 gehören zur LED-Anzeige: schalten Sie die Anzeige in der Software ab, bevor Sie sie anders nutzen. P5 und P11 sind die Taster A und B, P12 ist für den Barrierefreiheitsmodus reserviert. P19 und P20 sind der externe I2C-Bus mit 4,7-kΩ-Pull-ups; auf V2 hängt der Bewegungssensor an einem eigenen internen I2C-Bus. Lautsprecher, Motoren oder Piezos nicht direkt anschließen. Zur Speisung über den 3V-Ring eine geregelte Versorgung und eine Schutzdiode verwenden."}
