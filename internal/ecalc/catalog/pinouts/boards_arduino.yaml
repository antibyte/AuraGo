  name: {cs: "Arduino Micro", da: "Arduino Micro", de: "Arduino Micro", el: "Arduino Micro", en: "Arduino Micro", es: "Arduino Micro", fr: "Arduino Micro", hi: "Arduino Micro", it: "Arduino Micro", ja: "Arduino Micro", nl: "Arduino Micro", no: "Arduino Micro", pl: "Arduino Micro", pt: "Arduino Micro", sv: "Arduino Micro", zh: "Arduino Micro"}
  doc: {en: "Arduino Micro from above with the Micro-USB socket at the top, the reset button and the 2×3 ICSP block towards the bottom and 17 pins down each long edge. The board carries no pin numbers, so each pin is named after its header in the Arduino schematic (J5 right, J6 left) plus its position there, pin 1 at the end away from USB. The ICSP block is called ICSP here; the schematic calls it J4.", de: "Arduino Micro von oben, die Micro-USB-Buchse oben, Reset-Taster und der ICSP-Block 2×3 zum unteren Ende hin, 17 Pins an jeder Längskante. Die Platine trägt keine Pinnummern, daher heißt jeder Pin nach seiner Stiftleiste im Arduino-Schaltplan (J5 rechts, J6 links) plus Position, Pin 1 am von USB abgewandten Ende. Der ICSP-Block heißt hier ICSP; im Schaltplan heißt er J4."}
  notes: {en: "Logic level 5 V. Current per I/O pin: the Micro pinout's legend says 40 mA at most, the Leonardo pinout 20 mA and the tech specs 10 mA; stay at 10 mA. VIN: the pinout says 6–9 V, the tech specs 7–12 V nominal; stay within 7–9 V, where both agree. The USB serial port is native (Serial); D0 and D1 are the separate hardware UART Serial1. I2C is on D2 (SDA) and D3 (SCL); SPI is on D14 to D17 and the ICSP block. PWM is on D3, D5, D6, D9, D10, D11 and D13. A6 to A11 are extra analog inputs on D4, D6, D8, D9, D10 and D12. D17 (SS) shares its pin with the RX LED.", de: "Logikpegel 5 V. Strom je I/O-Pin: die Legende des Micro-Pinouts nennt höchstens 40 mA, das Leonardo-Pinout 20 mA und die Tech Specs 10 mA; bleiben Sie bei 10 mA. VIN: das Pinout nennt 6–9 V, die Tech Specs 7–12 V nominal; bleiben Sie bei 7–9 V, wo beide übereinstimmen. Die serielle USB-Schnittstelle ist nativ (Serial); D0 und D1 sind der eigene Hardware-UART Serial1. I2C liegt an D2 (SDA) und D3 (SCL); SPI an D14 bis D17 und am ICSP-Block. PWM gibt es an D3, D5, D6, D9, D10, D11 und D13. A6 bis A11 sind zusätzliche Analogeingänge an D4, D6, D8, D9, D10 und D12. D17 (SS) teilt sich den Pin mit der RX-LED."}
