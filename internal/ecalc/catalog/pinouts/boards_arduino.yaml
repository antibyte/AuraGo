- id: arduino_mega
  kind: pinout
  category: pinouts
  group: boards
  name: {cs: "Arduino Mega 2560 Rev3", da: "Arduino Mega 2560 Rev3", de: "Arduino Mega 2560 Rev3", el: "Arduino Mega 2560 Rev3", en: "Arduino Mega 2560 Rev3", es: "Arduino Mega 2560 Rev3", fr: "Arduino Mega 2560 Rev3", hi: "Arduino Mega 2560 Rev3", it: "Arduino Mega 2560 Rev3", ja: "Arduino Mega 2560 Rev3", nl: "Arduino Mega 2560 Rev3", no: "Arduino Mega 2560 Rev3", pl: "Arduino Mega 2560 Rev3", pt: "Arduino Mega 2560 Rev3", sv: "Arduino Mega 2560 Rev3", zh: "Arduino Mega 2560 Rev3"}
  doc: {en: "Arduino Mega 2560 Rev3 from above with the USB-B socket at the top and the DC jack beside it. The board carries no pin numbers, so each pin is named after its header in the Arduino schematic plus its position there. JP6, ADCH, XIO (the 2×18 double row) and ICSP are the schematic's names; POWER, ADCL, PWML and COMM stand for the four 8-pin headers the schematic leaves unnamed and are ours. The double row is drawn as one block in the middle of the board; on the board it lies along the bottom edge, with the +5V pins (XIO.1, XIO.2) at the right end and the even pins XIO.2 to XIO.36 in the lower row at the board edge.", de: "Arduino Mega 2560 Rev3 von oben, die USB-B-Buchse oben, daneben die Hohlbuchse. Die Platine trägt keine Pinnummern, daher heißt jeder Pin nach seiner Stiftleiste im Arduino-Schaltplan plus Position. JP6, ADCH, XIO (die Doppelreihe 2×18) und ICSP sind die Namen aus dem Schaltplan; POWER, ADCL, PWML und COMM stehen für die vier 8-poligen Leisten, die der Schaltplan nicht benennt, und stammen von uns. Die Doppelreihe wird als ein Block in der Mitte der Platine gezeichnet; auf der Platine liegt sie am unteren Rand, die +5V-Pins (XIO.1, XIO.2) am rechten Ende und die geraden Pins XIO.2 bis XIO.36 in der unteren Reihe am Platinenrand."}
  notes: {en: "Logic level 5 V; each I/O pin carries 20 mA at most, the 3V3 pin 50 mA. VIN: Arduino's pinout says 6–20 V, the datasheet recommends 7–12 V; stay within 7–12 V. PWM is on D2 to D13 and D44 to D46 (15 pins) per the datasheet and the analogWrite reference; the pinout figure also marks D0 and D1 with a tilde, which the other documents do not support. I2C is on D20 (SDA) and D21 (SCL), also on the SDA and SCL pins beside AREF, not on A4 and A5 as on the Uno. SPI is on D50 to D53 and the ICSP block, not on D11 to D13. D0 and D1 also reach the USB bridge. The pinout also prints external-memory names (A8 to A15 on D37 to D30); those are address lines, not the analog inputs A8 to A15. ICSP1 of the ATmega16U2 near the USB socket and the 2×2 JP5 pads are not listed; the RESET-EN solder jumper disables auto-reset.", de: "Logikpegel 5 V; jeder I/O-Pin trägt höchstens 20 mA, der 3V3-Pin 50 mA. VIN: Arduinos Pinout nennt 6–20 V, das Datenblatt empfiehlt 7–12 V; bleiben Sie bei 7–12 V. PWM gibt es an D2 bis D13 und D44 bis D46 (15 Pins) laut Datenblatt und analogWrite-Referenz; die Pinout-Grafik markiert auch D0 und D1 mit einer Tilde, was die anderen Dokumente nicht stützen. I2C liegt an D20 (SDA) und D21 (SCL), ebenso an den Pins SDA und SCL neben AREF, nicht an A4 und A5 wie beim Uno. SPI liegt an D50 bis D53 und am ICSP-Block, nicht an D11 bis D13. D0 und D1 führen auch zur USB-Brücke. Das Pinout druckt außerdem Namen für externen Speicher (A8 bis A15 an D37 bis D30); das sind Adressleitungen, nicht die Analogeingänge A8 bis A15. ICSP1 des ATmega16U2 nahe der USB-Buchse und die 2×2-Pads JP5 sind nicht aufgeführt; die Lötbrücke RESET-EN schaltet den Auto-Reset ab."}
  tags: ["arduino", "mega", "mega 2560", "mega2560", "mega 2560 rev3", "atmega2560", "shield", "header", "stiftleiste", "belegung", "pinout", "icsp", "isp", "spi", "i2c", "uart", "serial1", "serial2", "serial3", "pwm", "sda", "scl", "mosi", "miso", "cipo", "copi", "sck", "ioref", "aref", "vin", "d13", "a0", "a15", "xio", "gpio"]
