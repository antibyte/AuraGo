  name: {cs: "Jack 3,5 mm, stereo (TRS)", da: "3,5 mm jack, stereo (TRS)", de: "3,5-mm-Klinke, Stereo (TRS)", el: "Βύσμα 3,5 mm, στερεοφωνικό (TRS)", en: "3.5 mm jack, stereo (TRS)", es: "Jack 3,5 mm, estéreo (TRS)", fr: "Jack 3,5 mm, stéréo (TRS)", hi: "3.5 मिमी जैक, स्टीरियो (TRS)", it: "Jack 3,5 mm, stereo (TRS)", ja: "3.5 mm ジャック ステレオ (TRS)", nl: "3,5 mm-jack, stereo (TRS)", "no": "3,5 mm jack, stereo (TRS)", pl: "Jack 3,5 mm, stereo (TRS)", pt: "Jack 3,5 mm, estéreo (TRS)", sv: "3,5 mm-teleplugg, stereo (TRS)", zh: "3.5 毫米立体声插头 (TRS)"}
  doc: {en: "The common 3.5 mm stereo plug of headphones and line cables, shown from the side with the tip at the left.", de: "Der übliche 3,5-mm-Stereostecker von Kopfhörern und Line-Kabeln, von der Seite gezeigt, Spitze links."}
  notes: {en: "Left and right on tip and ring apply to headphones and stereo line signals. Balanced studio TRS jacks use the same contacts for positive, negative and ground instead.", de: "Links und rechts auf Spitze und Ring gelten für Kopfhörer und Stereo-Line-Signale. Symmetrische TRS-Buchsen der Studiotechnik belegen dieselben Kontakte stattdessen mit Plus, Minus und Masse."}
  tags: ["trs", "klinke", "3.5 mm", "3,5 mm", "jack", "mini jack", "miniklinke", "stereo", "tip", "ring", "sleeve", "headphones", "kopfhörer", "aux", "audio"]
  source: "Texas Instruments TS3A225E datasheet SCDS329A, table 2; Rane Note 102 (Rane Corporation), section on phone jacks; Wikipedia, Phone connector (audio)"
  shape:
