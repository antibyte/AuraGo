  doc: {en: "Raspberry Pi Pico and Pico W from above with the micro-USB socket at the top: pin 1 top left, pin 20 bottom left, pin 21 bottom right, pin 40 top right. D1 to D3 are the three debug pads, shown where the Pico has them.", de: "Raspberry Pi Pico und Pico W von oben, die Micro-USB-Buchse oben: Pin 1 oben links, Pin 20 unten links, Pin 21 unten rechts, Pin 40 oben rechts. D1 bis D3 sind die drei Debug-Pads, gezeichnet an der Stelle des Pico."}
  notes: {en: "Pins 1 to 40 are the same on both boards. The debug pads sit on the bottom edge of the Pico; on the Pico W they are inside the board, level with pins 13 and 28, in the same left-to-right order. The GPIOs run at 3.3 V and all of them also do PWM and PIO. (default) marks the bus pins that Raspberry Pi's pinout highlights as default. Keep GP26 to GP28 below 3.3 V plus 300 mV. The user LED is not on a header: GPIO25 on the Pico, WL_GPIO0 of the wireless chip on the Pico W.", de: "Die Pins 1 bis 40 sind auf beiden Boards gleich. Die Debug-Pads liegen beim Pico an der Unterkante; beim Pico W liegen sie innerhalb der Platine auf Höhe der Pins 13 und 28, in derselben Reihenfolge von links nach rechts. Die GPIOs arbeiten mit 3,3 V und können alle auch PWM und PIO. (Standard) markiert die Bus-Pins, die Raspberry Pis Pinout als Vorgabe hervorhebt. GP26 bis GP28 unter 3,3 V plus 300 mV halten. Die Benutzer-LED liegt an keiner Stiftleiste: GPIO25 beim Pico, WL_GPIO0 des Funkchips beim Pico W."}
  tags: ["raspberry pi", "pico", "pico w", "rp2040", "gpio", "gp0", "gp15", "swd", "swclk", "swdio", "debug", "adc", "i2c", "spi", "uart", "pwm", "pio", "vsys", "vbus", "3v3_en", "run", "agnd", "adc_vref", "mikrocontroller", "belegung", "pinout"]
