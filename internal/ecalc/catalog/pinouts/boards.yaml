    - {number: "J2.12", name: "GPIO14", function: {en: "ADC2_CH6, TOUCH6, JTAG MTMS, HSPI SCK", de: "ADC2_CH6, TOUCH6, JTAG MTMS, HSPI SCK"}, type: io}
    - {number: "J2.13", name: "GPIO12", function: {en: "Strapping pin (MTDI). ADC2_CH5, TOUCH5, HSPI MISO", de: "Strapping-Pin (MTDI). ADC2_CH5, TOUCH5, HSPI MISO"}, type: io, notes: {en: "Keep low at reset: high switches the flash supply to the internal 1.8 V regulator.", de: "Beim Reset low halten: High schaltet die Flash-Versorgung auf den internen 1,8-V-Regler."}}
    - {number: "J2.14", name: "GND", function: {en: "Ground", de: "Masse"}, type: ground}
    - {number: "J2.15", name: "GPIO13", function: {en: "ADC2_CH4, TOUCH4, JTAG MTCK, HSPI MOSI", de: "ADC2_CH4, TOUCH4, JTAG MTCK, HSPI MOSI"}, type: io}
    - {number: "J2.16", name: "GPIO9", function: {en: "Silk D2. SPI flash line SD_DATA2; leave free", de: "Aufdruck D2. SPI-Flash-Leitung SD_DATA2; frei lassen"}, type: data}
    - {number: "J2.17", name: "GPIO10", function: {en: "Silk D3. SPI flash line SD_DATA3; leave free", de: "Aufdruck D3. SPI-Flash-Leitung SD_DATA3; frei lassen"}, type: data}
    - {number: "J2.18", name: "GPIO11", function: {en: "Silk CMD. SPI flash line SD_CMD; leave free", de: "Aufdruck CMD. SPI-Flash-Leitung SD_CMD; frei lassen"}, type: data}
    - {number: "J2.19", name: "5V", function: {en: "5 V supply, output or input", de: "5-V-Versorgung, Ausgang oder Eingang"}, type: power}
    - {number: "J3.1", name: "GND", function: {en: "Ground", de: "Masse"}, type: ground}
    - {number: "J3.2", name: "GPIO23", function: {en: "VSPI MOSI", de: "VSPI MOSI"}, type: io}
    - {number: "J3.3", name: "GPIO22", function: {en: "I2C SCL in the Arduino core (WIRE_SCL)", de: "I2C SCL im Arduino-Core (WIRE_SCL)"}, type: io}
    - {number: "J3.4", name: "GPIO1", function: {en: "Silk TX. UART0 TXD; USB bridge and boot messages", de: "Aufdruck TX. UART0 TXD; USB-Brücke und Boot-Meldungen"}, type: io}
    - {number: "J3.5", name: "GPIO3", function: {en: "Silk RX. UART0 RXD; USB bridge", de: "Aufdruck RX. UART0 RXD; USB-Brücke"}, type: io}
    - {number: "J3.6", name: "GPIO21", function: {en: "I2C SDA in the Arduino core (WIRE_SDA)", de: "I2C SDA im Arduino-Core (WIRE_SDA)"}, type: io}
    - {number: "J3.7", name: "GND", function: {en: "Ground", de: "Masse"}, type: ground}
    - {number: "J3.8", name: "GPIO19", function: {en: "VSPI MISO", de: "VSPI MISO"}, type: io}
    - {number: "J3.9", name: "GPIO18", function: {en: "VSPI SCK", de: "VSPI SCK"}, type: io}
    - {number: "J3.10", name: "GPIO5", function: {en: "Strapping pin. VSPI SS", de: "Strapping-Pin. VSPI SS"}, type: io, notes: {en: "Together with GPIO15 it sets the SDIO slave timing at reset; pulled up by default.", de: "Legt zusammen mit GPIO15 beim Reset das SDIO-Slave-Timing fest; standardmäßig Pull-up."}}
    - {number: "J3.11", name: "GPIO17", function: {en: "UART2 TXD; reserved on WROVER boards", de: "UART2 TXD; auf WROVER-Boards reserviert"}, type: io, notes: {en: "Free only with ESP32-WROOM and ESP32-SOLO-1 modules.", de: "Nur mit den Modulen ESP32-WROOM und ESP32-SOLO-1 frei."}}
    - {number: "J3.12", name: "GPIO16", function: {en: "UART2 RXD; reserved on WROVER boards", de: "UART2 RXD; auf WROVER-Boards reserviert"}, type: io, notes: {en: "Free only with ESP32-WROOM and ESP32-SOLO-1 modules.", de: "Nur mit den Modulen ESP32-WROOM und ESP32-SOLO-1 frei."}}
    - {number: "J3.13", name: "GPIO4", function: {en: "ADC2_CH0, TOUCH0", de: "ADC2_CH0, TOUCH0"}, type: io}
    - {number: "J3.14", name: "GPIO0", function: {en: "Strapping pin; Boot button. ADC2_CH1, TOUCH1", de: "Strapping-Pin; Boot-Taster. ADC2_CH1, TOUCH1"}, type: io, notes: {en: "Low at reset, with GPIO2 low as well, starts download mode.", de: "Low beim Reset, zusammen mit GPIO2 low, startet den Download-Modus."}}
    - {number: "J3.15", name: "GPIO2", function: {en: "Strapping pin. ADC2_CH2, TOUCH2", de: "Strapping-Pin. ADC2_CH2, TOUCH2"}, type: io, notes: {en: "Must be low for download mode; has no effect on a normal boot.", de: "Muss für den Download-Modus low sein; beim normalen Start ohne Wirkung."}}
    - {number: "J3.16", name: "GPIO15", function: {en: "Strapping pin (MTDO). ADC2_CH3, TOUCH3, HSPI SS", de: "Strapping-Pin (MTDO). ADC2_CH3, TOUCH3, HSPI SS"}, type: io, notes: {en: "Low at reset silences the boot messages on U0TXD; with GPIO5 it also sets the SDIO slave timing.", de: "Low beim Reset unterdrückt die Boot-Meldungen auf U0TXD; legt mit GPIO5 auch das SDIO-Slave-Timing fest."}}
    - {number: "J3.17", name: "GPIO8", function: {en: "Silk D1. SPI flash line SD_DATA1; leave free", de: "Aufdruck D1. SPI-Flash-Leitung SD_DATA1; frei lassen"}, type: data}
    - {number: "J3.18", name: "GPIO7", function: {en: "Silk D0. SPI flash line SD_DATA0; leave free", de: "Aufdruck D0. SPI-Flash-Leitung SD_DATA0; frei lassen"}, type: data}
    - {number: "J3.19", name: "GPIO6", function: {en: "Silk CLK. SPI flash line SD_CLK; leave free", de: "Aufdruck CLK. SPI-Flash-Leitung SD_CLK; frei lassen"}, type: data}

- id: esp8266_nodemcu
  kind: pinout
  category: pinouts
  group: boards
  name: {cs: "NodeMCU DevKit 1.0 (ESP8266)", da: "NodeMCU DevKit 1.0 (ESP8266)", de: "NodeMCU DevKit 1.0 (ESP8266)", el: "NodeMCU DevKit 1.0 (ESP8266)", en: "NodeMCU DevKit 1.0 (ESP8266)", es: "NodeMCU DevKit 1.0 (ESP8266)", fr: "NodeMCU DevKit 1.0 (ESP8266)", hi: "NodeMCU DevKit 1.0 (ESP8266)", it: "NodeMCU DevKit 1.0 (ESP8266)", ja: "NodeMCU DevKit 1.0 (ESP8266)", nl: "NodeMCU DevKit 1.0 (ESP8266)", no: "NodeMCU DevKit 1.0 (ESP8266)", pl: "NodeMCU DevKit 1.0 (ESP8266)", pt: "NodeMCU DevKit 1.0 (ESP8266)", sv: "NodeMCU DevKit 1.0 (ESP8266)", zh: "NodeMCU DevKit 1.0 (ESP8266)"}
  doc: {en: "NodeMCU DevKit V1.0 with ESP-12E from the component side, drawn with the Micro-USB socket at the top, so the antenna is at the bottom; the project's own pin map shows the board the other way up. Numbers are the headers J1 and J2 of its schematic.", de: "NodeMCU DevKit V1.0 mit ESP-12E von der Bauteilseite, gezeichnet mit der Micro-USB-Buchse oben, die Antenne also unten; der Pin-Plan des Projekts zeigt die Platine umgekehrt. Die Nummern sind die Stiftleisten J1 und J2 seines Schaltplans."}
  notes: {en: "This is the open-hardware V1.0 revision only. Clones differ, so compare with the silk screen before wiring. For a boot D8 (GPIO15) must be low and D4 (GPIO2) high; D3 (GPIO0) high runs the firmware, low enters flash mode. Logic runs at 3.3 V, inputs take 3.6 V at most, an output 12 mA. PWM and I2C are done in software: the NodeMCU firmware accepts the IO indexes 1 to 12, and its examples use a different pair than the Arduino core's default of D2 (SDA) and D1 (SCL).", de: "Dies ist nur die offene Hardware-Revision V1.0. Klone weichen ab, daher vor dem Verdrahten mit dem Aufdruck vergleichen. Zum Start muss D8 (GPIO15) low und D4 (GPIO2) high sein; D3 (GPIO0) high führt die Firmware aus, low startet den Flash-Modus. Die Logik arbeitet mit 3,3 V, Eingänge vertragen höchstens 3,6 V, ein Ausgang 12 mA. PWM und I2C laufen in Software: Die NodeMCU-Firmware nimmt die IO-Indizes 1 bis 12, ihre Beispiele nutzen ein anderes Paar als der Arduino-Core mit D2 (SDA) und D1 (SCL) als Vorgabe."}
  tags: ["esp8266", "nodemcu", "devkit", "esp-12e", "esp12", "wifi", "gpio", "d0", "d1", "d8", "gpio16", "strapping", "flash", "a0", "adc", "hspi", "uart", "i2c", "pwm", "rsv", "vin", "stiftleiste", "belegung", "pinout"]
  source: "NodeMCU DEVKIT V1.0 schematic, pin map and instruction V1.0 (github.com/nodemcu/nodemcu-devkit-v1.0); NodeMCU firmware documentation, modules gpio, i2c, pwm, spi; Espressif, ESP8266EX Datasheet v7.1; ESP8266 Arduino core documentation, Libraries"
  shape:
    type: board
    connector: top
    left: ["J2.15", "J2.14", "J2.13", "J2.12", "J2.11", "J2.10", "J2.9", "J2.8", "J2.7", "J2.6", "J2.5", "J2.4", "J2.3", "J2.2", "J2.1"]
    right: ["J1.15", "J1.14", "J1.13", "J1.12", "J1.11", "J1.10", "J1.9", "J1.8", "J1.7", "J1.6", "J1.5", "J1.4", "J1.3", "J1.2", "J1.1"]
  pins:
    - {number: "J1.1", name: "A0", function: {en: "Analog input to TOUT (ADC0) through a divider", de: "Analogeingang über Spannungsteiler an TOUT (ADC0)"}, type: signal, notes: {en: "220 kΩ over 100 kΩ on the board: 3.2 V at A0 gives the 1.0 V limit of TOUT.", de: "220 kΩ über 100 kΩ auf der Platine: 3,2 V an A0 ergeben die 1,0-V-Grenze von TOUT."}}
    - {number: "J1.2", name: "RSV", function: {en: "Reserved; leave open", de: "Reserviert; offen lassen"}, type: nc, notes: {en: "The schematic ties this pin to the ADC net behind the divider.", de: "Der Schaltplan legt diesen Pin an das ADC-Netz hinter dem Teiler."}}
    - {number: "J1.3", name: "RSV", function: {en: "Reserved; leave open", de: "Reserviert; offen lassen"}, type: nc}
    - {number: "J1.4", name: "SD3", function: {en: "GPIO10 (IO index 12); flash SD_D3", de: "GPIO10 (IO-Index 12); Flash SD_D3"}, type: io, notes: {en: "Also wired to the flash inside the module. Use with care.", de: "Auch mit dem Flash im Modul verbunden. Nur mit Vorsicht nutzen."}}
    - {number: "J1.5", name: "SD2", function: {en: "GPIO9 (IO index 11); flash SD_D2", de: "GPIO9 (IO-Index 11); Flash SD_D2"}, type: io, notes: {en: "Also wired to the flash inside the module. Use with care.", de: "Auch mit dem Flash im Modul verbunden. Nur mit Vorsicht nutzen."}}
    - {number: "J1.6", name: "SD1", function: {en: "Flash SD_D1, SPI MOSI (GPIO8); leave free", de: "Flash SD_D1, SPI MOSI (GPIO8); frei lassen"}, type: data}
    - {number: "J1.7", name: "CMD", function: {en: "Flash SD_CMD, SPI CS0 (GPIO11); leave free", de: "Flash SD_CMD, SPI CS0 (GPIO11); frei lassen"}, type: data}
    - {number: "J1.8", name: "SD0", function: {en: "Flash SD_D0, SPI MISO (GPIO7); leave free", de: "Flash SD_D0, SPI MISO (GPIO7); frei lassen"}, type: data}
    - {number: "J1.9", name: "CLK", function: {en: "Flash SD_CLK, SPI clock (GPIO6); leave free", de: "Flash SD_CLK, SPI-Takt (GPIO6); frei lassen"}, type: data}
    - {number: "J1.10", name: "GND", function: {en: "Ground", de: "Masse"}, type: ground}
    - {number: "J1.11", name: "3V3", function: {en: "3.3 V rail", de: "3,3-V-Schiene"}, type: power}
    - {number: "J1.12", name: "EN", function: {en: "Chip enable; 12 kΩ pull-up", de: "Chip-Freigabe; 12-kΩ-Pull-up"}, type: signal}
    - {number: "J1.13", name: "RST", function: {en: "Reset, active low; 12 kΩ pull-up; RST button", de: "Reset, low-aktiv; 12-kΩ-Pull-up; RST-Taster"}, type: signal}
    - {number: "J1.14", name: "GND", function: {en: "Ground", de: "Masse"}, type: ground}
    - {number: "J1.15", name: "VIN", function: {en: "5 V supply input", de: "5-V-Versorgungseingang"}, type: power}
    - {number: "J2.1", name: "D0", function: {en: "GPIO16 (IO index 0); on-board LED; deep-sleep wake", de: "GPIO16 (IO-Index 0); LED auf der Platine; Aufwecken aus Deep Sleep"}, type: io, notes: {en: "Plain read and write only: no PWM, I2C, 1-Wire or interrupts. The LED lights when the pin is low. For deep-sleep wake-up connect it to RST.", de: "Nur einfaches Lesen und Schreiben: kein PWM, I2C, 1-Wire, keine Interrupts. Die LED leuchtet bei Low. Zum Aufwecken aus dem Deep Sleep mit RST verbinden."}}
    - {number: "J2.2", name: "D1", function: {en: "GPIO5 (IO index 1); I2C SCL in the Arduino core", de: "GPIO5 (IO-Index 1); I2C SCL im Arduino-Core"}, type: io}
    - {number: "J2.3", name: "D2", function: {en: "GPIO4 (IO index 2); I2C SDA in the Arduino core", de: "GPIO4 (IO-Index 2); I2C SDA im Arduino-Core"}, type: io}
    - {number: "J2.4", name: "D3", function: {en: "Strapping pin. GPIO0 (IO index 3); FLASH button", de: "Strapping-Pin. GPIO0 (IO-Index 3); FLASH-Taster"}, type: io, notes: {en: "High at boot runs the firmware, low enters flash mode. The FLASH button pulls it low through 470 Ω.", de: "High beim Start führt die Firmware aus, low startet den Flash-Modus. Der FLASH-Taster zieht ihn über 470 Ω nach low."}}
    - {number: "J2.5", name: "D4", function: {en: "Strapping pin. GPIO2 (IO index 4); UART1 TXD1", de: "Strapping-Pin. GPIO2 (IO-Index 4); UART1 TXD1"}, type: io, notes: {en: "Must be high at boot; 12 kΩ pull-up on the board.", de: "Muss beim Start high sein; 12-kΩ-Pull-up auf der Platine."}}
    - {number: "J2.6", name: "3V3", function: {en: "3.3 V rail", de: "3,3-V-Schiene"}, type: power}
    - {number: "J2.7", name: "GND", function: {en: "Ground", de: "Masse"}, type: ground}
    - {number: "J2.8", name: "D5", function: {en: "GPIO14 (IO index 5); HSPI CLK", de: "GPIO14 (IO-Index 5); HSPI CLK"}, type: io}
    - {number: "J2.9", name: "D6", function: {en: "GPIO12 (IO index 6); HSPI MISO", de: "GPIO12 (IO-Index 6); HSPI MISO"}, type: io}
    - {number: "J2.10", name: "D7", function: {en: "GPIO13 (IO index 7); HSPI MOSI; RXD2", de: "GPIO13 (IO-Index 7); HSPI MOSI; RXD2"}, type: io}
    - {number: "J2.11", name: "D8", function: {en: "Strapping pin. GPIO15 (IO index 8); HSPI CS; TXD2", de: "Strapping-Pin. GPIO15 (IO-Index 8); HSPI CS; TXD2"}, type: io, notes: {en: "Must be low at boot; 12 kΩ pull-down on the board.", de: "Muss beim Start low sein; 12-kΩ-Pull-down auf der Platine."}}
    - {number: "J2.12", name: "RX", function: {en: "D9: GPIO3 (IO index 9); UART0 RXD", de: "D9: GPIO3 (IO-Index 9); UART0 RXD"}, type: io}
    - {number: "J2.13", name: "TX", function: {en: "D10: GPIO1 (IO index 10); UART0 TXD", de: "D10: GPIO1 (IO-Index 10); UART0 TXD"}, type: io, notes: {en: "Do not pull low from outside during power-up.", de: "Beim Einschalten nicht von außen nach low ziehen."}}
    - {number: "J2.14", name: "GND", function: {en: "Ground", de: "Masse"}, type: ground}
    - {number: "J2.15", name: "3V3", function: {en: "3.3 V rail", de: "3,3-V-Schiene"}, type: power}

- id: raspberry_pi_40
  kind: pinout
  category: pinouts
  group: boards
  name: {cs: "Raspberry Pi 40pinová lišta", da: "Raspberry Pi 40-bens header", de: "Raspberry Pi 40-Pin-Stiftleiste", el: "Raspberry Pi κεφαλίδα 40 ακίδων", en: "Raspberry Pi 40-pin header", es: "Raspberry Pi conector de 40 pines", fr: "Raspberry Pi connecteur 40 broches", hi: "Raspberry Pi 40-पिन हेडर", it: "Raspberry Pi connettore a 40 pin", ja: "Raspberry Pi 40ピンヘッダー", nl: "Raspberry Pi 40-pins header", no: "Raspberry Pi 40-pinners header", pl: "Raspberry Pi złącze 40-pinowe", pt: "Raspberry Pi conector de 40 pinos", sv: "Raspberry Pi 40-polig stiftlist", zh: "Raspberry Pi 40 针排针"}
  doc: {en: "The 40-pin GPIO header of Raspberry Pi B+ and later and of the Zero models, turned as in Raspberry Pi's figure: header at the right edge, USB and Ethernet at the bottom, pin 1 top left. With the header along the top edge of the board, pin 1 is the lower left corner.", de: "Die 40-polige GPIO-Stiftleiste des Raspberry Pi ab B+ und der Zero-Modelle, gedreht wie in Raspberry Pis Abbildung: Leiste am rechten Rand, USB und Ethernet unten, Pin 1 oben links. Liegt die Leiste an der Oberkante der Platine, ist Pin 1 die untere linke Ecke."}
  notes: {en: "The GPIOs run at 3.3 V and are not 5 V tolerant: never put 5 V on a GPIO. One pin may supply 16 mA, all GPIOs together 50 mA. Names are the SoC's GPIO numbers (BCM numbering), not positions. Keyboard computers have the header turned by 180°, so go by the pin 1 mark there. Alternative functions vary with the SoC; the list shows Raspberry Pi's typical ones. Pi models with the old 26-pin header are not covered.", de: "Die GPIOs arbeiten mit 3,3 V und sind nicht 5-V-tolerant: niemals 5 V an einen GPIO legen. Ein Pin darf 16 mA liefern, alle GPIOs zusammen 50 mA. Die Namen sind die GPIO-Nummern des SoC (BCM-Zählung), keine Positionen. Bei den Tastatur-Computern ist die Leiste um 180° gedreht, dort gilt die Markierung von Pin 1. Alternativfunktionen hängen vom SoC ab; die Liste zeigt die typischen laut Raspberry Pi. Modelle mit der alten 26-poligen Leiste sind nicht erfasst."}
  tags: ["raspberry pi", "raspi", "rpi", "gpio", "40-pin", "40 pin", "header", "stiftleiste", "pfostenleiste", "hat", "bcm", "i2c", "spi", "uart", "pwm", "pcm", "sda", "scl", "mosi", "miso", "txd", "rxd", "id_sd", "id_sc", "belegung", "pinout"]
  source: "Raspberry Pi documentation, Raspberry Pi hardware, section 40-pin GPIO header (pin table and two figures); Raspberry Pi, BCM2711 ARM Peripherals, table 94"
  views:
    plug: {en: "Pin header on the board", de: "Stiftleiste auf der Platine"}
    socket: {en: "Socket on a cable", de: "Buchse am Kabel"}
