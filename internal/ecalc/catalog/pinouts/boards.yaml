- id: esp32_devkitc
  kind: pinout
  category: pinouts
  group: boards
  name: {cs: "ESP32-DevKitC V4", da: "ESP32-DevKitC V4", de: "ESP32-DevKitC V4", el: "ESP32-DevKitC V4", en: "ESP32-DevKitC V4", es: "ESP32-DevKitC V4", fr: "ESP32-DevKitC V4", hi: "ESP32-DevKitC V4", it: "ESP32-DevKitC V4", ja: "ESP32-DevKitC V4", nl: "ESP32-DevKitC V4", no: "ESP32-DevKitC V4", pl: "ESP32-DevKitC V4", pt: "ESP32-DevKitC V4", sv: "ESP32-DevKitC V4", zh: "ESP32-DevKitC V4"}
  doc: {en: "ESP32-DevKitC V4 from the component side, drawn with the Micro-USB socket at the top, so the antenna is at the bottom; Espressif's own figure shows the board the other way up. Numbers are the headers J2 and J3 of Espressif's user guide.", de: "ESP32-DevKitC V4 von der Bauteilseite, gezeichnet mit der Micro-USB-Buchse oben, die Antenne also unten; Espressifs eigene Abbildung zeigt die Platine umgekehrt. Die Nummern sind die Stiftleisten J2 und J3 aus Espressifs Handbuch."}
  notes: {en: "GPIO34, 35, 36 and 39 are inputs only and have no pull resistors. GPIO0, 2, 5, 12 and 15 are strapping pins, read at reset, so a circuit on them can change how the board starts. GPIO6 to GPIO11 belong to the SPI flash and cannot serve as regular GPIO. Every other GPIO that can output can also do PWM. Inputs take at most the 3.3 V supply plus 0.3 V. Power the board from one source only (USB, the 5V pin or the 3V3 pin); two at once can do damage.", de: "GPIO34, 35, 36 und 39 sind reine Eingänge ohne Pull-Widerstände. GPIO0, 2, 5, 12 und 15 sind Strapping-Pins, die beim Reset gelesen werden; eine Schaltung daran kann das Startverhalten ändern. GPIO6 bis GPIO11 gehören zum SPI-Flash und taugen nicht als normale GPIOs. Jeder andere ausgabefähige GPIO kann auch PWM. Eingänge vertragen höchstens die 3,3-V-Versorgung plus 0,3 V. Nur aus einer Quelle versorgen (USB, Pin 5V oder Pin 3V3); zwei zugleich können Schaden anrichten."}
  tags: ["esp32", "devkitc", "devkit", "espressif", "wroom", "wrover", "wifi", "gpio", "strapping", "input only", "nur eingang", "flash", "adc", "dac", "touch", "pwm", "i2c", "spi", "vspi", "hspi", "uart", "boot", "en", "stiftleiste", "belegung", "pinout"]
  source: "Espressif, ESP32-DevKitC V4 user guide (esp-dev-kits, latest): header tables J2 and J3, pin layout figure; Espressif, ESP32_DevKitc_V4 schematic; Espressif, ESP32 Series Datasheet v5.3"
