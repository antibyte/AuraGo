    left: ["J3.19", "J3.18", "J3.17", "J3.16", "J3.15", "J3.14", "J3.13", "J3.12", "J3.11", "J3.10", "J3.9", "J3.8", "J3.7", "J3.6", "J3.5", "J3.4", "J3.3", "J3.2", "J3.1"]
    right: ["J2.19", "J2.18", "J2.17", "J2.16", "J2.15", "J2.14", "J2.13", "J2.12", "J2.11", "J2.10", "J2.9", "J2.8", "J2.7", "J2.6", "J2.5", "J2.4", "J2.3", "J2.2", "J2.1"]
  pins:
