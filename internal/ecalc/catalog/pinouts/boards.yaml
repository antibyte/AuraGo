  notes: {en: "Logic level 5 V; each I/O pin carries 20 mA at most. Arduino's pinout gives VIN as 7–12 V, the feature list of its datasheet as 7–15 V. That list counts pins around the board: its pin 30 is J2.1 (VIN), its pin 27 is J2.4 (5V). This is the ATmega328 Nano, not the Nano Every or Nano 33 boards.", de: "Logikpegel 5 V; jeder I/O-Pin trägt höchstens 20 mA. Arduinos Pinout nennt für VIN 7–12 V, die Merkmalliste seines Datenblatts 7–15 V. Diese Liste zählt die Pins rund um die Platine: ihr Pin 30 ist J2.1 (VIN), ihr Pin 27 ist J2.4 (5V). Dies ist der Nano mit ATmega328, nicht Nano Every oder Nano 33."}
