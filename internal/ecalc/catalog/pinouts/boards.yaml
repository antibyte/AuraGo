  kind: pinout
  category: pinouts
  group: boards
  name: {cs: "Arduino Uno R3", da: "Arduino Uno R3", de: "Arduino Uno R3", el: "Arduino Uno R3", en: "Arduino Uno R3", es: "Arduino Uno R3", fr: "Arduino Uno R3", hi: "Arduino Uno R3", it: "Arduino Uno R3", ja: "Arduino Uno R3", nl: "Arduino Uno R3", no: "Arduino Uno R3", pl: "Arduino Uno R3", pt: "Arduino Uno R3", sv: "Arduino Uno R3", zh: "Arduino Uno R3"}
  doc: {en: "Arduino Uno R3 from above with the USB socket at the top and the DC jack beside it. The board carries no pin numbers, so each pin is named after its header in the Arduino schematic (POWER, AD, IOH, IOL, ICSP) plus its position there.", de: "Arduino Uno R3 von oben, die USB-Buchse oben, daneben die Hohlbuchse. Die Platine trägt keine Pinnummern, daher heißt jeder Pin nach seiner Stiftleiste im Arduino-Schaltplan (POWER, AD, IOH, IOL, ICSP) plus Position."}
  notes: {en: "Logic level 5 V; each I/O pin carries 20 mA at most. The ICSP block is the 6-pin header at the end of the board away from USB and belongs to the ATmega328P. A second 6-pin header near the USB socket, ICSP1, programs the ATmega16U2 and is not listed here. D0 and D1 also reach the USB bridge, so a circuit on them can get in the way of uploads.", de: "Logikpegel 5 V; jeder I/O-Pin trägt höchstens 20 mA. Der ICSP-Block ist die 6-polige Leiste am von USB abgewandten Platinenende und gehört zum ATmega328P. Eine zweite 6-polige Leiste nahe der USB-Buchse, ICSP1, programmiert den ATmega16U2 und ist hier nicht aufgeführt. D0 und D1 führen auch zur USB-Brücke, eine Schaltung daran kann das Hochladen stören."}
  tags: ["arduino", "uno", "uno r3", "atmega328p", "shield", "header", "stiftleiste", "belegung", "pinout", "icsp", "isp", "spi", "i2c", "uart", "pwm", "sda", "scl", "mosi", "miso", "cipo", "copi", "sck", "ioref", "aref", "vin", "d13", "a0", "gpio"]
