- id: dvi_i
  kind: pinout
  category: pinouts
  group: data
  name: {cs: "DVI-I (Dual Link)", da: "DVI-I (Dual Link)", de: "DVI-I (Dual Link)", el: "DVI-I (Dual Link)", en: "DVI-I (Dual Link)", es: "DVI-I (Dual Link)", fr: "DVI-I (Dual Link)", hi: "DVI-I (Dual Link)", it: "DVI-I (Dual Link)", ja: "DVI-I (Dual Link)", nl: "DVI-I (Dual Link)", "no": "DVI-I (Dual Link)", pl: "DVI-I (Dual Link)", pt: "DVI-I (Dual Link)", sv: "DVI-I (Dual Link)", zh: "DVI-I (Dual Link)"}
  doc: {en: "The combined analogue and digital DVI connector: 24 digital contacts in three rows of eight plus the analogue block C1 to C5, 29 contacts in all. Two TMDS links share the connector: the second link is only used by dual-link devices.", de: "Der kombinierte analoge und digitale DVI-Anschluss: 24 digitale Kontakte in drei Reihen zu acht und dazu der analoge Block C1 bis C5, zusammen 29 Kontakte. Zwei TMDS-Links teilen sich den Anschluss: Der zweite Link wird nur von Dual-Link-Geräten genutzt."}
  notes: {en: "DVI-D, the digital-only connector, has the same 24 contacts with the same numbers, but no C1 to C5 and pin 8 is not connected. A single link uses only the TMDS data channels 0 to 2 and the clock: pins 4, 5, 12, 13, 20 and 21 (data channels 4, 3 and 5) belong to the second link alone. The shields 3, 11 and 19 serve a pair of each link and stay in use. The colour words in the data channel names only say which colour of the pixel data a channel carries, they are not wire colours. The drawing is the receptacle on a graphics card or monitor seen onto its mating face, the wide side of the shell at the top and the two chamfered corners at the bottom; the plug is the mirror image with pin 1 at the upper right and the analogue block at the left. DVI-D single-link cables and plugs that leave out the second-link contacts were not verified.", de: "DVI-D, der rein digitale Anschluss, hat dieselben 24 Kontakte mit denselben Nummern, aber kein C1 bis C5, und Pin 8 ist nicht beschaltet. Ein einzelner Link nutzt nur die TMDS-Datenkanäle 0 bis 2 und den Takt: Die Pins 4, 5, 12, 13, 20 und 21 (Datenkanäle 4, 3 und 5) gehören allein zum zweiten Link. Die Abschirmungen 3, 11 und 19 gehören zu je einem Paar beider Links und bleiben in Gebrauch. Die Farbwörter in den Namen der Datenkanäle sagen nur, welche Farbe der Bilddaten ein Kanal führt, es sind keine Aderfarben. Gezeichnet ist die Buchse an Grafikkarte oder Monitor mit Blick auf die Steckfläche, die breite Seite des Gehäuses oben und die beiden abgeschrägten Ecken unten; der Stecker ist das Spiegelbild mit Pin 1 oben rechts und dem analogen Block links. DVI-D-Einzellink-Kabel und -Stecker, die die Kontakte des zweiten Links weglassen, wurden nicht überprüft."}
  tags: [dvi, dvi-i, "dvi-d", "dual link", "single link", tmds, ddc, edid, hpd, "hot plug", analog, analogue, "c1", "c5", "digital visual interface", ddwg, video, stecker, buchse, receptacle, plug]
