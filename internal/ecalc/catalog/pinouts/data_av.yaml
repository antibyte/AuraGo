  name: {cs: "CAN (D-Sub 9)", da: "CAN (D-Sub 9)", de: "CAN (D-Sub 9)", el: "CAN (D-Sub 9)", en: "CAN (D-Sub 9)", es: "CAN (D-Sub 9)", fr: "CAN (D-Sub 9)", hi: "CAN (D-Sub 9)", it: "CAN (D-Sub 9)", ja: "CAN (D-Sub 9)", nl: "CAN (D-Sub 9)", "no": "CAN (D-Sub 9)", pl: "CAN (D-Sub 9)", pt: "CAN (D-Sub 9)", sv: "CAN (D-Sub 9)", zh: "CAN (D-Sub 9)"}
  doc: {en: "The 9-pin D-sub connector that CAN and CANopen interfaces use as a de-facto standard: CAN_L on pin 2, CAN_H on pin 7, ground on pins 3 and 6. The other pins are optional or reserved.", de: "Der 9-polige D-Sub-Steckverbinder, den CAN- und CANopen-Schnittstellen de facto nutzen: CAN_L auf Pin 2, CAN_H auf Pin 7, Masse auf den Pins 3 und 6. Die übrigen Pins sind optional oder reserviert."}
  notes: {en: "The pins 2, 3, 6 and 7 are the same in every source read. Pins 1, 5 and 9 vary with the maker: pin 1 is reserved at one maker and not used at another, and one interface can put 5 V on pins 1 and 9 by solder bridges that are not fitted at delivery; pin 5 is an optional shield at some makers and not connected at another; pin 9 is an optional external supply for the transceivers at some makers and not used at another. Measure before you connect anything to pins 1 and 9. The catalog follows the pin table of an interface maker that cites the CiA specification. The CiA documents themselves (CiA 303-1 and its successor CiA 106) need a login and were not read. The drawing is the male connector seen at its pins, wide side of the shell at the top, as for RS-232 on DE-9; the female connector of the cable is the mirror image.", de: "Die Pins 2, 3, 6 und 7 sind in allen gelesenen Quellen gleich. Die Pins 1, 5 und 9 hängen vom Hersteller ab: Pin 1 ist bei einem Hersteller reserviert und bei einem anderen unbenutzt, und eine Schnittstelle kann über bei Lieferung nicht bestückte Lötbrücken 5 V auf die Pins 1 und 9 legen; Pin 5 ist bei manchen Herstellern ein optionaler Schirm und bei einem anderen nicht angeschlossen; Pin 9 ist bei manchen Herstellern eine optionale externe Versorgung der Transceiver und bei einem anderen unbenutzt. Vor dem Anschließen an die Pins 1 und 9 messen. Der Katalog folgt der Pin-Tabelle eines Schnittstellenherstellers, der die CiA-Spezifikation nennt. Die CiA-Dokumente selbst (CiA 303-1 und der Nachfolger CiA 106) erfordern ein Login und wurden nicht gelesen. Gezeichnet ist der Stecker mit Blick auf die Stifte, die breite Seite des Gehäuses oben, wie bei RS-232 auf DE-9; die Buchse des Kabels ist das Spiegelbild."}
  tags: [can, canbus, "can bus", canopen, "cia 303", "cia 106", "cia ds 102", can_h, can_l, can_gnd, "d-sub 9", "d-sub", dsub, db9, de9, "9-pin", "9-polig", bus, automotive, industrial, peak, pcan, ixxat, stecker, buchse]
  source: "PEAK-System, PCAN-USB User Manual 3.2.0, section 4.1 and appendix D; HMS Networks (Ixxat), knowledge base article CAN-Steckerbelegung (Sub-D9 after CiA DS 102); Beckhoff CX7050 documentation, D-sub connector X003; Black Box Corporation, Technical Reference: Pinouts for Serial Interfaces (1997), section 1B (front-view numbering); CAN in Automation, CiA 106 overview page (not read beyond the overview)"
  views:
    plug: {en: "Male connector, pins (CAN interface)", de: "Stecker mit Stiften (CAN-Schnittstelle)"}
    socket: {en: "Female connector, sockets (bus cable)", de: "Buchse (Buskabel)"}
  shape:
    type: rows
    outline: dsub
    contact: round
    drawn: plug
    rows:
      - {pins: ["1", "2", "3", "4", "5"]}
      - {pins: ["6", "7", "8", "9"], offset: 0.5}
  pins:
    - {number: "1", name: "Reserved", function: {en: "Reserved (some interfaces: optional +5 V)", de: "Reserviert (manche Schnittstellen: optional +5 V)"}, type: nc, notes: {en: "One interface can put 5 V here by a solder bridge that is not fitted at delivery; other makers say reserved or not used.", de: "Eine Schnittstelle kann hier über eine bei Lieferung nicht bestückte Lötbrücke 5 V ausgeben; andere Hersteller nennen den Pin reserviert oder unbenutzt."}}
    - {number: "2", name: "CAN_L", function: {en: "CAN bus line, dominant low", de: "CAN-Busleitung, dominant low"}, type: data}
    - {number: "3", name: "CAN_GND", function: {en: "CAN ground", de: "CAN-Masse"}, type: ground}
    - {number: "4", name: "Reserved", function: {en: "Reserved, not connected", de: "Reserviert, nicht belegt"}, type: nc}
    - {number: "5", name: "CAN_SHLD", function: {en: "Optional cable shield", de: "Optionaler Kabelschirm"}, type: ground, notes: {en: "Optional shield at some makers, plain shield at one, not connected at another.", de: "Bei manchen Herstellern optionaler Schirm, bei einem einfach Schirm, bei einem anderen nicht angeschlossen."}}
    - {number: "6", name: "GND", function: {en: "Optional CAN ground, connected to pin 3", de: "Optionale CAN-Masse, mit Pin 3 verbunden"}, type: ground}
    - {number: "7", name: "CAN_H", function: {en: "CAN bus line, dominant high", de: "CAN-Busleitung, dominant high"}, type: data}
    - {number: "8", name: "Reserved", function: {en: "Reserved, not connected", de: "Reserviert, nicht belegt"}, type: nc}
    - {number: "9", name: "CAN_V+", function: {en: "Optional external supply for the transceivers", de: "Optionale externe Versorgung der Transceiver"}, type: power, notes: {en: "Optional at some makers, one interface supplies 5 V here, another maker says not used. The voltage is not stated by the sources read: measure before you connect anything.", de: "Bei manchen Herstellern optional, eine Schnittstelle liefert hier 5 V, ein anderer Hersteller nennt den Pin unbenutzt. Die Spannung nennen die gelesenen Quellen nicht: vor dem Anschließen messen."}}

- id: microsd_card
  kind: pinout
  category: pinouts
  group: data
  name: {cs: "Karta microSD", da: "microSD-kort", de: "microSD-Karte", el: "Κάρτα microSD", en: "microSD card", es: "Tarjeta microSD", fr: "Carte microSD", hi: "microSD कार्ड", it: "Scheda microSD", ja: "microSDカード", nl: "microSD-kaart", "no": "microSD-kort", pl: "Karta microSD", pt: "Cartão microSD", sv: "microSD-kort", zh: "microSD 卡"}
  doc: {en: "The eight contact pads of a microSD memory card. In SD mode the card has four data lines, a command line and a clock; in SPI mode the same pads carry chip select, data in, clock and data out.", de: "Die acht Kontaktflächen einer microSD-Speicherkarte. Im SD-Modus hat die Karte vier Datenleitungen, eine Befehlsleitung und einen Takt; im SPI-Modus tragen dieselben Flächen Chip-Select, Dateneingang, Takt und Datenausgang."}
  notes: {en: "Drawn is the contact side of the card (back view, bottom view): the insertion edge with the pads is at the top, the step in the card's edge on the left and the pads read 1 to 8 from the left. Pads 4 (VDD) and 6 (VSS) are the longer ones. The label side is the mirror image: step on the right, 8 to 1 from the left. CD/DAT3 has a 50 kΩ pull-up in the card at power-up for card detection and mode selection; the host pulls it low to select SPI mode, and the pull-up is switched off with ACMD42. The host should pull up all data lines even if only DAT0 is used, otherwise floating DAT1 and DAT2 inputs can draw current. In SPI mode the reserved pads 1 and 8 should be pulled up by the host with 10 to 100 kΩ. DAT1 can be the SDIO interrupt and DAT2 the SDIO read wait. One maker states an operating voltage of 2.7 V to 3.6 V for its card. The microSD addendum of the SD specification is not free and was not read; the UHS-II second-row pads and the full-size SD card are not covered.", de: "Gezeichnet ist die Kontaktseite der Karte (Rückansicht, Unteransicht): Die Einschubkante mit den Flächen liegt oben, die Stufe in der Kartenkante links, und die Flächen lesen sich von links 1 bis 8. Die Flächen 4 (VDD) und 6 (VSS) sind die längeren. Die Beschriftungsseite ist das Spiegelbild: Stufe rechts, von links 8 bis 1. CD/DAT3 hat beim Einschalten einen 50-kΩ-Pull-up in der Karte für Kartenerkennung und Moduswahl; der Host zieht ihn auf low, um den SPI-Modus zu wählen, und der Pull-up wird mit ACMD42 abgeschaltet. Der Host sollte alle Datenleitungen hochziehen, auch wenn nur DAT0 genutzt wird, sonst können offene DAT1- und DAT2-Eingänge Strom ziehen. Im SPI-Modus sollte der Host die reservierten Flächen 1 und 8 mit 10 bis 100 kΩ hochziehen. DAT1 kann der SDIO-Interrupt und DAT2 das SDIO-Read-Wait sein. Ein Hersteller nennt für seine Karte eine Betriebsspannung von 2,7 V bis 3,6 V. Der microSD-Anhang der SD-Spezifikation ist nicht frei und wurde nicht gelesen; die zweite Kontaktreihe von UHS-II und die große SD-Karte sind nicht erfasst."}
  tags: [microsd, "micro sd", "micro-sd", microsdhc, microsdxc, "sd card", sd-karte, "sd mode", "spi mode", spi, "sd-modus", "spi-modus", speicherkarte, "memory card", tf, transflash, cmd, clk, dat0, dat1, dat2, dat3, cs, miso, mosi, sclk, karte, card]
  source: "SanDisk, microSD, microSDHC and microSDXC cards OEM Product Manual, revision 3.1 (document 80-36-03335, November 2013), figures 4 and 5 and table 4; Kingston Technology, microSDHC industrial card specification SDCIT 8GB-32GB (document 4900180-001.A00), section 6.1, figure 1 and table 3; Cactus Technologies, Industrial 3D pSLC -295M Series microSD Card Product Manual (2 April 2025), table 3-5"
  views:
    plug: {en: "Card, contact side (back view), step at the left", de: "Karte, Kontaktseite (Rückansicht), Stufe links"}
    socket: {en: "Card, label side (top view), mirror image: step at the right", de: "Karte, Beschriftungsseite (Draufsicht), Spiegelbild: Stufe rechts"}
  shape:
    type: rows
    outline: card
    contact: blade
    drawn: plug
    rows:
      - {pins: ["1", "2", "3", "4", "5", "6", "7", "8"]}
  variants:
    - id: sd
      name: {en: "SD mode", de: "SD-Modus"}
      pins:
        - {number: "1", name: "DAT2", function: {en: "Data line bit 2", de: "Datenleitung Bit 2"}, type: data, notes: {en: "Can be the SDIO read wait.", de: "Kann das SDIO-Read-Wait sein."}}
        - {number: "2", name: "CD/DAT3", function: {en: "Card detect and data line bit 3", de: "Kartenerkennung und Datenleitung Bit 3"}, type: data, notes: {en: "50 kΩ pull-up in the card at power-up; the host pulls it low to select SPI mode.", de: "50-kΩ-Pull-up in der Karte beim Einschalten; der Host zieht ihn auf low, um den SPI-Modus zu wählen."}}
        - {number: "3", name: "CMD", function: {en: "Command and response", de: "Befehl und Antwort"}, type: data}
        - {number: "4", name: "VDD", function: {en: "Supply voltage", de: "Versorgungsspannung"}, type: power}
        - {number: "5", name: "CLK", function: {en: "Clock, host to card", de: "Takt, Host zur Karte"}, type: signal}
        - {number: "6", name: "VSS", function: {en: "Supply ground", de: "Versorgungsmasse"}, type: ground}
        - {number: "7", name: "DAT0", function: {en: "Data line bit 0", de: "Datenleitung Bit 0"}, type: data}
        - {number: "8", name: "DAT1", function: {en: "Data line bit 1", de: "Datenleitung Bit 1"}, type: data, notes: {en: "Can be the SDIO interrupt.", de: "Kann der SDIO-Interrupt sein."}}
    - id: spi
      name: {en: "SPI mode", de: "SPI-Modus"}
      pins:
        - {number: "1", name: "RSV", function: {en: "Reserved", de: "Reserviert"}, type: nc, notes: {en: "Pull up on the host side with 10 to 100 kΩ.", de: "Auf der Hostseite mit 10 bis 100 kΩ hochziehen."}}
        - {number: "2", name: "CS", function: {en: "Chip select, active low", de: "Chip-Select, aktiv low"}, type: signal}
        - {number: "3", name: "DI", function: {en: "Data in, host to card", de: "Dateneingang, Host zur Karte"}, type: data}
        - {number: "4", name: "VDD", function: {en: "Supply voltage", de: "Versorgungsspannung"}, type: power}
        - {number: "5", name: "SCLK", function: {en: "Clock", de: "Takt"}, type: signal}
        - {number: "6", name: "VSS", function: {en: "Supply ground", de: "Versorgungsmasse"}, type: ground}
        - {number: "7", name: "DO", function: {en: "Data out, card to host", de: "Datenausgang, Karte zum Host"}, type: data}
        - {number: "8", name: "RSV", function: {en: "Reserved", de: "Reserviert"}, type: nc, notes: {en: "Pull up on the host side with 10 to 100 kΩ.", de: "Auf der Hostseite mit 10 bis 100 kΩ hochziehen."}}
