- id: dsub25
  kind: pinout
  category: pinouts
  group: data
  name: {cs: "D-Sub 25 pinů", da: "D-Sub 25-polet", de: "D-Sub 25-polig", el: "D-Sub 25 ακίδων", en: "D-Sub 25-pin", es: "D-Sub 25 pines", fr: "D-Sub 25 broches", hi: "D-Sub 25-पिन", it: "D-Sub 25 poli", ja: "D-Sub 25ピン", nl: "D-Sub 25-polig", "no": "D-Sub 25-polet", pl: "D-Sub 25-pinowy", pt: "D-Sub 25 pinos", sv: "D-Sub 25-polig", zh: "D-Sub 25 针"}
  doc: {en: "The 25-way D-subminiature connector (DB-25), two rows of 13 and 12 contacts. Two uses share the same numbering: the PC parallel (printer) port and the EIA-232 serial interface on DB-25.", de: "Der 25-polige D-Sub-Steckverbinder (DB-25) mit zwei Reihen zu 13 und 12 Kontakten. Zwei Anwendungen teilen sich dieselbe Nummerierung: der parallele Druckerport des PCs und die serielle EIA-232-Schnittstelle auf DB-25."}
  notes: {en: "Choose the variant by the use. parallel: the compatibility-mode signals of the PC parallel port in the IEEE 1284 names, directions for the PC (host); on bidirectional (EPP and ECP) ports pins 2 to 9 and several control lines change their roles, and only the compatibility mode is given. rs232: the EIA-232-D/E assignment, signals named from the DTE side, a pin carries the same signal at both ends. An asynchronous PC port uses only pins 2, 3, 4, 5, 6, 7, 8, 20 and 22. The PC parallel port is the female connector; an RS-232 DTE such as a PC or terminal usually has the male one, which is the mirror image, and some devices break that rule. IEEE 1284 and TIA-232-F themselves were not read, the pins rest on device manuals and reproductions of EIA-232-D. The drawing is the female connector seen onto its mating face with the wide side of the shell at the top.", de: "Die Variante richtet sich nach der Anwendung. parallel: die Signale des Kompatibilitätsmodus des parallelen PC-Ports mit den Namen nach IEEE 1284, Richtungen aus Sicht des PCs (Host); bei bidirektionalen Ports (EPP und ECP) wechseln die Pins 2 bis 9 und mehrere Steuerleitungen ihre Rollen, angegeben ist nur der Kompatibilitätsmodus. rs232: die Belegung nach EIA-232-D/E, Signale aus Sicht der DTE benannt, ein Pin führt an beiden Enden dasselbe Signal. Ein asynchroner PC-Port nutzt nur die Pins 2, 3, 4, 5, 6, 7, 8, 20 und 22. Der parallele PC-Port ist der Buchsenstecker; eine RS-232-DTE wie ein PC oder Terminal hat meist den Stecker mit Stiften, das Spiegelbild, und manche Geräte halten sich nicht an die Regel. IEEE 1284 und TIA-232-F selbst wurden nicht gelesen, die Pins stützen sich auf Gerätehandbücher und Nachdrucke von EIA-232-D. Gezeichnet ist der Buchsenstecker mit Blick auf die Steckfläche, die breite Seite des Gehäuses oben."}
  tags: [dsub25, db25, db-25, "d-sub 25", "d-sub", dsub, "25-pin", "25-polig", parallel, "parallel port", parallelport, lpt, drucker, printer, "ieee 1284", centronics, rs232, rs-232, "eia-232", "tia-232", serial, seriell, txd, rxd, rts, cts, dtr, dsr, stecker, buchse]
  source: "Winford Engineering, PBC25F and PBC25M Physical Layout (DB25 female and male pinout); Black Box Corporation, Technical Reference: Pinouts for Serial Interfaces (1997), section 1A; Datapro Information Services Group, report 2741, ANSI EIA/TIA-232-E Interface Standard (1995), table EIA-232-D Interface Connector Pin Assignments; Dell PowerEdge 8450 Systems User's Guide, I/O Ports and Connectors, figure 3 and table 2; Sun Enterprise 220R Server Service Manual 806-1081-11, A.5.2 Parallel Port Signals; HP 8924E CDMA Mobile Station Test Set User Guide, parallel port"
