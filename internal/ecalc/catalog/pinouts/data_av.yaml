    - {number: "5", name: "TMDS Data4+", function: {en: "TMDS data channel 4 (second link, green), positive", de: "TMDS-Datenkanal 4 (zweiter Link, Grün), positiv"}, type: data, notes: {en: "Second link only, unused on a single link.", de: "Nur zweiter Link, bei einem einzelnen Link unbenutzt."}}
