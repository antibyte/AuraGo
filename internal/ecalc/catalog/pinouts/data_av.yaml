    - {number: "21", name: "TMDS Data5+", function: {en: "TMDS data channel 5 (second link, red), positive", de: "TMDS-Datenkanal 5 (zweiter Link, Rot), positiv"}, type: data, notes: {en: "Second link only, unused on a single link.", de: "Nur zweiter Link, bei einem einzelnen Link unbenutzt."}}
