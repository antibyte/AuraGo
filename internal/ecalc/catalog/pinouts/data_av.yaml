- id: scart
  kind: pinout
  category: pinouts
  group: data
  name: {cs: "SCART (21 pinů)", da: "SCART (21-polet)", de: "SCART (21-polig)", el: "SCART (21 ακίδων)", en: "SCART (21-pin)", es: "SCART (21 pines)", fr: "SCART (21 broches)", hi: "SCART (21-पिन)", it: "SCART (21 poli)", ja: "SCART (21ピン)", nl: "SCART (21-polig)", "no": "SCART (21-polet)", pl: "SCART (21-pinowy)", pt: "SCART (21 pinos)", sv: "SCART (21-polig)", zh: "SCART (21 针)"}
  doc: {en: "The 21-position audio and video connector of European televisions, video recorders and receivers (SCART, also Péritel or Euro-AV): composite and RGB video, stereo audio and switching lines. The functions are given for a TV.", de: "Der 21-polige Audio- und Video-Anschluss europäischer Fernseher, Videorecorder und Receiver (SCART, auch Péritel oder Euro-AV): FBAS- und RGB-Video, Stereo-Audio und Schaltleitungen. Die Funktionen gelten für einen Fernseher."}
  notes: {en: "Every device has its outputs on pins 1, 3 and 19 and its inputs on 2, 6 and 20, and a SCART cable crosses 1 with 2, 3 with 6 and 19 with 20 and runs the other pins straight. So RGB (7, 11, 15), pin 8 and pin 16 are inputs at a TV and outputs at a source such as a player or a console. Pins 10, 12, 14, 17 and 18 differ between devices: the catalog shows 17 as the ground of the composite video, 18 as the ground of pin 16 and 14 as a plain ground, see the pin notes. Pin 21 is a contact in the socket and the metal shell of the plug, which has 20 pins. The standard itself (EN 50049-1, IEC 60933-1) was not read: the pins rest on the tables of device manuals. The drawing is the socket on a device, the wide side of the shell at the top and the slanted corner at the lower left; the plug is the mirror image.", de: "Jedes Gerät hat seine Ausgänge auf den Pins 1, 3 und 19 und seine Eingänge auf 2, 6 und 20, und ein SCART-Kabel kreuzt 1 mit 2, 3 mit 6 und 19 mit 20 und führt die übrigen Pins gerade durch. RGB (7, 11, 15), Pin 8 und Pin 16 sind also an einem Fernseher Eingänge und an einer Quelle wie einem Player oder einer Konsole Ausgänge. Die Pins 10, 12, 14, 17 und 18 unterscheiden sich von Gerät zu Gerät: Der Katalog zeigt 17 als Masse des FBAS-Videos, 18 als Masse von Pin 16 und 14 als einfache Masse, siehe die Pin-Hinweise. Pin 21 ist in der Buchse ein Kontakt und am Stecker das Metallgehäuse, der Stecker hat 20 Pins. Die Norm selbst (EN 50049-1, IEC 60933-1) wurde nicht gelesen: Die Pins stützen sich auf die Tabellen von Gerätehandbüchern. Gezeichnet ist die Buchse am Gerät, die breite Seite des Gehäuses oben und die schräge Ecke unten links; der Stecker ist das Spiegelbild."}
  tags: [scart, péritel, peritel, "euro-av", euroconnector, "euro-scart", "21-pin", "21-polig", "en 50049", "iec 60933", rgb, composite, fbas, "s-video", blanking, austastung, audio, video, tv, fernseher, videorecorder, stecker, buchse, socket, plug]
  source: "Kycon, catalogue page 134, K-SCART series (K-SCART-021 front view); Pioneer KRP-600A operating instructions, Additional information (SCART pin assignment); Daewoo 2898ST service manual, 21 PIN EURO-SCART table; LG Electronics 32LC2D service manual, tables 1 and 2 (Scart arrangement); AOC L19WA91 service manual, Full Scart Connector Pin Assignments; RND Connect RND 205-01033 SCART male data sheet; Wikipedia, SCART with the figure SCART_Connector_Pinout_Color.svg"
  views:
    plug: {en: "Plug (cable end), mirror image of the socket", de: "Stecker (Kabelende), Spiegelbild der Buchse"}
    socket: {en: "Socket (on the device), wide side up", de: "Buchse (am Gerät), breite Seite oben"}
  shape:
    type: rows
    outline: scart
    contact: round
    drawn: socket
    rows:
      - {pins: ["20", "18", "16", "14", "12", "10", "8", "6", "4", "2"], offset: 0.5}
      - {pins: ["21", "19", "17", "15", "13", "11", "9", "7", "5", "3", "1"]}
  pins:
    - {number: "1", name: "Audio Out R", function: {en: "Audio output, right", de: "Audioausgang rechts"}, type: signal}
    - {number: "2", name: "Audio In R", function: {en: "Audio input, right", de: "Audioeingang rechts"}, type: signal}
    - {number: "3", name: "Audio Out L", function: {en: "Audio output, left (mono)", de: "Audioausgang links (Mono)"}, type: signal}
    - {number: "4", name: "Audio GND", function: {en: "Audio ground", de: "Audiomasse"}, type: ground}
    - {number: "5", name: "Blue GND", function: {en: "Ground of blue (pin 7)", de: "Masse für Blau (Pin 7)"}, type: ground}
    - {number: "6", name: "Audio In L", function: {en: "Audio input, left (mono)", de: "Audioeingang links (Mono)"}, type: signal}
    - {number: "7", name: "Blue", function: {en: "Blue video (RGB), input at a TV", de: "Video Blau (RGB), Eingang am Fernseher"}, type: signal}
    - {number: "8", name: "Function Switch", function: {en: "Slow switching and status: 0 to 2 V TV, 5 to 8 V AV 16:9, 9.5 to 12 V AV 4:3", de: "Langsame Umschaltung und Status: 0 bis 2 V TV, 5 bis 8 V AV 16:9, 9,5 bis 12 V AV 4:3"}, type: signal, notes: {en: "The sources give 4.5 to 7 V and 5 to 8 V for 16:9; 5 to 8 V is shown.", de: "Für 16:9 nennen die Quellen 4,5 bis 7 V und 5 bis 8 V; gezeigt sind 5 bis 8 V."}}
    - {number: "9", name: "Green GND", function: {en: "Ground of green (pin 11)", de: "Masse für Grün (Pin 11)"}, type: ground}
    - {number: "10", name: "Data 2", function: {en: "Data line 2 or control bus (AV.link), often not connected", de: "Datenleitung 2 oder Steuerbus (AV.link), oft nicht belegt"}, type: data, notes: {en: "Not connected on some devices, data line 2 on others, the AV.link control bus on others.", de: "Bei manchen Geräten nicht belegt, bei anderen Datenleitung 2, bei weiteren der AV.link-Steuerbus."}}
    - {number: "11", name: "Green", function: {en: "Green video (RGB), input at a TV", de: "Video Grün (RGB), Eingang am Fernseher"}, type: signal}
    - {number: "12", name: "Data 1", function: {en: "Data line 1, often not connected", de: "Datenleitung 1, oft nicht belegt"}, type: data, notes: {en: "Not connected on some devices, data line 1 on others.", de: "Bei manchen Geräten nicht belegt, bei anderen Datenleitung 1."}}
    - {number: "13", name: "Red GND", function: {en: "Ground of red (pin 15)", de: "Masse für Rot (Pin 15)"}, type: ground}
    - {number: "14", name: "GND", function: {en: "Ground; devices use it for data, blanking or not at all", de: "Masse; Geräte nutzen sie für Daten, Austastung oder gar nicht"}, type: ground, notes: {en: "Not connected on some devices, the ground of blanking on others, the ground of the RGB control or of the data lines on others.", de: "Bei manchen Geräten nicht belegt, bei anderen die Masse der Austastung, der RGB-Steuerung oder der Datenleitungen."}}
    - {number: "15", name: "Red / C", function: {en: "Red video (RGB), or S-Video chroma, input at a TV", de: "Video Rot (RGB) oder S-Video-Chroma, Eingang am Fernseher"}, type: signal}
    - {number: "16", name: "Blanking", function: {en: "Fast blanking and RGB switch: 0 to 0.4 V composite, 1 to 3 V RGB, 75 Ω", de: "Schnelle Austastung und RGB-Umschaltung: 0 bis 0,4 V FBAS, 1 bis 3 V RGB, 75 Ω"}, type: signal}
    - {number: "17", name: "Video GND", function: {en: "Ground of the composite video (pins 19 and 20)", de: "Masse für das FBAS-Video (Pins 19 und 20)"}, type: ground, notes: {en: "One device table names it the ground of the video output only, another the ground of the video input.", de: "Eine Gerätetabelle nennt sie nur als Masse des Videoausgangs, eine andere als Masse des Videoeingangs."}}
    - {number: "18", name: "Blanking GND", function: {en: "Ground of pin 16", de: "Masse für Pin 16"}, type: ground, notes: {en: "Three device tables and one reference name it the ground of blanking or of the RGB switching; one device table names it the ground of the video input.", de: "Drei Gerätetabellen und eine Referenz nennen sie die Masse der Austastung oder der RGB-Umschaltung; eine Gerätetabelle nennt sie die Masse des Videoeingangs."}}
    - {number: "19", name: "Video Out", function: {en: "Composite video output (or S-Video Y)", de: "FBAS-Videoausgang (oder S-Video Y)"}, type: signal}
    - {number: "20", name: "Video In", function: {en: "Composite video input (or S-Video Y)", de: "FBAS-Videoeingang (oder S-Video Y)"}, type: signal}
    - {number: "21", name: "Shield", function: {en: "Common ground and shield; the shell of the plug", de: "Gemeinsame Masse und Schirm; das Gehäuse des Steckers"}, type: ground}

- id: ps2
  kind: pinout
  category: pinouts
  group: data
  name: {cs: "PS/2 (Mini-DIN 6)", da: "PS/2 (Mini-DIN 6)", de: "PS/2 (Mini-DIN 6)", el: "PS/2 (Mini-DIN 6)", en: "PS/2 (Mini-DIN 6)", es: "PS/2 (Mini-DIN 6)", fr: "PS/2 (Mini-DIN 6)", hi: "PS/2 (Mini-DIN 6)", it: "PS/2 (Mini-DIN 6)", ja: "PS/2 (Mini-DIN 6)", nl: "PS/2 (Mini-DIN 6)", "no": "PS/2 (Mini-DIN 6)", pl: "PS/2 (Mini-DIN 6)", pt: "PS/2 (Mini-DIN 6)", sv: "PS/2 (Mini-DIN 6)", zh: "PS/2 (Mini-DIN 6)"}
  doc: {en: "The 6-pin mini-DIN connector of PS/2 keyboards and mice. Keyboard and mouse ports use the same pins: a data line, a clock line, ground and +5 V; pins 2 and 6 are reserved.", de: "Der 6-polige Mini-DIN-Steckverbinder von PS/2-Tastaturen und -Mäusen. Tastatur- und Mausanschluss nutzen dieselben Pins: eine Datenleitung, eine Taktleitung, Masse und +5 V; die Pins 2 und 6 sind reserviert."}
  notes: {en: "Data and clock are bidirectional open-collector lines with a pull-up to +5 V. The shell is the frame (chassis) ground. The drawing is the socket on the computer seen onto its mating face, with the key (notch of the shell) at 12 o'clock; the plug at the cable end is the mirror image. The positions are measured on a generic mini-DIN drawing of a connector maker; the arrangement agrees with the IBM and Dell figures, which are not dimensioned. Pins 2 and 6 are not always free: the combined keyboard and mouse port of the IBM ThinkPad 560 carries Mouse Data on pin 1, Keyboard Data on pin 2, Mouse Clock on pin 5 and Keyboard Clock on pin 6 (for a Y splitter), so leave them unconnected otherwise. No general current limit for +5 V was verified.", de: "Daten und Takt sind bidirektionale Open-Collector-Leitungen mit Pull-up nach +5 V. Das Gehäuse ist die Gehäusemasse (Chassis). Gezeichnet ist die Buchse am Computer mit Blick auf die Steckfläche, die Kodierung (Kerbe des Gehäuses) auf 12 Uhr; der Stecker am Kabelende ist das Spiegelbild. Die Positionen sind an der allgemeinen Mini-DIN-Zeichnung eines Steckverbinderherstellers gemessen; die Anordnung stimmt mit den Abbildungen von IBM und Dell überein, die nicht bemaßt sind. Die Pins 2 und 6 sind nicht immer frei: Der kombinierte Tastatur- und Mausanschluss des IBM ThinkPad 560 führt Maus-Daten auf Pin 1, Tastatur-Daten auf Pin 2, Maus-Takt auf Pin 5 und Tastatur-Takt auf Pin 6 (für einen Y-Splitter), sonst also unbeschaltet lassen. Eine allgemeine Strombegrenzung für +5 V wurde nicht überprüft."}
  tags: [ps2, "ps/2", "mini-din", minidin, "mini din", "din 6", "6-pin", "6-polig", keyboard, tastatur, mouse, maus, kbd, clock, data, "ibm ps/2", stecker, buchse, socket, plug]
  source: "IBM, Hardware Interface Technical Reference, Keyboards (101- and 102-Key), October 1990, figure 22; Dell PowerEdge 1600SC Systems Installation and Troubleshooting Guide, appendix B, figure B-4 and table B-4; Dell PowerEdge 8450 Systems User's Guide, I/O Ports and Connectors, tables 3 and 4 and figure 4; IBM ThinkPad 560/560E technical information, Keyboard/Mouse Connector; Kycon drawing KMDGX-xS-BS, rev C6 (geometry only)"
