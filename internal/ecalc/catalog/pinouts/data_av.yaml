- id: rj11
  kind: pinout
  category: pinouts
  group: data
  name: {cs: "RJ11 / RJ12 (6P4C, 6P6C)", da: "RJ11 / RJ12 (6P4C, 6P6C)", de: "RJ11 / RJ12 (6P4C, 6P6C)", el: "RJ11 / RJ12 (6P4C, 6P6C)", en: "RJ11 / RJ12 (6P4C, 6P6C)", es: "RJ11 / RJ12 (6P4C, 6P6C)", fr: "RJ11 / RJ12 (6P4C, 6P6C)", hi: "RJ11 / RJ12 (6P4C, 6P6C)", it: "RJ11 / RJ12 (6P4C, 6P6C)", ja: "RJ11 / RJ12 (6P4C, 6P6C)", nl: "RJ11 / RJ12 (6P4C, 6P6C)", "no": "RJ11 / RJ12 (6P4C, 6P6C)", pl: "RJ11 / RJ12 (6P4C, 6P6C)", pt: "RJ11 / RJ12 (6P4C, 6P6C)", sv: "RJ11 / RJ12 (6P4C, 6P6C)", zh: "RJ11 / RJ12 (6P4C, 6P6C)"}
  doc: {en: "The miniature 6-position modular jack of telephone lines. Line 1 is on positions 3 (ring) and 4 (tip), a second line on 2 (tip 2) and 5 (ring 2). The RJ11 jack usually has four contacts (6P4C), the RJ12 jack all six (6P6C).", de: "Die Miniatur-Modularbuchse für Telefonleitungen mit 6 Positionen. Leitung 1 liegt auf den Positionen 3 (Ring) und 4 (Tip), eine zweite Leitung auf 2 (Tip 2) und 5 (Ring 2). Die RJ11-Buchse hat meist vier Kontakte (6P4C), die RJ12-Buchse alle sechs (6P6C)."}
  notes: {en: "The line assignment is read from 47 CFR Part 68 (10-1-00 edition): RJ11C carries one line on conductors 3 (ring) and 4 (tip) and reserves 1, 2, 5 and 6 for the telephone company; RJ14C carries two lines, line 1 on 3 and 4, line 2 on 2 (tip 2) and 5 (ring 2). On a single-line installation only 3 and 4 are used. The names follow RJ14C. RJ12 is a trade name for a 6P6C jack, not a code of that text. The positions are counted 1 to 6 across the jack, as the CFR does; whether other makers number the four contacts of a 6P4C part 1 to 4 was not verified. Neither the CFR nor the maker drawing names wire colours, and tip and ring polarity and line voltages are not stated here; the German a/b wire names were not verified. The drawing is the jack seen into its opening with the latch notch at the bottom and position 1 on the left; a plug seen from its tip with the latch at the bottom reads 6 to 1, with the latch on top 1 to 6.", de: "Die Leitungsbelegung stammt aus 47 CFR Part 68 (Ausgabe 10-1-00): RJ11C führt eine Leitung auf den Leitern 3 (Ring) und 4 (Tip) und reserviert 1, 2, 5 und 6 für die Telefongesellschaft; RJ14C führt zwei Leitungen, Leitung 1 auf 3 und 4, Leitung 2 auf 2 (Tip 2) und 5 (Ring 2). Bei einer einzelnen Leitung werden nur 3 und 4 genutzt. Die Namen folgen RJ14C. RJ12 ist eine Handelsbezeichnung für eine 6P6C-Buchse, kein Code dieses Textes. Die Positionen sind wie im CFR über die Buchse von 1 bis 6 gezählt; ob andere Hersteller die vier Kontakte eines 6P4C-Teils mit 1 bis 4 nummerieren, wurde nicht überprüft. Weder das CFR noch die Herstellerzeichnung nennen Aderfarben, Polarität von Tip und Ring und Leitungsspannungen sind hier nicht angegeben; die deutschen a/b-Adernamen wurden nicht überprüft. Gezeichnet ist die Buchse mit Blick in die Öffnung, die Rastnase-Aussparung unten und Position 1 links; ein Stecker von der Spitze gesehen liest sich mit der Rastnase unten 6 bis 1, mit der Rastnase oben 1 bis 6."}
  tags: [rj11, rj12, rj14, "6p4c", "6p6c", "6p2c", telefon, telephone, phone, "tip ring", tip, ring, modular, modularstecker, dsl, analog, "47 cfr 68", usoc, stecker, buchse, jack, plug]
  source: "US Code of Federal Regulations, Title 47, Part 68, Subpart F (10-1-00 edition), section 68.500(b) and figure 68.500(b)(2)(i), section 68.502(a)(1) and (c)(1); Würth Elektronik eiSos, WR-MJ Modular Jack Tab Up 615006138421, revision 001.002, page 1; Aastra TA710i user guide, RJ-11 (Telephone) Cable, table 12"
  views:
    plug: {en: "Plug (cable end), latch at the bottom: 6 to 1 from the left", de: "Stecker (Kabelende), Rastnase unten: 6 bis 1 von links"}
    socket: {en: "Jack, latch notch at the bottom", de: "Buchse, Rastnase-Aussparung unten"}
  shape:
    type: rows
    outline: rj11
    contact: blade
    drawn: socket
    rows:
      - {pins: ["1", "2", "3", "4", "5", "6"]}
  variants:
    - id: rj11
      name: {en: "RJ11 (6P4C, positions 2 to 5)", de: "RJ11 (6P4C, Positionen 2 bis 5)"}
      pins:
        - {number: "1", name: "NC", function: {en: "No contact in a 6P4C jack", de: "Kein Kontakt in einer 6P4C-Buchse"}, type: nc}
        - {number: "2", name: "T2", function: {en: "Line 2, tip", de: "Leitung 2, Tip"}, type: signal}
        - {number: "3", name: "R1", function: {en: "Line 1, ring", de: "Leitung 1, Ring"}, type: signal}
        - {number: "4", name: "T1", function: {en: "Line 1, tip", de: "Leitung 1, Tip"}, type: signal}
        - {number: "5", name: "R2", function: {en: "Line 2, ring", de: "Leitung 2, Ring"}, type: signal}
        - {number: "6", name: "NC", function: {en: "No contact in a 6P4C jack", de: "Kein Kontakt in einer 6P4C-Buchse"}, type: nc}
    - id: rj12
      name: {en: "RJ12 (6P6C)", de: "RJ12 (6P6C)"}
      pins:
        - {number: "1", name: "NC", function: {en: "Reserved for the telephone company", de: "Für die Telefongesellschaft reserviert"}, type: nc}
        - {number: "2", name: "T2", function: {en: "Line 2, tip", de: "Leitung 2, Tip"}, type: signal}
        - {number: "3", name: "R1", function: {en: "Line 1, ring", de: "Leitung 1, Ring"}, type: signal}
        - {number: "4", name: "T1", function: {en: "Line 1, tip", de: "Leitung 1, Tip"}, type: signal}
        - {number: "5", name: "R2", function: {en: "Line 2, ring", de: "Leitung 2, Ring"}, type: signal}
        - {number: "6", name: "NC", function: {en: "Reserved for the telephone company", de: "Für die Telefongesellschaft reserviert"}, type: nc}

