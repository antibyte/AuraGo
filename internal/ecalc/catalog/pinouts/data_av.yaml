    - {number: "2", name: "NC", function: {en: "Reserved, not connected", de: "Reserviert, nicht belegt"}, type: nc, notes: {en: "Keyboard Data on the combined port of the IBM ThinkPad 560.", de: "Beim kombinierten Anschluss des IBM ThinkPad 560 die Tastatur-Daten."}}
