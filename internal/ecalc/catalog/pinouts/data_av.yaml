  doc: {en: "The 4-pin mini-DIN connector for S-Video (Y/C): luminance on pin 3, chrominance on pin 4 and two ground pins.", de: "Der 4-polige Mini-DIN-Steckverbinder für S-Video (Y/C): Luminanz auf Pin 3, Chrominanz auf Pin 4 und zwei Massepins."}
  notes: {en: "Neither source says which of the two ground pins 1 and 2 belongs to Y and which to C, so both are named GND here. The drawing is the socket on the device seen onto its mating face, with the notch of the shell at 12 o'clock and the rectangular plastic key at 6 o'clock; the plug at the cable end is the mirror image. A 7-pin S-Video socket, as Apple builds it, accepts the 4-pin plug in the positions of pins 1 to 4. The positions are measured on a generic mini-DIN drawing of a connector maker. No standard text for this connector was read.", de: "Keine der beiden Quellen sagt, welcher der beiden Massepins 1 und 2 zu Y und welcher zu C gehört, deshalb heißen hier beide GND. Gezeichnet ist die Buchse am Gerät mit Blick auf die Steckfläche, die Kerbe des Gehäuses auf 12 Uhr und der rechteckige Kunststoffkodierstift auf 6 Uhr; der Stecker am Kabelende ist das Spiegelbild. Eine 7-polige S-Video-Buchse, wie Apple sie baut, nimmt den 4-poligen Stecker in den Positionen der Pins 1 bis 4 auf. Die Positionen sind an einer allgemeinen Mini-DIN-Zeichnung eines Steckverbinderherstellers gemessen. Ein Normtext für diesen Steckverbinder wurde nicht gelesen."}
