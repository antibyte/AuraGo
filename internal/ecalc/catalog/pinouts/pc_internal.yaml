- id: hd_audio_header
  kind: pinout
  category: pinouts
  group: pc_power
  name: {cs: "Konektor HD Audio předního panelu, 2x5", da: "HD Audio-frontpanel-header, 2x5", de: "HD-Audio-Frontpanel-Anschluss, 2x5", el: "Κεφαλίδα HD Audio μπροστινού πάνελ, 2x5", en: "HD Audio front panel header, 2x5", es: "Conector HD Audio del panel frontal, 2x5", fr: "Connecteur HD Audio de façade, 2x5", hi: "HD Audio फ्रंट पैनल हेडर, 2x5", it: "Header HD Audio del pannello frontale, 2x5", ja: "HD Audio フロントパネルヘッダー 2x5", nl: "HD Audio-frontpaneelaansluiting, 2x5", "no": "HD Audio-frontpanel-header, 2x5", pl: "Złącze HD Audio panelu przedniego, 2x5", pt: "Conector HD Audio do painel frontal, 2x5", sv: "HD Audio-frontpanelskontakt, 2x5", zh: "HD Audio 前面板接头 2x5"}
  doc: {en: "The 2x5 header at 2.54 mm pitch for the headphone and microphone jacks of the case. It is drawn from above as the manuals draw it: pin 1 at the bottom left, the odd pins in the bottom row. Position 8 has no pin.", de: "Die 2x5-Stiftleiste im Raster 2,54 mm für die Kopfhörer- und Mikrofonbuchsen des Gehäuses. Sie ist von oben gezeichnet, wie die Handbücher es tun: Pin 1 unten links, die ungeraden Pins in der unteren Reihe. An Position 8 sitzt kein Pin."}
  notes: {en: "The two RETURN pins and SENSE_SEND report which front jack holds a plug. An AC'97 front panel uses the same 2x5 header with other signals on some pins (4, 6, 7 and 10), and the Intel documents do not agree on them. Pins 1, 2, 3, 5, 8 and 9 are the same in all. Check what the panel is before plugging it in.", de: "Die beiden RETURN-Pins und SENSE_SEND melden, welche Frontbuchse einen Stecker trägt. Ein AC'97-Frontpanel nutzt dieselbe 2x5-Stiftleiste mit anderen Signalen an einigen Pins (4, 6, 7 und 10), und die Intel-Dokumente sind sich darüber nicht einig. Die Pins 1, 2, 3, 5, 8 und 9 sind in allen gleich. Vor dem Anstecken prüfen, was für ein Panel es ist."}
  tags: ["hd audio", "hdaudio", "hd_audio", "front panel audio", "frontpanel audio", "ac97", "ac'97", "azalia", "intel hd audio", "header", "2x5", "10-pin", "9-pin", "jaud1", "hd_audio1", "front audio", "kopfhörer", "headphone", "mikrofon", "microphone", "presence", "sense", "motherboard", "mainboard"]
  source: "Intel Front Panel I/O Connectivity Design Guide Version 1.2 (A29286-004), section 2.3.5, table 7 and figures 3 and 4; Intel Front Panel I/O Connectivity Design Guide (600569) Rev. 1.1, figure 2-2 and table 2-5; Intel Desktop Board DX79SI Technical Product Specification, tables 13 and 14; MSI B450 TOMAHAWK user guide, JAUD1; ASRock B450 Steel Legend manual, HD_AUDIO1"
  views:
    plug: {en: "Cable plug from the case (socket contacts)", de: "Kabelstecker vom Gehäuse (Buchsenkontakte)"}
    socket: {en: "Header on the board, seen from above (pin contacts)", de: "Stiftleiste auf der Platine, von oben gesehen (Stiftkontakte)"}
  shape:
    type: rows
    outline: rect
    contact: square
    drawn: socket
    rows:
      - {pins: ["2", "4", "6", null, "10"]}
      - {pins: ["1", "3", "5", "7", "9"]}
  pins:
    - {number: "1", name: "PORT_1L", function: {en: "Port 1 left channel (microphone)", de: "Port 1 linker Kanal (Mikrofon)"}, type: signal}
    - {number: "2", name: "GND", function: {en: "Ground", de: "Masse"}, type: ground}
    - {number: "3", name: "PORT_1R", function: {en: "Port 1 right channel (microphone)", de: "Port 1 rechter Kanal (Mikrofon)"}, type: signal}
    - {number: "4", name: "PRESENCE#", function: {en: "Active low: tells the BIOS that an HD Audio front panel is connected", de: "Low-aktiv: meldet dem BIOS ein angeschlossenes HD-Audio-Frontpanel"}, type: signal, notes: {en: "Low (0) when an Intel HD Audio panel is connected. MSI marks this pin NC on its board.", de: "Low (0), wenn ein Intel-HD-Audio-Panel angeschlossen ist. MSI kennzeichnet diesen Pin auf seiner Platine als NC."}}
    - {number: "5", name: "PORT_2R", function: {en: "Port 2 right channel (headphone)", de: "Port 2 rechter Kanal (Kopfhörer)"}, type: signal}
    - {number: "6", name: "SENSE1_RETURN", function: {en: "Jack detection return of front jack 1 (microphone)", de: "Rückleitung der Buchsenerkennung, Frontbuchse 1 (Mikrofon)"}, type: signal}
    - {number: "7", name: "SENSE_SEND", function: {en: "Jack detection sense line from the codec", de: "Erkennungsleitung der Buchsenerkennung vom Codec"}, type: signal, notes: {en: "Comes from the jack detection resistor network of the HD Audio codec.", de: "Kommt vom Widerstandsnetzwerk der Buchsenerkennung des HD-Audio-Codecs."}}
    - {number: "9", name: "PORT_2L", function: {en: "Port 2 left channel (headphone)", de: "Port 2 linker Kanal (Kopfhörer)"}, type: signal}
    - {number: "10", name: "SENSE2_RETURN", function: {en: "Jack detection return of front jack 2 (headphone)", de: "Rückleitung der Buchsenerkennung, Frontbuchse 2 (Kopfhörer)"}, type: signal}

- id: rgb_header_12v
  kind: pinout
  category: pinouts
  group: pc_power
  name: {cs: "Konektor RGB LED, 4 piny, 12 V", da: "RGB LED-header, 4-polet, 12 V", de: "RGB-LED-Anschluss, 4-polig, 12 V", el: "Κεφαλίδα RGB LED, 4 ακίδων, 12 V", en: "RGB LED header, 4-pin, 12 V", es: "Conector LED RGB, 4 pines, 12 V", fr: "Connecteur LED RVB, 4 broches, 12 V", hi: "RGB LED हेडर, 4-पिन, 12 V", it: "Header LED RGB, 4 pin, 12 V", ja: "RGB LED ヘッダー 4 ピン 12 V", nl: "RGB-ledaansluiting, 4-polig, 12 V", "no": "RGB LED-header, 4-polet, 12 V", pl: "Złącze LED RGB, 4-pinowe, 12 V", pt: "Conector LED RGB, 4 pinos, 12 V", sv: "RGB LED-kontakt, 4-polig, 12 V", zh: "RGB LED 接头 4 针 12 V"}
  doc: {en: "The 4-pin header at 2.54 mm pitch for a 12 V RGB LED strip, drawn from above with pin 1 at the left. There is no standard: the order 12V, G, R, B is the board makers' convention.", de: "Die vierpolige Stiftleiste im Raster 2,54 mm für einen 12-V-RGB-LED-Streifen, von oben gezeichnet, Pin 1 links. Einen Standard gibt es nicht: Die Reihenfolge 12V, G, R, B ist die Konvention der Platinenhersteller."}
  notes: {en: "For 5050 RGB LED strips (12V/G/R/B) up to 3 A at 12 V and 2 m. Note the order: green comes before red. Match the arrow or mark of the plug to pin 1. Never put a 5 V addressable strip on this header: the 12 V would destroy it.", de: "Für 5050-RGB-LED-Streifen (12V/G/R/B) bis 3 A bei 12 V und 2 m. Auf die Reihenfolge achten: Grün kommt vor Rot. Pfeil oder Markierung des Steckers auf Pin 1 legen. Nie einen adressierbaren 5-V-Streifen an diese Stiftleiste hängen: Die 12 V würden ihn zerstören."}
  tags: ["rgb", "led", "led strip", "led-streifen", "rgb header", "12v rgb", "12v", "4-pin", "4-polig", "jrgb", "jrgb1", "rgb_led1", "5050", "g r b", "motherboard", "mainboard", "aura", "mystic light"]
  source: "ASRock B450 Steel Legend manual, RGB_LED1 header and section 3.4; MSI B450 TOMAHAWK user guide, JRGB1~2; MSI MAG B550 TOMAHAWK MAX WIFI user guide, JRGB1~2"
  views:
    plug: {en: "Cable plug of the strip (socket contacts)", de: "Kabelstecker des Streifens (Buchsenkontakte)"}
    socket: {en: "Header on the board, seen from above (pin contacts)", de: "Stiftleiste auf der Platine, von oben gesehen (Stiftkontakte)"}
  shape:
    type: rows
    outline: rect
    contact: square
    drawn: socket
    rows:
      - {pins: ["1", "2", "3", "4"]}
  pins:
    - {number: "1", name: "+12V", function: {en: "+12 V common supply of the strip", de: "Gemeinsame +12-V-Versorgung des Streifens"}, type: power}
    - {number: "2", name: "G", function: {en: "Green channel", de: "Grün-Kanal"}, type: signal}
    - {number: "3", name: "R", function: {en: "Red channel", de: "Rot-Kanal"}, type: signal}
    - {number: "4", name: "B", function: {en: "Blue channel", de: "Blau-Kanal"}, type: signal}

- id: argb_header_5v
  kind: pinout
  category: pinouts
  group: pc_power
  name: {cs: "Konektor adresovatelného RGB, 3 piny, 5 V", da: "Adresserbar RGB-header, 3-polet, 5 V", de: "Adressierbarer RGB-Anschluss, 3-polig, 5 V", el: "Κεφαλίδα RGB με διεύθυνση, 3 ακίδων, 5 V", en: "Addressable RGB header, 3-pin, 5 V", es: "Conector RGB direccionable, 3 pines, 5 V", fr: "Connecteur RVB adressable, 3 broches, 5 V", hi: "एड्रेसेबल RGB हेडर, 3-पिन, 5 V", it: "Header RGB indirizzabile, 3 pin, 5 V", ja: "アドレサブル RGB ヘッダー 3 ピン 5 V", nl: "Adresseerbare RGB-aansluiting, 3-polig, 5 V", "no": "Adresserbar RGB-header, 3-polet, 5 V", pl: "Złącze adresowalnego RGB, 3-pinowe, 5 V", pt: "Conector RGB endereçável, 3 pinos, 5 V", sv: "Adresserbar RGB-kontakt, 3-polig, 5 V", zh: "可寻址 RGB 接头 3 针 5 V"}
  doc: {en: "The header at 2.54 mm pitch for an addressable 5 V RGB LED strip (WS2812B type): four positions with pins at 1, 2 and 4, drawn from above with pin 1 at the left. Position 3 has no pin. There is no standard: it is the board makers' convention.", de: "Die Stiftleiste im Raster 2,54 mm für einen adressierbaren 5-V-RGB-LED-Streifen (Typ WS2812B): vier Positionen mit Pins an 1, 2 und 4, von oben gezeichnet, Pin 1 links. An Position 3 sitzt kein Pin. Einen Standard gibt es nicht: Es ist die Konvention der Platinenhersteller."}
  notes: {en: "For WS2812B strips (5V/Data/GND) up to 3 A at 5 V and 2 m; MSI names up to 75 LEDs, or 200 LEDs at 20 % brightness. The 5 V and the 12 V RGB header look alike: a 5 V strip on the 12 V header is destroyed. The missing pin keeps the 3-wire plug from going on the wrong way round.", de: "Für WS2812B-Streifen (5V/Data/GND) bis 3 A bei 5 V und 2 m; MSI nennt bis zu 75 LEDs, bei 20 % Helligkeit bis zu 200 LEDs. Die 5-V- und die 12-V-RGB-Stiftleiste sehen ähnlich aus: Ein 5-V-Streifen an der 12-V-Stiftleiste wird zerstört. Der fehlende Pin verhindert, dass der dreiadrige Stecker verkehrt herum aufgesteckt wird."}
