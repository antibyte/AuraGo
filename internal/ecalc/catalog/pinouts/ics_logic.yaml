- id: sn74hc165
  kind: pinout
  category: pinouts
  group: ics
  name: {cs: "SN74HC165 (DIP-16)", da: "SN74HC165 (DIP-16)", de: "SN74HC165 (DIP-16)", el: "SN74HC165 (DIP-16)", en: "SN74HC165 (DIP-16)", es: "SN74HC165 (DIP-16)", fr: "SN74HC165 (DIP-16)", hi: "SN74HC165 (DIP-16)", it: "SN74HC165 (DIP-16)", ja: "SN74HC165 (DIP-16)", nl: "SN74HC165 (DIP-16)", no: "SN74HC165 (DIP-16)", pl: "SN74HC165 (DIP-16)", pt: "SN74HC165 (DIP-16)", sv: "SN74HC165 (DIP-16)", zh: "SN74HC165 (DIP-16)"}
  doc: {en: "8-bit parallel-load shift register with serial input and complementary serial outputs, drawn as the 16-pin PDIP from above.", de: "8-Bit-Schieberegister mit parallelem Laden, seriellem Eingang und komplementären seriellen Ausgängen, gezeichnet als 16-poliges PDIP von oben."}
  notes: {en: "The parallel inputs are split, A to D on pins 11 to 14 and E to H on pins 3 to 6. A low SH/LD loads all eight inputs at once, whatever the clock does. With SH/LD high and CLK INH low, each rising edge of CLK shifts one step: H comes out at QH first, and SER moves into the first stage. CLK and CLK INH are interchangeable; change CLK INH to high only while CLK is high.", de: "Die Paralleleingänge sind geteilt: A bis D an den Pins 11 bis 14, E bis H an den Pins 3 bis 6. Ein low an SH/LD lädt alle acht Eingänge auf einmal, unabhängig vom Takt. Bei SH/LD high und CLK INH low schiebt jede steigende Flanke an CLK um eine Stufe: H erscheint zuerst an QH, und SER rückt in die erste Stufe nach. CLK und CLK INH sind vertauschbar; CLK INH nur auf high schalten, während CLK high ist."}
  tags: ["sn74hc165", "74hc165", "hc165", "165", "shift register", "schieberegister", "parallel in", "parallel-load", "piso", "input expander", "eingangserweiterung", "logic", "logik", "dip16", "dip-16"]
  source: "Texas Instruments SN54HC165, SN74HC165 datasheet SCLS116H (December 2015), section 5, pin figure and table Pin Functions; cross-checked against onsemi MC74HC165A/D Rev. 13 (April 2025), page 2, Figures 1 and 2"
  shape:
    type: dip
    pins: 16
  pins:
    - {number: "1", name: "SH/LD", function: {en: "Shift/load: low loads A to H in parallel, high enables shifting", de: "Schieben/Laden: low lädt A bis H parallel, high gibt das Schieben frei"}, type: signal}
    - {number: "2", name: "CLK", function: {en: "Clock: a rising edge shifts the data towards QH", de: "Takt: eine steigende Flanke schiebt die Daten in Richtung QH"}, type: data}
    - {number: "3", name: "E", function: {en: "Parallel input E", de: "Paralleleingang E"}, type: data}
    - {number: "4", name: "F", function: {en: "Parallel input F", de: "Paralleleingang F"}, type: data}
    - {number: "5", name: "G", function: {en: "Parallel input G", de: "Paralleleingang G"}, type: data}
    - {number: "6", name: "H", function: {en: "Parallel input H, the stage next to QH", de: "Paralleleingang H, die Stufe direkt vor QH"}, type: data}
    - {number: "7", name: "~QH", function: {en: "Complementary serial output", de: "Komplementärer serieller Ausgang"}, type: data}
    - {number: "8", name: "GND", function: {en: "Ground", de: "Masse"}, type: ground}
    - {number: "9", name: "QH", function: {en: "Serial output", de: "Serieller Ausgang"}, type: data}
    - {number: "10", name: "SER", function: {en: "Serial input: its level moves into the first stage on each shift", de: "Serieller Eingang: sein Pegel rückt bei jedem Schieben in die erste Stufe"}, type: data}
    - {number: "11", name: "A", function: {en: "Parallel input A", de: "Paralleleingang A"}, type: data}
    - {number: "12", name: "B", function: {en: "Parallel input B", de: "Paralleleingang B"}, type: data}
    - {number: "13", name: "C", function: {en: "Parallel input C", de: "Paralleleingang C"}, type: data}
    - {number: "14", name: "D", function: {en: "Parallel input D", de: "Paralleleingang D"}, type: data}
    - {number: "15", name: "CLK INH", function: {en: "Clock inhibit: high blocks the clock", de: "Taktsperre: high sperrt den Takt"}, type: signal}
    - {number: "16", name: "VCC", function: {en: "Supply, 2 V to 6 V", de: "Versorgung, 2 V bis 6 V"}, type: power}

- id: sn74hc245
  kind: pinout
  category: pinouts
  group: ics
  name: {cs: "SN74HC245 (DIP-20)", da: "SN74HC245 (DIP-20)", de: "SN74HC245 (DIP-20)", el: "SN74HC245 (DIP-20)", en: "SN74HC245 (DIP-20)", es: "SN74HC245 (DIP-20)", fr: "SN74HC245 (DIP-20)", hi: "SN74HC245 (DIP-20)", it: "SN74HC245 (DIP-20)", ja: "SN74HC245 (DIP-20)", nl: "SN74HC245 (DIP-20)", no: "SN74HC245 (DIP-20)", pl: "SN74HC245 (DIP-20)", pt: "SN74HC245 (DIP-20)", sv: "SN74HC245 (DIP-20)", zh: "SN74HC245 (DIP-20)"}
  doc: {en: "Octal bus transceiver with 3-state outputs, one direction input and one output-enable input, drawn as the 20-pin PDIP from above.", de: "Achtfach-Bus-Transceiver mit Tri-State-Ausgängen, einem Richtungseingang und einem Ausgangsfreigabeeingang, gezeichnet als 20-poliges PDIP von oben."}
  notes: {en: "The B side is shifted by one row against the A side: A1 (pin 2) faces OE (pin 19), A2 (pin 3) faces B1 (pin 18), and B8 (pin 11) faces GND (pin 10). With OE low, DIR high drives the B side from the A side and DIR low drives the A side from the B side; with OE high both sides are high-impedance. TI advises a pull-up resistor from OE to VCC so that the outputs stay off during power-up.", de: "Die B-Seite ist gegenüber der A-Seite um eine Reihe versetzt: A1 (Pin 2) liegt gegenüber von OE (Pin 19), A2 (Pin 3) gegenüber von B1 (Pin 18) und B8 (Pin 11) gegenüber von GND (Pin 10). Bei OE low treibt DIR high die B-Seite von der A-Seite, DIR low die A-Seite von der B-Seite; bei OE high sind beide Seiten hochohmig. TI empfiehlt einen Pull-up-Widerstand von OE nach VCC, damit die Ausgänge beim Einschalten abgeschaltet bleiben."}
  tags: ["sn74hc245", "74hc245", "hc245", "74245", "bus transceiver", "transceiver", "bus driver", "buffer", "puffer", "level shifter", "pegelwandler", "logic", "logik", "dip20", "dip-20"]
  source: "Texas Instruments SN54HC245, SN74HC245 datasheet SCLS131F (August 2022), section 5, Figure 5-1 and pin table; cross-checked against onsemi MC74HC245A/D Rev. 18 (July 2024), pages 1 and 2"
  shape:
    type: dip
    pins: 20
  pins:
    - {number: "1", name: "DIR", function: {en: "Direction: high sends A to B, low sends B to A", de: "Richtung: high überträgt von A nach B, low von B nach A"}, type: signal}
    - {number: "2", name: "A1", function: {en: "Bus A, bit 1", de: "Bus A, Bit 1"}, type: data}
    - {number: "3", name: "A2", function: {en: "Bus A, bit 2", de: "Bus A, Bit 2"}, type: data}
