  notes: {en: "Gates 1 and 2 run A, B, Y by rising pin number (pins 1 to 6). Gates 3 and 4 are the other way round: the output has the lowest number, 3Y is pin 8 (3A 9, 3B 10) and 4Y is pin 11 (4A 12, 4B 13).", de: "Bei Gatter 1 und 2 folgen A, B, Y mit steigender Pin-Nummer (Pins 1 bis 6). Bei Gatter 3 und 4 ist es umgekehrt: Der Ausgang hat die kleinste Nummer, 3Y ist Pin 8 (3A 9, 3B 10) und 4Y ist Pin 11 (4A 12, 4B 13)."}
