    - {number: "2", name: "1B", function: {en: "Gate 1, input B", de: "Gatter 1, Eingang B"}, type: signal}
    - {number: "3", name: "1Y", function: {en: "Gate 1, output: NAND of 1A and 1B", de: "Gatter 1, Ausgang: NAND aus 1A und 1B"}, type: signal}
    - {number: "4", name: "2A", function: {en: "Gate 2, input A", de: "Gatter 2, Eingang A"}, type: signal}
    - {number: "5", name: "2B", function: {en: "Gate 2, input B", de: "Gatter 2, Eingang B"}, type: signal}
    - {number: "6", name: "2Y", function: {en: "Gate 2, output: NAND of 2A and 2B", de: "Gatter 2, Ausgang: NAND aus 2A und 2B"}, type: signal}
    - {number: "7", name: "GND", function: {en: "Ground", de: "Masse"}, type: ground}
    - {number: "8", name: "3Y", function: {en: "Gate 3, output: NAND of 3A and 3B", de: "Gatter 3, Ausgang: NAND aus 3A und 3B"}, type: signal}
    - {number: "9", name: "3A", function: {en: "Gate 3, input A", de: "Gatter 3, Eingang A"}, type: signal}
    - {number: "10", name: "3B", function: {en: "Gate 3, input B", de: "Gatter 3, Eingang B"}, type: signal}
    - {number: "11", name: "4Y", function: {en: "Gate 4, output: NAND of 4A and 4B", de: "Gatter 4, Ausgang: NAND aus 4A und 4B"}, type: signal}
    - {number: "12", name: "4A", function: {en: "Gate 4, input A", de: "Gatter 4, Eingang A"}, type: signal}
    - {number: "13", name: "4B", function: {en: "Gate 4, input B", de: "Gatter 4, Eingang B"}, type: signal}
