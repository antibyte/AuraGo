    - {number: "7", name: "A6", function: {en: "Bus A, bit 6", de: "Bus A, Bit 6"}, type: data}
    - {number: "8", name: "A7", function: {en: "Bus A, bit 7", de: "Bus A, Bit 7"}, type: data}
    - {number: "9", name: "A8", function: {en: "Bus A, bit 8", de: "Bus A, Bit 8"}, type: data}
    - {number: "10", name: "GND", function: {en: "Ground", de: "Masse"}, type: ground}
    - {number: "11", name: "B8", function: {en: "Bus B, bit 8", de: "Bus B, Bit 8"}, type: data}
    - {number: "12", name: "B7", function: {en: "Bus B, bit 7", de: "Bus B, Bit 7"}, type: data}
