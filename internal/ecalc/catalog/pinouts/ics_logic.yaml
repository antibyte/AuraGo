  doc: {en: "3-to-8 line decoder and demultiplexer with three enable inputs and eight active-low outputs, drawn as the 16-pin PDIP from above.", de: "3-zu-8-Decoder und Demultiplexer mit drei Freigabeeingängen und acht Ausgängen mit aktiv low, gezeichnet als 16-poliges PDIP von oben."}
  notes: {en: "An output goes low only when G1 is high and both G2A and G2B are low; otherwise all eight outputs are high. C, B, A form the binary number of the selected output, A is the lowest bit. Y7 sits alone on pin 7, on the other side from Y0 to Y6.", de: "Ein Ausgang geht nur auf low, wenn G1 high ist und G2A und G2B beide low sind; sonst sind alle acht Ausgänge high. C, B, A bilden die Binärzahl des gewählten Ausgangs, A ist das niedrigste Bit. Y7 liegt allein auf Pin 7, auf der anderen Seite als Y0 bis Y6."}
  tags: ["sn74hc138", "74hc138", "hc138", "74138", "decoder", "dekoder", "demultiplexer", "address decoder", "adressdekoder", "3-to-8", "logic", "logik", "dip16", "dip-16"]
  source: "Texas Instruments SN54HC138, SN74HC138 datasheet SCLS107G (October 2021), section 5, pin figure and table Pin Functions; cross-checked against onsemi MC74HC138A/D Rev. 14 (March 2024), page 1 pin assignment and page 2"
