    - {number: "4", name: "G2A", function: {en: "Enable input, active low", de: "Freigabeeingang, aktiv low"}, type: signal}
    - {number: "5", name: "G2B", function: {en: "Enable input, active low", de: "Freigabeeingang, aktiv low"}, type: signal}
    - {number: "6", name: "G1", function: {en: "Enable input, active high", de: "Freigabeeingang, aktiv high"}, type: signal}
    - {number: "7", name: "Y7", function: {en: "Output 7, low when selected", de: "Ausgang 7, low wenn ausgewählt"}, type: signal}
    - {number: "8", name: "GND", function: {en: "Ground", de: "Masse"}, type: ground}
