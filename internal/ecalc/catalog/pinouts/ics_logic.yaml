  doc: {en: "CMOS decade counter with ten decoded outputs and a carry output, drawn as the 16-pin PDIP from above.", de: "CMOS-Dekadenzähler mit zehn dekodierten Ausgängen und einem Übertragsausgang, gezeichnet als 16-poliges PDIP von oben."}
  notes: {en: "The outputs are not in counting order around the package: Q0 is pin 3, Q1 is pin 2, Q2 is pin 4, Q3 is pin 7, Q4 is pin 10, Q5 is pin 1, Q6 is pin 5, Q7 is pin 6, Q8 is pin 9 and Q9 is pin 11. Only one output is high at a time, for one full clock cycle. To let the counter run, hold CLOCK INHIBIT and RESET low; do not leave these inputs open.", de: "Die Ausgänge liegen nicht in Zählreihenfolge am Gehäuse: Q0 ist Pin 3, Q1 ist Pin 2, Q2 ist Pin 4, Q3 ist Pin 7, Q4 ist Pin 10, Q5 ist Pin 1, Q6 ist Pin 5, Q7 ist Pin 6, Q8 ist Pin 9 und Q9 ist Pin 11. Es ist immer nur ein Ausgang high, jeweils einen vollen Taktzyklus lang. Damit der Zähler läuft, CLOCK INHIBIT und RESET auf low halten; diese Eingänge nicht offen lassen."}
  tags: ["cd4017", "cd4017b", "4017", "mc14017b", "hef4017", "decade counter", "dekadenzähler", "johnson counter", "johnson-zähler", "counter", "zähler", "led chaser", "lauflicht", "cmos", "logic", "logik", "dip16", "dip-16"]
  source: "Texas Instruments CD4017B, CD4022B datasheet SCHS027C (February 2004), page 1 terminal diagram and page 2 logic diagram; cross-checked against onsemi MC14017B/D Rev. 10 (August 2025), pin assignment, and Renesas CD4017BMS FN3297 Rev 0.00 (August 1998), page 1 pinouts"
  shape:
    type: dip
    pins: 16
  pins:
    - {number: "1", name: "Q5", function: {en: "Decoded output 5: high while the count is 5", de: "Dekodierter Ausgang 5: high, solange der Zählerstand 5 ist"}, type: signal}
    - {number: "2", name: "Q1", function: {en: "Decoded output 1: high while the count is 1", de: "Dekodierter Ausgang 1: high, solange der Zählerstand 1 ist"}, type: signal}
    - {number: "3", name: "Q0", function: {en: "Decoded output 0: high while the count is 0", de: "Dekodierter Ausgang 0: high, solange der Zählerstand 0 ist"}, type: signal}
    - {number: "4", name: "Q2", function: {en: "Decoded output 2: high while the count is 2", de: "Dekodierter Ausgang 2: high, solange der Zählerstand 2 ist"}, type: signal}
    - {number: "5", name: "Q6", function: {en: "Decoded output 6: high while the count is 6", de: "Dekodierter Ausgang 6: high, solange der Zählerstand 6 ist"}, type: signal}
    - {number: "6", name: "Q7", function: {en: "Decoded output 7: high while the count is 7", de: "Dekodierter Ausgang 7: high, solange der Zählerstand 7 ist"}, type: signal}
    - {number: "7", name: "Q3", function: {en: "Decoded output 3: high while the count is 3", de: "Dekodierter Ausgang 3: high, solange der Zählerstand 3 ist"}, type: signal}
    - {number: "8", name: "VSS", function: {en: "Ground", de: "Masse"}, type: ground}
    - {number: "9", name: "Q8", function: {en: "Decoded output 8: high while the count is 8", de: "Dekodierter Ausgang 8: high, solange der Zählerstand 8 ist"}, type: signal}
    - {number: "10", name: "Q4", function: {en: "Decoded output 4: high while the count is 4", de: "Dekodierter Ausgang 4: high, solange der Zählerstand 4 ist"}, type: signal}
    - {number: "11", name: "Q9", function: {en: "Decoded output 9: high while the count is 9", de: "Dekodierter Ausgang 9: high, solange der Zählerstand 9 ist"}, type: signal}
    - {number: "12", name: "CARRY OUT", function: {en: "Carry output: one cycle per ten clock pulses, high during counts 0 to 4; clocks the next counter in a chain", de: "Übertragsausgang: ein Zyklus je zehn Taktimpulse, high bei den Zählerständen 0 bis 4; taktet den nächsten Zähler einer Kette"}, type: signal}
    - {number: "13", name: "CLOCK INHIBIT", function: {en: "Clock inhibit: high stops the counting", de: "Taktsperre: high hält den Zähler an"}, type: signal}
    - {number: "14", name: "CLOCK", function: {en: "Clock input with Schmitt trigger: counts on the rising edge while CLOCK INHIBIT is low", de: "Takteingang mit Schmitt-Trigger: zählt bei steigender Flanke, solange CLOCK INHIBIT low ist"}, type: signal}
    - {number: "15", name: "RESET", function: {en: "Reset, active high: sets the counter to zero, output 0 goes high", de: "Reset, aktiv high: setzt den Zähler auf null, Ausgang 0 geht auf high"}, type: signal}
    - {number: "16", name: "VDD", function: {en: "Supply, 3 V to 18 V", de: "Versorgung, 3 V bis 18 V"}, type: power}

- id: cd4051
  kind: pinout
  category: pinouts
  group: ics
  name: {cs: "CD4051B (DIP-16)", da: "CD4051B (DIP-16)", de: "CD4051B (DIP-16)", el: "CD4051B (DIP-16)", en: "CD4051B (DIP-16)", es: "CD4051B (DIP-16)", fr: "CD4051B (DIP-16)", hi: "CD4051B (DIP-16)", it: "CD4051B (DIP-16)", ja: "CD4051B (DIP-16)", nl: "CD4051B (DIP-16)", no: "CD4051B (DIP-16)", pl: "CD4051B (DIP-16)", pt: "CD4051B (DIP-16)", sv: "CD4051B (DIP-16)", zh: "CD4051B (DIP-16)"}
  doc: {en: "CMOS 8-channel analog multiplexer and demultiplexer with three select inputs, an inhibit input and a separate negative supply, drawn as the 16-pin PDIP from above.", de: "CMOS-Analogmultiplexer und -Demultiplexer mit 8 Kanälen, drei Auswahleingängen, einem Sperreingang und einer eigenen negativen Versorgung, gezeichnet als 16-poliges PDIP von oben."}
  notes: {en: "C, B and A select the channel as a binary number, A is the lowest bit; with INH high no channel is on. The control inputs switch between VSS (0) and VDD (1). The channels are not in order around the package: 0 is pin 13, 1 is pin 14, 2 is pin 15, 3 is pin 12, 4 is pin 1, 5 is pin 5, 6 is pin 2 and 7 is pin 4. The switches conduct both ways: as a demultiplexer COM OUT/IN is the input. TI gives 3 V to 20 V for a single supply and ±3 V to ±10 V for a dual supply, with 20 V as the absolute maximum; onsemi's MC14051B stops at 18 V.", de: "C, B und A wählen den Kanal als Binärzahl, A ist das niedrigste Bit; bei INH high ist kein Kanal eingeschaltet. Die Steuereingänge schalten zwischen VSS (0) und VDD (1). Die Kanäle liegen nicht der Reihe nach am Gehäuse: 0 ist Pin 13, 1 ist Pin 14, 2 ist Pin 15, 3 ist Pin 12, 4 ist Pin 1, 5 ist Pin 5, 6 ist Pin 2 und 7 ist Pin 4. Die Schalter leiten in beide Richtungen: Als Demultiplexer ist COM OUT/IN der Eingang. TI nennt 3 V bis 20 V für einfache und ±3 V bis ±10 V für symmetrische Versorgung, mit 20 V als absolutem Grenzwert; der MC14051B von onsemi endet bei 18 V."}
  tags: ["cd4051", "cd4051b", "4051", "mc14051b", "hef4051", "74hc4051", "analog multiplexer", "analogmultiplexer", "analog switch", "analogschalter", "mux", "demux", "8-channel", "8-kanal", "cmos", "dip16", "dip-16"]
  source: "Texas Instruments CD4051B, CD4052B, CD4053B datasheet SCHS047O (May 2026), section 4, Figure 4-1 and Table 4-1; cross-checked against onsemi MC14051B/D Rev. 15 (June 2024), pages 1, 2 and 5"
  shape:
    type: dip
    pins: 16
  pins:
    - {number: "1", name: "CH 4 IN/OUT", function: {en: "Channel 4 in/out", de: "Kanal 4, Ein-/Ausgang"}, type: io}
    - {number: "2", name: "CH 6 IN/OUT", function: {en: "Channel 6 in/out", de: "Kanal 6, Ein-/Ausgang"}, type: io}
    - {number: "3", name: "COM OUT/IN", function: {en: "Common out/in: connected to the selected channel", de: "Gemeinsamer Aus-/Eingang: mit dem gewählten Kanal verbunden"}, type: io}
    - {number: "4", name: "CH 7 IN/OUT", function: {en: "Channel 7 in/out", de: "Kanal 7, Ein-/Ausgang"}, type: io}
    - {number: "5", name: "CH 5 IN/OUT", function: {en: "Channel 5 in/out", de: "Kanal 5, Ein-/Ausgang"}, type: io}
    - {number: "6", name: "INH", function: {en: "Inhibit: high switches all channels off", de: "Sperre: high schaltet alle Kanäle ab"}, type: signal}
    - {number: "7", name: "VEE", function: {en: "Negative supply of the analog signal path", de: "Negative Versorgung des analogen Signalwegs"}, type: power, notes: {en: "The analog signal may swing from VEE to VDD. With a single supply connect VEE to VSS; for signals around ground give VEE a negative voltage. VEE must not be above VSS.", de: "Das Analogsignal darf zwischen VEE und VDD liegen. Bei einfacher Versorgung VEE mit VSS verbinden; für Signale um Masse herum VEE an eine negative Spannung legen. VEE darf nicht über VSS liegen."}}
    - {number: "8", name: "VSS", function: {en: "Ground, the low level of the control inputs", de: "Masse, der Low-Pegel der Steuereingänge"}, type: ground}
    - {number: "9", name: "C", function: {en: "Channel select C, most significant bit", de: "Kanalauswahl C, höchstwertiges Bit"}, type: signal}
    - {number: "10", name: "B", function: {en: "Channel select B", de: "Kanalauswahl B"}, type: signal}
    - {number: "11", name: "A", function: {en: "Channel select A, least significant bit", de: "Kanalauswahl A, niederwertigstes Bit"}, type: signal}
    - {number: "12", name: "CH 3 IN/OUT", function: {en: "Channel 3 in/out", de: "Kanal 3, Ein-/Ausgang"}, type: io}
    - {number: "13", name: "CH 0 IN/OUT", function: {en: "Channel 0 in/out", de: "Kanal 0, Ein-/Ausgang"}, type: io}
    - {number: "14", name: "CH 1 IN/OUT", function: {en: "Channel 1 in/out", de: "Kanal 1, Ein-/Ausgang"}, type: io}
    - {number: "15", name: "CH 2 IN/OUT", function: {en: "Channel 2 in/out", de: "Kanal 2, Ein-/Ausgang"}, type: io}
    - {number: "16", name: "VDD", function: {en: "Positive supply", de: "Positive Versorgung"}, type: power}
