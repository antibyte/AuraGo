  notes: {en: "unlike the 74HC74, SET and RESET are active high: hold both low for clocked operation. If both are high, Q and ~Q are both high. Flip-flop 2 repeats the order of flip-flop 1 from pin 13 down to pin 8 (Q, ~Q, CLOCK, RESET, D, SET), so it sits one row lower: Q2 on pin 13 faces ~Q1 on pin 2. The pinout is not that of the 74HC74. Tie unused inputs to VSS or VDD.", de: "Anders als beim 74HC74 sind SET und RESET aktiv high: Für den getakteten Betrieb beide auf low halten. Sind beide high, sind Q und ~Q beide high. Flipflop 2 wiederholt die Reihenfolge von Flipflop 1 von Pin 13 abwärts bis Pin 8 (Q, ~Q, CLOCK, RESET, D, SET) und liegt damit eine Reihe tiefer: Q2 an Pin 13 liegt gegenüber von ~Q1 an Pin 2. Die Belegung ist eine andere als beim 74HC74. Unbenutzte Eingänge an VSS oder VDD legen."}
  tags: ["cd4013", "cd4013b", "4013", "mc14013b", "flip-flop", "flipflop", "d flip-flop", "register", "cmos", "4000", "logic", "logik", "dip14", "dip-14"]
  source: "Texas Instruments CD4013B datasheet SCHS023E (September 2016), section 5, pin figure and table Pin Functions; cross-checked against onsemi MC14013B/D Rev. 11 (July 2025), page 1, pin assignment, and Renesas CD4013BMS FN3080, page 1, pinout"
