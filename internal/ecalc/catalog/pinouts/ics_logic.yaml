  pins:
    - {number: "1", name: "Q1", function: {en: "Flip-flop 1, output", de: "Flipflop 1, Ausgang"}, type: data}
    - {number: "2", name: "~Q1", function: {en: "Flip-flop 1, inverted output", de: "Flipflop 1, invertierter Ausgang"}, type: data}
    - {number: "3", name: "CLOCK1", function: {en: "Flip-flop 1, clock: a rising edge stores D1", de: "Flipflop 1, Takt: eine steigende Flanke übernimmt D1"}, type: data}
    - {number: "4", name: "RESET1", function: {en: "Flip-flop 1, reset, active high: high forces Q1 low", de: "Flipflop 1, Rücksetzen, aktiv high: high setzt Q1 auf low"}, type: signal}
    - {number: "5", name: "D1", function: {en: "Flip-flop 1, data input", de: "Flipflop 1, Dateneingang"}, type: data}
    - {number: "6", name: "SET1", function: {en: "Flip-flop 1, set, active high: high forces Q1 high", de: "Flipflop 1, Setzen, aktiv high: high setzt Q1 auf high"}, type: signal}
    - {number: "7", name: "VSS", function: {en: "Ground", de: "Masse"}, type: ground}
    - {number: "8", name: "SET2", function: {en: "Flip-flop 2, set, active high: high forces Q2 high", de: "Flipflop 2, Setzen, aktiv high: high setzt Q2 auf high"}, type: signal}
    - {number: "9", name: "D2", function: {en: "Flip-flop 2, data input", de: "Flipflop 2, Dateneingang"}, type: data}
    - {number: "10", name: "RESET2", function: {en: "Flip-flop 2, reset, active high: high forces Q2 low", de: "Flipflop 2, Rücksetzen, aktiv high: high setzt Q2 auf low"}, type: signal}
    - {number: "11", name: "CLOCK2", function: {en: "Flip-flop 2, clock: a rising edge stores D2", de: "Flipflop 2, Takt: eine steigende Flanke übernimmt D2"}, type: data}
    - {number: "12", name: "~Q2", function: {en: "Flip-flop 2, inverted output", de: "Flipflop 2, invertierter Ausgang"}, type: data}
    - {number: "13", name: "Q2", function: {en: "Flip-flop 2, output", de: "Flipflop 2, Ausgang"}, type: data}
