- id: sn74hc74
  kind: pinout
  category: pinouts
  group: ics
  name: {cs: "SN74HC74 (DIP-14)", da: "SN74HC74 (DIP-14)", de: "SN74HC74 (DIP-14)", el: "SN74HC74 (DIP-14)", en: "SN74HC74 (DIP-14)", es: "SN74HC74 (DIP-14)", fr: "SN74HC74 (DIP-14)", hi: "SN74HC74 (DIP-14)", it: "SN74HC74 (DIP-14)", ja: "SN74HC74 (DIP-14)", nl: "SN74HC74 (DIP-14)", no: "SN74HC74 (DIP-14)", pl: "SN74HC74 (DIP-14)", pt: "SN74HC74 (DIP-14)", sv: "SN74HC74 (DIP-14)", zh: "SN74HC74 (DIP-14)"}
  doc: {en: "Dual D flip-flop with preset and clear, drawn as the 14-pin PDIP from above.", de: "Zweifaches D-Flipflop mit Setz- und Löscheingang, gezeichnet als 14-poliges PDIP von oben."}
  notes: {en: "flip-flop 2 repeats the order of flip-flop 1 from pin 13 down to pin 8 (CLR, D, CLK, PRE, Q, ~Q), so it sits one row lower: 2CLR on pin 13 faces 1D on pin 2. PRE and CLR act at once, without the clock, and are active low; hold both high for clocked operation. If both are low together, Q and ~Q are both high, and that state does not persist when they return high.", de: "Flipflop 2 wiederholt die Reihenfolge von Flipflop 1 von Pin 13 abwärts bis Pin 8 (CLR, D, CLK, PRE, Q, ~Q) und liegt damit eine Reihe tiefer: 2CLR an Pin 13 liegt gegenüber von 1D an Pin 2. PRE und CLR wirken sofort, ohne Takt, und sind aktiv low; für den getakteten Betrieb beide auf high halten. Sind beide gleichzeitig low, sind Q und ~Q beide high; dieser Zustand bleibt nicht erhalten, wenn sie wieder high werden."}
  tags: ["sn74hc74", "74hc74", "hc74", "7474", "flip-flop", "flipflop", "d flip-flop", "register", "logic", "logik", "dip14", "dip-14"]
  source: "Texas Instruments SN54HC74, SN74HC74 datasheet SCLS094F (June 2021), section 5, pin figure and table Pin Functions; cross-checked against onsemi MC74HC74A/D Rev. 17 (September 2026), page 2, Figures 1 and 2"
  shape:
    type: dip
    pins: 14
  pins:
    - {number: "1", name: "1CLR", function: {en: "Flip-flop 1, clear, active low: low forces 1Q low", de: "Flipflop 1, Löschen, aktiv low: low setzt 1Q auf low"}, type: signal}
    - {number: "2", name: "1D", function: {en: "Flip-flop 1, data input", de: "Flipflop 1, Dateneingang"}, type: data}
    - {number: "3", name: "1CLK", function: {en: "Flip-flop 1, clock: a rising edge stores 1D", de: "Flipflop 1, Takt: eine steigende Flanke übernimmt 1D"}, type: data}
    - {number: "4", name: "1PRE", function: {en: "Flip-flop 1, preset, active low: low forces 1Q high", de: "Flipflop 1, Setzen, aktiv low: low setzt 1Q auf high"}, type: signal}
    - {number: "5", name: "1Q", function: {en: "Flip-flop 1, output", de: "Flipflop 1, Ausgang"}, type: data}
    - {number: "6", name: "~1Q", function: {en: "Flip-flop 1, inverted output", de: "Flipflop 1, invertierter Ausgang"}, type: data}
    - {number: "7", name: "GND", function: {en: "Ground", de: "Masse"}, type: ground}
    - {number: "8", name: "~2Q", function: {en: "Flip-flop 2, inverted output", de: "Flipflop 2, invertierter Ausgang"}, type: data}
    - {number: "9", name: "2Q", function: {en: "Flip-flop 2, output", de: "Flipflop 2, Ausgang"}, type: data}
    - {number: "10", name: "2PRE", function: {en: "Flip-flop 2, preset, active low: low forces 2Q high", de: "Flipflop 2, Setzen, aktiv low: low setzt 2Q auf high"}, type: signal}
    - {number: "11", name: "2CLK", function: {en: "Flip-flop 2, clock: a rising edge stores 2D", de: "Flipflop 2, Takt: eine steigende Flanke übernimmt 2D"}, type: data}
    - {number: "12", name: "2D", function: {en: "Flip-flop 2, data input", de: "Flipflop 2, Dateneingang"}, type: data}
    - {number: "13", name: "2CLR", function: {en: "Flip-flop 2, clear, active low: low forces 2Q low", de: "Flipflop 2, Löschen, aktiv low: low setzt 2Q auf low"}, type: signal}
    - {number: "14", name: "VCC", function: {en: "Supply, 2 V to 6 V", de: "Versorgung, 2 V bis 6 V"}, type: power}

- id: sn74hc139
  kind: pinout
  category: pinouts
  group: ics
  name: {cs: "SN74HC139 (DIP-16)", da: "SN74HC139 (DIP-16)", de: "SN74HC139 (DIP-16)", el: "SN74HC139 (DIP-16)", en: "SN74HC139 (DIP-16)", es: "SN74HC139 (DIP-16)", fr: "SN74HC139 (DIP-16)", hi: "SN74HC139 (DIP-16)", it: "SN74HC139 (DIP-16)", ja: "SN74HC139 (DIP-16)", nl: "SN74HC139 (DIP-16)", no: "SN74HC139 (DIP-16)", pl: "SN74HC139 (DIP-16)", pt: "SN74HC139 (DIP-16)", sv: "SN74HC139 (DIP-16)", zh: "SN74HC139 (DIP-16)"}
  doc: {en: "Dual 2-to-4 line decoder/demultiplexer, drawn as the 16-pin PDIP from above.", de: "Zweifacher 2-zu-4-Decoder/Demultiplexer, gezeichnet als 16-poliges PDIP von oben."}
  notes: {en: "with G low, B and A pick one output as a binary number, A is the lowest bit, and that output goes low while the other three stay high; with G high all four are high. The second decoder mirrors the first from pin 15 down to pin 9 (2G, 2A, 2B, 2Y0 to 2Y3), one row lower: 2G on pin 15 faces 1A on pin 2. As a demultiplexer, G is the data input.", de: "Bei G low wählen B und A als Binärzahl einen Ausgang, A ist das niedrigste Bit; dieser Ausgang geht auf low, die anderen drei bleiben high. Bei G high sind alle vier high. Der zweite Decoder wiederholt die Belegung des ersten von Pin 15 abwärts bis Pin 9 (2G, 2A, 2B, 2Y0 bis 2Y3) und liegt eine Reihe tiefer: 2G an Pin 15 liegt gegenüber von 1A an Pin 2. Als Demultiplexer ist G der Dateneingang."}
  tags: ["sn74hc139", "74hc139", "hc139", "74139", "decoder", "dekoder", "demultiplexer", "2-to-4", "logic", "logik", "dip16", "dip-16"]
  source: "Texas Instruments SN54HC139, SN74HC139 datasheet SCLS108E (February 2022), section 4, DIP pin figure; cross-checked against onsemi MC74HC139A/D Rev. 13 (April 2024), pages 1 and 2, pin assignment and Figure 1"
  shape:
    type: dip
    pins: 16
  pins:
    - {number: "1", name: "1G", function: {en: "Decoder 1, enable, active low: high sets all four outputs high", de: "Decoder 1, Freigabe, aktiv low: high setzt alle vier Ausgänge auf high"}, type: signal}
    - {number: "2", name: "1A", function: {en: "Decoder 1, select input A, least significant bit", de: "Decoder 1, Auswahleingang A, niederwertigstes Bit"}, type: signal}
    - {number: "3", name: "1B", function: {en: "Decoder 1, select input B, most significant bit", de: "Decoder 1, Auswahleingang B, höchstwertiges Bit"}, type: signal}
    - {number: "4", name: "1Y0", function: {en: "Decoder 1, output 0, low when selected", de: "Decoder 1, Ausgang 0, low wenn ausgewählt"}, type: signal}
    - {number: "5", name: "1Y1", function: {en: "Decoder 1, output 1, low when selected", de: "Decoder 1, Ausgang 1, low wenn ausgewählt"}, type: signal}
    - {number: "6", name: "1Y2", function: {en: "Decoder 1, output 2, low when selected", de: "Decoder 1, Ausgang 2, low wenn ausgewählt"}, type: signal}
    - {number: "7", name: "1Y3", function: {en: "Decoder 1, output 3, low when selected", de: "Decoder 1, Ausgang 3, low wenn ausgewählt"}, type: signal}
    - {number: "8", name: "GND", function: {en: "Ground", de: "Masse"}, type: ground}
    - {number: "9", name: "2Y3", function: {en: "Decoder 2, output 3, low when selected", de: "Decoder 2, Ausgang 3, low wenn ausgewählt"}, type: signal}
    - {number: "10", name: "2Y2", function: {en: "Decoder 2, output 2, low when selected", de: "Decoder 2, Ausgang 2, low wenn ausgewählt"}, type: signal}
    - {number: "11", name: "2Y1", function: {en: "Decoder 2, output 1, low when selected", de: "Decoder 2, Ausgang 1, low wenn ausgewählt"}, type: signal}
    - {number: "12", name: "2Y0", function: {en: "Decoder 2, output 0, low when selected", de: "Decoder 2, Ausgang 0, low wenn ausgewählt"}, type: signal}
    - {number: "13", name: "2B", function: {en: "Decoder 2, select input B, most significant bit", de: "Decoder 2, Auswahleingang B, höchstwertiges Bit"}, type: signal}
    - {number: "14", name: "2A", function: {en: "Decoder 2, select input A, least significant bit", de: "Decoder 2, Auswahleingang A, niederwertigstes Bit"}, type: signal}
    - {number: "15", name: "2G", function: {en: "Decoder 2, enable, active low: high sets all four outputs high", de: "Decoder 2, Freigabe, aktiv low: high setzt alle vier Ausgänge auf high"}, type: signal}
    - {number: "16", name: "VCC", function: {en: "Supply, 2 V to 6 V", de: "Versorgung, 2 V bis 6 V"}, type: power}

- id: sn74hc161
  kind: pinout
  category: pinouts
  group: ics
  name: {cs: "SN74HC161 / SN74HC163 (DIP-16)", da: "SN74HC161 / SN74HC163 (DIP-16)", de: "SN74HC161 / SN74HC163 (DIP-16)", el: "SN74HC161 / SN74HC163 (DIP-16)", en: "SN74HC161 / SN74HC163 (DIP-16)", es: "SN74HC161 / SN74HC163 (DIP-16)", fr: "SN74HC161 / SN74HC163 (DIP-16)", hi: "SN74HC161 / SN74HC163 (DIP-16)", it: "SN74HC161 / SN74HC163 (DIP-16)", ja: "SN74HC161 / SN74HC163 (DIP-16)", nl: "SN74HC161 / SN74HC163 (DIP-16)", no: "SN74HC161 / SN74HC163 (DIP-16)", pl: "SN74HC161 / SN74HC163 (DIP-16)", pt: "SN74HC161 / SN74HC163 (DIP-16)", sv: "SN74HC161 / SN74HC163 (DIP-16)", zh: "SN74HC161 / SN74HC163 (DIP-16)"}
  doc: {en: "4-bit synchronous binary counter with synchronous load (SN74HC161 with asynchronous clear, SN74HC163 with synchronous clear), drawn as the 16-pin PDIP from above.", de: "Synchroner 4-Bit-Binärzähler mit synchronem Laden (SN74HC161 mit asynchronem, SN74HC163 mit synchronem Löschen), gezeichnet als 16-poliges PDIP von oben."}
  notes: {en: "the counter counts only while ENP, ENT, LOAD and CLR are all high; each rising edge at CLK then adds one. QA is the lowest bit. A low at LOAD loads A to D at the next rising edge. The SN74HC161 clears as soon as CLR goes low; the SN74HC163 clears only at the next rising clock edge, so a gate that decodes the outputs can shorten the count. Otherwise the two parts are pin-compatible.", de: "Der Zähler zählt nur, wenn ENP, ENT, LOAD und CLR alle high sind; dann erhöht jede steigende Flanke an CLK den Zählerstand um eins. QA ist das niedrigste Bit. Ein low an LOAD übernimmt A bis D mit der nächsten steigenden Flanke. Der SN74HC161 löscht sofort, wenn CLR low wird; der SN74HC163 löscht erst mit der nächsten steigenden Taktflanke, so dass ein Gatter an den Ausgängen die Zählfolge verkürzen kann. Sonst sind beide Bausteine pinkompatibel."}
  tags: ["sn74hc161", "sn74hc163", "74hc161", "74hc163", "hc161", "hc163", "74161", "74163", "counter", "zähler", "binary counter", "binärzähler", "logic", "logik", "dip16", "dip-16"]
  source: "Texas Instruments SN54HC161, SN74HC161 datasheet SCLS297D (September 2003) and SN54HC163, SN74HC163 datasheet SCLS298D (October 2003), page 1, DIP pin figures; cross-checked against onsemi MC74HC161A/D Rev. 14 (May 2024), page 2, Figure 1"
  shape:
    type: dip
    pins: 16
  pins:
    - {number: "1", name: "CLR", function: {en: "Clear, active low: sets QA to QD low; on the 'HC161 at once, on the 'HC163 at the next rising clock edge", de: "Löschen, aktiv low: setzt QA bis QD auf low; beim 'HC161 sofort, beim 'HC163 mit der nächsten steigenden Taktflanke"}, type: signal}
    - {number: "2", name: "CLK", function: {en: "Clock: counting and loading happen on the rising edge", de: "Takt: Zählen und Laden erfolgen mit der steigenden Flanke"}, type: signal}
    - {number: "3", name: "A", function: {en: "Preset input A, least significant bit", de: "Voreinstelleingang A, niederwertigstes Bit"}, type: data}
    - {number: "4", name: "B", function: {en: "Preset input B", de: "Voreinstelleingang B"}, type: data}
    - {number: "5", name: "C", function: {en: "Preset input C", de: "Voreinstelleingang C"}, type: data}
    - {number: "6", name: "D", function: {en: "Preset input D, most significant bit", de: "Voreinstelleingang D, höchstwertiges Bit"}, type: data}
    - {number: "7", name: "ENP", function: {en: "Count enable P: counts only while ENP and ENT are both high", de: "Zählfreigabe P: zählt nur, wenn ENP und ENT beide high sind"}, type: signal}
    - {number: "8", name: "GND", function: {en: "Ground", de: "Masse"}, type: ground}
    - {number: "9", name: "LOAD", function: {en: "Load, active low: the next rising clock edge copies A to D to the outputs", de: "Laden, aktiv low: die nächste steigende Taktflanke übernimmt A bis D an die Ausgänge"}, type: signal}
    - {number: "10", name: "ENT", function: {en: "Count enable T: like ENP, and also enables RCO", de: "Zählfreigabe T: wie ENP, gibt zusätzlich RCO frei"}, type: signal}
    - {number: "11", name: "QD", function: {en: "Counter output D, most significant bit", de: "Zählerausgang D, höchstwertiges Bit"}, type: data}
    - {number: "12", name: "QC", function: {en: "Counter output C", de: "Zählerausgang C"}, type: data}
    - {number: "13", name: "QB", function: {en: "Counter output B", de: "Zählerausgang B"}, type: data}
    - {number: "14", name: "QA", function: {en: "Counter output A, least significant bit", de: "Zählerausgang A, niederwertigstes Bit"}, type: data}
    - {number: "15", name: "RCO", function: {en: "Ripple-carry output: high at count 15 while ENT is high; enables the next counter", de: "Übertragsausgang: high bei Zählerstand 15, solange ENT high ist; gibt den nächsten Zähler frei"}, type: signal}
    - {number: "16", name: "VCC", function: {en: "Supply, 2 V to 6 V", de: "Versorgung, 2 V bis 6 V"}, type: power}

- id: cd4011
  kind: pinout
  category: pinouts
  group: ics
  name: {cs: "CD4011B (DIP-14)", da: "CD4011B (DIP-14)", de: "CD4011B (DIP-14)", el: "CD4011B (DIP-14)", en: "CD4011B (DIP-14)", es: "CD4011B (DIP-14)", fr: "CD4011B (DIP-14)", hi: "CD4011B (DIP-14)", it: "CD4011B (DIP-14)", ja: "CD4011B (DIP-14)", nl: "CD4011B (DIP-14)", no: "CD4011B (DIP-14)", pl: "CD4011B (DIP-14)", pt: "CD4011B (DIP-14)", sv: "CD4011B (DIP-14)", zh: "CD4011B (DIP-14)"}
  doc: {en: "Quad 2-input NAND gate (CMOS 4000 series), drawn as the 14-pin PDIP from above.", de: "Vierfach-NAND-Gatter mit 2 Eingängen (CMOS-4000er-Reihe), gezeichnet als 14-poliges PDIP von oben."}
  notes: {en: "the outputs sit in the middle of each side, J on pin 3 and K on pin 4, L on pin 10 and M on pin 11; the inputs take the outer pins. Supply and ground are where the 74HC00 has them, but the gates are not: pins 4 and 10 are outputs here and inputs on the 74HC00, pins 6 and 8 the other way round. Tie unused inputs to VSS or VDD.", de: "Die Ausgänge liegen in der Mitte jeder Seite, J an Pin 3 und K an Pin 4, L an Pin 10 und M an Pin 11; die Eingänge belegen die äußeren Pins. Versorgung und Masse liegen wie beim 74HC00, die Gatter aber nicht: Pin 4 und 10 sind hier Ausgänge und beim 74HC00 Eingänge, bei Pin 6 und 8 ist es umgekehrt. Unbenutzte Eingänge an VSS oder VDD legen."}
  tags: ["cd4011", "cd4011b", "4011", "mc14011b", "nand", "gate", "gatter", "cmos", "4000", "logic", "logik", "dip14", "dip-14"]
  source: "Texas Instruments CD4011B, CD4012B, CD4023B datasheet SCHS021D (September 2003), page 1, terminal assignments CD4011B; cross-checked against onsemi MC14001B/D Rev. 13 (November 2025), page 2, pin assignments, and Renesas CD4011BMS FN3079, page 1, pinouts"
  shape:
    type: dip
    pins: 14
  pins:
    - {number: "1", name: "A", function: {en: "Gate 1, input A", de: "Gatter 1, Eingang A"}, type: signal}
    - {number: "2", name: "B", function: {en: "Gate 1, input B", de: "Gatter 1, Eingang B"}, type: signal}
    - {number: "3", name: "J", function: {en: "Gate 1, output J: NAND of A and B", de: "Gatter 1, Ausgang J: NAND aus A und B"}, type: signal}
    - {number: "4", name: "K", function: {en: "Gate 2, output K: NAND of C and D", de: "Gatter 2, Ausgang K: NAND aus C und D"}, type: signal}
    - {number: "5", name: "C", function: {en: "Gate 2, input C", de: "Gatter 2, Eingang C"}, type: signal}
    - {number: "6", name: "D", function: {en: "Gate 2, input D", de: "Gatter 2, Eingang D"}, type: signal}
    - {number: "7", name: "VSS", function: {en: "Ground", de: "Masse"}, type: ground}
    - {number: "8", name: "E", function: {en: "Gate 3, input E", de: "Gatter 3, Eingang E"}, type: signal}
    - {number: "9", name: "F", function: {en: "Gate 3, input F", de: "Gatter 3, Eingang F"}, type: signal}
    - {number: "10", name: "L", function: {en: "Gate 3, output L: NAND of E and F", de: "Gatter 3, Ausgang L: NAND aus E und F"}, type: signal}
    - {number: "11", name: "M", function: {en: "Gate 4, output M: NAND of G and H", de: "Gatter 4, Ausgang M: NAND aus G und H"}, type: signal}
    - {number: "12", name: "G", function: {en: "Gate 4, input G", de: "Gatter 4, Eingang G"}, type: signal}
    - {number: "13", name: "H", function: {en: "Gate 4, input H", de: "Gatter 4, Eingang H"}, type: signal}
    - {number: "14", name: "VDD", function: {en: "Supply, 3 V to 18 V", de: "Versorgung, 3 V bis 18 V"}, type: power}

