  doc: {en: "BCD-to-7-segment latch, decoder and driver (CMOS 4000 series), drawn as the 16-pin PDIP from above.", de: "BCD-zu-7-Segment-Latch, -Decoder und -Treiber (CMOS-4000er-Reihe), gezeichnet als 16-poliges PDIP von oben."}
  notes: {en: "the BCD inputs are scattered: A (lowest bit) is pin 7, B pin 1, C pin 2, D pin 6. The segment outputs a to g are on pins 13, 12, 11, 10, 9, 15 and 14. With LT and BL high and LE low, the code on D C B A shows as a digit; codes above 9 blank the display. LT low lights every segment, BL low blanks the display, and LE high holds the last code. The outputs drive common-cathode LED displays with up to 25 mA each; an output that is high must not be shorted to VSS. Pin 4 is called BL in TI's pin figure; onsemi and TI's truth table call it BI.", de: "Die BCD-Eingänge liegen verstreut: A (niedrigstes Bit) ist Pin 7, B Pin 1, C Pin 2, D Pin 6. Die Segmentausgänge a bis g liegen an den Pins 13, 12, 11, 10, 9, 15 und 14. Bei LT und BL high und LE low erscheint der Code an D C B A als Ziffer; Codes über 9 schalten die Anzeige dunkel. LT low lässt alle Segmente leuchten, BL low schaltet die Anzeige dunkel, und LE high hält den letzten Code. Die Ausgänge treiben LED-Anzeigen mit gemeinsamer Kathode mit bis zu 25 mA je Ausgang; ein Ausgang, der high ist, darf nicht gegen VSS kurzgeschlossen werden. Pin 4 heißt in TIs Pinbelegung BL; onsemi und TIs Wahrheitstabelle nennen ihn BI."}
  tags: ["cd4511", "cd4511b", "4511", "mc14511b", "bcd", "7-segment", "7-segment-treiber", "seven segment", "decoder", "dekoder", "display driver", "anzeigetreiber", "cmos", "4000", "logic", "logik", "dip16", "dip-16"]
  source: "Texas Instruments CD4511B datasheet SCHS072B (July 2003), page 1, CD4511B terminal assignment; cross-checked against onsemi MC14511B/D Rev. 13 (March 2022), page 2, pin assignment"
