  doc: {en: "Phototransistor optocoupler of the Sharp PC817 series, drawn as the 4-pin DIP from above.", de: "Fototransistor-Optokoppler der Sharp-Baureihe PC817, gezeichnet als 4-poliges DIP von oben."}
  notes: {en: "Input side (LED) on pins 1 and 2, output side (phototransistor) on pins 3 and 4; the two sides are isolated from each other. Pin 1 is marked by a dot on the top. The LED needs a series resistor. The SMT gull-wing version of the same series has the same pin numbers.", de: "Eingangsseite (LED) an Pin 1 und 2, Ausgangsseite (Fototransistor) an Pin 3 und 4; beide Seiten sind voneinander isoliert. Pin 1 ist oben mit einem Punkt markiert. Die LED braucht einen Vorwiderstand. Die SMT-Version mit Gull-Wing-Anschlüssen derselben Baureihe hat dieselben Pin-Nummern."}
