- id: to92
  kind: pinout
  category: pinouts
  group: ics
  name: {cs: "TO-92: příklady", da: "TO-92: eksempler", de: "TO-92: Beispiele", el: "TO-92: παραδείγματα", en: "TO-92: examples", es: "TO-92: ejemplos", fr: "Exemples TO-92", hi: "TO-92: उदाहरण", it: "TO-92: esempi", ja: "TO-92の例", nl: "TO-92: voorbeelden", no: "TO-92: eksempler", pl: "TO-92: przykłady", pt: "TO-92: exemplos", sv: "TO-92: exempel", zh: "TO-92 示例"}
  doc: {en: "The pin order of a TO-92 part depends on the part, not on the package: this page lists examples only, so check the datasheet of your exact part and maker. Each is drawn from the front, flat side towards you and leads pointing down, and the numbers are positions from left to right.", de: "Die Pin-Reihenfolge eines TO-92-Bauteils hängt vom Bauteil ab, nicht vom Gehäuse: Diese Seite zeigt nur Beispiele, prüfe also das Datenblatt deines genauen Bauteils und Herstellers. Alle sind von vorn gezeichnet, flache Seite zu dir und Anschlüsse nach unten, und die Nummern sind Positionen von links nach rechts."}
  notes: {en: "The PN2222A entry is the plastic TO-92 type from onsemi (formerly Fairchild). It does not apply to the round metal-can 2N2222 (TO-18), whose leads form a triangle, and the similarly named onsemi P2N2222A has collector and emitter swapped: collector left, emitter right. The 78L05 runs the opposite way to the L78xx in TO-220: its input is on the right. TI's table numbers the TL431 leads against the positions used here; see its pin notes. The BS170 runs the opposite way to the 2N7000: drain left, source right. The DS18B20 has ground on the left and the supply on the right, the reverse of the LM35. The BC337 and BC557 have the same order as the BC547 (collector left), the 2N3906 the same as the 2N3904 (emitter left).", de: "Der Eintrag PN2222A ist der TO-92-Typ aus Kunststoff von onsemi (früher Fairchild). Er gilt nicht für den runden 2N2222 im Metallgehäuse (TO-18), dessen Anschlüsse ein Dreieck bilden, und beim ähnlich benannten onsemi P2N2222A sind Kollektor und Emitter vertauscht: Kollektor links, Emitter rechts. Der 78L05 läuft umgekehrt zum L78xx im TO-220: Sein Eingang liegt rechts. Die Tabelle von TI nummeriert die Anschlüsse des TL431 gegenläufig zu den Positionen hier; siehe die Pin-Hinweise. Der BS170 ist umgekehrt belegt wie der 2N7000: Drain links, Source rechts. Der DS18B20 hat Masse links und die Versorgung rechts, umgekehrt zum LM35. BC337 und BC557 haben dieselbe Reihenfolge wie der BC547 (Kollektor links), der 2N3906 dieselbe wie der 2N3904 (Emitter links)."}
  tags: ["to92", "to-92", "transistor", "mosfet", "bc547", "pn2222a", "2n2222", "2n3904", "2n7000", "lm35", "78l05", "ua78l05", "mc78l05", "tl431", "npn", "collector", "kollektor", "base", "basis", "emitter", "gate", "source", "drain", "regulator", "spannungsregler", "temperature sensor", "temperatursensor", "voltage reference", "spannungsreferenz", "bc337", "bc557", "2n3906", "bs170", "ds18b20", "pnp", "1-wire", "onewire", "thermometer"]
  source: "onsemi BC546/D Rev. 8 (BC547); onsemi/Fairchild PN2222A Rev. 1.1.0 and onsemi P2N2222A/D Rev. 7; multicomp 2N2222 sheet V1.0 (TO-18); onsemi 2N3903/D Rev. 9 (2N3904); onsemi NDS7002A/D Rev. 11 (2N7000); TI LM35 SNIS159H; TI UA78L SLVS010X and onsemi MC78L00A/D Rev. 21 (78L05); TI TL431 SLVS543S and onsemi TL431/D Rev. 45; Diotec BC337 and BC556 to BC559 (version 2026-03-30); onsemi BC556B/D Rev. 3 (BC557); onsemi 2N3906/D Rev. 4; onsemi BS170/D Rev. 7, MMBF170/D Rev. 9 and Vishay 70226 (BS170); Dallas DS18B20 datasheet (footer 050400)"
  shape:
    type: to
    package: to92
    pins: ["1", "2", "3"]
  variants:
    - id: bc547
      name: {en: "BC547", de: "BC547"}
      pins:
        - {number: "1", name: "C", function: {en: "Collector", de: "Kollektor"}, type: signal}
        - {number: "2", name: "B", function: {en: "Base", de: "Basis"}, type: signal}
        - {number: "3", name: "E", function: {en: "Emitter", de: "Emitter"}, type: signal}
    - id: q2n2222
      name: {en: "PN2222A", de: "PN2222A"}
      pins:
        - {number: "1", name: "E", function: {en: "Emitter", de: "Emitter"}, type: signal, notes: {en: "For the TO-92 PN2222A. Not for the metal-can 2N2222 or the P2N2222A.", de: "Für den PN2222A im TO-92. Nicht für den 2N2222 im Metallgehäuse oder den P2N2222A."}}
        - {number: "2", name: "B", function: {en: "Base", de: "Basis"}, type: signal}
        - {number: "3", name: "C", function: {en: "Collector", de: "Kollektor"}, type: signal}
    - id: q2n3904
      name: {en: "2N3904", de: "2N3904"}
      pins:
        - {number: "1", name: "E", function: {en: "Emitter", de: "Emitter"}, type: signal}
        - {number: "2", name: "B", function: {en: "Base", de: "Basis"}, type: signal}
        - {number: "3", name: "C", function: {en: "Collector", de: "Kollektor"}, type: signal}
    - id: q2n7000
      name: {en: "2N7000", de: "2N7000"}
      pins:
        - {number: "1", name: "S", function: {en: "Source of the N-channel MOSFET", de: "Source des N-Kanal-MOSFET"}, type: signal}
        - {number: "2", name: "G", function: {en: "Gate", de: "Gate"}, type: signal}
        - {number: "3", name: "D", function: {en: "Drain", de: "Drain"}, type: signal}
    - id: lm35
      name: {en: "LM35", de: "LM35"}
      pins:
        - {number: "1", name: "+VS", function: {en: "Positive supply", de: "Positive Versorgung"}, type: power}
        - {number: "2", name: "VOUT", function: {en: "Analogue temperature output", de: "Analoger Temperaturausgang"}, type: signal}
        - {number: "3", name: "GND", function: {en: "Ground", de: "Masse"}, type: ground}
    - id: reg78l05
      name: {en: "78L05", de: "78L05"}
      pins:
        - {number: "1", name: "OUTPUT", function: {en: "Regulated 5 V output", de: "Geregelter 5-V-Ausgang"}, type: power}
        - {number: "2", name: "COMMON", function: {en: "Ground", de: "Masse"}, type: ground}
        - {number: "3", name: "INPUT", function: {en: "Unregulated input voltage", de: "Ungeregelte Eingangsspannung"}, type: power}
    - id: tl431
      name: {en: "TL431", de: "TL431"}
      pins:
        - {number: "1", name: "REF", function: {en: "Reference input", de: "Referenzeingang"}, type: signal, notes: {en: "Position 1 here; TI's table calls it pin 3, onsemi pin 1.", de: "Hier Position 1; die Tabelle von TI nennt ihn Pin 3, onsemi Pin 1."}}
        - {number: "2", name: "ANODE", function: {en: "Anode, the common pin, normally tied to ground", de: "Anode, der gemeinsame Anschluss, normalerweise an Masse"}, type: ground, notes: {en: "Position 2 here; pin 2 at TI and onsemi.", de: "Hier Position 2; bei TI und onsemi Pin 2."}}
        - {number: "3", name: "CATHODE", function: {en: "Cathode, carries the shunt current", de: "Kathode, führt den Shunt-Strom"}, type: signal, notes: {en: "Position 3 here; TI's table calls it pin 1, onsemi pin 3.", de: "Hier Position 3; die Tabelle von TI nennt sie Pin 1, onsemi Pin 3."}}
    - id: bc337
      name: {en: "BC337", de: "BC337"}
      pins:
        - {number: "1", name: "C", function: {en: "Collector", de: "Kollektor"}, type: signal}
        - {number: "2", name: "B", function: {en: "Base", de: "Basis"}, type: signal}
        - {number: "3", name: "E", function: {en: "Emitter", de: "Emitter"}, type: signal}
    - id: bc557
      name: {en: "BC557", de: "BC557"}
      pins:
        - {number: "1", name: "C", function: {en: "Collector", de: "Kollektor"}, type: signal}
        - {number: "2", name: "B", function: {en: "Base", de: "Basis"}, type: signal}
        - {number: "3", name: "E", function: {en: "Emitter", de: "Emitter"}, type: signal}
    - id: q2n3906
      name: {en: "2N3906", de: "2N3906"}
      pins:
        - {number: "1", name: "E", function: {en: "Emitter", de: "Emitter"}, type: signal}
        - {number: "2", name: "B", function: {en: "Base", de: "Basis"}, type: signal}
        - {number: "3", name: "C", function: {en: "Collector", de: "Kollektor"}, type: signal}
    - id: bs170
      name: {en: "BS170", de: "BS170"}
      pins:
        - {number: "1", name: "D", function: {en: "Drain", de: "Drain"}, type: signal, notes: {en: "Drain on the left: the BS170 runs the opposite way to the 2N7000 (source on the left).", de: "Drain links: Der BS170 ist umgekehrt belegt wie der 2N7000 (Source links)."}}
        - {number: "2", name: "G", function: {en: "Gate", de: "Gate"}, type: signal}
        - {number: "3", name: "S", function: {en: "Source of the N-channel MOSFET", de: "Source des N-Kanal-MOSFET"}, type: signal}
    - id: ds18b20
      name: {en: "DS18B20", de: "DS18B20"}
      pins:
        - {number: "1", name: "GND", function: {en: "Ground", de: "Masse"}, type: ground, notes: {en: "Ground on the left: the DS18B20 has supply and ground swapped compared with the LM35, whose supply is on the left.", de: "Masse links: Beim DS18B20 sind Versorgung und Masse gegenüber dem LM35 vertauscht, dessen Versorgung links liegt."}}
        - {number: "2", name: "DQ", function: {en: "1-Wire data input/output, open drain; also supplies the part in parasite-power mode", de: "1-Wire-Datenein-/-ausgang, Open Drain; versorgt den Baustein im Parasite-Power-Betrieb"}, type: data}
        - {number: "3", name: "VDD", function: {en: "Optional supply; tie to ground in parasite-power mode", de: "Optionale Versorgung; im Parasite-Power-Betrieb an Masse legen"}, type: power, notes: {en: "Supply on the right: the opposite of the LM35. Order from the maker's (Dallas) own datasheet; the current Analog Devices datasheet could not be opened.", de: "Versorgung rechts: umgekehrt zum LM35. Reihenfolge aus dem Datenblatt des Herstellers (Dallas); das aktuelle Datenblatt von Analog Devices ließ sich nicht öffnen."}}

