  name: {cs: "SN74HC595 (DIP-16)", da: "SN74HC595 (DIP-16)", de: "SN74HC595 (DIP-16)", el: "SN74HC595 (DIP-16)", en: "SN74HC595 (DIP-16)", es: "SN74HC595 (DIP-16)", fr: "SN74HC595 (DIP-16)", hi: "SN74HC595 (DIP-16)", it: "SN74HC595 (DIP-16)", ja: "SN74HC595 (DIP-16)", nl: "SN74HC595 (DIP-16)", no: "SN74HC595 (DIP-16)", pl: "SN74HC595 (DIP-16)", pt: "SN74HC595 (DIP-16)", sv: "SN74HC595 (DIP-16)", zh: "SN74HC595 (DIP-16)"}
  doc: {en: "8-bit shift register with serial input, a storage register and 3-state parallel outputs, drawn as the 16-pin PDIP from above.", de: "8-Bit-Schieberegister mit seriellem Eingang, Speicherregister und parallelen Tri-State-Ausgängen, gezeichnet als 16-poliges PDIP von oben."}
  notes: {en: "QA is alone on pin 15, on the other side from QB to QH. SRCLK shifts SER in; RCLK copies the shift register to the outputs. To chain chips, feed QH' into SER of the next one.", de: "QA liegt allein auf Pin 15, auf der anderen Seite als QB bis QH. SRCLK schiebt SER ein; RCLK übernimmt das Schieberegister an die Ausgänge. Zum Kaskadieren QH' an SER des nächsten Bausteins legen."}
  tags: ["sn74hc595", "74hc595", "hc595", "595", "shift register", "schieberegister", "latch", "ser", "srclk", "rclk", "srclr", "oe", "dip16", "dip-16"]
