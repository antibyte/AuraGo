  doc: {en: "800 mA low-dropout linear regulator, adjustable or fixed output, TI package NDE, drawn from the front: label side towards you, leads pointing down.", de: "800-mA-Low-Drop-Spannungsregler, einstellbar oder mit fester Ausgangsspannung, TI-Gehäuse NDE, von vorn gezeichnet: Beschriftung zu dir, Anschlüsse nach unten."}
  notes: {en: "The metal tab is connected to pin 2 (OUTPUT), as on the LM317: a heat sink on the tab carries the output voltage. The order is the same as the LM317 (adjust, output, input), not the L78xx (input, ground, output). Pin 1 is the adjust input on the adjustable version and ground on the fixed versions.", de: "Die Metallfahne ist mit Pin 2 (OUTPUT) verbunden, wie beim LM317: Ein Kühlkörper an der Fahne führt die Ausgangsspannung. Die Reihenfolge entspricht dem LM317 (Einstellung, Ausgang, Eingang), nicht dem L78xx (Eingang, Masse, Ausgang). Pin 1 ist bei der einstellbaren Version der Einstelleingang und bei den Festspannungsversionen Masse."}
