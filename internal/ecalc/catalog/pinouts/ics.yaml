  name: {cs: "TO-92: příklady", da: "TO-92: eksempler", de: "TO-92: Beispiele", el: "TO-92: παραδείγματα", en: "TO-92: examples", es: "TO-92: ejemplos", fr: "Exemples TO-92", hi: "TO-92: उदाहरण", it: "TO-92: esempi", ja: "TO-92の例", nl: "TO-92: voorbeelden", no: "TO-92: eksempler", pl: "TO-92: przykłady", pt: "TO-92: exemplos", sv: "TO-92: exempel", zh: "TO-92 示例"}
  doc: {en: "The pin order of a TO-92 part depends on the part, not on the package: this page lists examples only, so check the datasheet of your exact part and maker. Each is drawn from the front, flat side towards you and leads pointing down, and the numbers are positions from left to right.", de: "Die Pin-Reihenfolge eines TO-92-Bauteils hängt vom Bauteil ab, nicht vom Gehäuse: Diese Seite zeigt nur Beispiele, prüfe also das Datenblatt deines genauen Bauteils und Herstellers. Alle sind von vorn gezeichnet, flache Seite zu dir und Anschlüsse nach unten, und die Nummern sind Positionen von links nach rechts."}
  notes: {en: "The PN2222A entry is the plastic TO-92 type from onsemi (formerly Fairchild). It does not apply to the round metal-can 2N2222 (TO-18), whose leads form a triangle, and the similarly named onsemi P2N2222A has collector and emitter swapped: collector left, emitter right. The 78L05 runs the opposite way to the L78xx in TO-220: its input is on the right. TI's table numbers the TL431 leads against the positions used here; see its pin notes.", de: "Der Eintrag PN2222A ist der TO-92-Typ aus Kunststoff von onsemi (früher Fairchild). Er gilt nicht für den runden 2N2222 im Metallgehäuse (TO-18), dessen Anschlüsse ein Dreieck bilden, und beim ähnlich benannten onsemi P2N2222A sind Kollektor und Emitter vertauscht: Kollektor links, Emitter rechts. Der 78L05 läuft umgekehrt zum L78xx im TO-220: Sein Eingang liegt rechts. Die Tabelle von TI nummeriert die Anschlüsse des TL431 gegenläufig zu den Positionen hier; siehe die Pin-Hinweise."}
