  doc: {en: "Adjustable positive voltage regulator, 1.25 V to 37 V, drawn from the front: label side towards you, leads pointing down.", de: "Einstellbarer positiver Spannungsregler, 1,25 V bis 37 V, von vorn gezeichnet: Beschriftung zu dir, Anschlüsse nach unten."}
