    - {number: "10", name: "PB7", function: {en: "Port B bit 7; XTAL2 (oscillator output), TOSC2 (timer oscillator), PCINT7", de: "Port B Bit 7; XTAL2 (Oszillatorausgang), TOSC2 (Timer-Oszillator), PCINT7"}, type: io}
