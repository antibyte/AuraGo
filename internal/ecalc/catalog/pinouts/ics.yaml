  shape:
    type: to
    package: to220
    pins: ["1", "2", "3"]
  pins:
    - {number: "1", name: "ADJ/GND", function: {en: "Adjust input on the adjustable version, ground on the fixed versions", de: "Einstelleingang bei der einstellbaren Version, Masse bei den Festspannungsversionen"}, type: signal}
    - {number: "2", name: "OUTPUT", function: {en: "Regulated output, also on the tab", de: "Geregelter Ausgang, auch an der Metallfahne"}, type: power}
    - {number: "3", name: "INPUT", function: {en: "Unregulated input voltage", de: "Ungeregelte Eingangsspannung"}, type: power}

- id: sot23
  kind: pinout
  category: pinouts
  group: ics
  name: {cs: "SOT-23: příklady", da: "SOT-23: eksempler", de: "SOT-23: Beispiele", el: "SOT-23: παραδείγματα", en: "SOT-23: examples", es: "SOT-23: ejemplos", fr: "Exemples SOT-23", hi: "SOT-23: उदाहरण", it: "SOT-23: esempi", ja: "SOT-23の例", nl: "SOT-23: voorbeelden", no: "SOT-23: eksempler", pl: "SOT-23: przykłady", pt: "SOT-23: exemplos", sv: "SOT-23: exempel", zh: "SOT-23 示例"}
  doc: {en: "The pin order of a SOT-23 part depends on the part, not on the package: this page lists examples only, so check the datasheet of your exact part and maker. Each is drawn from above with the marking side up: pin 1 lower left, pin 2 lower right, pin 3 alone at the top.", de: "Die Pin-Reihenfolge eines SOT-23-Bauteils hängt vom Bauteil ab, nicht vom Gehäuse: Diese Seite zeigt nur Beispiele, prüfe also das Datenblatt deines genauen Bauteils und Herstellers. Alle sind von oben mit der Beschriftung nach oben gezeichnet: Pin 1 unten links, Pin 2 unten rechts, Pin 3 allein oben."}
  notes: {en: "The pin order of a SOT-23 part depends on the part, not on the package: transistors, MOSFETs, diodes and regulators in the same case use different orders. The examples here all have pin 3 alone on one side. The 2N7002 in SOT-23 (gate, source, drain) runs differently from the 2N7000 in TO-92 (source, gate, drain), and the MMBT3904 (base, emitter, collector) differently from the 2N3904 in TO-92 (emitter, base, collector).", de: "Die Pin-Reihenfolge eines SOT-23-Bauteils hängt vom Bauteil ab, nicht vom Gehäuse: Transistoren, MOSFETs, Dioden und Regler im selben Gehäuse haben verschiedene Reihenfolgen. Bei allen Beispielen hier steht Pin 3 allein auf einer Seite. Der 2N7002 im SOT-23 (Gate, Source, Drain) ist anders belegt als der 2N7000 im TO-92 (Source, Gate, Drain), der MMBT3904 (Basis, Emitter, Kollektor) anders als der 2N3904 im TO-92 (Emitter, Basis, Kollektor)."}
  tags: ["sot23", "sot-23", "to-236", "to236", "smd", "transistor", "mosfet", "bc847", "bc846", "bc848", "mmbt3904", "2n7002", "bss84", "npn", "p-channel", "p-kanal", "n-channel", "n-kanal", "base", "basis", "collector", "kollektor", "emitter", "gate", "source", "drain"]
  source: "onsemi BC846ALT1/D Rev. 21 (BC847), MMBT3904LT1/D Rev. 15 (MMBT3904), NDS7002A/D Rev. 11 (2N7002), BSS84/D Rev. 5 (BSS84), case 318 outline ISSUE AU; Diodes Incorporated DS11108 Rev. 28-2 (BC847), DS30036 Rev. 27-2 (MMBT3904), DS11303 Rev. 40-2 (2N7002), DS30149 Rev. 27-2 (BSS84)"
  shape:
    type: to
    package: sot23
    pins: ["1", "2", "3"]
  variants:
    - id: bc847
      name: {en: "BC847", de: "BC847"}
      pins:
        - {number: "1", name: "B", function: {en: "Base", de: "Basis"}, type: signal}
        - {number: "2", name: "E", function: {en: "Emitter", de: "Emitter"}, type: signal}
        - {number: "3", name: "C", function: {en: "Collector", de: "Kollektor"}, type: signal}
    - id: mmbt3904
      name: {en: "MMBT3904", de: "MMBT3904"}
      pins:
        - {number: "1", name: "B", function: {en: "Base", de: "Basis"}, type: signal}
        - {number: "2", name: "E", function: {en: "Emitter", de: "Emitter"}, type: signal}
        - {number: "3", name: "C", function: {en: "Collector", de: "Kollektor"}, type: signal}
    - id: q2n7002
      name: {en: "2N7002", de: "2N7002"}
      pins:
        - {number: "1", name: "G", function: {en: "Gate", de: "Gate"}, type: signal}
        - {number: "2", name: "S", function: {en: "Source of the N-channel MOSFET", de: "Source des N-Kanal-MOSFET"}, type: signal}
        - {number: "3", name: "D", function: {en: "Drain", de: "Drain"}, type: signal}
    - id: bss84
