  doc: {en: "N-channel power MOSFETs IRF540N (100 V) and IRLZ44N (logic level) of Infineon, formerly International Rectifier, drawn from the front: label side towards you, leads pointing down.", de: "N-Kanal-Leistungs-MOSFETs IRF540N (100 V) und IRLZ44N (Logikpegel) von Infineon, früher International Rectifier, von vorn gezeichnet: Beschriftung zu dir, Anschlüsse nach unten."}
