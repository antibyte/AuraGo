# Vehicle and mains connectors: trailer sockets, the Type 2 charging connector and the ISO 10487 radio connector. The sources behind every
# item are in documentation/ecalc-sources/pinouts/vehicle_mains/; a changed pin updates that record, this file and the item's vector together.

- id: trailer_7
  kind: pinout
  category: pinouts
  group: vehicle_mains
  name: {cs: "Zásuvka přívěsu, 7 pinů (ISO 1724, 12N)", da: "Anhængerstik, 7-polet (ISO 1724, 12N)", de: "Anhängersteckdose, 7-polig (ISO 1724, 12N)", el: "Πρίζα ρυμούλκησης, 7 ακίδων (ISO 1724, 12N)", en: "Trailer socket, 7-pin (ISO 1724, 12N)", es: "Toma de remolque, 7 polos (ISO 1724, 12N)", fr: "Prise de remorque, 7 broches (ISO 1724, 12N)", hi: "ट्रेलर सॉकेट, 7-पिन (ISO 1724, 12N)", it: "Presa per rimorchio, 7 poli (ISO 1724, 12N)", ja: "トレーラーソケット 7 ピン (ISO 1724、12N)", nl: "Aanhangerstopcontact, 7-polig (ISO 1724, 12N)", "no": "Tilhengerkontakt, 7-polet (ISO 1724, 12N)", pl: "Gniazdo przyczepy, 7-pinowe (ISO 1724, 12N)", pt: "Tomada de reboque, 7 polos (ISO 1724, 12N)", sv: "Släpvagnskontakt, 7-polig (ISO 1724, 12N)", zh: "挂车插座 7 针 (ISO 1724，12N)"}
  doc: {en: "The 7-pin 12 V trailer socket of ISO 1724 (type N, 12N): direction indicators, brake, tail and fog lights on one common return, drawn from the socket face.", de: "Die siebenpolige 12-V-Anhängersteckdose nach ISO 1724 (Typ N, 12N): Blinker, Brems-, Schluss- und Nebelschlussleuchte mit einer gemeinsamen Masse, gezeichnet von der Steckdosenseite."}
  notes: {en: "Work on mains and vehicle electrics only if you are qualified, and check the actual connector before wiring. This is the 12 V socket of ISO 1724 (12N), not the white 12S socket of ISO 3732, which uses the same contact numbers for other functions. Contact 3 is the common return of all lamps. Contacts 5 and 7 are the two sides of the tail lights, so no lamp may be connected to both. The core colours are given for information. The makers' documents do not show a key position, so none is drawn; the radius of the outer ring is a drawing value, not a dimension from the standard.", de: "Arbeiten an Netz- und Fahrzeugelektrik nur durch Qualifizierte, und vor dem Verdrahten den tatsächlichen Steckverbinder prüfen. Dies ist die 12-V-Steckdose nach ISO 1724 (12N), nicht die weiße 12S-Steckdose nach ISO 3732, die dieselben Kontaktnummern für andere Funktionen nutzt. Kontakt 3 ist die gemeinsame Masse aller Leuchten. Die Kontakte 5 und 7 sind die beiden Seiten der Schlussleuchten, daher darf keine Leuchte an beiden liegen. Die Aderfarben gelten zur Information. Die Herstellerunterlagen zeigen keine Lage der Kodierung, deshalb ist keine gezeichnet; der Radius des äußeren Rings ist ein Zeichenwert, kein Maß aus der Norm."}
  tags: ["trailer", "anhänger", "anhängerkupplung", "towbar", "7-pin", "7-polig", "iso 1724", "iso1724", "12n", "type n", "caravan", "wohnwagen", "blinker", "indicator", "brake", "bremslicht", "nebelschluss", "fog", "din 72552", "din 72577"]
  source: "Erich Jaeger, ISO 1724: The international standard for 7-pin trailer connectors (scope and application, contact table and the figures of socket, rear view and plug); M&K catalogue pages 14 and 15, 7-polige 12-Volt-Steckvorrichtung ISO 1724 / ISO 3732 (Conrad item 808849), Kontaktbelegung Connector N-type"
  views:
    plug: {en: "Trailer plug (pins)", de: "Anhängerstecker (Stifte)"}
    socket: {en: "Vehicle socket (face, cover open)", de: "Fahrzeugsteckdose (Steckseite, Klappe offen)"}
  shape:
    type: circular
    contact: round
    drawn: socket
    positions:
      - {pin: "1", angle: 0, radius: 0.6}
      - {pin: "2", angle: 60, radius: 0.6}
      - {pin: "3", angle: 120, radius: 0.6}
      - {pin: "4", angle: 180, radius: 0.6}
      - {pin: "5", angle: 240, radius: 0.6}
      - {pin: "6", angle: 300, radius: 0.6}
      - {pin: "7", angle: 0, radius: 0}
  pins:
    - {number: "1", name: "L", function: {en: "Left-hand direction indicator", de: "Fahrtrichtungsanzeiger links"}, type: power, wire: yellow}
    - {number: "2", name: "54g", function: {en: "Rear fog light", de: "Nebelschlussleuchte"}, type: power, wire: blue}
    - {number: "3", name: "31", function: {en: "Earth (common return), 2.5 mm²", de: "Masse (gemeinsame Rückleitung), 2,5 mm²"}, type: ground, wire: white}
    - {number: "4", name: "R", function: {en: "Right-hand direction indicator", de: "Fahrtrichtungsanzeiger rechts"}, type: power, wire: green}
    - {number: "5", name: "58R", function: {en: "Right-hand rear position and marker lights, number-plate light", de: "Rechte Schlussleuchte, Umriss- und Begrenzungsleuchte, Kennzeichenleuchte"}, type: power, wire: brown}
    - {number: "6", name: "54", function: {en: "Stop (brake) lights", de: "Bremsleuchten"}, type: power, wire: red}
    - {number: "7", name: "58L", function: {en: "Left-hand rear position and marker lights, number-plate light", de: "Linke Schlussleuchte, Umriss- und Begrenzungsleuchte, Kennzeichenleuchte"}, type: power, wire: black}

- id: trailer_13
  kind: pinout
  category: pinouts
  group: vehicle_mains
  name: {cs: "Zásuvka přívěsu, 13 pinů (ISO 11446)", da: "Anhængerstik, 13-polet (ISO 11446)", de: "Anhängersteckdose, 13-polig (ISO 11446)", el: "Πρίζα ρυμούλκησης, 13 ακίδων (ISO 11446)", en: "Trailer socket, 13-pin (ISO 11446)", es: "Toma de remolque, 13 polos (ISO 11446)", fr: "Prise de remorque, 13 broches (ISO 11446)", hi: "ट्रेलर सॉकेट, 13-पिन (ISO 11446)", it: "Presa per rimorchio, 13 poli (ISO 11446)", ja: "トレーラーソケット 13 ピン (ISO 11446)", nl: "Aanhangerstopcontact, 13-polig (ISO 11446)", "no": "Tilhengerkontakt, 13-polet (ISO 11446)", pl: "Gniazdo przyczepy, 13-pinowe (ISO 11446)", pt: "Tomada de reboque, 13 polos (ISO 11446)", sv: "Släpvagnskontakt, 13-polig (ISO 11446)", zh: "挂车插座 13 针 (ISO 11446)"}
  doc: {en: "The 13-pin 12 V trailer socket of ISO 11446 (Jaeger system): contacts 1 to 7 as on the 7-pin socket, plus reversing light, permanent and ignition-switched supply with their own returns, drawn from the socket face.", de: "Die 13-polige 12-V-Anhängersteckdose nach ISO 11446 (Jaeger-System): Kontakte 1 bis 7 wie an der 7-poligen Steckdose, dazu Rückfahrleuchte, Dauer- und Zündungsplus mit eigenen Rückleitungen, gezeichnet von der Steckdosenseite."}
  notes: {en: "Work on mains and vehicle electrics only if you are qualified, and check the actual connector before wiring. The drawing follows Jaeger's figure and the angles are approximate (within about 7 degrees of the maker's rendering, rounded to a 36 degree pattern); the contact numbers are exact. Contacts 9 (permanent +) and 10 (ignition +) each have their own return, 13 and 11: do not use contact 3 for them. Contact 9 is live with the ignition off; Jaeger states no current rating for 9 and 10. No key is drawn because it rests on a render only. This is the 12 V version; the 24 V version is not covered.", de: "Arbeiten an Netz- und Fahrzeugelektrik nur durch Qualifizierte, und vor dem Verdrahten den tatsächlichen Steckverbinder prüfen. Die Zeichnung folgt der Abbildung von Jaeger, die Winkel sind ungefähr (etwa 7 Grad Abweichung zur Darstellung des Herstellers, gerundet auf ein 36-Grad-Raster); die Kontaktnummern sind exakt. Die Kontakte 9 (Dauerplus) und 10 (Zündungsplus) haben je eine eigene Rückleitung, 13 und 11: Kontakt 3 dafür nicht verwenden. Kontakt 9 führt auch bei ausgeschalteter Zündung Spannung; Jaeger nennt keinen Strom für 9 und 10. Eine Kodierung ist nicht gezeichnet, weil sie nur auf einer Darstellung beruht. Dies ist die 12-V-Version; die 24-V-Version ist nicht erfasst."}
  tags: ["trailer", "anhänger", "anhängerkupplung", "towbar", "13-pin", "13-polig", "iso 11446", "iso11446", "jaeger", "caravan", "wohnwagen", "dauerplus", "zündungsplus", "rückfahrleuchte", "reversing", "permanent", "ignition"]
  source: "Erich Jaeger, ISO 11446 scope and application (contact table, nominal voltage and the figures of socket, rear view and plug); Erich Jaeger, ISO 11446 overview; Erich Jaeger and M&K ISO 1724 tables for contacts 1 to 7"
  views:
