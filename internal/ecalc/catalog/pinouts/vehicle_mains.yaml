    - {number: "2", name: "Rear fog", function: {en: "Rear fog light, 1.5 mm²", de: "Nebelschlussleuchte, 1,5 mm²"}, type: power, wire: blue}
    - {number: "3", name: "GND 1-8", function: {en: "Common return for contacts 1 to 8, 2.5 mm²", de: "Gemeinsame Masse für Kontakte 1 bis 8, 2,5 mm²"}, type: ground, wire: white}
    - {number: "4", name: "Indicator R", function: {en: "Right-hand direction indicator, 1.5 mm²", de: "Fahrtrichtungsanzeiger rechts, 1,5 mm²"}, type: power, wire: green}
    - {number: "5", name: "Tail R", function: {en: "Right-hand rear, position, marker and licence-plate lights, 1.5 mm²", de: "Rechte Schluss-, Begrenzungs-, Umriss- und Kennzeichenleuchte, 1,5 mm²"}, type: power, wire: brown}
    - {number: "6", name: "Brake", function: {en: "Brake lights, 1.5 mm²", de: "Bremsleuchten, 1,5 mm²"}, type: power, wire: red}
    - {number: "7", name: "Tail L", function: {en: "Left-hand rear, position, marker and licence-plate lights, 1.5 mm²", de: "Linke Schluss-, Begrenzungs-, Umriss- und Kennzeichenleuchte, 1,5 mm²"}, type: power, wire: black}
    - {number: "8", name: "Reverse", function: {en: "Reversing light, 1.5 mm²", de: "Rückfahrleuchte, 1,5 mm²"}, type: power, wire: pink}
    - {number: "9", name: "Permanent +", function: {en: "Power supply, steady (permanent), 2.5 mm²; return on 13", de: "Stromversorgung Dauerplus, 2,5 mm²; Rückleitung über 13"}, type: power, wire: orange}
    - {number: "10", name: "Ignition +", function: {en: "Power supply controlled by the ignition switch, 2.5 mm²; return on 11", de: "Stromversorgung über Zündschalter, 2,5 mm²; Rückleitung über 11"}, type: power, wire: grey}
    - {number: "11", name: "GND 10", function: {en: "Common return for contact 10, 2.5 mm²", de: "Masse für Kontakt 10, 2,5 mm²"}, type: ground, notes: {en: "Core colour white/black; the wire colours of the app have no striped white/black.", de: "Aderfarbe weiß/schwarz; die Aderfarben der App kennen kein gestreiftes Weiß/Schwarz."}}
    - {number: "12", name: "Reserved", function: {en: "Reserved for future allocation, no core", de: "Reserviert für künftige Belegung, keine Ader"}, type: nc}
    - {number: "13", name: "GND 9", function: {en: "Common return for contact 9, 2.5 mm²", de: "Masse für Kontakt 9, 2,5 mm²"}, type: ground, notes: {en: "Core colour white/red; the wire colours of the app have no striped white/red.", de: "Aderfarbe weiß/rot; die Aderfarben der App kennen kein gestreiftes Weiß/Rot."}}

- id: type2
  kind: pinout
  category: pinouts
  group: vehicle_mains
  name: {cs: "Nabíjecí konektor Typ 2 (IEC 62196-2)", da: "Ladestik type 2 (IEC 62196-2)", de: "Ladestecker Typ 2 (IEC 62196-2)", el: "Συνδέτης φόρτισης Τύπου 2 (IEC 62196-2)", en: "Charging connector Type 2 (IEC 62196-2)", es: "Conector de carga tipo 2 (IEC 62196-2)", fr: "Connecteur de recharge type 2 (IEC 62196-2)", hi: "चार्जिंग कनेक्टर टाइप 2 (IEC 62196-2)", it: "Connettore di ricarica tipo 2 (IEC 62196-2)", ja: "充電コネクター タイプ 2 (IEC 62196-2)", nl: "Laadstekker type 2 (IEC 62196-2)", "no": "Ladekontakt type 2 (IEC 62196-2)", pl: "Złącze ładowania typu 2 (IEC 62196-2)", pt: "Conector de carregamento tipo 2 (IEC 62196-2)", sv: "Laddkontakt typ 2 (IEC 62196-2)", zh: "充电连接器 Type 2 (IEC 62196-2)"}
  doc: {en: "The Type 2 connector of IEC 62196-2 for AC charging of electric vehicles: five power contacts (PE, N, L1 to L3) and the two signal contacts CP and PP, drawn on the pin face.", de: "Der Typ-2-Steckverbinder nach IEC 62196-2 für das Wechselstromladen von Elektrofahrzeugen: fünf Leistungskontakte (PE, N, L1 bis L3) und die beiden Signalkontakte CP und PP, gezeichnet auf der Stiftseite."}
  notes: {en: "Work on mains and vehicle electrics only if you are qualified, and check the actual connector before wiring. Never bridge CP or PP to fake a vehicle and never apply power outside a charging station. Single-phase cables and inlets use L1 and N only. Contact sequence when plugging in: PE first, then N, the phases, and CP and PP last; unplugging runs in reverse (TE table 4-11). The Rc values of PP follow TE table 4-7 (from IEC 61851-22 Annex B). The voltages and currents in TE's document (250 V AC, 20 A three-phase, 32 A single-phase, 2 A 30 V for CP and PP) are TE's assembly ratings, not the limits of the Type 2 system. CP signalling (the PWM levels) is not covered. The angles are rounded from a small render (about 5 degrees).", de: "Arbeiten an Netz- und Fahrzeugelektrik nur durch Qualifizierte, und vor dem Verdrahten den tatsächlichen Steckverbinder prüfen. CP oder PP nie überbrücken, um ein Fahrzeug vorzutäuschen, und nie außerhalb einer Ladestation Spannung anlegen. Einphasige Kabel und Fahrzeugdosen nutzen nur L1 und N. Reihenfolge beim Stecken: zuerst PE, dann N, die Außenleiter und zuletzt CP und PP; beim Ziehen umgekehrt (TE Tabelle 4-11). Die Rc-Werte von PP folgen TE Tabelle 4-7 (aus IEC 61851-22 Anhang B). Die Spannungen und Ströme in TEs Dokument (250 V AC, 20 A dreiphasig, 32 A einphasig, 2 A 30 V für CP und PP) sind TEs Bemessungswerte für die eigenen Baugruppen, nicht die Grenzen des Typ-2-Systems. Die CP-Signalisierung (die PWM-Pegel) ist nicht erfasst. Die Winkel sind aus einer kleinen Darstellung gerundet (etwa 5 Grad)."}
  tags: ["type 2", "typ 2", "type2", "typ2", "mennekes", "iec 62196", "iec 62196-2", "ev", "ladestecker", "ladekabel", "wallbox", "charging", "laden", "elektroauto", "electric vehicle", "control pilot", "proximity", "cp", "pp", "iec 61851"]
  source: "TE Connectivity, Product Specification 108-94323 Rev A (01 FEB 16), IEC 62196 Electric Vehicle Charge Connector Assembly (Type 2 for Mode 2 and 3), pages 1, 2, 3, 5, 7 and 11 to 13"
  views:
    plug: {en: "Pin face: vehicle inlet or station plug (pins)", de: "Stiftseite: Fahrzeugdose oder Ladestation-Stecker (Stifte)"}
    socket: {en: "Contact-tube face: vehicle connector or wallbox socket-outlet", de: "Buchsenseite: Fahrzeugstecker oder Wallbox-Steckdose"}
  shape:
    type: circular
    contact: round
    drawn: plug
    key: 0
    positions:
      - {pin: "PE", angle: 0, radius: 0}
      - {pin: "CP", angle: 30, radius: 0.55}
      - {pin: "N", angle: 90, radius: 0.55}
      - {pin: "L3", angle: 150, radius: 0.55}
      - {pin: "L2", angle: 210, radius: 0.55}
      - {pin: "L1", angle: 270, radius: 0.55}
      - {pin: "PP", angle: 330, radius: 0.55}
  pins:
    - {number: "PE", name: "PE", function: {en: "Protective earth, centre contact; mates first, breaks last", de: "Schutzleiter, mittlerer Kontakt; schließt zuerst, trennt zuletzt"}, type: ground}
    - {number: "L1", name: "L1", function: {en: "Phase 1 (single-phase charging uses L1 and N)", de: "Außenleiter 1 (einphasiges Laden über L1 und N)"}, type: power}
    - {number: "L2", name: "L2", function: {en: "Phase 2 (three-phase only)", de: "Außenleiter 2 (nur dreiphasig)"}, type: power}
    - {number: "L3", name: "L3", function: {en: "Phase 3 (three-phase only)", de: "Außenleiter 3 (nur dreiphasig)"}, type: power}
    - {number: "N", name: "N", function: {en: "Neutral", de: "Neutralleiter"}, type: power}
    - {number: "CP", name: "CP", function: {en: "Control pilot, signal contact (rated 2 A, 30 V in TE's assembly); connects last when plugging in", de: "Control Pilot, Signalkontakt (Bemessung 2 A, 30 V bei TEs Baugruppe); schließt beim Stecken zuletzt"}, type: signal}
    - {number: "PP", name: "PP", function: {en: "Proximity: resistor Rc to PE in the plug codes the cable's current capacity (13 A 1.5 kΩ, 20 A 680 Ω, 32 A 220 Ω) and shows a plug is present", de: "Proximity: Widerstand Rc nach PE im Stecker codiert die Strombelastbarkeit des Kabels (13 A 1,5 kΩ, 20 A 680 Ω, 32 A 220 Ω) und meldet einen gesteckten Stecker"}, type: signal}

- id: iso10487_a
  kind: pinout
  category: pinouts
  group: vehicle_mains
  name: {cs: "Konektor autorádia ISO 10487, část A (napájení)", da: "Bilradiostik ISO 10487, del A (strøm)", de: "Autoradio-Stecker ISO 10487, Teil A (Versorgung)", el: "Συνδέτης ραδιοφώνου αυτοκινήτου ISO 10487, μέρος A (τροφοδοσία)", en: "Car radio connector ISO 10487, part A (power)", es: "Conector de autorradio ISO 10487, parte A (alimentación)", fr: "Connecteur autoradio ISO 10487, partie A (alimentation)", hi: "कार रेडियो कनेक्टर ISO 10487, भाग A (पावर)", it: "Connettore autoradio ISO 10487, parte A (alimentazione)", ja: "カーラジオコネクター ISO 10487 パート A (電源)", nl: "Autoradioconnector ISO 10487, deel A (voeding)", "no": "Bilradiokontakt ISO 10487, del A (strøm)", pl: "Złącze radia samochodowego ISO 10487, część A (zasilanie)", pt: "Conector de autorrádio ISO 10487, parte A (alimentação)", sv: "Bilradiokontakt ISO 10487, del A (ström)", zh: "车载收音机连接器 ISO 10487，A 部分 (电源)"}
  doc: {en: "Part A of the ISO 10487 car radio connector: battery positive, ground, illumination and the antenna supply, as the standard draws it from the rear of the radio.", de: "Teil A des Autoradio-Steckverbinders nach ISO 10487: Batterie plus, Masse, Beleuchtung und Antennenversorgung, gezeichnet wie in der Norm von der Rückseite des Radios."}
  notes: {en: "Work on mains and vehicle electrics only if you are qualified, and check the actual connector before wiring. The standard makes A7 the main supply (permanent, or switched in the vehicle only when A4 is not switched) and A4 a switched positive of at most 0.3 A, which differs from the common folklore of A4 permanent and A7 ignition: some vehicles and radios use their own split, so measure both contacts in the car before connecting a radio. A5 is an output of the radio for an antenna amplifier (max. 0.3 A), not a supply into the radio. Contacts 9 and 10 do not exist in part A. The standard gives no wire colours.", de: "Arbeiten an Netz- und Fahrzeugelektrik nur durch Qualifizierte, und vor dem Verdrahten den tatsächlichen Steckverbinder prüfen. Die Norm macht A7 zur Hauptversorgung (Dauerplus oder im Fahrzeug nur geschaltet, wenn A4 nicht geschaltet ist) und A4 zu einem geschalteten Plus von höchstens 0,3 A; das weicht von der verbreiteten Faustregel A4 Dauerplus und A7 Zündung ab. Manche Fahrzeuge und Radios haben eine eigene Aufteilung, daher beide Kontakte im Auto nachmessen, bevor ein Radio angeschlossen wird. A5 ist ein Ausgang des Radios für einen Antennenverstärker (max. 0,3 A), keine Versorgung des Radios. Die Kontakte 9 und 10 gibt es in Teil A nicht. Die Norm nennt keine Aderfarben."}
  tags: ["iso 10487", "iso10487", "iso-stecker", "iso connector", "autoradio", "car radio", "radio", "a4", "a7", "dauerplus", "zündungsplus", "permanent", "ignition", "antenne", "antenna", "beleuchtung", "illumination", "radioanschluss", "radio harness", "autoradiostecker"]
  source: "ISO 10487-1:1992, Passenger car radio connections, Part 1: Dimensions and general requirements (official preview with the complete normative text: clauses 3 and 4, figure 1, table 1)"
  views:
    plug: {en: "Radio's connector, rear view (tabs; the standard calls it the socket)", de: "Radio-Anschluss, Rückansicht (Messer; die Norm nennt ihn Buchse)"}
    socket: {en: "Harness plug (receptacles), mating face", de: "Kabelbaum-Stecker (Buchsen), Steckseite"}
  shape:
    type: rows
    outline: rect
    contact: blade
    drawn: plug
    key: left
    rows:
      - {pins: ["1", "3", "5", "7"]}
      - {pins: ["2", "4", "6", "8"]}
  pins:
    - {number: "1", name: "Speed signal", function: {en: "Volume control, vehicle-speed related (input to the radio)", de: "Lautstärkeregelung abhängig von der Fahrzeuggeschwindigkeit (Eingang des Radios)"}, type: signal}
    - {number: "2", name: "GND A1", function: {en: "Ground for A1", de: "Masse für A1"}, type: ground}
    - {number: "3", name: "Reserved", function: {en: "Not allocated (for future application)", de: "Nicht belegt (für künftige Anwendung)"}, type: nc}
    - {number: "4", name: "Batt+ switched", function: {en: "Battery positive, switched in the vehicle only when A7 is not switched; 0.3 A max", de: "Batterie plus, im Fahrzeug nur geschaltet, wenn A7 nicht geschaltet ist; max. 0,3 A"}, type: power}
    - {number: "5", name: "Antenna +", function: {en: "Battery positive switched by the radio for the antenna supply; max 0.3 A (output of the radio)", de: "Batterie plus, vom Radio geschaltet für die Antennenversorgung; max. 0,3 A (Ausgang des Radios)"}, type: power}
    - {number: "6", name: "Illumination", function: {en: "Battery positive for the radio illumination, controlled by the dashboard illumination", de: "Batterie plus für die Radiobeleuchtung, gesteuert von der Armaturenbeleuchtung"}, type: power}
    - {number: "7", name: "Batt+ main", function: {en: "Battery positive for the main power supply: permanent, or switched in the vehicle only when A4 is not switched", de: "Batterie plus für die Hauptversorgung: Dauerplus oder im Fahrzeug nur geschaltet, wenn A4 nicht geschaltet ist"}, type: power}
    - {number: "8", name: "Batt-", function: {en: "Battery negative (ground)", de: "Batterie minus (Masse)"}, type: ground}

- id: iso10487_b
  kind: pinout
