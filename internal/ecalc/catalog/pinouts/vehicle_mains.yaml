  name: {cs: "Konektor autorádia ISO 10487, část B (reproduktory)", da: "Bilradiostik ISO 10487, del B (højttalere)", de: "Autoradio-Stecker ISO 10487, Teil B (Lautsprecher)", el: "Συνδέτης ραδιοφώνου αυτοκινήτου ISO 10487, μέρος B (ηχεία)", en: "Car radio connector ISO 10487, part B (speakers)", es: "Conector de autorradio ISO 10487, parte B (altavoces)", fr: "Connecteur autoradio ISO 10487, partie B (haut-parleurs)", hi: "कार रेडियो कनेक्टर ISO 10487, भाग B (स्पीकर)", it: "Connettore autoradio ISO 10487, parte B (altoparlanti)", ja: "カーラジオコネクター ISO 10487 パート B (スピーカー)", nl: "Autoradioconnector ISO 10487, deel B (luidsprekers)", "no": "Bilradiokontakt ISO 10487, del B (høyttalere)", pl: "Złącze radia samochodowego ISO 10487, część B (głośniki)", pt: "Conector de autorrádio ISO 10487, parte B (altifalantes)", sv: "Bilradiokontakt ISO 10487, del B (högtalare)", zh: "车载收音机连接器 ISO 10487，B 部分 (扬声器)"}
  doc: {en: "Part B of the ISO 10487 car radio connector: the four loudspeaker channels, each with its own positive and negative contact, as the standard draws it from the rear of the radio.", de: "Teil B des Autoradio-Steckverbinders nach ISO 10487: die vier Lautsprecherkanäle mit je einem eigenen Plus- und Minuskontakt, gezeichnet wie in der Norm von der Rückseite des Radios."}
  notes: {en: "Work on mains and vehicle electrics only if you are qualified, and check the actual connector before wiring. Each speaker has its own negative line: never join the negative lines or connect them to ground, because ISO 10487-1 (table 1, footnote 2) does not allow common negative wiring in the vehicle, and a negative line on ground can damage the output stage of a bridged amplifier. Each positive contact sits directly above its negative contact. Contacts 9 and 10 do not exist in part B. The standard gives no wire colours.", de: "Arbeiten an Netz- und Fahrzeugelektrik nur durch Qualifizierte, und vor dem Verdrahten den tatsächlichen Steckverbinder prüfen. Jeder Lautsprecher hat eine eigene Minusleitung: Die Minusleitungen nie verbinden und nie an Masse legen, denn ISO 10487-1 (Tabelle 1, Fußnote 2) erlaubt im Fahrzeug keine gemeinsame Minusleitung, und eine Minusleitung an Masse kann die Endstufe eines Brückenverstärkers beschädigen. Jeder Pluskontakt liegt direkt über seinem Minuskontakt. Die Kontakte 9 und 10 gibt es in Teil B nicht. Die Norm nennt keine Aderfarben."}
