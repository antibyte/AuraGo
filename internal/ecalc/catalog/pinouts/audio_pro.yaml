    - {number: "13", name: "CV", function: {en: "Bus control voltage (internal CV)", de: "Steuerspannung des Busses (interne CV)"}, type: signal}
    - {number: "14", name: "CV", function: {en: "Bus control voltage (internal CV)", de: "Steuerspannung des Busses (interne CV)"}, type: signal}
    - {number: "15", name: "Gate", function: {en: "Bus gate signal (internal gate)", de: "Gate-Signal des Busses (internes Gate)"}, type: signal}
