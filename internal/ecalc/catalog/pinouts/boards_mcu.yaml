- id: esp32_cam
  kind: pinout
  category: pinouts
  group: boards
  name: {cs: "ESP32-CAM", da: "ESP32-CAM", de: "ESP32-CAM", el: "ESP32-CAM", en: "ESP32-CAM", es: "ESP32-CAM", fr: "ESP32-CAM", hi: "ESP32-CAM", it: "ESP32-CAM", ja: "ESP32-CAM", nl: "ESP32-CAM", no: "ESP32-CAM", pl: "ESP32-CAM", pt: "ESP32-CAM", sv: "ESP32-CAM", zh: "ESP32-CAM"}
  doc: {en: "ESP32-CAM (Ai-Thinker ESP-32S module with OV2640 camera) from the side with the camera, the microSD socket and the pin labels, drawn with the microSD socket at the top and the camera connector at the bottom. The board has no USB socket. Numbers P1 and P2 follow a copy of the board schematic (Rev 1.6).", de: "ESP32-CAM (Ai-Thinker-Modul ESP-32S mit OV2640-Kamera) von der Seite mit Kamera, microSD-Buchse und Pin-Beschriftung, gezeichnet mit der microSD-Buchse oben und dem Kameraanschluss unten. Die Platine hat keine USB-Buchse. Die Nummern P1 und P2 folgen einer Kopie des Platinen-Schaltplans (Rev 1.6)."}
  notes: {en: "No maker document: Ai-Thinker's own pages and files could not be opened, so the layout comes from two independent sources (pinout figures of two tutorial sites, confirmed by a copy of the board schematic) and the signal functions from Espressif (ESP32 datasheet, arduino-esp32 camera pin map AI_THINKER). Clones may differ; check the silk screen. All GPIOs are 3.3 V logic. Feed the board through 5V; the 3V3 pin is the regulator output, and VCC is an output too (3.3 V, or 5 V when the 0 Ω link is moved). The camera uses GPIO0 (XCLK), 5, 18, 19, 21, 22, 23, 25, 26, 27, 32, 34, 35, 36 and 39. The microSD card uses GPIO2, 4, 12, 13, 14 and 15, which are on the headers; GPIO4 also drives the white flash LED, and the red LED is on GPIO33. GPIO16 is the chip select of the PSRAM, GPIO17 its clock. GPIO0, GPIO2, GPIO12 and GPIO15 are strapping pins. Programming needs a USB-serial adapter on U0R and U0T with GPIO0 pulled to GND at reset.", de: "Kein Herstellerdokument: Ai-Thinkers eigene Seiten und Dateien ließen sich nicht öffnen, daher stammt das Layout aus zwei unabhängigen Quellen (Pinout-Abbildungen zweier Tutorial-Seiten, bestätigt durch eine Kopie des Platinen-Schaltplans) und die Signalfunktionen von Espressif (ESP32-Datenblatt, Kamera-Pinbelegung AI_THINKER im arduino-esp32). Klone können abweichen; mit dem Aufdruck vergleichen. Alle GPIOs sind 3,3-V-Logik. Die Platine über 5V speisen; der Pin 3V3 ist der Reglerausgang, und auch VCC ist ein Ausgang (3,3 V, oder 5 V, wenn die 0-Ω-Brücke umgesetzt wird). Die Kamera belegt GPIO0 (XCLK), 5, 18, 19, 21, 22, 23, 25, 26, 27, 32, 34, 35, 36 und 39. Die microSD-Karte belegt GPIO2, 4, 12, 13, 14 und 15, die an den Leisten liegen; GPIO4 steuert auch die weiße Blitz-LED, die rote LED hängt an GPIO33. GPIO16 ist die Chipauswahl des PSRAM, GPIO17 sein Takt. GPIO0, GPIO2, GPIO12 und GPIO15 sind Strapping-Pins. Zum Programmieren braucht man einen USB-Seriell-Adapter an U0R und U0T mit GPIO0 gegen GND beim Reset."}
  tags: ["esp32-cam", "esp32cam", "cam", "ai-thinker", "ai thinker", "esp-32s", "ov2640", "camera", "kamera", "microsd", "sd card", "psram", "flash led", "wifi", "gpio", "gpio16", "gpio0", "strapping", "u0r", "u0t", "stiftleiste", "belegung", "pinout"]
  source: "Espressif, ESP32 Series Datasheet v5.3; Espressif, arduino-esp32 camera_pins.h (CAMERA_MODEL_AI_THINKER); schematic ESP32_CAM Rev 1.6 (copy hosted by Seeed Studio); Random Nerd Tutorials, ESP32-CAM AI-Thinker Pinout Guide; Last Minute Engineers, ESP32-CAM Pinout Reference; no Ai-Thinker document could be opened"
  shape:
    type: board
    connector: none
    left: ["P2.8", "P2.7", "P2.6", "P2.5", "P2.4", "P2.3", "P2.2", "P2.1"]
    right: ["P1.8", "P1.7", "P1.6", "P1.5", "P1.4", "P1.3", "P1.2", "P1.1"]
  pins:
    - {number: "P2.8", name: "5V", function: {en: "5 V supply input to the 3.3 V regulator (AMS1117)", de: "5-V-Versorgungseingang zum 3,3-V-Regler (AMS1117)"}, type: power}
    - {number: "P2.7", name: "GND", function: {en: "Ground", de: "Masse"}, type: ground}
    - {number: "P2.6", name: "GPIO12", function: {en: "microSD DATA2 (HS2_DATA2); strapping pin MTDI (flash voltage) — keep low at boot", de: "microSD DATA2 (HS2_DATA2); Strapping-Pin MTDI (Flash-Spannung) — beim Start low halten"}, type: io}
    - {number: "P2.5", name: "GPIO13", function: {en: "microSD DATA3 (HS2_DATA3)", de: "microSD DATA3 (HS2_DATA3)"}, type: io}
    - {number: "P2.4", name: "GPIO15", function: {en: "microSD CMD (HS2_CMD); strapping pin MTDO", de: "microSD CMD (HS2_CMD); Strapping-Pin MTDO"}, type: io}
    - {number: "P2.3", name: "GPIO14", function: {en: "microSD CLK (HS2_CLK)", de: "microSD CLK (HS2_CLK)"}, type: io}
    - {number: "P2.2", name: "GPIO2", function: {en: "microSD DATA0 (HS2_DATA0); strapping pin (boot mode)", de: "microSD DATA0 (HS2_DATA0); Strapping-Pin (Boot-Modus)"}, type: io}
    - {number: "P2.1", name: "GPIO4", function: {en: "microSD DATA1 (HS2_DATA1); drives the white flash LED", de: "microSD DATA1 (HS2_DATA1); steuert die weiße Blitz-LED"}, type: io}
    - {number: "P1.8", name: "3V3", function: {en: "3.3 V rail (regulator output)", de: "3,3-V-Schiene (Reglerausgang)"}, type: power}
    - {number: "P1.7", name: "GPIO16", function: {en: "PSRAM chip select; U2RXD — not free while PSRAM is used", de: "PSRAM-Chipauswahl; U2RXD — nicht frei, solange PSRAM genutzt wird"}, type: data, notes: {en: "GPIO16 is the chip select of the PSRAM, so it is not free while the PSRAM is used.", de: "GPIO16 ist die Chipauswahl des PSRAM und daher nicht frei, solange der PSRAM genutzt wird."}}
    - {number: "P1.6", name: "GPIO0", function: {en: "Camera XCLK; boot-mode strapping pin, 10 kΩ pull-up — low at reset = flash mode", de: "Kamera-XCLK; Boot-Strapping-Pin, 10-kΩ-Pull-up — low beim Reset = Flash-Modus"}, type: signal}
    - {number: "P1.5", name: "GND", function: {en: "Ground", de: "Masse"}, type: ground}
    - {number: "P1.4", name: "VCC", function: {en: "Supply output, 3.3 V (default) or 5 V, set by a 0 Ω link", de: "Versorgungsausgang, 3,3 V (Standard) oder 5 V, per 0-Ω-Brücke"}, type: power}
    - {number: "P1.3", name: "GPIO3", function: {en: "UART0 RX (U0RXD), for programming (silk U0R)", de: "UART0 RX (U0RXD), zum Programmieren (Aufdruck U0R)"}, type: io}
    - {number: "P1.2", name: "GPIO1", function: {en: "UART0 TX (U0TXD), for programming (silk U0T)", de: "UART0 TX (U0TXD), zum Programmieren (Aufdruck U0T)"}, type: io}
    - {number: "P1.1", name: "GND", function: {en: "Ground", de: "Masse"}, type: ground}

- id: blue_pill
  kind: pinout
  category: pinouts
  group: boards
  name: {cs: "Blue Pill (STM32F103C8)", da: "Blue Pill (STM32F103C8)", de: "Blue Pill (STM32F103C8)", el: "Blue Pill (STM32F103C8)", en: "Blue Pill (STM32F103C8)", es: "Blue Pill (STM32F103C8)", fr: "Blue Pill (STM32F103C8)", hi: "Blue Pill (STM32F103C8)", it: "Blue Pill (STM32F103C8)", ja: "Blue Pill (STM32F103C8)", nl: "Blue Pill (STM32F103C8)", no: "Blue Pill (STM32F103C8)", pl: "Blue Pill (STM32F103C8)", pt: "Blue Pill (STM32F103C8)", sv: "Blue Pill (STM32F103C8)", zh: "Blue Pill (STM32F103C8)"}
  doc: {en: "STM32F103C8 Blue Pill from the component side (MCU, crystal, reset button), drawn with the Micro-USB socket at the top. The 4-pin SWD header, which sits at the bottom edge of the real board, is shown as a block in the middle of the drawing. The board carries no header names; H1 (right column) and H2 (left column) and the SWD header follow stm32-base.org, and pin 1 of each is at the SWD end.", de: "STM32F103C8 Blue Pill von der Bauteilseite (MCU, Quarz, Reset-Taster), gezeichnet mit der Micro-USB-Buchse oben. Die 4-polige SWD-Leiste, die auf der echten Platine am unteren Rand sitzt, ist als Block in der Mitte der Zeichnung dargestellt. Die Platine trägt keine Leistennamen; H1 (rechte Reihe), H2 (linke Reihe) und die SWD-Leiste folgen stm32-base.org, Pin 1 jeweils am SWD-Ende."}
  notes: {en: "There is no official maker of the Blue Pill: it is a clone board, and the layout comes from two independent sources (stm32-base.org and the Zephyr Project's figure), the pin functions from ST's STM32F103x8/xB datasheet. Clones differ: regulator (RT9193-33 or TX6211B), USB D+ pull-up (4.7 kΩ or 10 kΩ instead of 1.5 kΩ) and sometimes the chip itself; compare with the silk screen. The chip runs at 2.0 to 3.6 V. Pins marked 5 V tolerant take 5 V; all others, among them PA0 to PA7, PB0, PB1, PB5 and PC13 to PC15, must never see 5 V. PB5 is the one pin of its neighbours that is not 5 V tolerant. PC13 to PC15 sink or source 3 mA at 2 MHz only. PB3, PB4 and PA15 start as JTAG pins. The 5V pin is tied to USB VBUS without protection: do not feed it while USB is plugged in. BOOT0 and BOOT1 are jumpers, not header pins.", de: "Es gibt keinen offiziellen Hersteller des Blue Pill: Es ist eine Klon-Platine, das Layout stammt aus zwei unabhängigen Quellen (stm32-base.org und die Abbildung des Zephyr Project), die Pinfunktionen aus ST's Datenblatt STM32F103x8/xB. Klone unterscheiden sich: Regler (RT9193-33 oder TX6211B), USB-D+-Pull-up (4,7 kΩ oder 10 kΩ statt 1,5 kΩ) und manchmal der Chip selbst; mit dem Aufdruck vergleichen. Der Chip läuft mit 2,0 bis 3,6 V. Als 5-V-tolerant markierte Pins vertragen 5 V; alle anderen, darunter PA0 bis PA7, PB0, PB1, PB5 und PC13 bis PC15, dürfen nie 5 V sehen. PB5 ist der einzige Pin unter seinen Nachbarn, der nicht 5-V-tolerant ist. PC13 bis PC15 liefern oder senken nur 3 mA bei 2 MHz. PB3, PB4 und PA15 starten als JTAG-Pins. Der Pin 5V liegt ohne Schutz an USB-VBUS: nicht einspeisen, solange USB steckt. BOOT0 und BOOT1 sind Brücken, keine Leistenpins."}
  tags: ["blue pill", "bluepill", "stm32", "stm32f103", "stm32f103c8", "stm32f103c8t6", "cortex-m3", "swd", "jtag", "st-link", "clone", "gpio", "pc13", "pb5", "5v tolerant", "5v-tolerant", "usb", "adc", "uart", "spi", "i2c", "stiftleiste", "belegung", "pinout"]
  source: "STMicroelectronics, STM32F103x8 STM32F103xB datasheet, DocID13587 Rev 16; stm32-base.org, STM32F103C8T6 Blue Pill board page; Zephyr Project, STM32 Minimum Development Board pinout figure; VCC-GND Studio, STM32F103C8T6 core board schematic"
