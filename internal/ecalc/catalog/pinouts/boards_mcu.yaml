  pins:
    - {number: "J1.1", name: "3V3", function: {en: "3.3 V supply (LDO output, or input)", de: "3,3-V-Versorgung (LDO-Ausgang oder Eingang)"}, type: power}
    - {number: "J1.2", name: "3V3", function: {en: "3.3 V supply (LDO output, or input)", de: "3,3-V-Versorgung (LDO-Ausgang oder Eingang)"}, type: power}
    - {number: "J1.3", name: "RST", function: {en: "EN (CHIP_PU); low resets; RESET button", de: "EN (CHIP_PU); low setzt zurück; RESET-Taster"}, type: signal}
    - {number: "J1.4", name: "GPIO4", function: {en: "TOUCH4; ADC1_CH3 (RTC_GPIO4)", de: "TOUCH4; ADC1_CH3 (RTC_GPIO4)"}, type: io}
    - {number: "J1.5", name: "GPIO5", function: {en: "TOUCH5; ADC1_CH4 (RTC_GPIO5)", de: "TOUCH5; ADC1_CH4 (RTC_GPIO5)"}, type: io}
    - {number: "J1.6", name: "GPIO6", function: {en: "TOUCH6; ADC1_CH5 (RTC_GPIO6)", de: "TOUCH6; ADC1_CH5 (RTC_GPIO6)"}, type: io}
    - {number: "J1.7", name: "GPIO7", function: {en: "TOUCH7; ADC1_CH6 (RTC_GPIO7)", de: "TOUCH7; ADC1_CH6 (RTC_GPIO7)"}, type: io}
    - {number: "J1.8", name: "GPIO15", function: {en: "U0RTS; ADC2_CH4; XTAL_32K_P", de: "U0RTS; ADC2_CH4; XTAL_32K_P"}, type: io}
    - {number: "J1.9", name: "GPIO16", function: {en: "U0CTS; ADC2_CH5; XTAL_32K_N", de: "U0CTS; ADC2_CH5; XTAL_32K_N"}, type: io}
    - {number: "J1.10", name: "GPIO17", function: {en: "U1TXD; ADC2_CH6", de: "U1TXD; ADC2_CH6"}, type: io}
    - {number: "J1.11", name: "GPIO18", function: {en: "U1RXD; ADC2_CH7; CLK_OUT3", de: "U1RXD; ADC2_CH7; CLK_OUT3"}, type: io}
