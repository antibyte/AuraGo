- id: esp32_s3_devkitc1
  kind: pinout
  category: pinouts
  group: boards
  name: {cs: "ESP32-S3-DevKitC-1", da: "ESP32-S3-DevKitC-1", de: "ESP32-S3-DevKitC-1", el: "ESP32-S3-DevKitC-1", en: "ESP32-S3-DevKitC-1", es: "ESP32-S3-DevKitC-1", fr: "ESP32-S3-DevKitC-1", hi: "ESP32-S3-DevKitC-1", it: "ESP32-S3-DevKitC-1", ja: "ESP32-S3-DevKitC-1", nl: "ESP32-S3-DevKitC-1", no: "ESP32-S3-DevKitC-1", pl: "ESP32-S3-DevKitC-1", pt: "ESP32-S3-DevKitC-1", sv: "ESP32-S3-DevKitC-1", zh: "ESP32-S3-DevKitC-1"}
  doc: {en: "ESP32-S3-DevKitC-1 v1.1 from the component side, drawn with the two Micro-USB sockets at the top (UART socket at the right, USB socket at the left), so the module and antenna are at the bottom; Espressif's own figure shows the board the other way up. Numbers are the headers J1 and J3 of Espressif's user guide.", de: "ESP32-S3-DevKitC-1 v1.1 von der Bauteilseite, gezeichnet mit den zwei Micro-USB-Buchsen oben (UART-Buchse rechts, USB-Buchse links), Modul und Antenne also unten; Espressifs eigene Abbildung zeigt die Platine umgekehrt. Die Nummern sind die Stiftleisten J1 und J3 aus Espressifs Handbuch."}
  notes: {en: "All GPIOs are 3.3 V logic (inputs take VDD plus 0.3 V at most). GPIO0, GPIO3, GPIO45 and GPIO46 are strapping pins, read at reset, so a circuit on them can change how the board starts: GPIO0 and GPIO46 set the boot mode (the BOOT button is on GPIO0), GPIO45 the flash voltage VDD_SPI, GPIO3 the JTAG source. GPIO35, GPIO36 and GPIO37 are used by the Octal flash or PSRAM on the variants sold now and are not available there. GPIO19 and GPIO20 also go to the second Micro-USB socket (the chip's USB). The RGB LED is on GPIO38 on v1.1. Power the board from one source only (a USB socket, the 5V pin or the 3V3 pins); each USB socket reaches the 5V rail through its own diode.", de: "Alle GPIOs sind 3,3-V-Logik (Eingänge vertragen höchstens VDD plus 0,3 V). GPIO0, GPIO3, GPIO45 und GPIO46 sind Strapping-Pins, die beim Reset gelesen werden; eine Schaltung daran kann das Startverhalten ändern: GPIO0 und GPIO46 legen den Boot-Modus fest (der BOOT-Taster liegt an GPIO0), GPIO45 die Flash-Spannung VDD_SPI, GPIO3 die JTAG-Quelle. GPIO35, GPIO36 und GPIO37 gehören bei den heute verkauften Varianten dem Octal-Flash oder -PSRAM und sind dort nicht verfügbar. GPIO19 und GPIO20 gehen auch an die zweite Micro-USB-Buchse (das USB des Chips). Die RGB-LED liegt bei v1.1 an GPIO38. Nur aus einer Quelle versorgen (eine USB-Buchse, der Pin 5V oder die 3V3-Pins); jede USB-Buchse erreicht die 5V-Schiene über eine eigene Diode."}
  tags: ["esp32-s3", "esp32s3", "s3", "devkitc-1", "devkitc", "espressif", "wifi", "ble", "gpio", "strapping", "boot", "octal", "psram", "rgb led", "usb", "jtag", "touch", "adc", "i2c", "spi", "uart", "stiftleiste", "belegung", "pinout"]
  source: "Espressif, ESP32-S3-DevKitC-1 v1.1 User Guide with pin layout figure and annotated photo; Espressif, schematic ESP32-S3-DevKitC-1 V1.1; Espressif, ESP32-S3 Series Datasheet v2.2"
  shape:
    type: board
    connector: top
    left: ["J3.22", "J3.21", "J3.20", "J3.19", "J3.18", "J3.17", "J3.16", "J3.15", "J3.14", "J3.13", "J3.12", "J3.11", "J3.10", "J3.9", "J3.8", "J3.7", "J3.6", "J3.5", "J3.4", "J3.3", "J3.2", "J3.1"]
