    - {number: "J1.13", name: "5V", function: {en: "5 V supply (USB 5 V behind a Schottky diode, or input)", de: "5-V-Versorgung (USB-5 V hinter Schottky-Diode, oder Eingang)"}, type: power}
    - {number: "J1.14", name: "5V", function: {en: "5 V supply (USB 5 V behind a Schottky diode, or input)", de: "5-V-Versorgung (USB-5 V hinter Schottky-Diode, oder Eingang)"}, type: power}
    - {number: "J1.15", name: "GND", function: {en: "Ground", de: "Masse"}, type: ground}
    - {number: "J3.1", name: "GND", function: {en: "Ground", de: "Masse"}, type: ground}
