    - {number: "J1.10", name: "GPIO1", function: {en: "ADC1_CH1; XTAL_32K_N (silk 1)", de: "ADC1_CH1; XTAL_32K_N (Aufdruck 1)"}, type: io}
    - {number: "J1.11", name: "GPIO10", function: {en: "FSPICS0 (silk 10)", de: "FSPICS0 (Aufdruck 10)"}, type: io}
