    - {number: "J3.6", name: "GPIO8", function: {en: "Strapping pin; RGB LED data, 10 kΩ pull-up (silk 8)", de: "Strapping-Pin; RGB-LED-Daten, 10-kΩ-Pull-up (Aufdruck 8)"}, type: io, notes: {en: "Strapping pin, read at reset: must be high for download mode. It also carries the RGB LED data, with a 10 kΩ pull-up.", de: "Strapping-Pin, wird beim Reset gelesen: muss für den Download-Modus high sein. Er führt außerdem die Daten der RGB-LED, mit 10-kΩ-Pull-up."}}
