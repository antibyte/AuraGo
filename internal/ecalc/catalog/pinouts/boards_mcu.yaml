# a changed pin updates that record, this file and the item's vector together.

- id: wemos_d1_mini
  kind: pinout
  category: pinouts
  group: boards
  name: {cs: "WEMOS D1 mini", da: "WEMOS D1 mini", de: "WEMOS D1 mini", el: "WEMOS D1 mini", en: "WEMOS D1 mini", es: "WEMOS D1 mini", fr: "WEMOS D1 mini", hi: "WEMOS D1 mini", it: "WEMOS D1 mini", ja: "WEMOS D1 mini", nl: "WEMOS D1 mini", no: "WEMOS D1 mini", pl: "WEMOS D1 mini", pt: "WEMOS D1 mini", sv: "WEMOS D1 mini", zh: "WEMOS D1 mini"}
  doc: {en: "WEMOS D1 mini (V3 and V4, same positions) from the component side, drawn with the USB socket at the top, so the antenna is at the bottom; WEMOS's own figure shows the board the other way up. Numbers are the headers J2 and J3 of the V4.0.0 schematic, pin 1 of both at the antenna end.", de: "WEMOS D1 mini (V3 und V4, gleiche Positionen) von der Bauteilseite, gezeichnet mit der USB-Buchse oben, die Antenne also unten; WEMOS' eigene Abbildung zeigt die Platine umgekehrt. Die Nummern sind die Stiftleisten J2 und J3 des V4.0.0-Schaltplans, Pin 1 beider am Antennenende."}
  notes: {en: "All I/O pins run at 3.3 V and are not 5 V tolerant (the chip takes 3.6 V at most, an output 12 mA). D3 (GPIO0) and D4 (GPIO2) have a pull-up and D8 (GPIO15) a pull-down on the board; both schematics (V3.0.0 and V4.0.0) show 12 kΩ, while the V3.1.0 pin table says 10k. These three pins select the boot mode at reset, and TX must not be pulled low during power-up. A0 takes 0 to 3.2 V. D0 (GPIO16) has no interrupt, PWM or I2C and wakes the chip from deep sleep when it is linked to RST. The positions are the same on V3 and V4, the 5V pin is not: on V3 it is the 5 V rail behind a diode and a 0.5 A fuse from USB, on V4 it is USB VBUS directly, with no diode or fuse, so feeding 5 V into it while USB is plugged in drives the USB port. The V4 also has a 4-pin I2C socket, not drawn. Clones exist; compare with the silk screen.", de: "Alle I/O-Pins laufen mit 3,3 V und sind nicht 5-V-tolerant (der Chip verträgt höchstens 3,6 V, ein Ausgang 12 mA). D3 (GPIO0) und D4 (GPIO2) haben einen Pull-up, D8 (GPIO15) einen Pull-down auf der Platine; beide Schaltpläne (V3.0.0 und V4.0.0) zeigen 12 kΩ, die Pin-Tabelle der V3.1.0 nennt 10k. Diese drei Pins wählen beim Reset den Boot-Modus, und TX darf beim Einschalten nicht nach low gezogen werden. A0 nimmt 0 bis 3,2 V. D0 (GPIO16) hat keinen Interrupt, kein PWM und kein I2C und weckt den Chip aus dem Deep Sleep, wenn er mit RST verbunden ist. Die Positionen sind bei V3 und V4 gleich, der 5V-Pin nicht: Bei V3 ist er die 5-V-Schiene hinter einer Diode und einer 0,5-A-Sicherung vom USB, bei V4 liegt er direkt an USB-VBUS, ohne Diode und Sicherung; speist man 5 V ein, während USB steckt, treibt man die USB-Buchse. Die V4 hat außerdem eine 4-polige I2C-Buchse, nicht gezeichnet. Es gibt Klone; mit dem Aufdruck vergleichen."}
  tags: ["wemos", "lolin", "d1 mini", "d1mini", "esp8266", "esp-12", "wifi", "gpio", "d0", "d1", "d8", "gpio16", "strapping", "boot", "a0", "adc", "vbus", "5v", "i2c", "spi", "stiftleiste", "belegung", "pinout"]
  source: "WEMOS/LOLIN D1 mini board pages V4.0.0 and V3.1.0 with pinout figure and board photo; WEMOS/LOLIN schematics D1 mini V4.0.0 and V3.0.0; Espressif, ESP8266EX Datasheet v7.1"
  shape:
    type: board
    connector: top
    left: ["J3.8", "J3.7", "J3.6", "J3.5", "J3.4", "J3.3", "J3.2", "J3.1"]
    right: ["J2.8", "J2.7", "J2.6", "J2.5", "J2.4", "J2.3", "J2.2", "J2.1"]
  pins:
    - {number: "J2.1", name: "RST", function: {en: "Reset, active low; reset button", de: "Reset, low-aktiv; Reset-Taster"}, type: signal}
    - {number: "J2.2", name: "A0", function: {en: "Analog input 0–3.2 V (220 k/100 k divider to the ADC TOUT)", de: "Analogeingang 0–3,2 V (Teiler 220 k/100 k zum ADC TOUT)"}, type: signal}
    - {number: "J2.3", name: "D0", function: {en: "GPIO16; no interrupt, PWM, I2C or one-wire; deep-sleep wake (jumper to RST)", de: "GPIO16; kein Interrupt, PWM, I2C oder One-Wire; Deep-Sleep-Wecken (Brücke zu RST)"}, type: io}
    - {number: "J2.4", name: "D5", function: {en: "GPIO14; SPI SCK", de: "GPIO14; SPI SCK"}, type: io}
    - {number: "J2.5", name: "D6", function: {en: "GPIO12; SPI MISO", de: "GPIO12; SPI MISO"}, type: io}
    - {number: "J2.6", name: "D7", function: {en: "GPIO13; SPI MOSI", de: "GPIO13; SPI MOSI"}, type: io}
    - {number: "J2.7", name: "D8", function: {en: "GPIO15; SPI SS; 12 kΩ pull-down on the board; boot-mode pin", de: "GPIO15; SPI SS; 12-kΩ-Pull-down auf der Platine; Boot-Modus-Pin"}, type: io}
    - {number: "J2.8", name: "3V3", function: {en: "3.3 V output of the on-board regulator", de: "3,3-V-Ausgang des Reglers auf der Platine"}, type: power}
    - {number: "J3.1", name: "TX", function: {en: "UART0 TX (GPIO1); to the USB-serial chip", de: "UART0 TX (GPIO1); zum USB-Seriell-Chip"}, type: io}
    - {number: "J3.2", name: "RX", function: {en: "UART0 RX (GPIO3); from the USB-serial chip", de: "UART0 RX (GPIO3); vom USB-Seriell-Chip"}, type: io}
    - {number: "J3.3", name: "D1", function: {en: "GPIO5; I2C SCL", de: "GPIO5; I2C SCL"}, type: io}
    - {number: "J3.4", name: "D2", function: {en: "GPIO4; I2C SDA", de: "GPIO4; I2C SDA"}, type: io}
    - {number: "J3.5", name: "D3", function: {en: "GPIO0; 12 kΩ pull-up on the board; boot-mode pin", de: "GPIO0; 12-kΩ-Pull-up auf der Platine; Boot-Modus-Pin"}, type: io}
    - {number: "J3.6", name: "D4", function: {en: "GPIO2; 12 kΩ pull-up; on-board LED (active low); boot-mode pin", de: "GPIO2; 12-kΩ-Pull-up; LED auf der Platine (low-aktiv); Boot-Modus-Pin"}, type: io}
    - {number: "J3.7", name: "GND", function: {en: "Ground", de: "Masse"}, type: ground}
    - {number: "J3.8", name: "5V", function: {en: "USB 5 V (V4.0.0: VBUS, direct; V3: through diode and 0.5 A fuse)", de: "USB-5 V (V4.0.0: VBUS, direkt; V3: über Diode und 0,5-A-Sicherung)"}, type: power, notes: {en: "V4: this pin is USB VBUS directly, with no diode or fuse (V3: 5 V behind a diode and a 0.5 A fuse). Feeding 5 V into it while USB is plugged in drives the USB port.", de: "V4: Dieser Pin liegt direkt an USB-VBUS, ohne Diode und Sicherung (V3: 5 V hinter Diode und 0,5-A-Sicherung). Speist man 5 V ein, während USB steckt, treibt man die USB-Buchse."}}

- id: esp32_c3_devkitm1
  kind: pinout
  category: pinouts
  group: boards
  name: {cs: "ESP32-C3-DevKitM-1", da: "ESP32-C3-DevKitM-1", de: "ESP32-C3-DevKitM-1", el: "ESP32-C3-DevKitM-1", en: "ESP32-C3-DevKitM-1", es: "ESP32-C3-DevKitM-1", fr: "ESP32-C3-DevKitM-1", hi: "ESP32-C3-DevKitM-1", it: "ESP32-C3-DevKitM-1", ja: "ESP32-C3-DevKitM-1", nl: "ESP32-C3-DevKitM-1", no: "ESP32-C3-DevKitM-1", pl: "ESP32-C3-DevKitM-1", pt: "ESP32-C3-DevKitM-1", sv: "ESP32-C3-DevKitM-1", zh: "ESP32-C3-DevKitM-1"}
  doc: {en: "ESP32-C3-DevKitM-1 V1 from the component side, drawn with the Micro-USB socket at the top, so the module and antenna are at the bottom; Espressif's own figure shows the board the other way up. Numbers are the headers J1 and J3 of Espressif's user guide.", de: "ESP32-C3-DevKitM-1 V1 von der Bauteilseite, gezeichnet mit der Micro-USB-Buchse oben, Modul und Antenne also unten; Espressifs eigene Abbildung zeigt die Platine umgekehrt. Die Nummern sind die Stiftleisten J1 und J3 aus Espressifs Handbuch."}
  notes: {en: "All GPIOs are 3.3 V only (inputs take VDD plus 0.3 V at most). GPIO2, GPIO8 and GPIO9 are strapping pins, read at reset, so a circuit on them can change how the board starts; GPIO9 low with GPIO8 high enters download mode, which is what the BOOT button does. GPIO8 also drives the RGB LED. GPIO18 and GPIO19 are the chip's own USB pins; the Micro-USB socket of this board goes to the USB-UART bridge on GPIO20 and GPIO21, not to them. The SPI flash is inside the module and not on the headers. Power the board from one source only (Micro-USB, the 5V pins or the 3V3 pins); the 5V pins sit behind a Schottky diode from USB.", de: "Alle GPIOs sind nur 3,3 V (Eingänge vertragen höchstens VDD plus 0,3 V). GPIO2, GPIO8 und GPIO9 sind Strapping-Pins, die beim Reset gelesen werden; eine Schaltung daran kann das Startverhalten ändern. GPIO9 low bei GPIO8 high startet den Download-Modus, das tut der BOOT-Taster. GPIO8 steuert außerdem die RGB-LED. GPIO18 und GPIO19 sind die eigenen USB-Pins des Chips; die Micro-USB-Buchse dieser Platine führt zur USB-UART-Brücke an GPIO20 und GPIO21, nicht zu ihnen. Der SPI-Flash steckt im Modul und liegt nicht an den Leisten. Nur aus einer Quelle versorgen (Micro-USB, die 5V-Pins oder die 3V3-Pins); die 5V-Pins liegen hinter einer Schottky-Diode vom USB."}
  tags: ["esp32-c3", "esp32c3", "c3", "devkitm", "devkitm-1", "espressif", "risc-v", "wifi", "ble", "gpio", "strapping", "boot", "rgb led", "usb", "jtag", "adc", "i2c", "spi", "uart", "stiftleiste", "belegung", "pinout"]
  source: "Espressif, ESP32-C3-DevKitM-1 User Guide with pin layout figure and annotated photo; Espressif, schematic ESP32-C3-DevKitM-1 V1.0; Espressif, ESP32-C3 Series Datasheet v2.5"
  shape:
    type: board
    connector: top
    left: ["J3.15", "J3.14", "J3.13", "J3.12", "J3.11", "J3.10", "J3.9", "J3.8", "J3.7", "J3.6", "J3.5", "J3.4", "J3.3", "J3.2", "J3.1"]
    right: ["J1.15", "J1.14", "J1.13", "J1.12", "J1.11", "J1.10", "J1.9", "J1.8", "J1.7", "J1.6", "J1.5", "J1.4", "J1.3", "J1.2", "J1.1"]
  pins:
    - {number: "J1.1", name: "GND", function: {en: "Ground", de: "Masse"}, type: ground}
    - {number: "J1.2", name: "3V3", function: {en: "3.3 V supply (LDO output, or input)", de: "3,3-V-Versorgung (LDO-Ausgang oder Eingang)"}, type: power}
    - {number: "J1.3", name: "3V3", function: {en: "3.3 V supply (LDO output, or input)", de: "3,3-V-Versorgung (LDO-Ausgang oder Eingang)"}, type: power}
    - {number: "J1.4", name: "GPIO2", function: {en: "ADC1_CH2; FSPIQ; strapping pin (silk 2)", de: "ADC1_CH2; FSPIQ; Strapping-Pin (Aufdruck 2)"}, type: io, notes: {en: "Strapping pin, read at reset. The datasheet says it does not decide between SPI and download boot, but recommends pulling it up.", de: "Strapping-Pin, wird beim Reset gelesen. Laut Datenblatt entscheidet er nicht zwischen SPI- und Download-Boot, ein Pull-up wird aber empfohlen."}}
    - {number: "J1.5", name: "GPIO3", function: {en: "ADC1_CH3 (silk 3)", de: "ADC1_CH3 (Aufdruck 3)"}, type: io}
