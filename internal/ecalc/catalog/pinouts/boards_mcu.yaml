    - {number: "J3.9", name: "GPIO6", function: {en: "FSPICLK; JTAG MTCK (silk 6)", de: "FSPICLK; JTAG MTCK (Aufdruck 6)"}, type: io}
    - {number: "J3.10", name: "GPIO5", function: {en: "ADC2_CH0; FSPIWP; JTAG MTDI (silk 5)", de: "ADC2_CH0; FSPIWP; JTAG MTDI (Aufdruck 5)"}, type: io}
