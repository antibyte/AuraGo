      - {en: "Inductor colour codes are maker and military conventions; IEC 60062 only covers resistors. Values are in µH.", de: "Spulen-Farbcodes sind Hersteller- und Militärkonventionen; IEC 60062 gilt nur für Widerstände. Werte in µH."}
