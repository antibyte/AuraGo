      - {en: "Without the wide silver band (EIA style), gold in the third band means ×0.1 and silver ×0.01.", de: "Ohne breiten Silberring (EIA-Art) bedeutet Gold im dritten Ring ×0,1 und Silber ×0,01."}
      - {en: "Only gold (±5 %) and silver (±10 %) are decoded as tolerance; other tolerance colours are not cross-checked in the sources.", de: "Als Toleranz werden nur Gold (±5 %) und Silber (±10 %) gelesen; andere Toleranzfarben sind in den Quellen nicht abgesichert."}
