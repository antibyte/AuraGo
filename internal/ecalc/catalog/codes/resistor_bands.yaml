- id: resistor_color_code
  kind: code
  category: codes
  code: resistor_bands
  name: {cs: "Barevný kód rezistorů", da: "Farvekode for modstande", de: "Widerstands-Farbcode", el: "Χρωματικός κώδικας αντιστάσεων", en: "Resistor colour code", es: "Código de colores de resistencias", fr: "Code couleur des résistances", hi: "प्रतिरोधक रंग कोड", it: "Codice colori dei resistori", ja: "抵抗のカラーコード", nl: "Kleurcode voor weerstanden", no: "Fargekode for motstander", pl: "Kod kolorów rezystorów", pt: "Código de cores de resistores", sv: "Färgkod för motstånd", zh: "电阻色环代码"}
  doc: {en: "Colour bands of resistors per IEC 60062: 3 to 6 bands read and written in both directions (two or three significant figures, multiplier, tolerance and temperature coefficient). Writing a value picks the nearest standard value of the series that fits the tolerance.", de: "Farbringe von Widerständen nach IEC 60062: 3 bis 6 Ringe lesen und schreiben (zwei oder drei signifikante Stellen, Multiplikator, Toleranz und Temperaturkoeffizient). Beim Schreiben eines Werts wird der nächste Normwert der zur Toleranz passenden Reihe gewählt."}
  tags: ["resistor", "widerstand", "colour code", "color code", "farbcode", "bands", "ringe", "iec 60062", "tolerance", "toleranz", "tcr"]
  source: "IEC 60062:2016 (marking codes for resistors and capacitors) with COR1:2016 and AMD1:2019, Table 1; the older tolerance colours from the resistor colour-code notes of Panasonic and TT Electronics; E-series from IEC 60063"
  data:
    colors:
      - {id: "black", iec: "BK", hex: "#000000", name: {cs: "černá", da: "sort", de: "schwarz", el: "μαύρο", en: "black", es: "negro", fr: "noir", hi: "काला", it: "nero", ja: "黒", nl: "zwart", no: "svart", pl: "czarny", pt: "preto", sv: "svart", zh: "黑色"}, digit: 0, exp: 0, tcr: 250}
      - {id: "brown", iec: "BN", hex: "#8B4513", name: {cs: "hnědá", da: "brun", de: "braun", el: "καφέ", en: "brown", es: "marrón", fr: "marron", hi: "भूरा", it: "marrone", ja: "茶", nl: "bruin", no: "brun", pl: "brązowy", pt: "marrom", sv: "brun", zh: "棕色"}, digit: 1, exp: 1, tol: 1, tcr: 100}
      - {id: "red", iec: "RD", hex: "#D62828", name: {cs: "červená", da: "rød", de: "rot", el: "κόκκινο", en: "red", es: "rojo", fr: "rouge", hi: "लाल", it: "rosso", ja: "赤", nl: "rood", no: "rød", pl: "czerwony", pt: "vermelho", sv: "röd", zh: "红色"}, digit: 2, exp: 2, tol: 2, tcr: 50}
      - {id: "orange", iec: "OG", hex: "#F77F00", name: {cs: "oranžová", da: "orange", de: "orange", el: "πορτοκαλί", en: "orange", es: "naranja", fr: "orange", hi: "नारंगी", it: "arancione", ja: "橙", nl: "oranje", no: "oransje", pl: "pomarańczowy", pt: "laranja", sv: "orange", zh: "橙色"}, digit: 3, exp: 3, tol: 0.05, tcr: 15, legacy_tol_none: true}
      - {id: "yellow", iec: "YE", hex: "#FCD116", name: {cs: "žlutá", da: "gul", de: "gelb", el: "κίτρινο", en: "yellow", es: "amarillo", fr: "jaune", hi: "पीला", it: "giallo", ja: "黄", nl: "geel", no: "gul", pl: "żółty", pt: "amarelo", sv: "gul", zh: "黄色"}, digit: 4, exp: 4, tol: 0.02, tcr: 25, legacy_tol_none: true}
      - {id: "green", iec: "GN", hex: "#2E9E3E", name: {cs: "zelená", da: "grøn", de: "grün", el: "πράσινο", en: "green", es: "verde", fr: "vert", hi: "हरा", it: "verde", ja: "緑", nl: "groen", no: "grønn", pl: "zielony", pt: "verde", sv: "grön", zh: "绿色"}, digit: 5, exp: 5, tol: 0.5, tcr: 20}
      - {id: "blue", iec: "BU", hex: "#1F5FD6", name: {cs: "modrá", da: "blå", de: "blau", el: "μπλε", en: "blue", es: "azul", fr: "bleu", hi: "नीला", it: "blu", ja: "青", nl: "blauw", no: "blå", pl: "niebieski", pt: "azul", sv: "blå", zh: "蓝色"}, digit: 6, exp: 6, tol: 0.25, tcr: 10}
      - {id: "violet", iec: "VT", hex: "#7B2CBF", name: {cs: "fialová", da: "violet", de: "violett", el: "βιολετί", en: "violet", es: "violeta", fr: "violet", hi: "बैंगनी", it: "viola", ja: "紫", nl: "violet", no: "fiolett", pl: "fioletowy", pt: "violeta", sv: "violett", zh: "紫色"}, digit: 7, exp: 7, tol: 0.1, tcr: 5}
      - {id: "grey", iec: "GY", hex: "#8C8C8C", name: {cs: "šedá", da: "grå", de: "grau", el: "γκρι", en: "grey", es: "gris", fr: "gris", hi: "स्लेटी", it: "grigio", ja: "灰", nl: "grijs", no: "grå", pl: "szary", pt: "cinza", sv: "grå", zh: "灰色"}, digit: 8, exp: 8, tol: 0.01, tcr: 1, legacy_tol: 0.05}
      - {id: "white", iec: "WH", hex: "#FFFFFF", name: {cs: "bílá", da: "hvid", de: "weiß", el: "λευκό", en: "white", es: "blanco", fr: "blanc", hi: "सफ़ेद", it: "bianco", ja: "白", nl: "wit", no: "hvit", pl: "biały", pt: "branco", sv: "vit", zh: "白色"}, digit: 9, exp: 9}
      - {id: "gold", iec: "GD", hex: "#CFA93A", name: {cs: "zlatá", da: "guld", de: "gold", el: "χρυσό", en: "gold", es: "dorado", fr: "or", hi: "सुनहरा", it: "oro", ja: "金", nl: "goud", no: "gull", pl: "złoty", pt: "dourado", sv: "guld", zh: "金色"}, exp: -1, tol: 5}
      - {id: "silver", iec: "SR", hex: "#C0C0C0", name: {cs: "stříbrná", da: "sølv", de: "silber", el: "ασημί", en: "silver", es: "plateado", fr: "argent", hi: "रुपहला", it: "argento", ja: "銀", nl: "zilver", no: "sølv", pl: "srebrny", pt: "prateado", sv: "silver", zh: "银色"}, exp: -2, tol: 10}
      - {id: "pink", iec: "PK", hex: "#FF8FB1", name: {cs: "růžová", da: "lyserød", de: "rosa", el: "ροζ", en: "pink", es: "rosa", fr: "rose", hi: "गुलाबी", it: "rosa", ja: "ピンク", nl: "roze", no: "rosa", pl: "różowy", pt: "rosa", sv: "rosa", zh: "粉红色"}, exp: -3}
      - {id: "none", hex: "transparent", name: {cs: "bez proužku", da: "ingen ring", de: "kein Ring", el: "χωρίς δακτύλιο", en: "no band", es: "sin banda", fr: "sans anneau", hi: "कोई पट्टी नहीं", it: "nessuna fascia", ja: "帯なし", nl: "geen ring", no: "ingen ring", pl: "brak paska", pt: "sem faixa", sv: "ingen ring", zh: "无色环"}, tol: 20}
    layouts:
      - {bands: 3, roles: ["digit", "digit", "multiplier"]}
      - {bands: 4, roles: ["digit", "digit", "multiplier", "tolerance"]}
      - {bands: 5, roles: ["digit", "digit", "digit", "multiplier", "tolerance"]}
      - {bands: 6, roles: ["digit", "digit", "digit", "multiplier", "tolerance", "tcr"]}
    notes:
      - {en: "Read from the end where the bands start; the tolerance band is at least 1.5 times as wide as the others (IEC 60062, corrigendum 2016). Gold, silver and pink never stand first.", de: "Lesen ab dem Ende, an dem die Ringe beginnen; der Toleranzring ist mindestens 1,5-mal so breit wie die anderen (IEC 60062, Berichtigung 2016). Gold, Silber und Rosa stehen nie an erster Stelle."}
      - {en: "Older charts use grey = ±0.05 % and give orange and yellow no tolerance; IEC 60062:2016 uses grey ±0.01 %, orange ±0.05 % and yellow ±0.02 %. Check the datasheet of precision resistors.", de: "Ältere Tabellen verwenden Grau = ±0,05 % und geben Orange und Gelb keine Toleranz; IEC 60062:2016 verwendet Grau ±0,01 %, Orange ±0,05 % und Gelb ±0,02 %. Bei Präzisionswiderständen das Datenblatt prüfen."}
      - {en: "Pink (×0.001) is new in IEC 60062:2016 for very low resistances.", de: "Rosa (×0,001) ist seit IEC 60062:2016 neu, für sehr kleine Widerstandswerte."}
      - {en: "A single black band marks a zero-ohm jumper.", de: "Ein einzelner schwarzer Ring kennzeichnet eine Null-Ohm-Brücke."}
      - {en: "The temperature coefficient band only exists together with three significant figures (six bands).", de: "Den Temperaturkoeffizient-Ring gibt es nur zusammen mit drei signifikanten Stellen (sechs Ringe)."}
      - {en: "Displayed colours are illustrations only.", de: "Die angezeigten Farben sind nur Illustrationen."}
