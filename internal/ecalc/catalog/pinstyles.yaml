# The colours of the pinout drawings. They are data and not theme tokens: a pin type must read the same on every skin
# (several skins have near-monochrome palettes) and a red supply rail is red on any desktop.
#   types: the six pin types; `ink` is the text colour on `hex` (contrast at least 4.5, checked at load).
#   wires: the standard wire colours (T568, ATX, servo, Qwiic, ...); `stripe` is the second colour of a striped wire.
