  power:
    hex: "#c62828"
    ink: "#ffffff"
    name: {cs: "Napájení", da: "Forsyning", de: "Versorgung", el: "Τροφοδοσία", en: "Power", es: "Alimentación", fr: "Alimentation", hi: "पावर", it: "Alimentazione", ja: "電源", nl: "Voeding", no: "Forsyning", pl: "Zasilanie", pt: "Alimentação", sv: "Matning", zh: "电源"}
