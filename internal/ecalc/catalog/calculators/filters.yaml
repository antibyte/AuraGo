# Filter calculators. Every name is written in all 16 desktop locales; docs, variable names and warnings in English
# and German (other languages fall back to English). Rules are written out for every direction, in the order the
# solver tries them: the first alternative whose variables are all known wins.

- id: rc_lowpass
  kind: calculator
  category: filters
  name: {cs: "RC dolní propust", da: "RC-lavpasfilter", de: "RC-Tiefpass", el: "Βαθυπερατό φίλτρο RC", en: "RC low-pass filter", es: "Filtro paso bajo RC", fr: "Filtre passe-bas RC", hi: "आरसी निम्न-पास फ़िल्टर", it: "Filtro passa-basso RC", ja: "RCローパスフィルタ", nl: "RC-laagdoorlaatfilter", no: "RC-lavpassfilter", pl: "Filtr dolnoprzepustowy RC", pt: "Filtro passa-baixo RC", sv: "RC-lågpassfilter", zh: "RC低通滤波器"}
  doc:
    en: "A first-order RC low-pass passes low frequencies and attenuates high ones. Cutoff frequency (−3 dB point): f_c = 1 / (2π × R × C). At the test frequency f the amplitude ratio is A_v = 1 / √(1 + (f / f_c)²), the gain is G = 20 × log10(A_v) and the output phase is φ = −arctan(f / f_c) (the output lags). Above f_c the gain falls by 20 dB per decade. Example with the defaults: 10 kΩ and 10 nF give f_c ≈ 1.59 kHz; at 1 kHz the output is 84.7 % of the input (−1.45 dB) and lags by 32.1°. The formulas assume an unloaded output (load resistance much larger than R) and an ideal source."
    de: "Ein RC-Tiefpass erster Ordnung lässt tiefe Frequenzen durch und dämpft hohe. Grenzfrequenz (−3-dB-Punkt): f_c = 1 / (2π · R · C). Bei der Testfrequenz f ist das Amplitudenverhältnis A_v = 1 / √(1 + (f / f_c)²), die Verstärkung G = 20 · log10(A_v) und die Phase φ = −arctan(f / f_c) (der Ausgang eilt nach). Oberhalb von f_c fällt die Verstärkung um 20 dB pro Dekade. Beispiel mit den Standardwerten: 10 kΩ und 10 nF ergeben f_c ≈ 1,59 kHz; bei 1 kHz beträgt die Ausgangsspannung 84,7 % der Eingangsspannung (−1,45 dB) bei 32,1° Nacheilung. Die Formeln gelten für einen unbelasteten Ausgang (Lastwiderstand viel größer als R) und eine ideale Quelle."
  tags: [rc, low-pass, lowpass, filter, cutoff, corner frequency, 3 db, first order, time constant, tiefpass, grenzfrequenz, eckfrequenz, zeitkonstante, filter erster ordnung]
  source: "First-order RC low-pass: f_c = 1/(2πRC), |H| = 1/√(1+(f/f_c)²), φ = −arctan(f/f_c); P. Horowitz, W. Hill: The Art of Electronics, 3rd ed., ch. 1 (RC filters)"
  vars:
    r: {dim: resistance, label: R, name: {en: "Resistor", de: "Widerstand"}, default: "10k", eseries: true}
    c: {dim: capacitance, label: C, name: {en: "Capacitor", de: "Kondensator"}, default: "10n", eseries: true}
    fc: {dim: frequency, label: f_c, name: {en: "Cutoff frequency (−3 dB)", de: "Grenzfrequenz (−3 dB)"}}
    f: {dim: frequency, label: f, name: {en: "Test frequency", de: "Testfrequenz"}, default: "1k"}
  dof: 3
  rules:
    fc: ["1/(2*pi*r*c)"]
    r: ["1/(2*pi*fc*c)"]
    c: ["1/(2*pi*fc*r)"]
  derived:
    tau: {dim: time, label: τ, name: {en: "Time constant R × C", de: "Zeitkonstante R · C"}, expr: "r*c", units: [""]}
    av: {dim: ratio, label: A_v, name: {en: "Amplitude ratio at f", de: "Amplitudenverhältnis bei f"}, expr: "1/sqrt(1+(f/fc)^2)", unit: pct, units: [pct, ""]}
    gain: {dim: gain, label: G, name: {en: "Gain at f", de: "Verstärkung bei f"}, expr: "20*log10(av)"}
    phase: {dim: angle, label: φ, name: {en: "Phase at f", de: "Phase bei f"}, expr: "-atan(f/fc)", unit: deg, units: [deg, ""]}
  formula: ["fc = 1 / (2 * pi * r * c)", "av = 1 / sqrt(1 + (f / fc)^2)", "gain = 20 * log10(av)", "phase = -atan(f / fc)"]
  schematic: rc_lowpass

- id: rc_highpass
  kind: calculator
  category: filters
  name: {cs: "RC horní propust", da: "RC-højpasfilter", de: "RC-Hochpass", el: "Υψιπερατό φίλτρο RC", en: "RC high-pass filter", es: "Filtro paso alto RC", fr: "Filtre passe-haut RC", hi: "आरसी उच्च-पास फ़िल्टर", it: "Filtro passa-alto RC", ja: "RCハイパスフィルタ", nl: "RC-hoogdoorlaatfilter", no: "RC-høypassfilter", pl: "Filtr górnoprzepustowy RC", pt: "Filtro passa-alto RC", sv: "RC-högpassfilter", zh: "RC高通滤波器"}
  doc:
    en: "A first-order RC high-pass blocks low frequencies and passes high ones (a coupling capacitor with the input resistance behind it). Cutoff frequency (−3 dB point): f_c = 1 / (2π × R × C). At the test frequency f the amplitude ratio is A_v = (f / f_c) / √(1 + (f / f_c)²), the gain is G = 20 × log10(A_v) and the output leads the input by φ = arctan(f_c / f). Below f_c the gain falls by 20 dB per decade. Example with the defaults: 10 kΩ and 100 nF give f_c ≈ 159 Hz; at 100 Hz the output is 53.2 % of the input (−5.48 dB) and leads by 57.9°. The formulas assume an ideal source and an unloaded output."
    de: "Ein RC-Hochpass erster Ordnung sperrt tiefe Frequenzen und lässt hohe durch (ein Koppelkondensator mit dem Eingangswiderstand dahinter). Grenzfrequenz (−3-dB-Punkt): f_c = 1 / (2π · R · C). Bei der Testfrequenz f ist das Amplitudenverhältnis A_v = (f / f_c) / √(1 + (f / f_c)²), die Verstärkung G = 20 · log10(A_v) und der Ausgang eilt dem Eingang um φ = arctan(f_c / f) voraus. Unterhalb von f_c fällt die Verstärkung um 20 dB pro Dekade. Beispiel mit den Standardwerten: 10 kΩ und 100 nF ergeben f_c ≈ 159 Hz; bei 100 Hz beträgt die Ausgangsspannung 53,2 % der Eingangsspannung (−5,48 dB) bei 57,9° Voreilung. Die Formeln gelten für eine ideale Quelle und einen unbelasteten Ausgang."
  tags: [rc, high-pass, highpass, filter, cutoff, corner frequency, 3 db, coupling capacitor, first order, hochpass, grenzfrequenz, eckfrequenz, koppelkondensator, filter erster ordnung]
  source: "First-order RC high-pass: f_c = 1/(2πRC), |H| = (f/f_c)/√(1+(f/f_c)²), φ = arctan(f_c/f); P. Horowitz, W. Hill: The Art of Electronics, 3rd ed., ch. 1 (RC filters)"
  vars:
    r: {dim: resistance, label: R, name: {en: "Resistor", de: "Widerstand"}, default: "10k", eseries: true}
    c: {dim: capacitance, label: C, name: {en: "Capacitor", de: "Kondensator"}, default: "100n", eseries: true}
    fc: {dim: frequency, label: f_c, name: {en: "Cutoff frequency (−3 dB)", de: "Grenzfrequenz (−3 dB)"}}
    f: {dim: frequency, label: f, name: {en: "Test frequency", de: "Testfrequenz"}, default: "100"}
  dof: 3
  rules:
    fc: ["1/(2*pi*r*c)"]
    r: ["1/(2*pi*fc*c)"]
    c: ["1/(2*pi*fc*r)"]
  derived:
    tau: {dim: time, label: τ, name: {en: "Time constant R × C", de: "Zeitkonstante R · C"}, expr: "r*c", units: [""]}
    av: {dim: ratio, label: A_v, name: {en: "Amplitude ratio at f", de: "Amplitudenverhältnis bei f"}, expr: "(f/fc)/sqrt(1+(f/fc)^2)", unit: pct, units: [pct, ""]}
    gain: {dim: gain, label: G, name: {en: "Gain at f", de: "Verstärkung bei f"}, expr: "20*log10(av)"}
    phase: {dim: angle, label: φ, name: {en: "Phase at f", de: "Phase bei f"}, expr: "atan(fc/f)", unit: deg, units: [deg, ""]}
  formula: ["fc = 1 / (2 * pi * r * c)", "av = (f / fc) / sqrt(1 + (f / fc)^2)", "gain = 20 * log10(av)", "phase = atan(fc / f)"]
  schematic: rc_highpass

- id: lc_resonance
  kind: calculator
  category: filters
  name: {cs: "Rezonanční obvod LC", da: "LC-svingningskreds", de: "LC-Schwingkreis", el: "Συντονισμός LC", en: "LC resonance", es: "Resonancia LC", fr: "Circuit résonant LC", hi: "एलसी अनुनाद", it: "Risonanza LC", ja: "LC共振回路", nl: "LC-resonantie", no: "LC-resonans", pl: "Rezonans LC", pt: "Ressonância LC", sv: "LC-resonans", zh: "LC谐振"}
  doc:
    en: "An ideal LC circuit resonates at the Thomson frequency f_0 = 1 / (2π × √(L × C)); there the reactances are equal, X_L = X_C = √(L / C) = Z_0, the characteristic impedance. Enter any two of L, C and f_0. Example with the defaults: 100 µH and 1 nF resonate at about 503 kHz (medium-wave band) with Z_0 ≈ 316 Ω. Real coils and capacitors have losses; the RLC calculator gives the quality factor and the bandwidth."
    de: "Ein idealer LC-Kreis schwingt mit der Thomson-Frequenz f_0 = 1 / (2π · √(L · C)); dort sind die Blindwiderstände gleich groß, X_L = X_C = √(L / C) = Z_0, der Kennwiderstand. Zwei der drei Größen L, C und f_0 eingeben. Beispiel mit den Standardwerten: 100 µH und 1 nF schwingen bei etwa 503 kHz (Mittelwellenbereich) mit Z_0 ≈ 316 Ω. Reale Spulen und Kondensatoren haben Verluste; Güte und Bandbreite liefert der RLC-Rechner."
  tags: [lc, resonance, resonant circuit, tank, thomson, oscillator, characteristic impedance, resonanz, schwingkreis, resonanzfrequenz, kennwiderstand, parallelschwingkreis]
  source: "Thomson's resonance formula f_0 = 1/(2π√(LC)) and Z_0 = √(L/C); P. Horowitz, W. Hill: The Art of Electronics, 3rd ed., ch. 1 (resonant circuits); C. K. Alexander, M. N. O. Sadiku: Fundamentals of Electric Circuits, ch. 14 (frequency response, resonance)"
  vars:
    l: {dim: inductance, label: L, name: {en: "Inductor", de: "Spule"}, default: "100µ", eseries: true}
    c: {dim: capacitance, label: C, name: {en: "Capacitor", de: "Kondensator"}, default: "1n", eseries: true}
    f0: {dim: frequency, label: f_0, name: {en: "Resonant frequency", de: "Resonanzfrequenz"}}
  dof: 2
  rules:
    f0: ["1/(2*pi*sqrt(l*c))"]
    l: ["1/((2*pi*f0)^2*c)"]
    c: ["1/((2*pi*f0)^2*l)"]
  derived:
    z0: {dim: resistance, label: Z_0, name: {en: "Characteristic impedance √(L/C)", de: "Kennwiderstand √(L/C)"}, expr: "sqrt(l/c)"}
  formula: ["f0 = 1 / (2 * pi * sqrt(l * c))", "z0 = sqrt(l / c)"]
  schematic: lc_resonance

- id: rlc_q_bandwidth
  kind: calculator
  category: filters
  name: {cs: "Obvod RLC: činitel jakosti a šířka pásma", da: "RLC-kreds: Q-faktor og båndbredde", de: "RLC-Kreis: Güte und Bandbreite", el: "Κύκλωμα RLC: συντελεστής Q και εύρος ζώνης", en: "RLC circuit: Q and bandwidth", es: "Circuito RLC: factor Q y ancho de banda", fr: "Circuit RLC : facteur de qualité et bande passante", hi: "आरएलसी परिपथ: Q गुणांक और बैंडविड्थ", it: "Circuito RLC: fattore Q e larghezza di banda", ja: "RLC回路のQ値と帯域幅", nl: "RLC-kring: Q-factor en bandbreedte", no: "RLC-krets: Q-faktor og båndbredde", pl: "Obwód RLC: dobroć i szerokość pasma", pt: "Circuito RLC: fator Q e largura de banda", sv: "RLC-krets: Q-värde och bandbredd", zh: "RLC电路的Q值与带宽"}
  doc:
    en: "Resonance of a series or a parallel RLC circuit. Both resonate at f_0 = 1 / (2π × √(L × C)). The quality factor is Q = √(L / C) / R for a series circuit (R in series with L and C) and Q = R / √(L / C) for a parallel circuit (R in parallel with L and C, for example a load); the −3 dB bandwidth is BW = f_0 / Q. In the formula the exponent s is +1 for the series and −1 for the parallel circuit. Enter three of the six values; the calculator solves the rest when they determine it (f_0, Q and BW alone do not, because BW = f_0 / Q). Example with the defaults (series circuit): R = 10 Ω, L = 100 µH and C = 1 nF give f_0 ≈ 503 kHz, Q ≈ 31.6 and BW ≈ 15.9 kHz (= R / (2π × L)). For the parallel circuit enter the parallel resistance, for example 10 kΩ, which gives the same Q and BW. A Q below 1 means that the bandwidth is larger than f_0."
    de: "Resonanz eines Reihen- oder Parallel-RLC-Kreises. Beide schwingen bei f_0 = 1 / (2π · √(L · C)). Die Güte ist Q = √(L / C) / R beim Reihenkreis (R in Reihe mit L und C) und Q = R / √(L / C) beim Parallelkreis (R parallel zu L und C, zum Beispiel eine Last); die −3-dB-Bandbreite ist BW = f_0 / Q. In der Formel ist der Exponent s gleich +1 beim Reihen- und −1 beim Parallelkreis. Drei der sechs Werte eingeben; der Rechner bestimmt den Rest, wenn sie ihn festlegen (f_0, Q und BW allein tun das nicht, weil BW = f_0 / Q gilt). Beispiel mit den Standardwerten (Reihenkreis): R = 10 Ω, L = 100 µH und C = 1 nF ergeben f_0 ≈ 503 kHz, Q ≈ 31,6 und BW ≈ 15,9 kHz (= R / (2π · L)). Beim Parallelkreis den Parallelwiderstand eingeben, zum Beispiel 10 kΩ; das ergibt dieselbe Güte und Bandbreite. Ein Q unter 1 bedeutet, dass die Bandbreite größer als f_0 ist."
  tags: [rlc, resonance, quality factor, q factor, q, bandwidth, series resonance, parallel resonance, selectivity, güte, gütefaktor, bandbreite, reihenresonanz, parallelresonanz, schwingkreis, selektivität]
  source: "Series and parallel RLC resonance: f_0 = 1/(2π√(LC)); series Q = √(L/C)/R, parallel Q = R/√(L/C), BW = f_0/Q; C. K. Alexander, M. N. O. Sadiku: Fundamentals of Electric Circuits, ch. 14 (series and parallel resonance); P. Horowitz, W. Hill: The Art of Electronics, 3rd ed., ch. 1"
  vars:
    r: {dim: resistance, label: R, name: {en: "Resistance", de: "Widerstand"}, default: "10", eseries: true}
    l: {dim: inductance, label: L, name: {en: "Inductor", de: "Spule"}, default: "100µ", eseries: true}
    c: {dim: capacitance, label: C, name: {en: "Capacitor", de: "Kondensator"}, default: "1n", eseries: true}
    f0: {dim: frequency, label: f_0, name: {en: "Resonant frequency", de: "Resonanzfrequenz"}}
    q: {dim: number, label: Q, name: {en: "Quality factor", de: "Güte"}}
    bw: {dim: frequency, label: BW, name: {en: "Bandwidth (−3 dB)", de: "Bandbreite (−3 dB)"}}
  choices:
    circuit:
      name: {cs: "Zapojení", da: "Kobling", de: "Schaltung", el: "Συνδεσμολογία", en: "Circuit", es: "Circuito", fr: "Montage", hi: "परिपथ", it: "Circuito", ja: "回路", nl: "Schakeling", no: "Kobling", pl: "Układ", pt: "Circuito", sv: "Koppling", zh: "电路"}
      default: series
      options:
        series:
          name: {cs: "Sériový", da: "Serie", de: "Reihe", el: "Σε σειρά", en: "Series", es: "Serie", fr: "Série", hi: "श्रेणी", it: "Serie", ja: "直列", nl: "Serie", no: "Serie", pl: "Szeregowy", pt: "Série", sv: "Serie", zh: "串联"}
          consts: {s: 1}
        parallel:
          name: {cs: "Paralelní", da: "Parallel", de: "Parallel", el: "Παράλληλο", en: "Parallel", es: "Paralelo", fr: "Parallèle", hi: "समानांतर", it: "Parallelo", ja: "並列", nl: "Parallel", no: "Parallell", pl: "Równoległy", pt: "Paralelo", sv: "Parallell", zh: "并联"}
          consts: {s: -1}
  dof: 3
  rules:
    f0: ["1/(2*pi*sqrt(l*c))", "bw*q"]
    q: ["(sqrt(l/c)/r)^s", "f0/bw"]
    bw: ["f0/q"]
    l: ["1/((2*pi*f0)^2*c)", "c*(r*q^s)^2", "r*q^s/(2*pi*f0)"]
    c: ["1/((2*pi*f0)^2*l)", "l/(r*q^s)^2", "1/(2*pi*f0*r*q^s)"]
    r: ["sqrt(l/c)/q^s"]
  checks:
    - {when: "q < 1", warn: {en: "Q is below 1: the bandwidth is larger than the resonant frequency, the circuit is hardly selective. (For a parallel circuit R is the resistance across the tank.)", de: "Q liegt unter 1: Die Bandbreite ist größer als die Resonanzfrequenz, der Kreis ist kaum selektiv. (Beim Parallelkreis ist R der Widerstand parallel zum Schwingkreis.)"}}
  formula: ["f0 = 1 / (2 * pi * sqrt(l * c))", "q = (sqrt(l / c) / r)^s", "bw = f0 / q"]
  schematic: rlc_q_bandwidth

- id: sallen_key_lowpass
  kind: calculator
  category: filters
  name: {cs: "Sallen-Key dolní propust (zesílení 1)", da: "Sallen-Key-lavpasfilter (forstærkning 1)", de: "Sallen-Key-Tiefpass (Verstärkung 1)", el: "Βαθυπερατό φίλτρο Sallen-Key (κέρδος 1)", en: "Sallen-Key low-pass (unity gain)", es: "Filtro paso bajo Sallen-Key (ganancia 1)", fr: "Filtre passe-bas Sallen-Key (gain unitaire)", hi: "सैलन-की निम्न-पास फ़िल्टर (इकाई लब्धि)", it: "Filtro passa-basso Sallen-Key (guadagno unitario)", ja: "サレンキー・ローパスフィルタ（ゲイン1）", nl: "Sallen-Key-laagdoorlaatfilter (versterking 1)", no: "Sallen-Key-lavpassfilter (forsterkning 1)", pl: "Filtr dolnoprzepustowy Sallen-Key (wzmocnienie 1)", pt: "Filtro passa-baixo Sallen-Key (ganho unitário)", sv: "Sallen-Key-lågpassfilter (förstärkning 1)", zh: "Sallen-Key低通滤波器（单位增益）"}
  doc:
    en: "Second-order active low-pass in the Sallen-Key topology with unity gain (the op-amp is a voltage follower) and two equal resistors R. C_1 is the capacitor from the junction of the two resistors to the output (feedback), C_2 goes from the non-inverting input to ground. f_0 = 1 / (2π × R × √(C_1 × C_2)) and Q = ½ × √(C_1 / C_2). C_1 = 2 × C_2 gives Q = 0.707 (Butterworth, maximally flat); C_1b shows that C_1 for the present C_2. Enter any three independent values. Example with the defaults: R = 10 kΩ, C_1 = 22 nF and C_2 = 10 nF give f_0 ≈ 1.07 kHz and Q ≈ 0.742. The op-amp is assumed ideal; its bandwidth must be much higher than f_0 and the source impedance low."
    de: "Aktiver Tiefpass zweiter Ordnung in der Sallen-Key-Schaltung mit der Verstärkung 1 (der Operationsverstärker ist ein Spannungsfolger) und zwei gleichen Widerständen R. C_1 ist der Kondensator vom Verbindungspunkt der beiden Widerstände zum Ausgang (Rückkopplung), C_2 liegt vom nichtinvertierenden Eingang nach Masse. f_0 = 1 / (2π · R · √(C_1 · C_2)) und Q = ½ · √(C_1 / C_2). C_1 = 2 · C_2 ergibt Q = 0,707 (Butterworth, maximal flach); C_1b zeigt dieses C_1 für das vorhandene C_2. Drei unabhängige Werte eingeben. Beispiel mit den Standardwerten: R = 10 kΩ, C_1 = 22 nF und C_2 = 10 nF ergeben f_0 ≈ 1,07 kHz und Q ≈ 0,742. Der Operationsverstärker gilt als ideal; seine Bandbreite muss deutlich über f_0 liegen und die Quellimpedanz niedrig sein."
  tags: [sallen-key, sallen key, active filter, low-pass, lowpass, second order, butterworth, op-amp, q factor, aktiver filter, tiefpass, filter zweiter ordnung, operationsverstärker, güte]
  source: "Unity-gain Sallen-Key low-pass with equal resistors: f_0 = 1/(2πR√(C_1C_2)), Q = ½√(C_1/C_2), C_1 the feedback capacitor; R. P. Sallen, E. L. Key: A Practical Method of Designing RC Active Filters, IRE Transactions on Circuit Theory, 1955; P. Horowitz, W. Hill: The Art of Electronics, 3rd ed., ch. 6 (filters)"
  vars:
    r: {dim: resistance, label: R, name: {en: "Resistors (both)", de: "Widerstände (beide)"}, default: "10k", eseries: true}
    c1: {dim: capacitance, label: C_1, name: {en: "Feedback capacitor", de: "Rückkopplungskondensator"}, default: "22n", eseries: true}
    c2: {dim: capacitance, label: C_2, name: {en: "Capacitor to ground", de: "Kondensator nach Masse"}, default: "10n", eseries: true}
    f0: {dim: frequency, label: f_0, name: {en: "Natural frequency", de: "Eigenfrequenz"}}
    q: {dim: number, label: Q, name: {en: "Quality factor", de: "Güte"}}
  dof: 3
  rules:
    f0: ["1/(2*pi*r*sqrt(c1*c2))"]
    q: ["0.5*sqrt(c1/c2)"]
    c1: ["4*q^2*c2", "q/(pi*r*f0)"]
    c2: ["c1/(4*q^2)", "1/((2*pi*r*f0)^2*c1)", "1/(4*pi*q*r*f0)"]
    r: ["1/(2*pi*f0*sqrt(c1*c2))"]
  derived:
    c1b: {dim: capacitance, label: C_1b, name: {en: "C_1 for Q = 0.707 (Butterworth)", de: "C_1 für Q = 0,707 (Butterworth)"}, expr: "2*c2"}
  formula: ["f0 = 1 / (2 * pi * r * sqrt(c1 * c2))", "q = 0.5 * sqrt(c1 / c2)", "c1b = 2 * c2"]
  schematic: sallen_key_lowpass

- id: twin_t_notch
  kind: calculator
  category: filters
  name: {cs: "Pásmová zádrž dvojité T", da: "Dobbelt-T-notchfilter", de: "Doppel-T-Sperrfilter", el: "Φίλτρο αποκοπής διπλού Τ", en: "Twin-T notch filter", es: "Filtro de muesca doble T", fr: "Filtre réjecteur double T", hi: "ट्विन-टी नॉच फ़िल्टर", it: "Filtro notch a doppio T", ja: "ツインTノッチフィルタ", nl: "Dubbel-T-notchfilter", no: "Dobbel-T-notchfilter", pl: "Filtr zaporowy podwójne T", pt: "Filtro rejeita-banda duplo T", sv: "Dubbel-T-notchfilter", zh: "双T陷波滤波器"}
  doc:
    en: "Passive twin-T notch (band-stop) filter: two T networks in parallel between input and output, one of two resistors R with a capacitor 2C to ground, the other of two capacitors C with a resistor R/2 to ground. The transfer function has a zero at f_0 = 1 / (2π × R × C), so the output is (ideally) zero there; R/2 and 2C are the shunt parts. Example with the defaults: R = 31.6 kΩ and C = 100 nF give f_0 ≈ 50.4 Hz, a notch for 50 Hz mains hum (shunt parts 15.8 kΩ and 200 nF). The notch is only deep when the parts match closely (use 1 % resistors and matched capacitors). The passive filter has a low Q (a wide notch) and needs a source impedance much lower than R and a load impedance much higher than R."
    de: "Passiver Doppel-T-Sperrfilter (Notch, Bandsperre): zwei T-Glieder parallel zwischen Eingang und Ausgang, das eine aus zwei Widerständen R mit einem Kondensator 2C nach Masse, das andere aus zwei Kondensatoren C mit einem Widerstand R/2 nach Masse. Die Übertragungsfunktion hat eine Nullstelle bei f_0 = 1 / (2π · R · C), dort ist der Ausgang (ideal) null; R/2 und 2C sind die Querglieder. Beispiel mit den Standardwerten: R = 31,6 kΩ und C = 100 nF ergeben f_0 ≈ 50,4 Hz, eine Sperre für 50-Hz-Brummen (Querglieder 15,8 kΩ und 200 nF). Die Sperre ist nur tief, wenn die Bauteile eng zusammenpassen (1-%-Widerstände und gepaarte Kondensatoren verwenden). Das passive Filter hat eine geringe Güte (breite Sperre) und braucht eine Quellimpedanz weit unter R und eine Lastimpedanz weit über R."
  tags: [twin-t, twin t, notch, band-stop, band reject, hum filter, 50 hz, 60 hz, doppel-t, sperrfilter, bandsperre, brummfilter, notch filter]
  source: "Passive twin-T network (arms R-R-2C and C-C-R/2): transmission zero at f_0 = 1/(2πRC), obtained by nodal analysis; filter textbooks, e.g. P. Horowitz, W. Hill: The Art of Electronics, 3rd ed., ch. 6 (filters)"
  vars:
    r: {dim: resistance, label: R, name: {en: "Resistor R", de: "Widerstand R"}, default: "31.6k", eseries: true}
    c: {dim: capacitance, label: C, name: {en: "Capacitor C", de: "Kondensator C"}, default: "100n", eseries: true}
    f0: {dim: frequency, label: f_0, name: {en: "Notch frequency", de: "Sperrfrequenz"}}
  dof: 2
  rules:
    f0: ["1/(2*pi*r*c)"]
    r: ["1/(2*pi*f0*c)"]
    c: ["1/(2*pi*f0*r)"]
  derived:
    rh: {dim: resistance, label: R/2, name: {en: "Shunt resistor R/2", de: "Querwiderstand R/2"}, expr: "r/2"}
    c2x: {dim: capacitance, label: 2C, name: {en: "Shunt capacitor 2C", de: "Querkondensator 2C"}, expr: "2*c"}
  formula: ["f0 = 1 / (2 * pi * r * c)", "rh = r / 2", "c2x = 2 * c"]
  schematic: twin_t_notch

- id: attenuator_pi
  kind: calculator
  category: filters
  name: {cs: "Útlumový článek typu π", da: "π-dæmpeled", de: "Pi-Dämpfungsglied", el: "Εξασθενητής Π", en: "Pi attenuator", es: "Atenuador en pi", fr: "Atténuateur en pi", hi: "पाई एटेन्युएटर", it: "Attenuatore a pi greco", ja: "π型アッテネータ", nl: "Pi-verzwakker", no: "Pi-dempeledd", pl: "Tłumik typu π", pt: "Atenuador em pi", sv: "Pi-dämpsats", zh: "π型衰减器"}
  doc:
    en: "Matched resistive pi attenuator (π pad): one series resistor R_s between two equal shunt resistors R_p. Terminated with Z_0 it presents Z_0 at the other port and attenuates by A dB. With the voltage ratio K = 10^(A / 20): R_p = Z_0 × (K + 1) / (K − 1) and R_s = Z_0 × (K² − 1) / (2K). Enter any two of Z_0, A, R_s and R_p. Example with the defaults: 10 dB in a 50 Ω system need R_s ≈ 71.2 Ω and R_p ≈ 96.2 Ω. The power rating of the resistors must cover the dissipated power; this calculator does not size it."
    de: "Angepasstes Widerstands-Pi-Dämpfungsglied (π-Glied): ein Längswiderstand R_s zwischen zwei gleichen Querwiderständen R_p. Mit Z_0 abgeschlossen zeigt es am anderen Tor Z_0 und dämpft um A dB. Mit dem Spannungsverhältnis K = 10^(A / 20) gilt: R_p = Z_0 · (K + 1) / (K − 1) und R_s = Z_0 · (K² − 1) / (2K). Zwei der Größen Z_0, A, R_s und R_p eingeben. Beispiel mit den Standardwerten: 10 dB in einem 50-Ω-System brauchen R_s ≈ 71,2 Ω und R_p ≈ 96,2 Ω. Die Belastbarkeit der Widerstände muss die umgesetzte Leistung abdecken; der Rechner dimensioniert sie nicht."
  tags: [attenuator, pad, pi attenuator, pi pad, matched, resistive, db, 50 ohm, attenuation, dämpfungsglied, pi-glied, dämpfung, abschwächer, angepasst]
  source: "Matched resistive pi attenuator (image-impedance design): K = 10^(A/20), R_p = Z_0(K+1)/(K−1), R_s = Z_0(K²−1)/(2K); Reference Data for Engineers, 9th ed. (Newnes), chapter on attenuators; formulas checked by two-port analysis"
  vars:
    z0: {dim: resistance, label: Z_0, name: {en: "System impedance", de: "Systemimpedanz"}, default: "50"}
    att: {dim: gain, label: A, name: {en: "Attenuation", de: "Dämpfung"}, default: "10 dB"}
    rs: {dim: resistance, label: R_s, name: {en: "Series resistor", de: "Längswiderstand"}, eseries: true}
    rp: {dim: resistance, label: R_p, name: {en: "Shunt resistors (2×)", de: "Querwiderstände (2×)"}, eseries: true}
  dof: 2
  rules:
    att: ["20*log10(k)"]
    rs: ["z0*(k^2-1)/(2*k)"]
    rp: ["z0*(k+1)/(k-1)"]
    z0: ["rs*2*k/(k^2-1)", "rp*(k-1)/(k+1)"]
  derived:
    k: {dim: number, label: K, name: {en: "Voltage ratio K", de: "Spannungsverhältnis K"}, expr: ["10^(att/20)", "(rp+z0)/(rp-z0)", "rs/z0+sqrt((rs/z0)^2+1)", "(1+rs/rp)+sqrt((1+rs/rp)^2-1)"]}
  checks:
    - {when: "att <= 0", warn: {en: "The attenuation must be greater than 0 dB.", de: "Die Dämpfung muss größer als 0 dB sein."}}
    - {when: "rp <= z0", warn: {en: "R_p must be larger than Z_0 for a pi attenuator; these values do not fit together.", de: "R_p muss bei einem Pi-Glied größer als Z_0 sein; diese Werte passen nicht zusammen."}}
  formula: ["k = 10^(att / 20)", "rp = z0 * (k + 1) / (k - 1)", "rs = z0 * (k^2 - 1) / (2 * k)"]
  schematic: attenuator_pi

- id: attenuator_t
  kind: calculator
  category: filters
  name: {cs: "Útlumový článek typu T", da: "T-dæmpeled", de: "T-Dämpfungsglied", el: "Εξασθενητής Τ", en: "T attenuator", es: "Atenuador en T", fr: "Atténuateur en T", hi: "टी एटेन्युएटर", it: "Attenuatore a T", ja: "T型アッテネータ", nl: "T-verzwakker", no: "T-dempeledd", pl: "Tłumik typu T", pt: "Atenuador em T", sv: "T-dämpsats", zh: "T型衰减器"}
  doc:
    en: "Matched resistive T attenuator (T pad): two equal series resistors R_s with one shunt resistor R_p to ground between them. Terminated with Z_0 it presents Z_0 at the other port and attenuates by A dB. With the voltage ratio K = 10^(A / 20): R_s = Z_0 × (K − 1) / (K + 1) and R_p = 2 × Z_0 × K / (K² − 1). Enter any two of Z_0, A, R_s and R_p. Example with the defaults: 10 dB in a 50 Ω system need R_s ≈ 26.0 Ω and R_p ≈ 35.1 Ω. The power rating of the resistors must cover the dissipated power; this calculator does not size it."
    de: "Angepasstes Widerstands-T-Dämpfungsglied (T-Glied): zwei gleiche Längswiderstände R_s mit einem Querwiderstand R_p nach Masse dazwischen. Mit Z_0 abgeschlossen zeigt es am anderen Tor Z_0 und dämpft um A dB. Mit dem Spannungsverhältnis K = 10^(A / 20) gilt: R_s = Z_0 · (K − 1) / (K + 1) und R_p = 2 · Z_0 · K / (K² − 1). Zwei der Größen Z_0, A, R_s und R_p eingeben. Beispiel mit den Standardwerten: 10 dB in einem 50-Ω-System brauchen R_s ≈ 26,0 Ω und R_p ≈ 35,1 Ω. Die Belastbarkeit der Widerstände muss die umgesetzte Leistung abdecken; der Rechner dimensioniert sie nicht."
  tags: [attenuator, pad, t attenuator, t pad, matched, resistive, db, 50 ohm, attenuation, dämpfungsglied, t-glied, dämpfung, abschwächer, angepasst]
  source: "Matched resistive T attenuator (image-impedance design): K = 10^(A/20), R_s = Z_0(K−1)/(K+1), R_p = 2Z_0K/(K²−1); Reference Data for Engineers, 9th ed. (Newnes), chapter on attenuators; formulas checked by two-port analysis"
  vars:
    z0: {dim: resistance, label: Z_0, name: {en: "System impedance", de: "Systemimpedanz"}, default: "50"}
    att: {dim: gain, label: A, name: {en: "Attenuation", de: "Dämpfung"}, default: "10 dB"}
    rs: {dim: resistance, label: R_s, name: {en: "Series resistors (2×)", de: "Längswiderstände (2×)"}, eseries: true}
    rp: {dim: resistance, label: R_p, name: {en: "Shunt resistor", de: "Querwiderstand"}, eseries: true}
  dof: 2
  rules:
    att: ["20*log10(k)"]
    rs: ["z0*(k-1)/(k+1)"]
    rp: ["2*z0*k/(k^2-1)"]
    z0: ["rs*(k+1)/(k-1)", "rp*(k^2-1)/(2*k)"]
  derived:
    k: {dim: number, label: K, name: {en: "Voltage ratio K", de: "Spannungsverhältnis K"}, expr: ["10^(att/20)", "(z0+rs)/(z0-rs)", "(z0+sqrt(z0^2+rp^2))/rp", "(1+rs/rp)+sqrt((1+rs/rp)^2-1)"]}
  checks:
    - {when: "att <= 0", warn: {en: "The attenuation must be greater than 0 dB.", de: "Die Dämpfung muss größer als 0 dB sein."}}
    - {when: "rs >= z0", warn: {en: "R_s must be smaller than Z_0 for a T attenuator; these values do not fit together.", de: "R_s muss bei einem T-Glied kleiner als Z_0 sein; diese Werte passen nicht zusammen."}}
  formula: ["k = 10^(att / 20)", "rs = z0 * (k - 1) / (k + 1)", "rp = 2 * z0 * k / (k^2 - 1)"]
  schematic: attenuator_t

- id: lc_lowpass
  kind: calculator
  category: filters
  name: {cs: "LC dolní propust 2. řádu (Butterworth)", da: "LC-lavpasfilter, 2. orden (Butterworth)", de: "LC-Tiefpass 2. Ordnung (Butterworth)", el: "Βαθυπερατό φίλτρο LC 2ης τάξης (Butterworth)", en: "LC low-pass, 2nd-order Butterworth", es: "Filtro paso bajo LC de 2.º orden (Butterworth)", fr: "Filtre passe-bas LC du 2e ordre (Butterworth)", hi: "एलसी निम्न-पास फ़िल्टर, द्वितीय कोटि (बटरवर्थ)", it: "Filtro passa-basso LC del 2° ordine (Butterworth)", ja: "LCローパスフィルタ（2次・バターワース）", nl: "LC-laagdoorlaatfilter, 2e orde (Butterworth)", no: "LC-lavpassfilter, 2. orden (Butterworth)", pl: "Filtr dolnoprzepustowy LC 2. rzędu (Butterworth)", pt: "Filtro passa-baixo LC de 2.ª ordem (Butterworth)", sv: "LC-lågpassfilter, 2:a ordningen (Butterworth)", zh: "LC低通滤波器（二阶巴特沃斯）"}
  doc:
    en: "Passive second-order LC low-pass with a maximally flat (Butterworth) response: a series inductor L and a shunt capacitor C to ground, sized for the −3 dB cutoff frequency f_c. Two different normalisations exist for this same ladder, and choosing the wrong one halves or doubles C (L is the same in both). Source and load R (both ends): the generator has the internal resistance R and the load is R as well (prototype values g_1 = g_2 = √2): L = √2 × R / (2π × f_c) and C = √2 / (2π × f_c × R); the load then receives half of the source voltage in the pass band (−6 dB, the matched divider, not a loss of the filter) and f_c = √2 × f_0. Voltage source, load R: the source has zero impedance, as an amplifier output, a class-D output stage or a loudspeaker filter fed from a voltage source (g_1 = √2, g_2 = 1/√2): L = √2 × R / (2π × f_c) and C = 1 / (√2 × 2π × f_c × R), half the capacitance; here f_c = f_0. f_0 = 1 / (2π × √(L × C)) is the resonance of L and C alone, and √(L/C) is the ratio of the two reactances at that frequency. Enter any two of R, f_c, L and C. Example with the defaults: 50 Ω at both ends and f_c = 1 MHz give L = 11.25 µH and C = 4.50 nF (the published Stanford example). The parts are assumed ideal: the inductor's resistance lowers the pass band, and above its self-resonance (and with the capacitor's lead inductance) the stop-band attenuation collapses. The stop band falls by 12 dB per octave."
    de: "Passiver LC-Tiefpass zweiter Ordnung mit maximal flachem Verlauf (Butterworth): eine Längsinduktivität L und ein Querkondensator C nach Masse, bemessen für die −3-dB-Grenzfrequenz f_c. Für dieselbe Leiterschaltung gibt es zwei verschiedene Normierungen, und die falsche Wahl halbiert oder verdoppelt C (L ist in beiden gleich). Quelle und Last R (beidseitig): Der Generator hat den Innenwiderstand R und die Last ist ebenfalls R (Prototypwerte g_1 = g_2 = √2): L = √2 · R / (2π · f_c) und C = √2 / (2π · f_c · R); die Last erhält im Durchlassbereich die halbe Quellenspannung (−6 dB, der angepasste Teiler, kein Verlust des Filters), und es gilt f_c = √2 · f_0. Spannungsquelle, Last R: Die Quelle hat die Impedanz null, etwa ein Verstärkerausgang, eine Class-D-Endstufe oder eine Lautsprecherweiche an einer Spannungsquelle (g_1 = √2, g_2 = 1/√2): L = √2 · R / (2π · f_c) und C = 1 / (√2 · 2π · f_c · R), die halbe Kapazität; hier gilt f_c = f_0. f_0 = 1 / (2π · √(L · C)) ist die Resonanz von L und C allein, und √(L/C) ist das Verhältnis der beiden Blindwiderstände bei dieser Frequenz. Zwei der Größen R, f_c, L und C eingeben. Beispiel mit den Standardwerten: 50 Ω an beiden Seiten und f_c = 1 MHz ergeben L = 11,25 µH und C = 4,50 nF (das veröffentlichte Stanford-Beispiel). Die Bauteile gelten als ideal: Der Widerstand der Spule senkt den Durchlassbereich, und oberhalb ihrer Eigenresonanz (und mit der Zuleitungsinduktivität des Kondensators) bricht die Sperrdämpfung zusammen. Im Sperrbereich fällt der Pegel um 12 dB pro Oktave."
  tags: [lc filter, lc low-pass, low-pass, lowpass, butterworth, second order, passive filter, doubly terminated, g-values, prototype, cutoff frequency, resonance, rf filter, harmonic filter, class-d output filter, lc-filter, lc-tiefpass, tiefpass, zweite ordnung, passives filter, beidseitig abgeschlossen, grenzfrequenz, resonanzfrequenz, hf-filter, oberwellenfilter, siebglied]
  source: "Butterworth prototype g-values for n = 2 (g_1 = g_2 = 1.4142, doubly terminated) and impedance scaling: M. Steer, Microwave and RF Design IV: Modules, section 2.7 (Butterworth and Chebyshev Filters); Stanford University EE133 handout Filters; voltage-source (singly terminated) case f_0 = 1/(2π√(LC)), L = √2·R/ω_0, C = 1/(√2·ω_0·R): Texas Instruments, LC Filter Design (SLAA701B), section 1.3.3"
  vars:
    r: {dim: resistance, label: R, name: {en: "Source and load resistance (each)", de: "Quell- und Lastwiderstand (je)"}, default: "50"}
    fc: {dim: frequency, label: f_c, name: {en: "Cutoff frequency (−3 dB)", de: "Grenzfrequenz (−3 dB)"}, default: "1M"}
    l: {dim: inductance, label: L, name: {en: "Series inductor", de: "Längsinduktivität"}}
    c: {dim: capacitance, label: C, name: {en: "Shunt capacitor", de: "Querkondensator"}}
  choices:
    term:
      name: {cs: "Zakončení obvodu", da: "Afslutning", de: "Beschaltung", el: "Τερματισμός κυκλώματος", en: "Termination", es: "Terminación", fr: "Terminaison", hi: "समापन", it: "Terminazione", ja: "終端", nl: "Afsluiting", no: "Avslutning", pl: "Zakończenie obwodu", pt: "Terminação", sv: "Avslutning", zh: "端接方式"}
      default: double
      options:
        double:
          name: {cs: "Zdroj i zátěž R (oba konce)", da: "Kilde og last R (begge ender)", de: "Quelle und Last je R (beidseitig)", el: "Πηγή και φορτίο R (και τα δύο άκρα)", en: "Source and load R (both ends)", es: "Fuente y carga R (ambos extremos)", fr: "Source et charge R (aux deux extrémités)", hi: "स्रोत और लोड R (दोनों सिरे)", it: "Sorgente e carico R (entrambi i lati)", ja: "電源・負荷ともにR（両端終端）", nl: "Bron en belasting R (beide zijden)", no: "Kilde og last R (begge ender)", pl: "Źródło i obciążenie R (oba końce)", pt: "Fonte e carga R (ambos os lados)", sv: "Källa och last R (båda ändar)", zh: "信源与负载均为R（双端接）"}
          consts: {kl: 1.4142135623730951, kc: 1.4142135623730951}
        load_only:
          name: {cs: "Zdroj napětí, zátěž R", da: "Spændingskilde, last R", de: "Spannungsquelle, Last R", el: "Πηγή τάσης, φορτίο R", en: "Voltage source, load R", es: "Fuente de tensión, carga R", fr: "Source de tension, charge R", hi: "वोल्टेज स्रोत, लोड R", it: "Sorgente di tensione, carico R", ja: "電圧源・負荷R", nl: "Spanningsbron, belasting R", no: "Spenningskilde, last R", pl: "Źródło napięcia, obciążenie R", pt: "Fonte de tensão, carga R", sv: "Spänningskälla, last R", zh: "电压源，负载R"}
          consts: {kl: 1.4142135623730951, kc: 0.7071067811865475}
  dof: 2
  rules:
    l: ["kl*r/(2*pi*fc)", "kl*r^2*c/kc", "kl*kc/((2*pi*fc)^2*c)"]
    c: ["kc/(2*pi*fc*r)", "kc*l/(kl*r^2)", "kl*kc/((2*pi*fc)^2*l)"]
    r: ["sqrt(kc*l/(kl*c))", "2*pi*fc*l/kl", "kc/(2*pi*fc*c)"]
    fc: ["sqrt(kl*kc/(l*c))/(2*pi)", "kl*r/(2*pi*l)", "kc/(2*pi*r*c)"]
  derived:
    f0: {dim: frequency, label: f_0, name: {en: "Resonance of L and C alone", de: "Resonanzfrequenz von L und C allein"}, expr: "1/(2*pi*sqrt(l*c))"}
    zc: {dim: resistance, label: "√(L/C)", name: {en: "Reactance ratio √(L / C)", de: "Blindwiderstandsverhältnis √(L / C)"}, expr: "sqrt(l/c)"}
  checks:
    - {when: "c < 2e-12", warn: {en: "C is only a few pF: stray capacitance of the board and the inductor shifts the cutoff.", de: "C beträgt nur wenige pF: Streukapazitäten von Platine und Spule verschieben die Grenzfrequenz."}}
    - {when: "l < 2e-9", warn: {en: "L is only a few nH: trace and lead inductance are of the same order.", de: "L beträgt nur wenige nH: Leiterbahn- und Anschlussinduktivität liegen in derselben Größenordnung."}}
  formula: ["l = kl * r / (2 * pi * fc)", "c = kc / (2 * pi * fc * r)", "f0 = 1 / (2 * pi * sqrt(l * c))"]
  schematic: lc_lowpass

- id: sallen_key_highpass
  kind: calculator
  category: filters
  name: {cs: "Sallen-Key horní propust (zesílení 1)", da: "Sallen-Key-højpasfilter (forstærkning 1)", de: "Sallen-Key-Hochpass (Verstärkung 1)", el: "Υψιπερατό φίλτρο Sallen-Key (κέρδος 1)", en: "Sallen-Key high-pass (unity gain)", es: "Filtro paso alto Sallen-Key (ganancia 1)", fr: "Filtre passe-haut Sallen-Key (gain unitaire)", hi: "सैलन-की उच्च-पास फ़िल्टर (इकाई लब्धि)", it: "Filtro passa-alto Sallen-Key (guadagno unitario)", ja: "サレンキー・ハイパスフィルタ（ゲイン1）", nl: "Sallen-Key-hoogdoorlaatfilter (versterking 1)", no: "Sallen-Key-høypassfilter (forsterkning 1)", pl: "Filtr górnoprzepustowy Sallen-Key (wzmocnienie 1)", pt: "Filtro passa-alto Sallen-Key (ganho unitário)", sv: "Sallen-Key-högpassfilter (förstärkning 1)", zh: "Sallen-Key高通滤波器（单位增益）"}
  doc:
    en: "Second-order active high-pass in the Sallen-Key topology with unity gain (the op-amp is a voltage follower) and two equal capacitors C in series with the signal. R_1 is the feedback resistor, from the junction of the two capacitors to the output; R_2 is the resistor from the non-inverting input to ground. This mirrors the low-pass calculator, where C_1 is the feedback element and C_2 goes to ground. Mind the numbering: the sources differ. The Texas Instruments documents SLOD006B (Op Amps for Everyone) and SLOA024B call the resistor to ground R1, while SBOA225 and Wikipedia call the feedback resistor R1; here R_1 is always the feedback resistor. f_0 = 1 / (2π × C × √(R_1 × R_2)) and Q = ½ × √(R_2 / R_1). R_2 = 2 × R_1 gives Q = 0.707 (Butterworth, maximally flat), and then f_0 is the −3 dB cutoff; R_2b shows that R_2 for the present R_1. For other Q the −3 dB frequency differs from f_0, and at f_0 the gain equals Q. Enter any three independent values. Example with the defaults: R_1 = 11 kΩ, R_2 = 22 kΩ and C = 10 nF give f_0 ≈ 1.023 kHz and Q = 0.707. The op-amp is assumed ideal; being a high-pass, the circuit really is a band-pass whose upper edge the op-amp's bandwidth sets, so choose an op-amp with a gain-bandwidth product far above f_0. The source impedance must be low (it drives a capacitor) and the two capacitors must be equal."
    de: "Aktiver Hochpass zweiter Ordnung in der Sallen-Key-Schaltung mit der Verstärkung 1 (der Operationsverstärker ist ein Spannungsfolger) und zwei gleichen Kondensatoren C in Reihe zum Signal. R_1 ist der Rückkopplungswiderstand vom Verbindungspunkt der beiden Kondensatoren zum Ausgang; R_2 ist der Widerstand vom nichtinvertierenden Eingang nach Masse. Das entspricht dem Tiefpass-Rechner, bei dem C_1 das Rückkopplungselement ist und C_2 nach Masse liegt. Achtung bei der Nummerierung: Die Quellen weichen voneinander ab. Die Texas-Instruments-Dokumente SLOD006B (Op Amps for Everyone) und SLOA024B nennen den Widerstand nach Masse R1, SBOA225 und Wikipedia nennen den Rückkopplungswiderstand R1; hier ist R_1 immer der Rückkopplungswiderstand. f_0 = 1 / (2π · C · √(R_1 · R_2)) und Q = ½ · √(R_2 / R_1). R_2 = 2 · R_1 ergibt Q = 0,707 (Butterworth, maximal flach), und dann ist f_0 die −3-dB-Grenzfrequenz; R_2b zeigt dieses R_2 für das vorhandene R_1. Bei anderem Q weicht die −3-dB-Frequenz von f_0 ab, und bei f_0 ist die Verstärkung gleich Q. Drei unabhängige Werte eingeben. Beispiel mit den Standardwerten: R_1 = 11 kΩ, R_2 = 22 kΩ und C = 10 nF ergeben f_0 ≈ 1,023 kHz und Q = 0,707. Der Operationsverstärker gilt als ideal; als Hochpass ist die Schaltung in Wirklichkeit ein Bandpass, dessen obere Grenze die Bandbreite des Operationsverstärkers festlegt, daher einen mit einem Verstärkungs-Bandbreite-Produkt weit über f_0 wählen. Die Quellimpedanz muss niedrig sein (sie treibt einen Kondensator), und die beiden Kondensatoren müssen gleich sein."
  tags: [sallen-key, sallen key, active filter, high-pass, highpass, second order, butterworth, unity gain, op-amp, q factor, cutoff frequency, rumble filter, dc blocking, aktiver filter, hochpass, filter zweiter ordnung, verstärkung 1, operationsverstärker, güte, grenzfrequenz, rumpelfilter, trittschallfilter]
  source: "Unity-gain Sallen-Key high-pass with equal capacitors: f_0 = 1/(2πC√(R_1R_2)), Q = ½√(R_2/R_1), R_1 the feedback resistor; Texas Instruments, Op Amps for Everyone (SLOD006B), chapter 16 (active filter design techniques); Texas Instruments, Analysis of the Sallen-Key Architecture (SLOA024B), high-pass circuit; Texas Instruments, Single-supply, 2nd-order, Sallen-Key high-pass filter circuit (SBOA225); R. P. Sallen, E. L. Key: A Practical Method of Designing RC Active Filters, IRE Transactions on Circuit Theory, 1955"
  vars:
    r1: {dim: resistance, label: R_1, name: {en: "Feedback resistor (capacitor junction to output)", de: "Rückkopplungswiderstand (Kondensatorknoten zum Ausgang)"}, default: "11k", eseries: true}
    r2: {dim: resistance, label: R_2, name: {en: "Resistor to ground (at the non-inverting input)", de: "Widerstand nach Masse (am nichtinvertierenden Eingang)"}, default: "22k", eseries: true}
    c: {dim: capacitance, label: C, name: {en: "Capacitors (both)", de: "Kondensatoren (beide)"}, default: "10n", eseries: true}
    f0: {dim: frequency, label: f_0, name: {en: "Natural frequency", de: "Eigenfrequenz"}}
    q: {dim: number, label: Q, name: {en: "Quality factor", de: "Güte"}}
  dof: 3
  rules:
    f0: ["1/(2*pi*c*sqrt(r1*r2))"]
    q: ["0.5*sqrt(r2/r1)"]
    r1: ["r2/(4*q^2)", "1/(4*pi*f0*c*q)", "1/((2*pi*f0*c)^2*r2)"]
    r2: ["4*q^2*r1", "q/(pi*f0*c)", "1/((2*pi*f0*c)^2*r1)"]
    c: ["1/(2*pi*f0*sqrt(r1*r2))", "1/(4*pi*f0*q*r1)", "q/(pi*f0*r2)"]
  derived:
    r2b: {dim: resistance, label: R_2b, name: {en: "R_2 for Q = 0.707 (Butterworth)", de: "R_2 für Q = 0,707 (Butterworth)"}, expr: "2*r1"}
  checks:
    - {when: "q > 0.7072", warn: {en: "Q is above 0.707: the response rises above the pass-band gain near f_0 (at f_0 the gain is Q).", de: "Q liegt über 0,707: Der Frequenzgang überhöht nahe f_0 über die Durchlassverstärkung (bei f_0 beträgt die Verstärkung Q)."}}
    - {when: "q < 0.49999999", warn: {en: "Q is below 0.5: the two poles are real and the corner is very soft (two cascaded RC high-passes do the same).", de: "Q liegt unter 0,5: Beide Pole sind reell, der Knick ist sehr weich (zwei RC-Hochpässe hintereinander leisten dasselbe)."}}
  formula: ["f0 = 1 / (2 * pi * c * sqrt(r1 * r2))", "q = 0.5 * sqrt(r2 / r1)", "r2b = 2 * r1"]
  schematic: sallen_key_highpass

- id: mfb_bandpass
  kind: calculator
  category: filters
  name: {cs: "Pásmová propust MFB (násobná zpětná vazba)", da: "MFB-båndpasfilter (flere tilbagekoblinger)", de: "MFB-Bandpass (Mehrfachgegenkopplung)", el: "Ζωνοπερατό φίλτρο MFB (πολλαπλής ανάδρασης)", en: "MFB band-pass (multiple feedback)", es: "Filtro paso banda MFB (realimentación múltiple)", fr: "Filtre passe-bande MFB (contre-réaction multiple)", hi: "एमएफबी बैंड-पास फ़िल्टर (बहु-पुनर्निवेश)", it: "Filtro passa-banda MFB (retroazione multipla)", ja: "MFBバンドパスフィルタ（多重帰還）", nl: "MFB-banddoorlaatfilter (meervoudige terugkoppeling)", no: "MFB-båndpassfilter (flerfoldig tilbakekobling)", pl: "Filtr pasmowoprzepustowy MFB (wielokrotne sprzężenie zwrotne)", pt: "Filtro passa-banda MFB (realimentação múltipla)", sv: "MFB-bandpassfilter (flerfaldig återkoppling)", zh: "MFB带通滤波器（多重反馈）"}
  doc:
    en: "Second-order active band-pass in the multiple-feedback (MFB) topology with one inverting op-amp and two equal capacitors C. The input resistor R_in leads from the signal to a junction; from that junction go the resistor R_gnd to ground and one capacitor to the output and the other capacitor to the inverting input; the feedback resistor R_fb connects the output to the inverting input; the non-inverting input is grounded. The resistors are named by their place, because the sources number them differently (what Texas Instruments calls R2 is the feedback resistor, what Analog Devices calls R2 is the resistor to ground). f_0 = √((R_in + R_gnd) / (R_in × R_gnd × R_fb)) / (2π × C), Q = π × f_0 × R_fb × C, G = R_fb / (2 × R_in) and the −3 dB bandwidth B = f_0 / Q = 1 / (π × R_fb × C). G is the gain at the centre frequency f_0 (the output is inverted there); Analog Devices' H is not this gain, the centre gain is H × Q. R_gnd shifts f_0 without changing B or G. For a design enter f_0, Q, G and C: R_fb = Q / (π × f_0 × C), R_in = R_fb / (2G) and R_gnd = G × R_in / (2Q² − G). R_gnd exists only for 2 × Q² > G; at 2 × Q² = G the resistor is left out, and a higher gain at that Q cannot be built with this circuit. Example with the defaults, the rounded values of the Texas Instruments example: 7.96 kΩ, 80.4 Ω, 31.8 kΩ and 100 nF give f_0 ≈ 1.0004 kHz, Q ≈ 9.99 and G ≈ 2.0. The op-amp is assumed ideal; its open-loop gain at f_0 should be at least 20 dB above the gain at f_0 (Analog Devices), and the circuit suits Q up to about 20."
    de: "Aktiver Bandpass zweiter Ordnung in der Schaltung mit Mehrfachgegenkopplung (MFB) mit einem invertierenden Operationsverstärker und zwei gleichen Kondensatoren C. Der Eingangswiderstand R_in führt vom Signal zu einem Knoten; von diesem Knoten gehen der Widerstand R_gnd nach Masse, ein Kondensator zum Ausgang und der andere Kondensator zum invertierenden Eingang; der Rückkopplungswiderstand R_fb verbindet den Ausgang mit dem invertierenden Eingang; der nichtinvertierende Eingang liegt an Masse. Die Widerstände sind nach ihrem Platz benannt, weil die Quellen sie unterschiedlich nummerieren (was Texas Instruments R2 nennt, ist der Rückkopplungswiderstand, was Analog Devices R2 nennt, der Widerstand nach Masse). f_0 = √((R_in + R_gnd) / (R_in · R_gnd · R_fb)) / (2π · C), Q = π · f_0 · R_fb · C, G = R_fb / (2 · R_in) und die −3-dB-Bandbreite B = f_0 / Q = 1 / (π · R_fb · C). G ist die Verstärkung bei der Mittenfrequenz f_0 (dort ist der Ausgang invertiert); das H von Analog Devices ist nicht diese Verstärkung, die Mittenverstärkung ist H · Q. R_gnd verschiebt f_0, ohne B oder G zu ändern. Für einen Entwurf f_0, Q, G und C eingeben: R_fb = Q / (π · f_0 · C), R_in = R_fb / (2G) und R_gnd = G · R_in / (2Q² − G). R_gnd existiert nur für 2 · Q² > G; bei 2 · Q² = G entfällt der Widerstand, und eine höhere Verstärkung bei diesem Q lässt sich mit dieser Schaltung nicht bauen. Beispiel mit den Standardwerten, den gerundeten Werten des Beispiels von Texas Instruments: 7,96 kΩ, 80,4 Ω, 31,8 kΩ und 100 nF ergeben f_0 ≈ 1,0004 kHz, Q ≈ 9,99 und G ≈ 2,0. Der Operationsverstärker gilt als ideal; seine Leerlaufverstärkung bei f_0 sollte mindestens 20 dB über der Verstärkung bei f_0 liegen (Analog Devices), und die Schaltung eignet sich für Q bis etwa 20."
  tags: [mfb, multiple feedback, band-pass, bandpass, active filter, deliyannis, centre frequency, center frequency, q factor, bandwidth, op-amp, tone filter, narrow band, mehrfachgegenkopplung, aktiver filter, mittenfrequenz, güte, bandbreite, operationsverstärker, tonfilter, schmalband, selektivfilter]
  source: "Multiple-feedback band-pass, one op-amp, equal capacitors: f_0, Q = π·f_0·R_fb·C, G = R_fb/(2R_in), B = 1/(πR_fbC); Texas Instruments, Op Amps for Everyone (SLOD006B), chapter 16 (multiple feedback topology, Example 16-5); Analog Devices, Mini Tutorial MT-218 Multiple Feedback Band-Pass Design Example"
  vars:
    rin: {dim: resistance, label: R_in, name: {en: "Input resistor (signal to junction)", de: "Eingangswiderstand (Signal zum Knoten)"}, default: "7.96k", eseries: true}
    rgnd: {dim: resistance, label: R_gnd, name: {en: "Resistor from the junction to ground", de: "Widerstand vom Knoten nach Masse"}, default: "80.4", eseries: true}
    rfb: {dim: resistance, label: R_fb, name: {en: "Feedback resistor (output to inverting input)", de: "Rückkopplungswiderstand (Ausgang zum invertierenden Eingang)"}, default: "31.8k", eseries: true}
    c: {dim: capacitance, label: C, name: {en: "Capacitors (both)", de: "Kondensatoren (beide)"}, default: "100n", eseries: true}
    f0: {dim: frequency, label: f_0, name: {en: "Centre frequency", de: "Mittenfrequenz"}}
    q: {dim: number, label: Q, name: {en: "Quality factor f_0 / B", de: "Güte f_0 / B"}}
    g: {dim: number, label: G, name: {en: "Gain at f_0 (magnitude, output inverted)", de: "Verstärkung bei f_0 (Betrag, Ausgang invertiert)"}}
  dof: 4
  rules:
    f0: ["sqrt((rin+rgnd)/(rin*rgnd*rfb))/(2*pi*c)", "q/(pi*rfb*c)"]
    q: ["0.5*sqrt(rfb*(rin+rgnd)/(rin*rgnd))", "pi*f0*rfb*c"]
    g: ["rfb/(2*rin)"]
    rfb: ["q/(pi*f0*c)", "2*g*rin"]
    rin: ["rfb/(2*g)", "q/(2*pi*f0*c*g)"]
    rgnd: ["g*rin/(2*q^2-g)", "q/(2*pi*f0*c*(2*q^2-g))"]
    c: ["q/(pi*f0*rfb)"]
  derived:
    bw: {dim: frequency, label: B, name: {en: "−3 dB bandwidth f_0 / Q", de: "−3-dB-Bandbreite f_0 / Q"}, expr: "f0/q"}
  checks:
    - {when: "2*q^2 <= g", warn: {en: "Not realisable: R_gnd exists only for Q² > G / 2. Lower the gain or raise Q (at Q² = G / 2 the resistor R_gnd is left out).", de: "Nicht realisierbar: R_gnd existiert nur für Q² > G / 2. Verstärkung senken oder Q erhöhen (bei Q² = G / 2 entfällt R_gnd)."}}
    - {when: "q > 20", warn: {en: "Q above about 20: the single-op-amp MFB band-pass becomes very sensitive to tolerances and needs an op-amp with very high gain at f_0; a filter with two or three op-amps is better.", de: "Q über etwa 20: Der MFB-Bandpass mit einem Operationsverstärker reagiert stark auf Toleranzen und braucht einen Operationsverstärker mit sehr hoher Verstärkung bei f_0; besser ein Filter mit zwei oder drei Operationsverstärkern."}}
  formula: ["f0 = sqrt((rin + rgnd) / (rin * rgnd * rfb)) / (2 * pi * c)", "q = pi * f0 * rfb * c", "g = rfb / (2 * rin)", "bw = f0 / q"]
  schematic: mfb_bandpass

- id: speaker_crossover
  kind: calculator
  category: filters
  name: {cs: "Dvoupásmová reproduktorová výhybka 2. řádu", da: "2-vejs højttalerfrekvensdeler, 2. orden", de: "2-Wege-Frequenzweiche 2. Ordnung", el: "Διαχωριστής συχνοτήτων 2 δρόμων 2ης τάξης", en: "2-way speaker crossover, 2nd order", es: "Filtro divisor de 2 vías de 2.º orden", fr: "Filtre répartiteur 2 voies du 2e ordre", hi: "2-वे स्पीकर क्रॉसओवर, द्वितीय कोटि", it: "Crossover a 2 vie del 2° ordine", ja: "2ウェイ・スピーカークロスオーバー（2次）", nl: "2-weg-luidsprekerfilter, 2e orde", no: "2-veis høyttalerfilter, 2. orden", pl: "Zwrotnica głośnikowa 2-drożna 2. rzędu", pt: "Divisor de frequências de 2 vias, 2.ª ordem", sv: "2-vägs högtalarfilter, 2:a ordningen", zh: "二分频扬声器分频器（二阶）"}
  doc:
    en: "Passive second-order (12 dB per octave) crossover between an amplifier and two drivers. The woofer section is a series inductor L with a capacitor C in parallel with the driver, the tweeter section the dual: a series capacitor C with an inductor L in parallel with the driver. Both are fed from the amplifier, a voltage source, and the values below size each section for its own driver impedance R. They are the relations of the second-order low-pass driven from a voltage source into the load R: f = 1 / (2π × √(L × C)) and Q = R × √(C / L), hence L = R / (2π × f × Q) and C = Q / (2π × f × R). Butterworth uses Q = 0.707 (L = 0.2251 × R / f, C = 0.1125 / (f × R)), the section is 3 dB down at the crossover frequency and the summed response rises by 3 dB there. Linkwitz-Riley uses Q = 0.5 (L = 0.3183 × R / f, C = 0.07958 / (f × R)), each section is 6 dB down at f and the sum is flat. In a second-order crossover the two outputs are 180° apart, so the tweeter is connected with reversed polarity. Enter any two of R, f, L and C. Example with the defaults: 6 Ω and 3 kHz Linkwitz-Riley give L = 637 µH and C = 4.42 µF. The drivers are assumed to be pure resistances: use the impedance measured at the crossover frequency, not the nominal 4 Ω or 8 Ω (a real driver's impedance rises with frequency and has a resonance peak), otherwise crossover frequency and slope differ. Ideal parts and an amplifier with zero output impedance are assumed; the DC resistance of the inductor lowers the level of the woofer. Only the electrical filter is described: the drivers' own responses, sensitivities and mounting distance also shape the result."
    de: "Passive Frequenzweiche zweiter Ordnung (12 dB pro Oktave) zwischen einem Verstärker und zwei Chassis. Der Tieftonzweig ist eine Längsspule L mit einem Kondensator C parallel zum Chassis, der Hochtonzweig das Duale: ein Längskondensator C mit einer Spule L parallel zum Chassis. Beide hängen am Verstärker, einer Spannungsquelle, und die Werte bemessen jeden Zweig für die Impedanz R seines eigenen Chassis. Es sind die Beziehungen des Tiefpasses zweiter Ordnung an einer Spannungsquelle mit der Last R: f = 1 / (2π · √(L · C)) und Q = R · √(C / L), also L = R / (2π · f · Q) und C = Q / (2π · f · R). Butterworth verwendet Q = 0,707 (L = 0,2251 · R / f, C = 0,1125 / (f · R)), jeder Zweig ist bei der Trennfrequenz 3 dB abgesenkt, und der Summenfrequenzgang steigt dort um 3 dB. Linkwitz-Riley verwendet Q = 0,5 (L = 0,3183 · R / f, C = 0,07958 / (f · R)), jeder Zweig ist bei f um 6 dB abgesenkt, und die Summe ist eben. Bei einer Weiche zweiter Ordnung liegen die beiden Ausgänge 180° auseinander, daher wird der Hochtöner verpolt angeschlossen. Zwei der Größen R, f, L und C eingeben. Beispiel mit den Standardwerten: 6 Ω und 3 kHz Linkwitz-Riley ergeben L = 637 µH und C = 4,42 µF. Die Chassis gelten als reine Widerstände: Die bei der Trennfrequenz gemessene Impedanz verwenden, nicht die Nennimpedanz 4 Ω oder 8 Ω (die Impedanz eines echten Chassis steigt mit der Frequenz und hat eine Resonanzspitze), sonst weichen Trennfrequenz und Flankensteilheit ab. Ideale Bauteile und ein Verstärker mit der Ausgangsimpedanz null werden vorausgesetzt; der Gleichstromwiderstand der Spule senkt den Pegel des Tieftöners. Beschrieben ist nur das elektrische Filter: Auch der Frequenzgang, die Empfindlichkeit und der Einbauabstand der Chassis prägen das Ergebnis."
  tags: [crossover, speaker crossover, passive crossover, two-way, 2-way, loudspeaker, woofer, tweeter, butterworth, linkwitz-riley, lr2, 12 db, second order, crossover frequency, frequenzweiche, lautsprecherweiche, passive weiche, zweiwege, 2-wege, lautsprecher, tieftöner, hochtöner, zweite ordnung, trennfrequenz, übergangsfrequenz]
  source: "Second-order low-pass driven from a voltage source into the load R (f = 1/(2π√(LC)), Q = R√(C/L)): Texas Instruments, LC Filter Design (SLAA701B), section 1.3.3; Q of the Butterworth (0.7071) and the Bessel alignment: Texas Instruments, Op Amps for Everyone (SLOD006B), chapter 16, Tables 16-4 and 16-5; Linkwitz-Riley alignment (two cascaded first-order sections, Q = 0.5, −6 dB at the crossover, one output inverted): D. Bohn, Linkwitz-Riley Crossovers: A Primer, RaneNote 160, Rane Corporation"
  vars:
    r: {dim: resistance, label: R, name: {en: "Driver impedance at the crossover frequency (resistive)", de: "Chassis-Impedanz bei der Trennfrequenz (ohmsch)"}, default: "6"}
    f: {dim: frequency, label: f, name: {en: "Crossover frequency", de: "Trennfrequenz"}, default: "3k"}
    l: {dim: inductance, label: L, name: {en: "Inductor (series at the woofer, parallel at the tweeter)", de: "Spule (längs am Tieftöner, parallel am Hochtöner)"}}
    c: {dim: capacitance, label: C, name: {en: "Capacitor (parallel at the woofer, series at the tweeter)", de: "Kondensator (parallel am Tieftöner, längs am Hochtöner)"}}
  choices:
    align:
      name: {cs: "Charakteristika", da: "Afstemning", de: "Abstimmung", el: "Χαρακτηριστική", en: "Alignment", es: "Alineación", fr: "Alignement", hi: "संरेखण", it: "Allineamento", ja: "特性", nl: "Afstemming", no: "Avstemming", pl: "Charakterystyka", pt: "Alinhamento", sv: "Avstämning", zh: "滤波特性"}
      default: linkwitz_riley
      options:
        butterworth:
          name: {cs: "Butterworth (Q = 0.707)", da: "Butterworth (Q = 0.707)", de: "Butterworth (Q = 0.707)", el: "Butterworth (Q = 0.707)", en: "Butterworth (Q = 0.707)", es: "Butterworth (Q = 0.707)", fr: "Butterworth (Q = 0.707)", hi: "Butterworth (Q = 0.707)", it: "Butterworth (Q = 0.707)", ja: "Butterworth (Q = 0.707)", nl: "Butterworth (Q = 0.707)", no: "Butterworth (Q = 0.707)", pl: "Butterworth (Q = 0.707)", pt: "Butterworth (Q = 0.707)", sv: "Butterworth (Q = 0.707)", zh: "Butterworth (Q = 0.707)"}
          consts: {kl: 0.22507907903927654, kc: 0.11253953951963826}
        linkwitz_riley:
          name: {cs: "Linkwitz-Riley (Q = 0.5)", da: "Linkwitz-Riley (Q = 0.5)", de: "Linkwitz-Riley (Q = 0.5)", el: "Linkwitz-Riley (Q = 0.5)", en: "Linkwitz-Riley (Q = 0.5)", es: "Linkwitz-Riley (Q = 0.5)", fr: "Linkwitz-Riley (Q = 0.5)", hi: "Linkwitz-Riley (Q = 0.5)", it: "Linkwitz-Riley (Q = 0.5)", ja: "Linkwitz-Riley (Q = 0.5)", nl: "Linkwitz-Riley (Q = 0.5)", no: "Linkwitz-Riley (Q = 0.5)", pl: "Linkwitz-Riley (Q = 0.5)", pt: "Linkwitz-Riley (Q = 0.5)", sv: "Linkwitz-Riley (Q = 0.5)", zh: "Linkwitz-Riley (Q = 0.5)"}
          consts: {kl: 0.3183098861837907, kc: 0.07957747154594767}
  dof: 2
  rules:
    l: ["kl*r/f", "kl*r^2*c/kc", "kl*kc/(f^2*c)"]
    c: ["kc/(f*r)", "kc*l/(kl*r^2)", "kl*kc/(f^2*l)"]
    r: ["f*l/kl", "kc/(f*c)", "sqrt(kc*l/(kl*c))"]
    f: ["kl*r/l", "kc/(r*c)", "sqrt(kl*kc/(l*c))"]
  derived:
    q: {dim: number, label: Q, name: {en: "Quality factor R × √(C / L)", de: "Güte R · √(C / L)"}, expr: "r*sqrt(c/l)"}
  formula: ["l = kl * r / f", "c = kc / (f * r)", "q = r * sqrt(c / l)"]
  schematic: speaker_crossover

- id: l_pad
  kind: calculator
  category: filters
  name: {cs: "Útlumový článek L-pad", da: "L-pad-dæmpeled", de: "L-Pad-Abschwächer", el: "Εξασθενητής L-pad", en: "L-pad attenuator", es: "Atenuador L-pad", fr: "Atténuateur en L (L-pad)", hi: "एल-पैड एटेन्युएटर", it: "Attenuatore L-pad", ja: "L型アッテネータ（L-pad）", nl: "L-pad-verzwakker", no: "L-pad-dempeledd", pl: "Tłumik L-pad", pt: "Atenuador L-pad", sv: "L-pad-dämpsats", zh: "L型衰减器（L-pad）"}
  doc:
    en: "Loudspeaker L-pad: a series resistor R_s and a parallel resistor R_p across the driver lower the level of a driver (usually the tweeter) by A dB while the crossover still sees the driver's impedance Z. Two conditions fix the resistors: the input resistance R_s + (R_p ‖ Z) equals Z, and the divider ratio (R_p ‖ Z) / Z equals 1 / K. With the voltage ratio K = 10^(A / 20): R_s = Z × (K − 1) / K and R_p = Z / (K − 1). Enter any two of Z, A, R_s and R_p; from R_s and R_p alone Z = (R_s + √(R_s² + 4 × R_s × R_p)) / 2. Example with the defaults: 6 dB for an 8 Ω driver need R_s ≈ 3.99 Ω and R_p ≈ 8.04 Ω. The pad is constant-impedance only looking into it from the crossover (looking back from the driver the source resistance is no longer near zero), which is why L-pads belong on tweeters and not on woofers. It sits between the crossover and the driver, never in front of the crossover. The driver is treated as a pure resistance; the real impedance of a tweeter varies with frequency, which the parallel resistor reduces. This is the loudspeaker L-pad, not the RF L-pad that matches two different impedances. The calculator does not size the resistors' power: choose power ratings well above the power in this branch of the crossover, which is not the amplifier's rated power."
    de: "Lautsprecher-L-Glied: Ein Reihenwiderstand R_s und ein Parallelwiderstand R_p am Chassis senken den Pegel eines Chassis (meist des Hochtöners) um A dB ab, während die Weiche weiterhin die Impedanz Z des Chassis sieht. Zwei Bedingungen legen die Widerstände fest: Der Eingangswiderstand R_s + (R_p ‖ Z) ist gleich Z, und das Teilerverhältnis (R_p ‖ Z) / Z ist gleich 1 / K. Mit dem Spannungsverhältnis K = 10^(A / 20) gilt: R_s = Z · (K − 1) / K und R_p = Z / (K − 1). Zwei der Größen Z, A, R_s und R_p eingeben; aus R_s und R_p allein folgt Z = (R_s + √(R_s² + 4 · R_s · R_p)) / 2. Beispiel mit den Standardwerten: 6 dB bei einem 8-Ω-Chassis brauchen R_s ≈ 3,99 Ω und R_p ≈ 8,04 Ω. Die Impedanz bleibt nur beim Blick von der Weiche in das Glied konstant (vom Chassis aus gesehen ist der Quellwiderstand nicht mehr nahe null), deshalb gehören L-Glieder an Hochtöner und nicht an Tieftöner. Es sitzt zwischen Weiche und Chassis, nie vor der Weiche. Das Chassis gilt als reiner Widerstand; die echte Impedanz eines Hochtöners schwankt mit der Frequenz, was der Parallelwiderstand mildert. Das ist das Lautsprecher-L-Glied, nicht das HF-L-Glied, das zwei verschiedene Impedanzen anpasst. Der Rechner bemisst die Belastbarkeit der Widerstände nicht: Belastbarkeiten weit über der Leistung in diesem Weichenzweig wählen, die nicht die Nennleistung des Verstärkers ist."
  tags: [l-pad, l pad, attenuator, tweeter attenuation, speaker attenuator, level matching, sensitivity matching, crossover, series resistor, parallel resistor, constant impedance, l-glied, spannungsteiler, hochtöner absenken, pegelanpassung, pegelabsenkung, dämpfungsglied, frequenzweiche, vorwiderstand, parallelwiderstand, konstante impedanz]
  source: "Constant-impedance loudspeaker L-pad: input resistance R_s + R_p‖Z = Z and divider ratio 1/K with K = 10^(A/20), derived by Ohm's law; the same design steps and a worked example: R. Elliott, Design of Passive Crossovers, Elliott Sound Products, section Attenuation Networks"
  vars:
    z: {dim: resistance, label: Z, name: {en: "Driver impedance (resistive)", de: "Chassis-Impedanz (ohmsch)"}, default: "8"}
    a: {dim: gain, label: A, name: {en: "Attenuation", de: "Dämpfung"}, default: "6 dB"}
    rs: {dim: resistance, label: R_s, name: {en: "Series resistor", de: "Reihenwiderstand"}, eseries: true}
    rp: {dim: resistance, label: R_p, name: {en: "Parallel resistor (across the driver)", de: "Parallelwiderstand (parallel zum Chassis)"}, eseries: true}
  dof: 2
  rules:
    rs: ["z*(1-10^(-a/20))", "z^2/(z+rp)"]
    rp: ["z/(10^(a/20)-1)", "z*(z-rs)/rs"]
    a: ["20*log10(z/(z-rs))", "20*log10(1+z/rp)"]
    z: ["rs/(1-10^(-a/20))", "rp*(10^(a/20)-1)", "(rs+sqrt(rs^2+4*rs*rp))/2"]
  derived:
    k: {dim: number, label: K, name: {en: "Voltage ratio K = 10^(A / 20)", de: "Spannungsverhältnis K = 10^(A / 20)"}, expr: "10^(a/20)"}
  checks:
    - {when: "a <= 0", warn: {en: "No attenuation: no pad is needed (R_s = 0, R_p open).", de: "Keine Dämpfung: Es wird kein L-Glied gebraucht (R_s = 0, R_p offen)."}}
    - {when: "rs >= z", warn: {en: "R_s is not below Z: no constant-impedance pad exists with this series resistor.", de: "R_s liegt nicht unter Z: Mit diesem Reihenwiderstand gibt es kein impedanzrichtiges L-Glied."}}
  formula: ["k = 10^(a / 20)", "rs = z * (k - 1) / k", "rp = z / (k - 1)"]
  schematic: l_pad
