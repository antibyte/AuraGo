# RF calculators. Every name is written in all 16 desktop locales; docs, variable names and warnings in English and German
# (other languages fall back to English). Rules are written out for every direction, in the order the solver tries them:
# the first alternative whose variables are all known wins. The speed of light is the exact SI value 299792458 m/s.

- id: wavelength
  kind: calculator
  category: rf
  name: {cs: "Vlnová délka", da: "Bølgelængde", de: "Wellenlänge", el: "Μήκος κύματος", en: "Wavelength", es: "Longitud de onda", fr: "Longueur d'onde", hi: "तरंगदैर्घ्य", it: "Lunghezza d'onda", ja: "波長", nl: "Golflengte", no: "Bølgelengde", pl: "Długość fali", pt: "Comprimento de onda", sv: "Våglängd", zh: "波长"}
  doc:
    en: "The wavelength of an electromagnetic wave is λ = c × VF / f, with the speed of light c = 299 792 458 m/s (exact) and the velocity factor VF of the medium (1 in free space, about 0.66 in coax with a solid polyethylene dielectric). Any two of f, VF and λ determine the third; the half and the quarter wavelength are shown too. Example: 145 MHz in free space gives λ = 2.068 m."
    de: "Die Wellenlänge einer elektromagnetischen Welle ist λ = c · VF / f mit der Lichtgeschwindigkeit c = 299 792 458 m/s (exakt) und dem Verkürzungsfaktor VF des Mediums (1 im freien Raum, etwa 0,66 im Koaxkabel mit Vollpolyethylen). Je zwei der Größen f, VF und λ bestimmen die dritte; die halbe und die viertel Wellenlänge werden mitgeliefert. Beispiel: 145 MHz im freien Raum ergeben λ = 2,068 m."
  tags: [wavelength, lambda, frequency, velocity factor, speed of light, half wave, quarter wave, antenna, radio, rf, wellenlänge, frequenz, verkürzungsfaktor, lichtgeschwindigkeit, halbwelle, viertelwelle, antenne, funk, hf]
  source: "Wave relation λ = c/f with the exact speed of light c = 299 792 458 m/s (SI Brochure, BIPM); the velocity factor VF = v/c is the ratio of the propagation speed in the medium to c"
  vars:
    f: {dim: frequency, label: f, name: {en: "Frequency", de: "Frequenz"}, default: "145 MHz"}
    vf: {dim: number, label: VF, name: {en: "Velocity factor", de: "Verkürzungsfaktor"}, default: 1}
    wl: {dim: length, label: λ, name: {en: "Wavelength", de: "Wellenlänge"}, units: ["", "ft", "in"]}
  dof: 2
  rules:
    wl: ["299792458*vf/f"]
    f: ["299792458*vf/wl"]
    vf: ["wl*f/299792458"]
  derived:
    lhalf: {dim: length, label: λ/2, name: {en: "Half wavelength", de: "Halbe Wellenlänge"}, expr: "wl/2", units: ["", "ft", "in"]}
    lquarter: {dim: length, label: λ/4, name: {en: "Quarter wavelength", de: "Viertelwellenlänge"}, expr: "wl/4", units: ["", "ft", "in"]}
  checks:
    - {when: "vf > 1", warn: {en: "A velocity factor above 1 is not physical: the wave would be faster than light in vacuum.", de: "Ein Verkürzungsfaktor über 1 ist nicht physikalisch: die Welle wäre schneller als das Licht im Vakuum."}}
  formula: ["wl = 299792458 * vf / f"]

- id: dipole_length
  kind: calculator
  category: rf
  name: {cs: "Délka půlvlnného dipólu", da: "Halvbølgedipolens længde", de: "Länge des Halbwellendipols", el: "Μήκος διπόλου μισού κύματος", en: "Half-wave dipole length", es: "Longitud del dipolo de media onda", fr: "Longueur du dipôle demi-onde", hi: "अर्धतरंग द्विध्रुव की लंबाई", it: "Lunghezza del dipolo a mezz'onda", ja: "半波長ダイポールの長さ", nl: "Lengte van een halvegolfdipool", no: "Halvbølgedipolens lengde", pl: "Długość dipola półfalowego", pt: "Comprimento do dipolo de meia onda", sv: "Halvvågsdipolens längd", zh: "半波偶极子长度"}
  doc:
    en: "A resonant half-wave dipole is slightly shorter than half a free-space wavelength because of the end effect: L = K × c / (2 f), with a shortening factor K of about 0.95 for a wire dipole (the familiar 468 / f(MHz) feet corresponds to K ≈ 0.952). The quarter-wave length is half of L: one leg of the dipole, or a quarter-wave vertical over a ground plane. Example: 7.1 MHz (40 m band) gives L = 20.06 m. Trim for the lowest SWR; height, wire diameter and surroundings shift the resonance."
    de: "Ein resonanter Halbwellendipol ist wegen des Endeffekts etwas kürzer als die halbe Freiraumwellenlänge: L = K · c / (2 f), mit einem Verkürzungsfaktor K von etwa 0,95 für einen Drahtdipol (die bekannte Faustformel 468 / f(MHz) Fuß entspricht K ≈ 0,952). Die Viertelwellenlänge ist die Hälfte von L: ein Schenkel des Dipols oder ein Viertelwellenstrahler über einer Groundplane. Beispiel: 7,1 MHz (40-m-Band) ergeben L = 20,06 m. Auf das SWR-Minimum abgleichen; Höhe, Drahtdurchmesser und Umgebung verschieben die Resonanz."
  tags: [dipole, antenna, half wave, quarter wave, 468, wire antenna, length, ham radio, amateur radio, dipol, antenne, halbwellendipol, viertelwelle, drahtantenne, länge, funkamateur, amateurfunk]
  source: "Half-wave dipole L = K·c/(2f) with the end-effect shortening factor K (about 0.95); the rule of thumb 468/f(MHz) feet is widely published, e.g. The ARRL Antenna Book (dipole antennas) and J. D. Kraus: Antennas"
  vars:
    f: {dim: frequency, label: f, name: {en: "Frequency", de: "Frequenz"}, default: "7.1 MHz"}
    k: {dim: number, label: K, name: {en: "Shortening factor", de: "Verkürzungsfaktor"}, default: 0.95}
    lhalf: {dim: length, label: L, name: {en: "Half-wave length", de: "Länge des Halbwellendipols"}, units: ["", "ft", "in"]}
  dof: 2
  rules:
    lhalf: ["k*299792458/(2*f)"]
    f: ["k*299792458/(2*lhalf)"]
    k: ["2*f*lhalf/299792458"]
  derived:
    lquarter: {dim: length, label: L/2, name: {en: "Quarter-wave length", de: "Viertelwellenlänge"}, expr: "lhalf/2", units: ["", "ft", "in"]}
  checks:
    - {when: "k > 1", warn: {en: "A shortening factor above 1 is unusual: the end effect makes a resonant dipole shorter than half the free-space wavelength.", de: "Ein Verkürzungsfaktor über 1 ist ungewöhnlich: Der Endeffekt macht einen resonanten Dipol kürzer als die halbe Freiraumwellenlänge."}}
  formula: ["lhalf = k * 299792458 / (2 * f)", "lquarter = lhalf / 2"]

- id: microstrip_impedance
  kind: calculator
  category: rf
  name: {cs: "Impedance mikropáskového vedení", da: "Mikrostrip-impedans", de: "Mikrostrip-Impedanz", el: "Αντίσταση γραμμής microstrip", en: "Microstrip impedance", es: "Impedancia de microstrip", fr: "Impédance d'une ligne microruban", hi: "माइक्रोस्ट्रिप प्रतिबाधा", it: "Impedenza della microstriscia", ja: "マイクロストリップ線路の特性インピーダンス", nl: "Microstrip-impedantie", no: "Mikrostrip-impedans", pl: "Impedancja linii mikropaskowej", pt: "Impedância de microstrip", sv: "Mikrostrip-impedans", zh: "微带线特性阻抗"}
  doc:
    en: "Characteristic impedance of a surface microstrip line on a PCB by the IPC-2141 approximation: Z_0 = 87 / √(ε_r + 1.41) × ln(5.98 h / (0.8 w + t)), with the dielectric thickness h, the trace width w and the copper thickness t. The formula is usually quoted for 0.1 < w/h < 2.0 and 1 < ε_r < 15; outside that range the result is only a rough guide and a warning appears. Use it for a first design and have critical lines checked with a field solver or the impedance data of the board maker. Example: a 3 mm trace on 1.6 mm FR-4 (ε_r ≈ 4.3, 1 oz copper) gives about 49.8 Ω. ε_r depends on the laminate and the frequency: use the datasheet value."
    de: "Wellenwiderstand einer Mikrostrip-Leitung an der Oberfläche einer Leiterplatte nach der Näherung der IPC-2141: Z_0 = 87 / √(ε_r + 1,41) · ln(5,98 h / (0,8 w + t)) mit der Dielektrikumsdicke h, der Leiterbahnbreite w und der Kupferdicke t. Die Formel wird üblicherweise für 0,1 < w/h < 2,0 und 1 < ε_r < 15 angegeben; außerhalb ist das Ergebnis nur ein grober Anhalt und eine Warnung erscheint. Für einen ersten Entwurf geeignet; kritische Leitungen mit einem Feldlöser oder den Impedanzdaten des Leiterplattenherstellers prüfen. Beispiel: 3 mm Leiterbahn auf 1,6 mm FR-4 (ε_r ≈ 4,3, 1 oz Kupfer) ergibt etwa 49,8 Ω. ε_r hängt vom Laminat und von der Frequenz ab: den Datenblattwert verwenden."
  tags: [microstrip, pcb, impedance, transmission line, trace width, 50 ohm, ipc-2141, controlled impedance, rf, mikrostrip, leiterplatte, impedanz, wellenwiderstand, leiterbahnbreite, leitung, impedanzkontrolliert, hf]
  source: "IPC-2141 (design guide for high-speed controlled impedance circuit boards), surface microstrip approximation Z0 = 87/√(εr+1.41)·ln(5.98h/(0.8w+t)), as commonly quoted for 0.1 < w/h < 2.0 and 1 < εr < 15"
  vars:
    er: {dim: number, label: ε_r, name: {en: "Relative permittivity", de: "Relative Permittivität"}, default: 4.3}
    h: {dim: length, label: h, name: {en: "Dielectric thickness", de: "Dicke des Dielektrikums"}, default: "1.6 mm", units: ["", "mil", "in"]}
    w: {dim: length, label: w, name: {en: "Trace width", de: "Leiterbahnbreite"}, default: "3 mm", units: ["", "mil", "in"]}
    t: {dim: length, label: t, name: {en: "Copper thickness", de: "Kupferdicke"}, default: "1 oz", unit: oz, units: ["", "oz", "mil"]}
    z0: {dim: resistance, label: Z_0, name: {en: "Characteristic impedance", de: "Wellenwiderstand"}}
  dof: 4
  rules:
    z0: ["87/sqrt(er+1.41)*ln(5.98*h/(0.8*w+t))"]
    er: ["(87*ln(5.98*h/(0.8*w+t))/z0)^2-1.41"]
    h: ["(0.8*w+t)*exp(z0*sqrt(er+1.41)/87)/5.98"]
    w: ["(5.98*h*exp(-z0*sqrt(er+1.41)/87)-t)/0.8"]
    t: ["5.98*h*exp(-z0*sqrt(er+1.41)/87)-0.8*w"]
  derived:
    wh: {dim: number, label: w/h, name: {en: "Width-to-height ratio", de: "Verhältnis Breite zu Höhe"}, expr: "w/h"}
  checks:
    - {when: "wh < 0.1", warn: {en: "w/h is below 0.1: outside the range the IPC-2141 approximation is quoted for (0.1 to 2.0), expect a larger error.", de: "w/h liegt unter 0,1: außerhalb des Bereichs, für den die IPC-2141-Näherung angegeben wird (0,1 bis 2,0), ist mit einem größeren Fehler zu rechnen."}}
    - {when: "wh > 2", warn: {en: "w/h is above 2.0: outside the range the IPC-2141 approximation is quoted for (0.1 to 2.0), expect a larger error.", de: "w/h liegt über 2,0: außerhalb des Bereichs, für den die IPC-2141-Näherung angegeben wird (0,1 bis 2,0), ist mit einem größeren Fehler zu rechnen."}}
    - {when: "if(er < 1, 1, er > 15)", warn: {en: "ε_r is outside the range 1 to 15 the approximation is quoted for.", de: "ε_r liegt außerhalb des Bereichs 1 bis 15, für den die Näherung angegeben wird."}}
  formula: ["z0 = 87 / sqrt(er + 1.41) * ln(5.98 * h / (0.8 * w + t))"]

- id: coax_impedance
  kind: calculator
  category: rf
  name: {cs: "Impedance koaxiálního kabelu", da: "Koaksialkablets impedans", de: "Wellenwiderstand eines Koaxialkabels", el: "Χαρακτηριστική αντίσταση ομοαξονικού καλωδίου", en: "Coaxial cable impedance", es: "Impedancia de un cable coaxial", fr: "Impédance d'un câble coaxial", hi: "समाक्षीय केबल की प्रतिबाधा", it: "Impedenza del cavo coassiale", ja: "同軸ケーブルの特性インピーダンス", nl: "Impedantie van een coaxkabel", no: "Koaksialkabelens impedans", pl: "Impedancja kabla koncentrycznego", pt: "Impedância de um cabo coaxial", sv: "Koaxialkabelns impedans", zh: "同轴电缆特性阻抗"}
  doc:
    en: "Characteristic impedance of a lossless coaxial line: Z_0 = (η_0 / 2π) / √ε_r × ln(D / d), with η_0 / 2π = 59.958 Ω (η_0 = μ_0·c ≈ 376.73 Ω), the inner diameter D of the shield, the diameter d of the inner conductor and the relative permittivity ε_r of the dielectric. This is the same as the familiar 138 / √ε_r × log10(D / d). The velocity factor is 1 / √ε_r. Example: solid polyethylene (ε_r = 2.25) with D / d = 3.5 gives about 50 Ω (VF 0.667). PTFE has ε_r ≈ 2.1."
    de: "Wellenwiderstand einer verlustfreien Koaxialleitung: Z_0 = (η_0 / 2π) / √ε_r · ln(D / d), mit η_0 / 2π = 59,958 Ω (η_0 = μ_0·c ≈ 376,73 Ω), dem Innendurchmesser D des Außenleiters, dem Durchmesser d des Innenleiters und der relativen Permittivität ε_r des Dielektrikums. Das entspricht der bekannten Form 138 / √ε_r · log10(D / d). Der Verkürzungsfaktor ist 1 / √ε_r. Beispiel: Vollpolyethylen (ε_r = 2,25) mit D / d = 3,5 ergibt etwa 50 Ω (VF 0,667). PTFE hat ε_r ≈ 2,1."
  tags: [coax, coaxial cable, impedance, characteristic impedance, dielectric, velocity factor, 50 ohm, 75 ohm, rg58, transmission line, rf, koaxkabel, koaxialkabel, wellenwiderstand, impedanz, dielektrikum, verkürzungsfaktor, leitung, hf]
  source: "Lossless coaxial line Z0 = (η0/2π)·ln(D/d)/√εr with η0 = μ0·c ≈ 376.73 Ω; D. M. Pozar: Microwave Engineering, ch. 2 (transmission line theory)"
  vars:
    er: {dim: number, label: ε_r, name: {en: "Relative permittivity of the dielectric", de: "Relative Permittivität des Dielektrikums"}, default: 2.25}
    dout: {dim: length, label: D, name: {en: "Inner diameter of the shield", de: "Innendurchmesser des Außenleiters"}, default: "3.5 mm", units: ["", "mil", "in"]}
    din: {dim: length, label: d, name: {en: "Diameter of the inner conductor", de: "Durchmesser des Innenleiters"}, default: "1 mm", units: ["", "mil", "in", "AWG"]}
    z0: {dim: resistance, label: Z_0, name: {en: "Characteristic impedance", de: "Wellenwiderstand"}}
  dof: 3
  rules:
    z0: ["59.95849163/sqrt(er)*ln(dout/din)"]
    er: ["(59.95849163*ln(dout/din)/z0)^2"]
    dout: ["din*exp(z0*sqrt(er)/59.95849163)"]
    din: ["dout/exp(z0*sqrt(er)/59.95849163)"]
  derived:
    vfac: {dim: number, label: VF, name: {en: "Velocity factor", de: "Verkürzungsfaktor"}, expr: "1/sqrt(er)"}
  checks:
    - {when: "din >= dout", warn: {en: "The inner conductor diameter d must be smaller than the inner diameter D of the shield.", de: "Der Durchmesser d des Innenleiters muss kleiner sein als der Innendurchmesser D des Außenleiters."}}
  formula: ["z0 = 59.95849163 / sqrt(er) * ln(dout / din)", "vfac = 1 / sqrt(er)"]

- id: swr_return_loss
  kind: calculator
  category: rf
  name: {cs: "PSV a útlum odrazu", da: "SWR og returtab", de: "SWR und Rückflussdämpfung", el: "SWR και απώλεια επιστροφής", en: "SWR and return loss", es: "ROE y pérdida de retorno", fr: "ROS et perte de retour", hi: "एसडब्ल्यूआर और रिटर्न लॉस", it: "ROS e perdita di ritorno", ja: "VSWRとリターンロス", nl: "SWR en retourverlies", no: "SWR og returtap", pl: "WFS i tłumienie odbicia", pt: "ROE e perda de retorno", sv: "SWR och returförlust", zh: "驻波比与回波损耗"}
  doc:
    en: "A mismatch reflects part of the wave. With the magnitude of the reflection coefficient |Γ|: SWR = (1 + |Γ|) / (1 − |Γ|), return loss RL = −20 log10 |Γ| (larger means a better match) and mismatch loss = −10 log10 (1 − |Γ|²), the power lost to reflection. |Γ|² is the reflected fraction of the power. Enter any one of SWR, |Γ| or RL. Example: SWR 2:1 gives |Γ| = 0.333, RL = 9.54 dB, a mismatch loss of 0.51 dB and 11.1 % reflected power."
    de: "Eine Fehlanpassung reflektiert einen Teil der Welle. Mit dem Betrag des Reflexionsfaktors |Γ| gilt: SWR = (1 + |Γ|) / (1 − |Γ|), Rückflussdämpfung RL = −20 log10 |Γ| (größer heißt besser angepasst) und Fehlanpassungsdämpfung = −10 log10 (1 − |Γ|²), die durch Reflexion verlorene Leistung. |Γ|² ist der reflektierte Anteil der Leistung. Eine der Größen SWR, |Γ| oder RL eingeben. Beispiel: SWR 2:1 ergibt |Γ| = 0,333, RL = 9,54 dB, eine Fehlanpassungsdämpfung von 0,51 dB und 11,1 % reflektierte Leistung."
  tags: [swr, vswr, return loss, reflection coefficient, mismatch, mismatch loss, antenna, transmission line, reflected power, rf, stehwellenverhältnis, rückflussdämpfung, reflexionsfaktor, fehlanpassung, fehlanpassungsdämpfung, antenne, reflektierte leistung, hf]
  source: "Reflection coefficient Γ, standing wave ratio, return loss and mismatch loss (definitions); D. M. Pozar: Microwave Engineering, ch. 2 (transmission line theory)"
  vars:
    swr: {dim: number, label: SWR, name: {en: "Standing wave ratio", de: "Stehwellenverhältnis"}, default: 2}
    gamma: {dim: ratio, label: "|Γ|", name: {en: "Reflection coefficient |Γ|", de: "Reflexionsfaktor |Γ|"}}
    rl: {dim: gain, label: RL, name: {en: "Return loss", de: "Rückflussdämpfung"}}
  dof: 1
  rules:
    swr: ["(1+gamma)/(1-gamma)"]
    gamma: ["(swr-1)/(swr+1)", "10^(-rl/20)"]
    rl: ["-20*log10(gamma)"]
  derived:
    prefl: {dim: ratio, label: "|Γ|²", name: {en: "Reflected power", de: "Reflektierte Leistung"}, expr: "gamma^2", unit: pct}
    ml: {dim: gain, label: ML, name: {en: "Mismatch loss", de: "Fehlanpassungsdämpfung"}, expr: "-10*log10(1-gamma^2)"}
  checks:
    - {when: "swr < 1", warn: {en: "An SWR below 1 is not possible: the SWR is at least 1 (a perfect match).", de: "Ein SWR unter 1 ist nicht möglich: Das SWR beträgt mindestens 1 (perfekte Anpassung)."}}
    - {when: "gamma > 1", warn: {en: "|Γ| above 1 is not possible for a passive load: it cannot reflect more than it receives.", de: "|Γ| über 1 ist bei einer passiven Last nicht möglich: Sie kann nicht mehr reflektieren, als sie erhält."}}
  formula: ["swr = (1 + gamma) / (1 - gamma)", "rl = -20 * log10(gamma)", "ml = -10 * log10(1 - gamma^2)"]

- id: rf_power_levels
  kind: calculator
  category: rf
  name: {cs: "Výkon a napětí v RF (dBm, dBµV)", da: "RF-effekt og -spænding (dBm, dBµV)", de: "HF-Leistung und -Spannung (dBm, dBµV)", el: "Ισχύς και τάση RF (dBm, dBµV)", en: "RF power and voltage (dBm, dBµV)", es: "Potencia y tensión de RF (dBm, dBµV)", fr: "Puissance et tension RF (dBm, dBµV)", hi: "आरएफ शक्ति और वोल्टेज (dBm, dBµV)", it: "Potenza e tensione RF (dBm, dBµV)", ja: "RF電力と電圧（dBm、dBµV）", nl: "RF-vermogen en -spanning (dBm, dBµV)", no: "RF-effekt og -spenning (dBm, dBµV)", pl: "Moc i napięcie RF (dBm, dBµV)", pt: "Potência e tensão de RF (dBm, dBµV)", sv: "RF-effekt och -spänning (dBm, dBµV)", zh: "射频功率与电压（dBm、dBµV）"}
  doc:
    en: "Converts between power, voltage and the logarithmic RF levels of a sine wave across a resistance R (usually 50 Ω): P = V_rms² / R and V_pp = 2√2 × V_rms. dBm is relative to 1 mW (10 log10 (P / 1 mW)), dBµV to 1 µV (20 log10 (V / 1 µV)); across 50 Ω dBµV = dBm + 107. Enter two of P, R, V_rms and V_pp (V_rms and V_pp alone are not enough). To enter a level in dBm choose dBm in the unit menu of the power field. Example: 0 dBm (1 mW) into 50 Ω is 223.6 mV rms, 632.5 mV peak to peak and 107 dBµV."
    de: "Rechnet für eine Sinusspannung an einem Widerstand R (meist 50 Ω) zwischen Leistung, Spannung und den logarithmischen HF-Pegeln um: P = V_eff² / R und V_ss = 2√2 · V_eff. dBm bezieht sich auf 1 mW (10 log10 (P / 1 mW)), dBµV auf 1 µV (20 log10 (V / 1 µV)); an 50 Ω gilt dBµV = dBm + 107. Zwei der Größen P, R, V_eff und V_ss eingeben (V_eff und V_ss allein reichen nicht). Einen Pegel in dBm gibt man über das Einheitenmenü des Leistungsfelds ein. Beispiel: 0 dBm (1 mW) an 50 Ω sind 223,6 mV effektiv, 632,5 mV Spitze-Spitze und 107 dBµV."
  tags: [dbm, dbuv, dbµv, rf power, level, 50 ohm, milliwatt, microvolt, peak to peak, rms, signal level, rf, hf-leistung, pegel, effektivwert, spitze-spitze, signalpegel, hf]
  source: "Definitions: dBm = 10·log10(P / 1 mW), dBµV = 20·log10(V / 1 µV), P = V_rms²/R and V_pp = 2√2·V_rms for a sine wave; decibel per IEC 60027-3"
  vars:
    p: {dim: power, label: P, name: {en: "Power", de: "Leistung"}, default: "1 mW", units: ["", "dBm"]}
    r: {dim: resistance, label: R, name: {en: "Resistance", de: "Widerstand"}, default: "50"}
    vrms: {dim: voltage, label: V_rms, name: {en: "RMS voltage", de: "Effektivspannung"}, units: ["", "dBuV"]}
    vpp: {dim: voltage, label: V_pp, name: {en: "Peak-to-peak voltage", de: "Spitze-Spitze-Spannung"}, units: [""]}
  dof: 2
  rules:
    p: ["vrms^2/r"]
    r: ["vrms^2/p"]
    vrms: ["sqrt(p*r)", "vpp/(2*sqrt(2))"]
    vpp: ["2*sqrt(2)*vrms"]
  derived:
    p_dbm: {dim: power, label: P_dBm, name: {en: "Power level", de: "Leistungspegel"}, expr: "p", unit: dBm}
    v_dbuv: {dim: voltage, label: V_dBµV, name: {en: "Voltage level re 1 µV", de: "Spannungspegel bezogen auf 1 µV"}, expr: "vrms", unit: dBuV}
  formula: ["p = vrms^2 / r", "vpp = 2 * sqrt(2) * vrms"]

- id: fspl
  kind: calculator
  category: rf
  name: {cs: "Útlum volným prostorem", da: "Dæmpning i frit rum", de: "Freiraumdämpfung", el: "Απώλεια διαδρομής ελεύθερου χώρου", en: "Free-space path loss", es: "Pérdida en el espacio libre", fr: "Affaiblissement en espace libre", hi: "मुक्त-स्थान पथ हानि", it: "Attenuazione nello spazio libero", ja: "自由空間伝搬損失", nl: "Vrije-ruimteverlies", no: "Demping i fritt rom", pl: "Tłumienie w wolnej przestrzeni", pt: "Perda no espaço livre", sv: "Frirymdsdämpning", zh: "自由空间路径损耗"}
  doc:
    en: "Free-space path loss between two isotropic antennas in the far field: FSPL = 20 log10 (4π d f / c) in dB, with the distance d, the frequency f and c = 299 792 458 m/s. Each doubling of the distance or the frequency adds 6.02 dB. It is the loss of the path alone, without antenna gains, cable loss or obstacles. Example: 1 km at 2.4 GHz gives 100.05 dB. The formula holds in the far field only (d much larger than λ); for d < λ / (4π) it would turn negative."
    de: "Freiraumdämpfung zwischen zwei isotropen Antennen im Fernfeld: FSPL = 20 log10 (4π d f / c) in dB mit dem Abstand d, der Frequenz f und c = 299 792 458 m/s. Jede Verdopplung von Abstand oder Frequenz fügt 6,02 dB hinzu. Es ist nur die Dämpfung der Strecke, ohne Antennengewinne, Kabeldämpfung oder Hindernisse. Beispiel: 1 km bei 2,4 GHz ergeben 100,05 dB. Die Formel gilt nur im Fernfeld (d deutlich größer als λ); für d < λ / (4π) würde die Dämpfung negativ."
  tags: [fspl, free space path loss, path loss, friis, link budget, attenuation, distance, wireless, radio, rf, freiraumdämpfung, streckendämpfung, funkfeld, dämpfung, entfernung, funk, hf]
  source: "Friis free-space transmission formula (H. T. Friis, 1946), FSPL = (4πdf/c)²; ITU-R Recommendation P.525 (calculation of free-space attenuation)"
  vars:
    d: {dim: length, label: d, name: {en: "Distance", de: "Abstand"}, default: "1 km", units: ["", "ft"]}
    f: {dim: frequency, label: f, name: {en: "Frequency", de: "Frequenz"}, default: "2.4 GHz"}
    loss: {dim: gain, label: FSPL, name: {en: "Free-space path loss", de: "Freiraumdämpfung"}}
  dof: 2
  rules:
    loss: ["20*log10(4*pi*d*f/299792458)"]
    d: ["299792458/(4*pi*f)*10^(loss/20)"]
    f: ["299792458/(4*pi*d)*10^(loss/20)"]
  derived:
    wl: {dim: length, label: λ, name: {en: "Wavelength", de: "Wellenlänge"}, expr: "299792458/f", units: ["", "ft", "in"]}
  checks:
    - {when: "loss < 0", warn: {en: "A negative loss: the distance is shorter than λ / (4π), far outside the far-field range of the formula.", de: "Negative Dämpfung: Der Abstand ist kürzer als λ / (4π), weit außerhalb des Fernfeldbereichs der Formel."}}
  formula: ["loss = 20 * log10(4 * pi * d * f / 299792458)"]

- id: skin_depth
  kind: calculator
  category: rf
  name: {cs: "Hloubka vniku (skinefekt)", da: "Skindybde", de: "Skin-Tiefe (Eindringtiefe)", el: "Βάθος διείσδυσης (επιδερμικό φαινόμενο)", en: "Skin depth", es: "Profundidad de penetración (efecto pelicular)", fr: "Épaisseur de peau", hi: "त्वचा गहराई (स्किन डेप्थ)", it: "Profondità di penetrazione (effetto pelle)", ja: "表皮深さ", nl: "Skindiepte", no: "Skinndybde", pl: "Głębokość wnikania (efekt naskórkowy)", pt: "Profundidade pelicular", sv: "Skinndjup", zh: "趋肤深度"}
  doc:
    en: "The skin depth δ = √(ρ / (π f μ_0 μ_r)) is the depth at which the current density of an alternating current in a good conductor has fallen to 1/e (about 37 %) of its surface value. Most of the current flows within a few δ of the surface, which raises the AC resistance of thick wires; R_s = ρ / δ is the surface resistance per square. Copper, silver, gold and aluminium are non-magnetic (μ_r = 1). The resistivities are values for 20 °C and change by about 0.4 % per kelvin; real wire and plating differ from the pure metal. Example: copper at 1 MHz has δ = 66.1 µm."
    de: "Die Skin-Tiefe δ = √(ρ / (π f μ_0 μ_r)) ist die Tiefe, in der die Stromdichte eines Wechselstroms in einem guten Leiter auf 1/e (etwa 37 %) ihres Wertes an der Oberfläche gefallen ist. Der meiste Strom fließt innerhalb weniger δ unter der Oberfläche, was den Wechselstromwiderstand dicker Drähte erhöht; R_s = ρ / δ ist der Oberflächenwiderstand pro Quadrat. Kupfer, Silber, Gold und Aluminium sind nicht magnetisch (μ_r = 1). Die spezifischen Widerstände gelten für 20 °C und ändern sich um etwa 0,4 % pro Kelvin; echter Draht und Beschichtungen weichen vom reinen Metall ab. Beispiel: Kupfer bei 1 MHz hat δ = 66,1 µm."
  tags: [skin depth, skin effect, penetration depth, conductor, copper, ac resistance, surface resistance, rf, skin-tiefe, skineffekt, eindringtiefe, leiter, kupfer, wechselstromwiderstand, oberflächenwiderstand, hf]
  source: "Skin depth δ = √(ρ/(π f μ0 μr)) in a good conductor (D. M. Pozar: Microwave Engineering, ch. 1) with μ0 = 4π·10^-7 H/m; resistivity at 20 °C: copper 1.7241e-8 Ω·m (annealed copper standard, 58 MS/m, IEC 60028), silver 1.587e-8, gold 2.214e-8 and aluminium 2.65e-8 Ω·m (pure-metal handbook values, e.g. CRC Handbook of Chemistry and Physics)"
  vars:
    f: {dim: frequency, label: f, name: {en: "Frequency", de: "Frequenz"}, default: "1 MHz"}
    delta: {dim: length, label: δ, name: {en: "Skin depth", de: "Skin-Tiefe"}, units: ["", "mil", "in"]}
  choices:
    material:
      name: {cs: "Materiál", da: "Materiale", de: "Material", el: "Υλικό", en: "Material", es: "Material", fr: "Matériau", hi: "सामग्री", it: "Materiale", ja: "材料", nl: "Materiaal", no: "Materiale", pl: "Materiał", pt: "Material", sv: "Material", zh: "材料"}
      default: copper
      options:
        copper:
          name: {cs: "Měď", da: "Kobber", de: "Kupfer", el: "Χαλκός", en: "Copper", es: "Cobre", fr: "Cuivre", hi: "तांबा", it: "Rame", ja: "銅", nl: "Koper", no: "Kobber", pl: "Miedź", pt: "Cobre", sv: "Koppar", zh: "铜"}
          consts: {rho: 1.7241e-8}
        silver:
          name: {cs: "Stříbro", da: "Sølv", de: "Silber", el: "Άργυρος", en: "Silver", es: "Plata", fr: "Argent", hi: "चांदी", it: "Argento", ja: "銀", nl: "Zilver", no: "Sølv", pl: "Srebro", pt: "Prata", sv: "Silver", zh: "银"}
          consts: {rho: 1.587e-8}
        gold:
          name: {cs: "Zlato", da: "Guld", de: "Gold", el: "Χρυσός", en: "Gold", es: "Oro", fr: "Or", hi: "सोना", it: "Oro", ja: "金", nl: "Goud", no: "Gull", pl: "Złoto", pt: "Ouro", sv: "Guld", zh: "金"}
          consts: {rho: 2.214e-8}
        aluminium:
          name: {cs: "Hliník", da: "Aluminium", de: "Aluminium", el: "Αλουμίνιο", en: "Aluminium", es: "Aluminio", fr: "Aluminium", hi: "एल्युमिनियम", it: "Alluminio", ja: "アルミニウム", nl: "Aluminium", no: "Aluminium", pl: "Aluminium", pt: "Alumínio", sv: "Aluminium", zh: "铝"}
          consts: {rho: 2.65e-8}
  dof: 1
  rules:
    delta: ["sqrt(rho/(pi*f*4*pi*1e-7))"]
    f: ["rho/(pi*delta^2*4*pi*1e-7)"]
  derived:
    rs: {dim: resistance, label: R_s, name: {en: "Surface resistance per square", de: "Oberflächenwiderstand pro Quadrat"}, expr: "rho/delta"}
  formula: ["delta = sqrt(rho / (pi * f * 4 * pi * 1e-7))", "rs = rho / delta"]

- id: thermal_noise
  kind: calculator
  category: rf
  name: {cs: "Tepelný šum (Johnsonův)", da: "Termisk støj (Johnson)", de: "Thermisches Rauschen (Johnson)", el: "Θερμικός θόρυβος (Johnson)", en: "Thermal (Johnson) noise", es: "Ruido térmico (Johnson)", fr: "Bruit thermique (Johnson)", hi: "तापीय (जॉनसन) शोर", it: "Rumore termico (Johnson)", ja: "熱雑音（ジョンソン雑音）", nl: "Thermische ruis (Johnson)", no: "Termisk støy (Johnson)", pl: "Szum termiczny (Johnsona)", pt: "Ruído térmico (Johnson)", sv: "Termiskt brus (Johnson)", zh: "热噪声（约翰逊噪声）"}
  doc:
    en: "A resistor R at the absolute temperature T generates a white noise voltage: v_n = √(4 × k × T × R × B) (RMS, open circuit) in the noise bandwidth B, with the Boltzmann constant k = 1.380 649 × 10⁻²³ J/K (exact in the SI). The same noise seen as a short-circuit current is i_n = v_n / R. The voltage density e_n = √(4kTR) is shown as a voltage: it is the value in V per √Hz, so 1 kΩ at 290 K gives about 4 nV/√Hz. The available noise power is P_n = k × T × B. It is what the resistor delivers into a matched, noiseless load, it does not depend on R, and at 290 K in 1 Hz it is −173.975 dBm (the familiar −174 dBm/Hz). Do not compute it as v_n² / R: that value is 6 dB too high, only v_n² / (4R) equals kTB. Choose the display unit dBm for P_n and dBV for v_n. B is the noise bandwidth, not the −3 dB frequency: for a first-order low-pass it is 1.57 times the corner frequency, for higher orders it approaches the corner frequency. Enter any three of R, T, B and v_n. Values are RMS; real resistors add current-dependent excess noise at low frequencies and an amplifier adds its own noise. Example: 1 kΩ, 290 K and 1 Hz give e_n = 4.002 nV/√Hz."
    de: "Ein Widerstand R bei der absoluten Temperatur T erzeugt eine weiße Rauschspannung: v_n = √(4 · k · T · R · B) (Effektivwert, Leerlauf) in der Rauschbandbreite B, mit der Boltzmann-Konstante k = 1,380 649 · 10⁻²³ J/K (im SI exakt). Dasselbe Rauschen als Kurzschlussstrom ist i_n = v_n / R. Die Spannungsdichte e_n = √(4kTR) wird als Spannung angezeigt: Es ist der Wert in V pro √Hz, 1 kΩ bei 290 K ergeben also etwa 4 nV/√Hz. Die verfügbare Rauschleistung ist P_n = k · T · B. Das ist die Leistung, die der Widerstand an eine angepasste, rauschfreie Last abgibt; sie hängt nicht von R ab und beträgt bei 290 K in 1 Hz −173,975 dBm (das bekannte −174 dBm/Hz). Sie ist nicht v_n² / R: Dieser Wert wäre 6 dB zu hoch, nur v_n² / (4R) ist gleich kTB. Für P_n die Anzeigeeinheit dBm wählen, für v_n dBV. B ist die Rauschbandbreite, nicht die −3-dB-Frequenz: Bei einem Tiefpass erster Ordnung ist sie das 1,57-Fache der Eckfrequenz, bei höheren Ordnungen nähert sie sich der Eckfrequenz. Drei der Größen R, T, B und v_n eingeben. Alle Werte sind Effektivwerte; reale Widerstände erzeugen bei tiefen Frequenzen zusätzlich stromabhängiges Rauschen, und ein Verstärker bringt sein eigenes Rauschen mit. Beispiel: 1 kΩ, 290 K und 1 Hz ergeben e_n = 4,002 nV/√Hz."
  tags: [thermal noise, johnson noise, nyquist noise, resistor noise, noise voltage, noise current, noise density, nv/√hz, ktb, noise floor, -174 dbm/hz, dbm, dbv, boltzmann constant, rf, thermisches rauschen, wärmerauschen, widerstandsrauschen, johnson-rauschen, nyquist-rauschen, rauschspannung, rauschstrom, rauschdichte, rauschgrenze, grundrauschen, boltzmann-konstante, hf]
  source: "Thermal noise v_n = √(4kTRB) of a resistor: Texas Instruments, Noise Analysis in Operational Amplifier Circuits (SLVA043B), Thermal Noise, and Analog Dialogue 24-2, Ask the Applications Engineer—7: Op-amp Noise; available noise power P = kTB: Rohde & Schwarz, dB or not dB? (application note 1MA98), section Noise; Boltzmann constant k = 1.380 649e-23 J/K exact: SI Brochure, 9th edition (BIPM)"
  vars:
    r: {dim: resistance, label: R, name: {en: "Resistance", de: "Widerstand"}, default: "1 kΩ"}
    t: {dim: temperature, label: T, name: {en: "Absolute temperature", de: "Absolute Temperatur"}, default: "290 K"}
    b: {dim: frequency, label: B, name: {en: "Noise bandwidth", de: "Rauschbandbreite"}, default: "1 Hz"}
    vn: {dim: voltage, label: v_n, name: {en: "RMS noise voltage (open circuit)", de: "Rauschspannung (Effektivwert, Leerlauf)"}}
  dof: 3
  rules:
    vn: ["sqrt(4*1.380649e-23*t*r*b)"]
    r: ["vn^2/(4*1.380649e-23*t*b)"]
    t: ["vn^2/(4*1.380649e-23*r*b)"]
    b: ["vn^2/(4*1.380649e-23*t*r)"]
  derived:
    en: {dim: voltage, label: e_n, name: {en: "Voltage noise density (value in V/√Hz)", de: "Rauschspannungsdichte (Wert in V/√Hz)"}, expr: "sqrt(4*1.380649e-23*t*r)", units: [""]}
    inoise: {dim: current, label: i_n, name: {en: "RMS noise current (short circuit)", de: "Rauschstrom (Effektivwert, Kurzschluss)"}, expr: "vn/r"}
    pn: {dim: power, label: P_n, name: {en: "Available noise power kTB", de: "Verfügbare Rauschleistung kTB"}, expr: "1.380649e-23*t*b"}
  checks:
    - {when: "t <= 0", warn: {en: "The temperature must be an absolute temperature above 0 K (°C + 273.15).", de: "Die Temperatur muss eine absolute Temperatur über 0 K sein (°C + 273,15)."}}
  formula: ["vn = sqrt(4 * 1.380649e-23 * t * r * b)", "en = sqrt(4 * 1.380649e-23 * t * r)", "pn = 1.380649e-23 * t * b"]

- id: l_match
  kind: calculator
  category: rf
  name: {cs: "L-článek pro impedanční přizpůsobení", da: "L-netværk til tilpasning", de: "L-Anpassnetzwerk", el: "Δίκτυο προσαρμογής L", en: "L-network matching", es: "Red L de adaptación", fr: "Réseau d'adaptation en L", hi: "L-नेटवर्क मिलान", it: "Rete di adattamento a L", ja: "L型整合回路", nl: "L-netwerk voor aanpassing", no: "L-nettverk for tilpasning", pl: "Układ dopasowujący typu L", pt: "Rede L de casamento", sv: "L-nät för anpassning", zh: "L型匹配网络"}
  doc:
    en: "Two reactive parts, one in series and one in parallel, transform a load resistance to a different source resistance at one frequency, for maximum power transfer. With R_hi the larger and R_lo the smaller of the two resistances the Q is fixed by their ratio: Q = √(R_hi / R_lo − 1). The series reactance is X_s = Q × R_lo (on the low-resistance side) and the parallel reactance is X_p = R_hi / Q (across the high resistance), so X_s × X_p = R_hi × R_lo. Low-pass variant (passes DC, attenuates harmonics): L = X_s / (2π f) in series, C = 1 / (2π f X_p) in parallel. High-pass variant (blocks DC): C = 1 / (2π f X_s) in series, L = X_p / (2π f) in parallel. The part values depend only on R_hi and R_lo, so source and load can be swapped, but the network must then be mirrored: the series element always sits on the low-resistance side and the shunt element across the high-resistance side. The drawing shows R_S < R_L (series element next to the source); with R_S > R_L put the series element next to R_L and the shunt element across R_S. Example: 100 Ω to 1 kΩ at 100 MHz gives Q = 3, X_s = 300 Ω, X_p = 333 Ω, so L = 477 nH and C = 4.77 pF (low-pass). Valid for purely resistive source and load, ideal lossless parts and one frequency; reactive parts of the source or load must be compensated first. With lumped parts this works up to roughly 1 to 2 GHz. The calculator gives no bandwidth: the Q of an L-network is fixed by the ratio and is not the loaded Q of a resonator, so the rule bandwidth = f / Q must not be used. For another Q use a three-element network."
    de: "Zwei Blindelemente, eines in Reihe und eines parallel, transformieren bei einer Frequenz einen Lastwiderstand auf einen anderen Quellwiderstand (Leistungsanpassung). Ist R_hi der größere und R_lo der kleinere der beiden Widerstände, so legt ihr Verhältnis die Güte fest: Q = √(R_hi / R_lo − 1). Der Längsblindwiderstand ist X_s = Q · R_lo (auf der Seite des kleinen Widerstands) und der Querblindwiderstand X_p = R_hi / Q (parallel zum großen Widerstand), also X_s · X_p = R_hi · R_lo. Tiefpassvariante (lässt Gleichstrom durch, dämpft Oberwellen): L = X_s / (2π f) in Reihe, C = 1 / (2π f X_p) parallel. Hochpassvariante (sperrt Gleichstrom): C = 1 / (2π f X_s) in Reihe, L = X_p / (2π f) parallel. Die Bauteilwerte hängen nur von R_hi und R_lo ab, Quelle und Last dürfen also vertauscht werden, das Netzwerk muss dann aber gespiegelt werden: Das Längselement liegt immer auf der Seite des kleinen Widerstands und das Querelement parallel zum großen. Die Zeichnung zeigt R_S < R_L (Längselement an der Quelle); bei R_S > R_L das Längselement an R_L und das Querelement parallel zu R_S legen. Beispiel: 100 Ω auf 1 kΩ bei 100 MHz ergeben Q = 3, X_s = 300 Ω, X_p = 333 Ω, also L = 477 nH und C = 4,77 pF (Tiefpass). Gilt für rein ohmsche Quelle und Last, ideale verlustfreie Bauteile und eine Frequenz; Blindanteile von Quelle oder Last müssen zuvor kompensiert werden. Mit konzentrierten Bauteilen funktioniert das bis etwa 1 bis 2 GHz. Der Rechner gibt keine Bandbreite an: Die Güte eines L-Glieds ist durch das Verhältnis festgelegt und nicht die Betriebsgüte eines Resonators, die Regel Bandbreite = f / Q darf also nicht verwendet werden. Für eine andere Güte ein Netzwerk mit drei Elementen verwenden."
  tags: [l-match, l match, l-network, l network, impedance matching, matching network, antenna tuner, antenna matching, rf matching, q factor, low-pass match, high-pass match, impedance transformation, rf, l-glied, l-netzwerk, anpassnetzwerk, impedanzanpassung, leistungsanpassung, antennenanpassung, antennentuner, hf-anpassung, güte, tiefpass-anpassglied, hochpass-anpassglied, impedanztransformation, hf]
  source: "Two-reactance (L) matching network, Q = √(R_hi/R_lo − 1), X_s = Q·R_lo, X_p = R_hi/Q with the shunt reactance across the larger resistance: NXP (Motorola/Freescale) application note AN721, Impedance Matching Networks Applied to RF Power Transistors, section Two-Reactance Matching Networks; M. Steer, Microwave and RF Design III: Networks, section The L Matching Network"
  vars:
    rs: {dim: resistance, label: R_S, name: {en: "Source resistance", de: "Quellwiderstand"}, default: "100 Ω"}
    rl: {dim: resistance, label: R_L, name: {en: "Load resistance", de: "Lastwiderstand"}, default: "1 kΩ"}
    f: {dim: frequency, label: f, name: {en: "Frequency", de: "Frequenz"}, default: "100 MHz"}
    l: {dim: inductance, label: L, name: {en: "Inductor", de: "Spule"}, input: false}
    c: {dim: capacitance, label: C, name: {en: "Capacitor", de: "Kondensator"}, input: false}
  choices:
    variant:
      name: {cs: "Varianta", da: "Variant", de: "Variante", el: "Παραλλαγή", en: "Variant", es: "Variante", fr: "Variante", hi: "प्रकार", it: "Variante", ja: "方式", nl: "Variant", no: "Variant", pl: "Wariant", pt: "Variante", sv: "Variant", zh: "类型"}
      default: lowpass
      options:
        lowpass:
          name: {cs: "Dolní propust (L sériově, C paralelně)", da: "Lavpas (serie-L, shunt-C)", de: "Tiefpass (Längs-L, Quer-C)", el: "Βαθυπερατό (L σε σειρά, C παράλληλα)", en: "Low-pass (series L, shunt C)", es: "Paso bajo (L serie, C paralelo)", fr: "Passe-bas (L série, C parallèle)", hi: "लो-पास (श्रेणी L, समांतर C)", it: "Passa-basso (L serie, C parallelo)", ja: "ローパス（直列L、並列C）", nl: "Laagdoorlaat (serie-L, parallel-C)", no: "Lavpass (serie-L, parallell-C)", pl: "Dolnoprzepustowy (L szeregowo, C równolegle)", pt: "Passa-baixas (L série, C paralelo)", sv: "Lågpass (serie-L, parallell-C)", zh: "低通（串联L，并联C）"}
          consts: {lp: 1}
        highpass:
          name: {cs: "Horní propust (C sériově, L paralelně)", da: "Højpas (serie-C, shunt-L)", de: "Hochpass (Längs-C, Quer-L)", el: "Υψιπερατό (C σε σειρά, L παράλληλα)", en: "High-pass (series C, shunt L)", es: "Paso alto (C serie, L paralelo)", fr: "Passe-haut (C série, L parallèle)", hi: "हाई-पास (श्रेणी C, समांतर L)", it: "Passa-alto (C serie, L parallelo)", ja: "ハイパス（直列C、並列L）", nl: "Hoogdoorlaat (serie-C, parallel-L)", no: "Høypass (serie-C, parallell-L)", pl: "Górnoprzepustowy (C szeregowo, L równolegle)", pt: "Passa-altas (C série, L paralelo)", sv: "Högpass (serie-C, parallell-L)", zh: "高通（串联C，并联L）"}
          consts: {lp: 0}
  dof: 3
  rules:
    l: ["if(lp, sqrt(max(rs,rl)/min(rs,rl)-1)*min(rs,rl), max(rs,rl)/sqrt(max(rs,rl)/min(rs,rl)-1))/(2*pi*f)"]
    c: ["if(lp, sqrt(max(rs,rl)/min(rs,rl)-1)/max(rs,rl), 1/(sqrt(max(rs,rl)/min(rs,rl)-1)*min(rs,rl)))/(2*pi*f)"]
  derived:
    q: {dim: number, label: Q, name: {en: "Q of the network (fixed by the ratio)", de: "Güte des Netzwerks (durch das Verhältnis festgelegt)"}, expr: "sqrt(max(rs,rl)/min(rs,rl)-1)"}
    xs: {dim: resistance, label: X_s, name: {en: "Series reactance (magnitude)", de: "Längsblindwiderstand (Betrag)"}, expr: "q*min(rs,rl)"}
    xp: {dim: resistance, label: X_p, name: {en: "Parallel reactance (magnitude)", de: "Querblindwiderstand (Betrag)"}, expr: "max(rs,rl)/q"}
  checks:
    - {when: "rs == rl", warn: {en: "Source and load are equal: no matching network is needed.", de: "Quelle und Last sind gleich: Es wird kein Anpassnetzwerk gebraucht."}}
    - {when: "rs > rl", warn: {en: "R_S is larger than R_L: the values are right, but mirror the drawn network (series element next to R_L, shunt element across R_S).", de: "R_S ist größer als R_L: Die Werte stimmen, aber das gezeichnete Netzwerk muss gespiegelt werden (Längselement an R_L, Querelement parallel zu R_S)."}}
  formula: ["q = sqrt(max(rs, rl) / min(rs, rl) - 1)", "xs = q * min(rs, rl)", "xp = max(rs, rl) / q", "l = if(lp, xs, xp) / (2 * pi * f)", "c = if(lp, 1 / xp, 1 / xs) / (2 * pi * f)"]
  schematic: l_match

- id: eirp
  kind: calculator
  category: rf
  name: {cs: "EIRP a ERP", da: "EIRP og ERP", de: "EIRP und ERP", el: "EIRP και ERP", en: "EIRP and ERP", es: "EIRP y ERP", fr: "EIRP et ERP", hi: "EIRP और ERP", it: "EIRP ed ERP", ja: "EIRPとERP", nl: "EIRP en ERP", no: "EIRP og ERP", pl: "EIRP i ERP", pt: "EIRP e ERP", sv: "EIRP och ERP", zh: "EIRP与ERP"}
  doc:
    en: "The equivalent isotropically radiated power (EIRP) is the power supplied to the antenna times the antenna gain relative to an isotropic radiator, in the direction of that gain. In decibels: EIRP [dBm] = P_TX [dBm] − L_c [dB] + G [dBi], with the transmitter output power P_TX, the loss L_c of the cable, connectors and filters between transmitter and antenna, and the antenna gain G in dBi. Any three of P_TX, L_c, G and EIRP give the fourth, for example the highest transmitter power for an EIRP limit: P_TX = EIRP − G + L_c. The effective radiated power (ERP) refers to a half-wave dipole instead: ERP = EIRP − 2.15 dB (a factor of 1.64 in watts), because the ideal half-wave dipole has 2.15 dBi. A gain given in dBd is converted with G [dBi] = G [dBd] + 2.15 dB. Display the powers in dBm or in watts as you prefer. EIRP and ERP are regulatory quantities: check which of the two a limit refers to (for example e.r.p. for short-range devices below 1 GHz, e.i.r.p. for 2.4 GHz and 5 GHz WLAN). The gain must be that of the antenna as installed, and the loss must include everything between the point where P_TX is specified and the antenna; mismatch loss is not included. The calculator does not compute the field strength. Example: 20 dBm, 3.35 dB cable loss and a 21 dBi dish give 37.65 dBm = 5.82 W EIRP."
    de: "Die äquivalente isotrope Strahlungsleistung (EIRP) ist die der Antenne zugeführte Leistung mal dem Antennengewinn gegenüber dem Kugelstrahler, in Richtung dieses Gewinns. In Dezibel: EIRP [dBm] = P_TX [dBm] − L_c [dB] + G [dBi], mit der Senderausgangsleistung P_TX, der Dämpfung L_c von Kabel, Steckern und Filtern zwischen Sender und Antenne und dem Antennengewinn G in dBi. Drei der Größen P_TX, L_c, G und EIRP ergeben die vierte, zum Beispiel die höchste Sendeleistung für einen EIRP-Grenzwert: P_TX = EIRP − G + L_c. Die effektive Strahlungsleistung (ERP) bezieht sich stattdessen auf den Halbwellendipol: ERP = EIRP − 2,15 dB (Faktor 1,64 in Watt), weil der ideale Halbwellendipol 2,15 dBi hat. Ein in dBd angegebener Gewinn wird mit G [dBi] = G [dBd] + 2,15 dB umgerechnet. Die Leistungen lassen sich wahlweise in dBm oder in Watt anzeigen. EIRP und ERP sind Rechtsgrößen: Prüfen, auf welche der beiden sich ein Grenzwert bezieht (zum Beispiel ERP für Kurzstreckengeräte unter 1 GHz, EIRP für WLAN bei 2,4 GHz und 5 GHz). Der Gewinn muss der Gewinn der Antenne im eingebauten Zustand sein, und die Dämpfung muss alles zwischen dem Punkt, an dem P_TX angegeben ist, und der Antenne enthalten; Fehlanpassungsverluste sind nicht enthalten. Der Rechner berechnet keine Feldstärke. Beispiel: 20 dBm, 3,35 dB Kabeldämpfung und eine Parabolantenne mit 21 dBi ergeben 37,65 dBm = 5,82 W EIRP."
  tags: [eirp, erp, radiated power, effective radiated power, equivalent isotropically radiated power, antenna gain, dbi, dbd, cable loss, feeder loss, link budget, transmitter power, rf, strahlungsleistung, effektive strahlungsleistung, äquivalente isotrope strahlungsleistung, antennengewinn, kabeldämpfung, leitungsdämpfung, funkfeldbilanz, sendeleistung, hf]
  source: "e.i.r.p. and e.r.p. as defined in the ITU Radio Regulations (Nos. 1.161 and 1.162, quoted in ITU-R Recommendation BS.561-2) and in 47 CFR § 2.1; half-wave dipole gain 2.15 dBi: ITU-R Recommendation P.341-7, Table 1; EIRP = transmitter power − cable loss + antenna gain (dBm, dB, dBi): Cisco, RF Power Values (document 23231)"
  vars:
    p: {dim: power, label: P_TX, name: {en: "Transmitter output power", de: "Senderausgangsleistung"}, default: "100 mW", units: ["", "dBm"]}
    loss: {dim: gain, label: L_c, name: {en: "Feeder loss (cable, connectors, filters)", de: "Leitungsdämpfung (Kabel, Stecker, Filter)"}, default: "3.35 dB"}
    g: {dim: gain, label: G, name: {en: "Antenna gain (dBi, relative to an isotropic radiator)", de: "Antennengewinn (dBi, bezogen auf den Kugelstrahler)"}, default: "21 dB"}
    eirp: {dim: power, label: EIRP, name: {en: "Equivalent isotropically radiated power", de: "Äquivalente isotrope Strahlungsleistung"}, units: ["", "dBm"]}
  dof: 3
  rules:
    eirp: ["p*10^((g-loss)/10)"]
    p: ["eirp/10^((g-loss)/10)"]
    g: ["10*log10(eirp/p)+loss"]
    loss: ["g-10*log10(eirp/p)"]
  derived:
    erp: {dim: power, label: ERP, name: {en: "Effective radiated power (half-wave dipole, EIRP − 2.15 dB)", de: "Effektive Strahlungsleistung (Halbwellendipol, EIRP − 2,15 dB)"}, expr: "eirp/10^0.215", units: ["", "dBm"]}
  checks:
    - {when: "loss < 0", warn: {en: "A negative feeder loss is not possible for a passive cable; enter the loss as a positive number of dB.", de: "Eine negative Leitungsdämpfung ist bei einem passiven Kabel nicht möglich; die Dämpfung als positive dB-Zahl eingeben."}}
  formula: ["eirp = p * 10^((g - loss) / 10)", "erp = eirp / 10^0.215"]

- id: coax_stub
  kind: calculator
  category: rf
  name: {cs: "Koaxiální úsek (stub) a elektrická délka", da: "Koaksial stub / elektrisk længde", de: "Koax-Stichleitung / elektrische Länge", el: "Ομοαξονική γραμμή (stub) / ηλεκτρικό μήκος", en: "Coax stub / electrical length", es: "Stub coaxial / longitud eléctrica", fr: "Stub coaxial / longueur électrique", hi: "कोएक्स स्टब / विद्युत लंबाई", it: "Stub coassiale / lunghezza elettrica", ja: "同軸スタブ／電気長", nl: "Coax-stub / elektrische lengte", no: "Koaks-stubb / elektrisk lengde", pl: "Odcinek koncentryczny (stub) / długość elektryczna", pt: "Stub coaxial / comprimento elétrico", sv: "Koax-stub / elektrisk längd", zh: "同轴短截线／电长度"}
  doc:
    en: "The physical length ℓ of a coaxial line with a given electrical length θ follows from the frequency f and the velocity factor VF of the cable: ℓ = θ / 360° × λ_g with the wavelength in the cable λ_g = c × VF / f and c = 299 792 458 m/s (exact). 90° is a quarter-wave section, 180° a half-wave section. Any three of f, VF, θ and ℓ give the fourth: from a stub trimmed to resonance you can find the true velocity factor of a cable. The free-space wavelength and the wavelength in the cable are shown. VF = 1 / √ε_r holds only for a line that is completely filled with one solid dielectric (solid polyethylene, ε_r ≈ 2.3, gives 0.66); foam cables are an air and plastic mixture, so use the velocity factor from the cable datasheet. The electrical length is exact at one frequency only: the same piece has θ proportional to f. Datasheet velocity factors are nominal and real cables deviate by a few per cent, so cut stubs and phasing lines slightly long and trim them while measuring; connectors and the open or shorted end add length. A quarter-wave line turns a short into an open and the reverse, a half-wave line repeats the impedance. Example: a quarter-wave section for 145 MHz in 0.66 coax is 0.341 m long."
    de: "Die mechanische Länge ℓ einer Koaxleitung mit gegebener elektrischer Länge θ folgt aus der Frequenz f und dem Verkürzungsfaktor VF des Kabels: ℓ = θ / 360° · λ_g mit der Wellenlänge im Kabel λ_g = c · VF / f und c = 299 792 458 m/s (exakt). 90° ist ein λ/4-Stück, 180° ein λ/2-Stück. Drei der Größen f, VF, θ und ℓ ergeben die vierte: Aus einer auf Resonanz abgeglichenen Stichleitung lässt sich der wahre Verkürzungsfaktor eines Kabels bestimmen. Die Freiraumwellenlänge und die Wellenlänge im Kabel werden mitgeliefert. VF = 1 / √ε_r gilt nur für eine Leitung, die vollständig mit einem festen Dielektrikum gefüllt ist (Vollpolyethylen, ε_r ≈ 2,3, ergibt 0,66); Schaumkabel sind ein Gemisch aus Luft und Kunststoff, dort den Verkürzungsfaktor aus dem Kabeldatenblatt verwenden. Die elektrische Länge stimmt nur bei einer Frequenz: Dasselbe Kabelstück hat ein θ proportional zu f. Verkürzungsfaktoren im Datenblatt sind Nennwerte und reale Kabel weichen um einige Prozent ab; Stichleitungen und Phasenleitungen daher etwas zu lang zuschneiden und unter Messung kürzen, Stecker und das offene oder kurzgeschlossene Ende verlängern die Leitung. Eine λ/4-Leitung macht aus einem Kurzschluss eine Unterbrechung und umgekehrt, eine λ/2-Leitung wiederholt die Impedanz. Beispiel: Ein λ/4-Stück für 145 MHz in 0,66-Koax ist 0,341 m lang."
  tags: [coax, coaxial cable, stub, quarter wave, half wave, electrical length, velocity factor, velocity of propagation, vop, phasing line, matching stub, delay line, wavelength in cable, dielectric constant, rf, koax, koaxialkabel, stichleitung, lambda/4, lambda/2, viertelwelle, halbwelle, elektrische länge, verkürzungsfaktor, phasenleitung, anpassleitung, verzögerungsleitung, dielektrizitätszahl, hf]
  source: "Electrical length θ = β·ℓ with a wavelength of 360° and λ = v_p/f: M. Steer, Microwave and RF Design II: Transmission Lines, section Transmission Line Theory; velocity factor VF = 1/√ε_r of a solid-dielectric coax line (RG-59 with polyethylene, ε_r = 2.25, about 67 % of c): S. W. Ellingson, Electromagnetics Vol. 1, section Coaxial Line; speed of light c = 299 792 458 m/s exact (SI Brochure, BIPM)"
  vars:
    f: {dim: frequency, label: f, name: {en: "Frequency", de: "Frequenz"}, default: "145 MHz"}
    vf: {dim: ratio, label: VF, name: {en: "Velocity factor of the cable", de: "Verkürzungsfaktor des Kabels"}, default: 0.66}
    theta: {dim: angle, label: θ, name: {en: "Electrical length (90° = λ/4, 180° = λ/2)", de: "Elektrische Länge (90° = λ/4, 180° = λ/2)"}, default: "90°", unit: deg, units: [deg, ""]}
    l: {dim: length, label: ℓ, name: {en: "Physical length of the cable", de: "Mechanische Länge des Kabels"}, units: ["", "in", "ft"]}
  dof: 3
  rules:
    l: ["theta/(2*pi)*299792458*vf/f"]
    theta: ["2*pi*l*f/(299792458*vf)"]
    f: ["theta/(2*pi)*299792458*vf/l"]
    vf: ["2*pi*l*f/(theta*299792458)"]
  derived:
    lam0: {dim: length, label: λ_0, name: {en: "Wavelength in free space", de: "Wellenlänge im freien Raum"}, expr: "299792458/f", units: ["", "in", "ft"]}
    lam: {dim: length, label: λ_g, name: {en: "Wavelength in the cable", de: "Wellenlänge im Kabel"}, expr: "299792458*vf/f", units: ["", "in", "ft"]}
  checks:
    - {when: "(vf > 1) + (vf <= 0) > 0", warn: {en: "The velocity factor must lie between 0 and 1 (enter 66 % as 0.66).", de: "Der Verkürzungsfaktor muss zwischen 0 und 1 liegen (66 % als 0,66 eingeben)."}}
    - {when: "theta > 2*pi", warn: {en: "More than one wavelength: the line behaves like one shortened by whole wavelengths, but only at this frequency.", de: "Mehr als eine Wellenlänge: Die Leitung verhält sich wie eine um ganze Wellenlängen kürzere, aber nur bei dieser Frequenz."}}
  formula: ["lam = 299792458 * vf / f", "l = theta / (2 * pi) * lam"]

- id: noise_figure_cascade
  kind: calculator
  category: rf
  name: {cs: "Celkové číslo šumu (Friis)", da: "Samlet støjtal (Friis)", de: "Gesamtrauschzahl (Friis)", el: "Συνολικός δείκτης θορύβου (Friis)", en: "Cascaded noise figure (Friis)", es: "Figura de ruido en cascada (Friis)", fr: "Facteur de bruit en cascade (Friis)", hi: "कैस्केड शोर आंकड़ा (फ्रिस)", it: "Cifra di rumore in cascata (Friis)", ja: "縦続接続の雑音指数（フリスの式）", nl: "Cascade-ruisgetal (Friis)", no: "Samlet støytall (Friis)", pl: "Współczynnik szumów kaskady (Friis)", pt: "Figura de ruído em cascata (Friis)", sv: "Sammanlagt brusfaktor (Friis)", zh: "级联噪声系数（弗里斯公式）"}
  doc:
    en: "The overall noise figure of three stages in a row (amplifiers, cables, mixers, filters) follows from the Friis formula with the linear noise factors F_i = 10^(NF_i / 10) and power gains g_i = 10^(G_i / 10): F = F_1 + (F_2 − 1) / g_1 + (F_3 − 1) / (g_1 × g_2), and NF = 10 × log10(F). Enter every noise figure and gain in dB; the conversion to linear values is done inside (adding the dB values of the noise figures is the classic mistake). The chain is fixed at three stages: for two stages enter NF_3 = 0 dB, which removes the third term. The gain of the last stage does not matter. The first stage dominates: a loss in front of the first amplifier adds directly to the noise figure, and a stage with high gain makes the following stages count less. A passive, lossy stage at 290 K (cable, attenuator, filter) has a noise figure equal to its loss and a gain equal to the negative loss, both in dB. From the overall noise figure, the required NF_1 or the required gain G_1 of the first stage can be found; if the later stages alone already exceed the target, the answer is impossible (NF_1 below 0 dB, or no result). The equivalent input noise temperature is T_e = 290 K × (F − 1). Noise figures refer to a source at 290 K. Example: an LNA with 1 dB and 12 dB gain, a second LNA with 3 dB and 15 dB gain and an ADC with a noise figure of 20 dB give 1.8 dB."
    de: "Die Gesamtrauschzahl von drei hintereinandergeschalteten Stufen (Verstärker, Kabel, Mischer, Filter) folgt aus der Friis-Formel mit den linearen Rauschfaktoren F_i = 10^(NF_i / 10) und Leistungsverstärkungen g_i = 10^(G_i / 10): F = F_1 + (F_2 − 1) / g_1 + (F_3 − 1) / (g_1 · g_2) und NF = 10 · log10(F). Alle Rauschmaße und Verstärkungen in dB eingeben; die Umrechnung in lineare Werte geschieht intern (die dB-Werte der Rauschmaße zu addieren ist der klassische Fehler). Die Kette ist auf drei Stufen festgelegt: Für zwei Stufen NF_3 = 0 dB eingeben, das entfernt den dritten Term. Die Verstärkung der letzten Stufe spielt keine Rolle. Die erste Stufe dominiert: Eine Dämpfung vor dem ersten Verstärker addiert sich direkt zum Rauschmaß, und eine Stufe mit hoher Verstärkung lässt die folgenden Stufen weniger zählen. Eine passive, verlustbehaftete Stufe bei 290 K (Kabel, Dämpfungsglied, Filter) hat ein Rauschmaß in Höhe ihrer Dämpfung und eine Verstärkung in Höhe der negativen Dämpfung, beides in dB. Aus dem Gesamtrauschmaß lassen sich das nötige NF_1 oder die nötige Verstärkung G_1 der ersten Stufe bestimmen; überschreiten die folgenden Stufen allein schon das Ziel, ist die Antwort unmöglich (NF_1 unter 0 dB oder kein Ergebnis). Die äquivalente Eingangsrauschtemperatur ist T_e = 290 K · (F − 1). Rauschmaße beziehen sich auf eine Quelle mit 290 K. Beispiel: ein LNA mit 1 dB und 12 dB Verstärkung, ein zweiter LNA mit 3 dB und 15 dB Verstärkung und ein ADC mit 20 dB Rauschmaß ergeben 1,8 dB."
  tags: [noise figure, noise factor, friis, cascade, cascaded noise figure, noise temperature, lna, preamplifier, system noise, receiver, rf, rauschmaß, rauschzahl, friis-formel, kaskade, kettenrauschzahl, rauschtemperatur, lna, vorverstärker, systemrauschen, empfänger, hf]
  source: "Friis formula for cascaded stages F = F1 + (F2−1)/G1 + (F3−1)/(G1·G2) and Te = 290 K·(F−1): Agilent Technologies, Fundamentals of RF and Microwave Noise Figure Measurements (Application Note 57-1); worked three-stage example: Texas Instruments, How the ADC noise figure impacts RF receiver designs (SLYT839, Analog Design Journal 3Q 2023), Table 3"
  vars:
    nf1: {dim: gain, label: NF_1, name: {en: "Noise figure of stage 1", de: "Rauschmaß der Stufe 1"}, default: "1 dB"}
    g1: {dim: gain, label: G_1, name: {en: "Gain of stage 1 (negative = loss)", de: "Verstärkung der Stufe 1 (negativ = Dämpfung)"}, default: "12 dB"}
    nf2: {dim: gain, label: NF_2, name: {en: "Noise figure of stage 2", de: "Rauschmaß der Stufe 2"}, default: "3 dB"}
    g2: {dim: gain, label: G_2, name: {en: "Gain of stage 2 (negative = loss)", de: "Verstärkung der Stufe 2 (negativ = Dämpfung)"}, default: "15 dB"}
    nf3: {dim: gain, label: NF_3, name: {en: "Noise figure of stage 3 (0 dB = no third stage)", de: "Rauschmaß der Stufe 3 (0 dB = keine dritte Stufe)"}, default: "20 dB"}
    nft: {dim: gain, label: NF, name: {en: "Overall noise figure", de: "Gesamtrauschmaß"}}
  dof: 5
  rules:
    nft: ["10*log10(10^(nf1/10)+(10^(nf2/10)-1)/10^(g1/10)+(10^(nf3/10)-1)/10^((g1+g2)/10))"]
    nf1: ["10*log10(10^(nft/10)-(10^(nf2/10)-1)/10^(g1/10)-(10^(nf3/10)-1)/10^((g1+g2)/10))"]
    g1: ["10*log10(((10^(nf2/10)-1)+(10^(nf3/10)-1)/10^(g2/10))/(10^(nft/10)-10^(nf1/10)))"]
  derived:
    ftot: {dim: number, label: F, name: {en: "Overall noise factor (linear)", de: "Gesamtrauschfaktor (linear)"}, expr: "10^(nft/10)"}
    te: {dim: temperature, label: T_e, name: {en: "Equivalent input noise temperature", de: "Äquivalente Eingangsrauschtemperatur"}, expr: "290*(10^(nft/10)-1)"}
  checks:
    - {when: "(nf1 < 0) + (nf2 < 0) + (nf3 < 0) > 0", warn: {en: "A noise figure cannot be below 0 dB.", de: "Ein Rauschmaß kann nicht unter 0 dB liegen."}}
  formula: ["nft = 10 * log10(10^(nf1 / 10) + (10^(nf2 / 10) - 1) / 10^(g1 / 10) + (10^(nf3 / 10) - 1) / 10^((g1 + g2) / 10))", "te = 290 * (10^(nft / 10) - 1)"]

- id: stripline_impedance
  kind: calculator
  category: rf
  name: {cs: "Impedance symetrického stripline", da: "Stripline-impedans (symmetrisk)", de: "Stripline-Wellenwiderstand (symmetrisch)", el: "Χαρακτηριστική αντίσταση συμμετρικής γραμμής stripline", en: "Stripline impedance (symmetric)", es: "Impedancia de stripline (simétrica)", fr: "Impédance d'une ligne triplaque (symétrique)", hi: "स्ट्रिपलाइन प्रतिबाधा (सममित)", it: "Impedenza della stripline (simmetrica)", ja: "ストリップ線路の特性インピーダンス（対称）", nl: "Stripline-impedantie (symmetrisch)", no: "Stripline-impedans (symmetrisk)", pl: "Impedancja linii paskowej (symetrycznej)", pt: "Impedância de stripline (simétrica)", sv: "Stripline-impedans (symmetrisk)", zh: "对称带状线特性阻抗"}
  doc:
    en: "Characteristic impedance of a symmetric stripline: a trace of width w and copper thickness t centred in a dielectric of relative permittivity ε_r between two ground planes that are b apart (b is measured from plane to plane and includes the copper): Z_0 = 60 / √ε_r × ln(4 b / (0.67 π (0.8 w + t))). The formula is printed in the Motorola MECL System Design Handbook and in National Semiconductor AN-905. Best accuracy is quoted for b − t > 2 w and b > 4 t (AN-905); the MECL handbook quotes about ±5 % for w/(b − t) < 0.35 and t/b < 0.25. The calculator warns at the AN-905 ratios (w/(b − t) of 0.5 or more, t/b of 0.25 or more), because the stricter 0.35 would already flag the usual 50 Ω FR-4 design; above 0.35 expect the error to grow. Any one of Z_0, ε_r, b, w and t follows from the other four; w or t come out negative when Z_0 is too high for the given b. It is a closed-form approximation: use a field solver and the stackup of the board maker for controlled-impedance work. Example: ε_r 4.3, b = 0.5 mm, w = 0.15 mm and 1 oz copper give 52.46 Ω."
    de: "Wellenwiderstand einer symmetrischen Stripline: eine Leiterbahn der Breite w und Kupferdicke t mittig im Dielektrikum (relative Permittivität ε_r) zwischen zwei Masseflächen im Abstand b (von Fläche zu Fläche gemessen, einschließlich des Kupfers): Z_0 = 60 / √ε_r · ln(4 b / (0,67 π (0,8 w + t))). Die Formel steht im Motorola MECL System Design Handbook und in National Semiconductor AN-905. Die beste Genauigkeit wird für b − t > 2 w und b > 4 t angegeben (AN-905); das MECL-Handbuch nennt etwa ±5 % für w/(b − t) < 0,35 und t/b < 0,25. Der Rechner warnt bei den Verhältnissen der AN-905 (w/(b − t) ab 0,5, t/b ab 0,25), weil die strengeren 0,35 schon den üblichen 50-Ω-Entwurf auf FR-4 markieren würden; oberhalb von 0,35 wächst der Fehler. Jede der Größen Z_0, ε_r, b, w und t ergibt sich aus den übrigen vier; w oder t werden negativ, wenn Z_0 für das gegebene b zu hoch ist. Es ist eine geschlossene Näherung: Für impedanzkontrollierte Leiterplatten einen Feldlöser und den Lagenaufbau des Herstellers verwenden. Beispiel: ε_r 4,3, b = 0,5 mm, w = 0,15 mm und 1 oz Kupfer ergeben 52,46 Ω."
  tags: [stripline, symmetric stripline, pcb, impedance, transmission line, trace width, 50 ohm, controlled impedance, inner layer, rf, symmetrische stripline, leiterplatte, impedanz, wellenwiderstand, leiterbahnbreite, leitung, innenlage, impedanzkontrolliert, hf]
  source: "Motorola, MECL System Design Handbook (W. R. Blood Jr., 4th ed., 1988), chapter 3, strip line, and National Semiconductor AN-905 Transmission Line RAPIDESIGNER Operation and Applications Guide (appendix A, microstrip and stripline Z0): Z0 = 60/√εr·ln(4b/(0.67π(0.8w+t)))"
  vars:
    er: {dim: number, label: ε_r, name: {en: "Relative permittivity", de: "Relative Permittivität"}, default: 4.3}
    b: {dim: length, label: b, name: {en: "Dielectric thickness between the planes", de: "Dicke des Dielektrikums zwischen den Flächen"}, default: "0.5 mm", units: ["", "mil", "in"]}
    w: {dim: length, label: w, name: {en: "Trace width", de: "Leiterbahnbreite"}, default: "0.15 mm", units: ["", "mil", "in"]}
    t: {dim: length, label: t, name: {en: "Copper thickness", de: "Kupferdicke"}, default: "1 oz", unit: oz, units: ["", "oz", "mil"]}
    z0: {dim: resistance, label: Z_0, name: {en: "Characteristic impedance", de: "Wellenwiderstand"}}
  dof: 4
  rules:
    z0: ["60/sqrt(er)*ln(4*b/(0.67*pi*(0.8*w+t)))"]
    er: ["(60*ln(4*b/(0.67*pi*(0.8*w+t)))/z0)^2"]
    b: ["0.67*pi*(0.8*w+t)*exp(z0*sqrt(er)/60)/4"]
    w: ["(4*b*exp(-z0*sqrt(er)/60)/(0.67*pi)-t)/0.8"]
    t: ["4*b*exp(-z0*sqrt(er)/60)/(0.67*pi)-0.8*w"]
  derived:
    wbt: {dim: number, label: w/(b − t), name: {en: "Width relative to the dielectric thickness without copper", de: "Breite bezogen auf die Dielektrikumsdicke ohne Kupfer"}, expr: "w/(b-t)"}
    tb: {dim: number, label: t/b, name: {en: "Copper thickness relative to the plane spacing", de: "Kupferdicke bezogen auf den Flächenabstand"}, expr: "t/b"}
  checks:
    - {when: "wbt >= 0.5", warn: {en: "w/(b − t) is 0.5 or more: outside the guiding ratio b − t > 2w of AN-905, expect a larger error (best accuracy is quoted below 0.35).", de: "w/(b − t) beträgt 0,5 oder mehr: außerhalb des Richtverhältnisses b − t > 2w der AN-905, ist mit einem größeren Fehler zu rechnen (die beste Genauigkeit wird unter 0,35 angegeben)."}}
    - {when: "tb >= 0.25", warn: {en: "t/b is 0.25 or more: the copper is too thick relative to the plane spacing for the formula (b > 4t).", de: "t/b beträgt 0,25 oder mehr: Das Kupfer ist im Verhältnis zum Flächenabstand zu dick für die Formel (b > 4t)."}}
    - {when: "er < 1", warn: {en: "ε_r below 1 is not physical.", de: "ε_r unter 1 ist physikalisch nicht möglich."}}
  formula: ["z0 = 60 / sqrt(er) * ln(4 * b / (0.67 * pi * (0.8 * w + t)))"]

- id: diff_microstrip_impedance
  kind: calculator
  category: rf
  name: {cs: "Diferenciální impedance mikropáskového vedení", da: "Differentiel mikrostrip-impedans", de: "Differenzielle Mikrostrip-Impedanz", el: "Διαφορική αντίσταση γραμμής microstrip", en: "Differential microstrip impedance", es: "Impedancia diferencial de microstrip", fr: "Impédance différentielle d'une ligne microruban", hi: "अवकल माइक्रोस्ट्रिप प्रतिबाधा", it: "Impedenza differenziale della microstriscia", ja: "差動マイクロストリップ線路のインピーダンス", nl: "Differentiële microstrip-impedantie", no: "Differensiell mikrostrip-impedans", pl: "Impedancja różnicowa linii mikropaskowej", pt: "Impedância diferencial de microstrip", sv: "Differentiell mikrostrip-impedans", zh: "差分微带线阻抗"}
  doc:
    en: "Differential impedance of an edge-coupled pair of surface microstrip traces: two traces of equal width w and copper thickness t with the edge-to-edge gap s on a dielectric of thickness h and relative permittivity ε_r over one ground plane. Z_diff = 2 Z_0 (1 − 0.48 e^(−0.96 s/h)) with the single-ended microstrip impedance Z_0 = 87 / √(ε_r + 1.41) × ln(5.98 h / (0.8 w + t)); the odd-mode impedance of one trace is Z_diff / 2. The single-ended Z_0 and the ratios w/h and s/h are shown too. This is an empirical approximation from National Semiconductor AN-905 (as reproduced in the LVDS Owner's Manual): AN-905 itself says the accuracy has not been determined experimentally and cites possible errors of up to about ±10 %. The coupling term is given for 0.2 ≤ s/h ≤ 3.0, the practical range of Z_0 and Z_diff is 20 Ω to about 150 Ω. Both traces must have the same cross-section; keep other pairs more than 2 s away to limit crosstalk. The thickness h has no closed-form inverse and stays an input; Z_diff, s, w, t or ε_r follow from the others. Use a field solver and the stackup of the board maker for controlled-impedance work. Example: ε_r 4.3, h = 0.2 mm, w = 0.25 mm, s = 0.25 mm and 1 oz copper give 101.35 Ω."
    de: "Differenzielle Impedanz eines flankengekoppelten Mikrostrip-Leitungspaars an der Oberfläche: zwei gleich breite Leiterbahnen der Breite w und Kupferdicke t mit dem Kantenabstand s auf einem Dielektrikum der Dicke h und der relativen Permittivität ε_r über einer Massefläche. Z_diff = 2 Z_0 (1 − 0,48 e^(−0,96 s/h)) mit der Einzelleitungs-Impedanz Z_0 = 87 / √(ε_r + 1,41) · ln(5,98 h / (0,8 w + t)); die Odd-Mode-Impedanz einer Leiterbahn ist Z_diff / 2. Angezeigt werden auch Z_0 der einzelnen Leiterbahn sowie die Verhältnisse w/h und s/h. Es ist eine empirische Näherung aus National Semiconductor AN-905 (wiedergegeben im LVDS Owner's Manual): Die AN-905 selbst sagt, dass die Genauigkeit nicht experimentell bestimmt wurde, und nennt mögliche Fehler bis etwa ±10 %. Der Kopplungsterm wird für 0,2 ≤ s/h ≤ 3,0 angegeben, der praktische Bereich für Z_0 und Z_diff ist 20 Ω bis etwa 150 Ω. Beide Leiterbahnen müssen denselben Querschnitt haben; andere Leitungen mehr als 2 s entfernt halten, um Übersprechen zu begrenzen. Die Dicke h hat keine geschlossene Umkehrung und bleibt Eingabe; Z_diff, s, w, t oder ε_r ergeben sich aus den übrigen. Für impedanzkontrollierte Leiterplatten einen Feldlöser und den Lagenaufbau des Herstellers verwenden. Beispiel: ε_r 4,3, h = 0,2 mm, w = 0,25 mm, s = 0,25 mm und 1 oz Kupfer ergeben 101,35 Ω."
  tags: [differential microstrip, differential impedance, microstrip, pcb, impedance, odd mode, lvds, usb, ethernet, coupled traces, 100 ohm, controlled impedance, rf, differenzielle impedanz, mikrostrip, leiterplatte, impedanz, gegentakt, differenzpaar, gekoppelte leitungen, impedanzkontrolliert, hf]
  source: "National Semiconductor AN-905 Transmission Line RAPIDESIGNER Operation and Applications Guide (appendix A, differential Z0: Zdiff = 2·Z0·(1 − 0.48·e^(−0.96·s/h)), empirical, errors up to about ±10 %), as reproduced in the National/TI LVDS Owner's Manual (PCB transmission lines); single-ended Z0 = 87/√(εr+1.41)·ln(5.98h/(0.8w+t)) as in the ECalc microstrip impedance"
  vars:
    er: {dim: number, label: ε_r, name: {en: "Relative permittivity", de: "Relative Permittivität"}, default: 4.3}
    h: {dim: length, label: h, name: {en: "Dielectric thickness (trace to plane)", de: "Dicke des Dielektrikums (Leiterbahn bis Massefläche)"}, default: "0.2 mm", units: ["", "mil", "in"]}
    w: {dim: length, label: w, name: {en: "Trace width (each trace)", de: "Leiterbahnbreite (je Leiterbahn)"}, default: "0.25 mm", units: ["", "mil", "in"]}
    t: {dim: length, label: t, name: {en: "Copper thickness", de: "Kupferdicke"}, default: "1 oz", unit: oz, units: ["", "oz", "mil"]}
    s: {dim: length, label: s, name: {en: "Edge-to-edge gap between the traces", de: "Kantenabstand der beiden Leiterbahnen"}, default: "0.25 mm", units: ["", "mil", "in"]}
    zdiff: {dim: resistance, label: Z_diff, name: {en: "Differential impedance", de: "Differenzielle Impedanz"}}
  dof: 5
  rules:
    zdiff: ["2*87/sqrt(er+1.41)*ln(5.98*h/(0.8*w+t))*(1-0.48*exp(-0.96*s/h))"]
    er: ["(87*ln(5.98*h/(0.8*w+t))*2*(1-0.48*exp(-0.96*s/h))/zdiff)^2-1.41"]
    w: ["(5.98*h*exp(-zdiff/(2*(1-0.48*exp(-0.96*s/h)))*sqrt(er+1.41)/87)-t)/0.8"]
    t: ["5.98*h*exp(-zdiff/(2*(1-0.48*exp(-0.96*s/h)))*sqrt(er+1.41)/87)-0.8*w"]
    s: ["-h/0.96*ln((1-zdiff/(2*87/sqrt(er+1.41)*ln(5.98*h/(0.8*w+t))))/0.48)"]
  derived:
    z0: {dim: resistance, label: Z_0, name: {en: "Single-ended impedance of one trace", de: "Wellenwiderstand einer einzelnen Leiterbahn"}, expr: "87/sqrt(er+1.41)*ln(5.98*h/(0.8*w+t))"}
    z_odd: {dim: resistance, label: Z_odd, name: {en: "Odd-mode impedance (Z_diff / 2)", de: "Odd-Mode-Impedanz einer Leiterbahn (Z_diff / 2)"}, expr: "zdiff/2"}
    wh: {dim: number, label: w/h, name: {en: "Width-to-height ratio", de: "Verhältnis Breite zu Höhe"}, expr: "w/h"}
    sh: {dim: number, label: s/h, name: {en: "Gap-to-height ratio", de: "Verhältnis Abstand zu Höhe"}, expr: "s/h"}
  checks:
    - {when: "sh < 0.2", warn: {en: "s/h is below 0.2: closer than the range the coupling approximation is given for (0.2 to 3.0).", de: "s/h liegt unter 0,2: enger als der Bereich, für den die Kopplungsnäherung angegeben wird (0,2 bis 3,0)."}}
    - {when: "sh > 3", warn: {en: "s/h is above 3.0: outside the range of the coupling approximation (0.2 to 3.0); the traces are hardly coupled, Z_diff is close to 2·Z_0.", de: "s/h liegt über 3,0: außerhalb des Bereichs der Kopplungsnäherung (0,2 bis 3,0); die Leiterbahnen sind kaum gekoppelt, Z_diff liegt nahe bei 2·Z_0."}}
    - {when: "wh < 0.1", warn: {en: "w/h is below 0.1: outside the range the single-ended microstrip approximation is quoted for (0.1 to 2.0), expect a larger error.", de: "w/h liegt unter 0,1: außerhalb des Bereichs, für den die Mikrostrip-Näherung der Einzelleitung angegeben wird (0,1 bis 2,0), ist mit einem größeren Fehler zu rechnen."}}
    - {when: "wh > 2", warn: {en: "w/h is above 2.0: outside the range the single-ended microstrip approximation is quoted for (0.1 to 2.0), expect a larger error.", de: "w/h liegt über 2,0: außerhalb des Bereichs, für den die Mikrostrip-Näherung der Einzelleitung angegeben wird (0,1 bis 2,0), ist mit einem größeren Fehler zu rechnen."}}
    - {when: "if(er < 1, 1, er > 15)", warn: {en: "ε_r is outside the range 1 to 15 the approximation is quoted for.", de: "ε_r liegt außerhalb des Bereichs 1 bis 15, für den die Näherung angegeben wird."}}
  formula: ["z0 = 87 / sqrt(er + 1.41) * ln(5.98 * h / (0.8 * w + t))", "zdiff = 2 * z0 * (1 - 0.48 * exp(-0.96 * s / h))"]
