# Timer, oscillator and pulse calculators. Every name is written in all 16 desktop locales; docs, variable names and
# warnings in English and German (other languages fall back to English). Rules are written out for every direction, in
# the order the solver tries them: the first alternative whose variables are all known wins.

- id: ne555_astable
  kind: calculator
  category: timers
  name: {cs: "NE555 astabilní (oscilátor)", da: "NE555 astabil (oscillator)", de: "NE555 astabil (Oszillator)", el: "NE555 ασταθής (ταλαντωτής)", en: "NE555 astable (oscillator)", es: "NE555 astable (oscilador)", fr: "NE555 astable (oscillateur)", hi: "NE555 अस्थायी (ऑसिलेटर)", it: "NE555 astabile (oscillatore)", ja: "NE555 無安定（発振器）", nl: "NE555 astabiel (oscillator)", no: "NE555 astabil (oscillator)", pl: "NE555 astabilny (generator)", pt: "NE555 astável (oscilador)", sv: "NE555 astabil (oscillator)", zh: "NE555 无稳态（振荡器）"}
  doc:
    en: "Astable multivibrator with an NE555 timer: the capacitor charges through R_1 + R_2 up to 2/3 of the supply and discharges through R_2 down to 1/3. The high time is t_H = ln 2 × (R_1 + R_2) × C (ln 2 ≈ 0.693), the low time t_L = ln 2 × R_2 × C, the frequency f = 1 / (t_H + t_L) = 1.44 / ((R_1 + 2 R_2) × C) and the duty cycle D = t_H / (t_H + t_L) = (R_1 + R_2) / (R_1 + 2 R_2), which is always above 50 %. Enter any three independent values (for example f, D and C to design the resistors). Example with the defaults: R_1 = 1 kΩ, R_2 = 68 kΩ and C = 10 nF give about 1.05 kHz at 50.4 % duty cycle (t_H ≈ 478 µs, t_L ≈ 471 µs). With the control pin not driven the result does not depend on the supply voltage; real parts add the tolerances of R and C, leakage and switching delays, so very high frequencies and very small resistors deviate."
    de: "Astabiler Multivibrator mit dem Timer NE555: Der Kondensator lädt sich über R_1 + R_2 bis auf 2/3 der Versorgung auf und entlädt sich über R_2 bis auf 1/3. Die Highzeit ist t_H = ln 2 · (R_1 + R_2) · C (ln 2 ≈ 0,693), die Lowzeit t_L = ln 2 · R_2 · C, die Frequenz f = 1 / (t_H + t_L) = 1,44 / ((R_1 + 2 R_2) · C) und das Tastverhältnis D = t_H / (t_H + t_L) = (R_1 + R_2) / (R_1 + 2 R_2), das stets über 50 % liegt. Drei unabhängige Werte eingeben (zum Beispiel f, D und C, um die Widerstände zu bestimmen). Beispiel mit den Standardwerten: R_1 = 1 kΩ, R_2 = 68 kΩ und C = 10 nF ergeben etwa 1,05 kHz bei 50,4 % Tastverhältnis (t_H ≈ 478 µs, t_L ≈ 471 µs). Bei unbeschaltetem Steuereingang hängt das Ergebnis nicht von der Versorgungsspannung ab; reale Bauteile bringen die Toleranzen von R und C, Leckströme und Schaltverzögerungen mit, sodass sehr hohe Frequenzen und sehr kleine Widerstände abweichen."
  tags: [555, ne555, timer, astable, oscillator, multivibrator, blinker, flasher, frequency, duty cycle, astabil, oszillator, blinkschaltung, rechteckgenerator, tastverhältnis, frequenz]
  source: "NE555 datasheet (Texas Instruments NE555 / SE555 precision timer), astable operation: f = 1.44/((R_A + 2R_B)·C), t_H = ln 2·(R_A + R_B)·C, t_L = ln 2·R_B·C; P. Horowitz, W. Hill: The Art of Electronics, 3rd ed., ch. 7 (timers)"
  vars:
    r1: {dim: resistance, label: R_1, name: {en: "Resistor R_1 (supply to discharge pin)", de: "Widerstand R_1 (Versorgung zu Entladepin)"}, default: "1k", eseries: true}
    r2: {dim: resistance, label: R_2, name: {en: "Resistor R_2 (discharge pin to capacitor)", de: "Widerstand R_2 (Entladepin zu Kondensator)"}, default: "68k", eseries: true}
    c: {dim: capacitance, label: C, name: {en: "Timing capacitor", de: "Zeitkondensator"}, default: "10n", eseries: true}
    f: {dim: frequency, label: f, name: {en: "Frequency", de: "Frequenz"}}
    th: {dim: time, label: t_H, name: {en: "High time", de: "Highzeit"}, units: [""]}
    tl: {dim: time, label: t_L, name: {en: "Low time", de: "Lowzeit"}, units: [""]}
    duty: {dim: ratio, label: D, name: {en: "Duty cycle", de: "Tastverhältnis"}, unit: pct, units: [pct, ""]}
  dof: 3
  rules:
    f: ["1/(th+tl)", "duty/th", "(1-duty)/tl"]
    th: ["ln(2)*(r1+r2)*c", "duty/f", "1/f-tl"]
    tl: ["ln(2)*r2*c", "(1-duty)/f", "1/f-th"]
    duty: ["th/(th+tl)", "th*f"]
    r1: ["th/(ln(2)*c)-r2", "(th-tl)/(ln(2)*c)"]
    r2: ["tl/(ln(2)*c)", "(1/(f*ln(2)*c)-r1)/2"]
    c: ["tl/(ln(2)*r2)", "th/(ln(2)*(r1+r2))", "(th-tl)/(ln(2)*r1)", "1/(f*ln(2)*(r1+2*r2))"]
  derived:
    period: {dim: time, label: T, name: {en: "Period", de: "Periodendauer"}, expr: "1/f", units: [""]}
  checks:
    - {when: "duty <= 0.5", warn: {en: "The duty cycle is not above 50 %: a standard NE555 astable cannot do that (R_1 would be zero or negative). A diode across R_2 allows lower duty cycles.", de: "Das Tastverhältnis liegt nicht über 50 %: Das kann ein normaler NE555-Astabilbetrieb nicht (R_1 wäre null oder negativ). Eine Diode parallel zu R_2 ermöglicht kleinere Tastverhältnisse."}}
  formula: ["th = ln(2) * (r1 + r2) * c", "tl = ln(2) * r2 * c", "f = 1 / (th + tl)", "duty = th / (th + tl)"]
  schematic: ne555_astable

- id: ne555_monostable
  kind: calculator
  category: timers
  name: {cs: "NE555 monostabilní (monostabilní klopný obvod)", da: "NE555 monostabil (monoflop)", de: "NE555 monostabil (Monoflop)", el: "NE555 μονοσταθής (μονοπαλμός)", en: "NE555 monostable (one-shot)", es: "NE555 monoestable", fr: "NE555 monostable", hi: "NE555 मोनोस्टेबल (वन-शॉट)", it: "NE555 monostabile", ja: "NE555 単安定（ワンショット）", nl: "NE555 monostabiel (monoflop)", no: "NE555 monostabil (monoflopp)", pl: "NE555 monostabilny (przerzutnik)", pt: "NE555 monoestável", sv: "NE555 monostabil (monoflop)", zh: "NE555 单稳态（单触发）"}
  doc:
    en: "Monostable (one-shot) with an NE555 timer: a trigger pulse at pin 2 starts the output pulse, during which the capacitor charges through R from 0 up to 2/3 of the supply. The pulse width is t = R × C × ln 3 ≈ 1.0986 × R × C (the datasheet rounds this to 1.1 × R × C). Enter any two of R, C and t. Example with the defaults: 100 kΩ and 10 µF give a pulse of about 1.1 s. The trigger pulse must be shorter than the output pulse; the real width varies with the capacitor tolerance and leakage (use film or low-leakage capacitors for long times)."
    de: "Monostabile Kippstufe (Monoflop) mit dem Timer NE555: Ein Triggerimpuls an Pin 2 startet den Ausgangsimpuls, während dem sich der Kondensator über R von 0 bis auf 2/3 der Versorgung auflädt. Die Impulsbreite ist t = R · C · ln 3 ≈ 1,0986 · R · C (das Datenblatt rundet auf 1,1 · R · C). Zwei der Größen R, C und t eingeben. Beispiel mit den Standardwerten: 100 kΩ und 10 µF ergeben einen Impuls von etwa 1,1 s. Der Triggerimpuls muss kürzer als der Ausgangsimpuls sein; die reale Breite schwankt mit der Kondensatortoleranz und dem Leckstrom (für lange Zeiten Folien- oder verlustarme Kondensatoren verwenden)."
  tags: [555, ne555, timer, monostable, one-shot, one shot, pulse, delay, monoflop, monostabil, impuls, verzögerung, zeitglied, pulsbreite]
  source: "NE555 datasheet (Texas Instruments NE555 / SE555 precision timer), monostable operation: t_w = 1.1·R_A·C, exactly ln 3·R_A·C (charging from 0 to 2/3 V_CC); P. Horowitz, W. Hill: The Art of Electronics, 3rd ed., ch. 7 (timers)"
  vars:
    r: {dim: resistance, label: R, name: {en: "Timing resistor", de: "Zeitwiderstand"}, default: "100k", eseries: true}
    c: {dim: capacitance, label: C, name: {en: "Timing capacitor", de: "Zeitkondensator"}, default: "10µ", eseries: true}
    t: {dim: time, label: t, name: {en: "Pulse width", de: "Impulsbreite"}}
  dof: 2
  rules:
    t: ["ln(3)*r*c"]
    r: ["t/(ln(3)*c)"]
    c: ["t/(ln(3)*r)"]
  formula: ["t = ln(3) * r * c"]
  schematic: ne555_monostable

- id: crystal_load_caps
  kind: calculator
  category: timers
  name: {cs: "Zatěžovací kondenzátory krystalu", da: "Krystallastkondensatorer", de: "Quarz-Lastkondensatoren", el: "Πυκνωτές φορτίου κρυστάλλου", en: "Crystal load capacitors", es: "Condensadores de carga del cristal", fr: "Condensateurs de charge du quartz", hi: "क्रिस्टल लोड संधारित्र", it: "Condensatori di carico del quarzo", ja: "水晶振動子の負荷容量", nl: "Belastingcondensatoren voor kristal", no: "Lastkondensatorer for krystall", pl: "Kondensatory obciążające rezonator kwarcowy", pt: "Condensadores de carga do cristal", sv: "Lastkondensatorer för kristall", zh: "晶振负载电容"}
  doc:
    en: "Load capacitors for a parallel-resonant quartz crystal in a Pierce oscillator: two capacitors C_1 = C_2 from the crystal pins to ground. The crystal sees the load capacitance C_L = C_1 × C_2 / (C_1 + C_2) + C_stray, where C_stray is the pin, trace and board capacitance (a few pF as a rough estimate, 2 to 5 pF). With C_1 = C_2 = C this gives C = 2 × (C_L − C_stray). Take C_L from the crystal datasheet. Example with the defaults: C_L = 18 pF and C_stray = 4 pF give C_1 = C_2 = 28 pF (use the nearest standard value, 27 pF)."
    de: "Lastkondensatoren für einen parallelresonanten Schwingquarz in einer Pierce-Oszillatorschaltung: zwei Kondensatoren C_1 = C_2 von den Quarzanschlüssen nach Masse. Der Quarz sieht die Lastkapazität C_L = C_1 · C_2 / (C_1 + C_2) + C_stray; C_stray ist die Kapazität von Pin, Leiterbahn und Platine (als grobe Schätzung einige pF, 2 bis 5 pF). Mit C_1 = C_2 = C folgt C = 2 · (C_L − C_stray). C_L dem Datenblatt des Quarzes entnehmen. Beispiel mit den Standardwerten: C_L = 18 pF und C_stray = 4 pF ergeben C_1 = C_2 = 28 pF (den nächsten Normwert verwenden, 27 pF)."
  tags: [crystal, quartz, xtal, load capacitance, load capacitor, pierce oscillator, oscillator, microcontroller, quarz, schwingquarz, lastkapazität, lastkondensator, pierce, oszillator, mikrocontroller]
  source: "Load capacitance of a parallel-resonant crystal in a Pierce oscillator: C_L = C_1·C_2/(C_1 + C_2) + C_stray (series connection of the two capacitors plus stray capacitance); the crystal datasheet states C_L; P. Horowitz, W. Hill: The Art of Electronics, 3rd ed., ch. 7 (crystal oscillators)"
  vars:
    cl: {dim: capacitance, label: C_L, name: {en: "Crystal load capacitance (datasheet)", de: "Lastkapazität des Quarzes (Datenblatt)"}, default: "18p"}
    cs: {dim: capacitance, label: C_stray, name: {en: "Stray capacitance (pins, traces)", de: "Streukapazität (Pins, Leiterbahnen)"}, default: "4p"}
    c: {dim: capacitance, label: "C_1,2", name: {en: "Load capacitor C_1 = C_2 (each)", de: "Lastkondensator C_1 = C_2 (je)"}, eseries: true}
  dof: 2
  rules:
    c: ["2*(cl-cs)"]
    cl: ["c/2+cs"]
    cs: ["cl-c/2"]
  derived:
    cser: {dim: capacitance, label: C_ser, name: {en: "Series combination C_1·C_2/(C_1 + C_2)", de: "Reihenschaltung C_1·C_2/(C_1 + C_2)"}, expr: "c/2"}
  checks:
    - {when: "cs >= cl", warn: {en: "C_stray is not below C_L: the board already provides the load capacitance, no load capacitors are needed (or the crystal needs a lower load capacitance).", de: "C_stray liegt nicht unter C_L: Die Platine liefert die Lastkapazität bereits, Lastkondensatoren entfallen (oder der Quarz braucht eine kleinere Lastkapazität)."}}
  formula: ["cl = c / 2 + cs", "c = 2 * (cl - cs)"]
  schematic: crystal_load_caps

- id: frequency_period
  kind: calculator
  category: timers
  name: {cs: "Frekvence, perioda a střída", da: "Frekvens, periode og dutycycle", de: "Frequenz, Periodendauer und Tastverhältnis", el: "Συχνότητα, περίοδος και κύκλος λειτουργίας", en: "Frequency, period and duty cycle", es: "Frecuencia, periodo y ciclo de trabajo", fr: "Fréquence, période et rapport cyclique", hi: "आवृत्ति, आवर्तकाल और ड्यूटी साइकिल", it: "Frequenza, periodo e duty cycle", ja: "周波数・周期・デューティ比", nl: "Frequentie, periode en duty cycle", no: "Frekvens, periode og driftssyklus", pl: "Częstotliwość, okres i wypełnienie", pt: "Frequência, período e ciclo de trabalho", sv: "Frekvens, period och pulskvot", zh: "频率、周期与占空比"}
  doc:
    en: "Converts between the frequency f, the period T = 1 / f and the duty cycle D of a rectangular signal: t_high = D × T and t_low = T − t_high. Enter any two independent values (the frequency and the period alone do not fix the duty cycle). Example with the defaults: 1 kHz at a duty cycle of 30 % is a period of 1 ms with 300 µs high and 700 µs low."
    de: "Rechnet zwischen der Frequenz f, der Periodendauer T = 1 / f und dem Tastverhältnis D eines Rechtecksignals um: t_high = D · T und t_low = T − t_high. Zwei unabhängige Werte eingeben (Frequenz und Periodendauer allein legen das Tastverhältnis nicht fest). Beispiel mit den Standardwerten: 1 kHz bei 30 % Tastverhältnis sind 1 ms Periodendauer mit 300 µs High und 700 µs Low."
  tags: [frequency, period, duty cycle, duty, pulse width, square wave, rectangular, pwm, hertz, frequenz, periodendauer, tastverhältnis, tastgrad, pulsbreite, rechteck]
  source: "Definitions: frequency f = 1/T (hertz = 1/s, SI Brochure, BIPM) and duty cycle D = t_high/T of a periodic rectangular signal"
  vars:
    f: {dim: frequency, label: f, name: {en: "Frequency", de: "Frequenz"}, default: "1k"}
    t: {dim: time, label: T, name: {en: "Period", de: "Periodendauer"}, units: [""]}
    duty: {dim: ratio, label: D, name: {en: "Duty cycle", de: "Tastverhältnis"}, default: 0.3, unit: pct, units: [pct, ""]}
    th: {dim: time, label: t_high, name: {en: "High time", de: "Highzeit"}, units: [""]}
    tl: {dim: time, label: t_low, name: {en: "Low time", de: "Lowzeit"}, units: [""]}
  dof: 2
  rules:
    f: ["1/t", "duty/th", "(1-duty)/tl"]
    t: ["1/f", "th+tl", "th/duty", "tl/(1-duty)"]
    duty: ["th/t", "1-tl/t", "th/(th+tl)"]
    th: ["duty*t", "t-tl", "tl*duty/(1-duty)"]
    tl: ["(1-duty)*t", "t-th", "th*(1-duty)/duty"]
  checks:
    - {when: "if(duty <= 0, 1, duty >= 1)", warn: {en: "The duty cycle must be between 0 % and 100 %.", de: "Das Tastverhältnis muss zwischen 0 % und 100 % liegen."}}
  formula: ["t = 1 / f", "th = duty * t", "tl = t - th"]

- id: pwm_average
  kind: calculator
  category: timers
  name: {cs: "Střední hodnota PWM", da: "PWM-middelspænding", de: "PWM-Mittelwert", el: "Μέση τάση PWM", en: "PWM average voltage", es: "Tensión media de PWM", fr: "Tension moyenne d'un signal PWM", hi: "PWM औसत वोल्टेज", it: "Tensione media PWM", ja: "PWMの平均電圧", nl: "Gemiddelde PWM-spanning", no: "PWM-middelspenning", pl: "Napięcie średnie PWM", pt: "Tensão média PWM", sv: "PWM-medelspänning", zh: "PWM平均电压"}
  doc:
    en: "Average and RMS value of a rectangular PWM signal that switches between V_low and V_high with the duty cycle D: V_avg = V_low + D × (V_high − V_low) (a low-pass filter, or the inertia of a motor, LED or heater, turns the PWM into this DC voltage) and V_rms = √(D × V_high² + (1 − D) × V_low²) (the heating effect in a resistive load). Enter any three of D, V_high, V_low and V_avg. Example with the defaults: 25 % duty cycle between 0 V and 5 V gives V_avg = 1.25 V and V_rms = 2.5 V."
    de: "Mittelwert und Effektivwert eines Rechteck-PWM-Signals, das mit dem Tastverhältnis D zwischen V_low und V_high wechselt: V_avg = V_low + D · (V_high − V_low) (ein Tiefpass oder die Trägheit von Motor, LED oder Heizung macht daraus diese Gleichspannung) und V_rms = √(D · V_high² + (1 − D) · V_low²) (die Heizwirkung an einer ohmschen Last). Drei der Größen D, V_high, V_low und V_avg eingeben. Beispiel mit den Standardwerten: 25 % Tastverhältnis zwischen 0 V und 5 V ergeben V_avg = 1,25 V und V_rms = 2,5 V."
  tags: [pwm, pulse width modulation, average, mean, rms, duty cycle, dimming, motor speed, pulsweitenmodulation, mittelwert, effektivwert, tastverhältnis, dimmen, drehzahl]
  source: "Average and RMS value of a rectangular two-level waveform over one period (integration of the waveform); P. Horowitz, W. Hill: The Art of Electronics, 3rd ed., ch. 1 (signals)"
  vars:
    duty: {dim: ratio, label: D, name: {en: "Duty cycle", de: "Tastverhältnis"}, default: 0.25, unit: pct, units: [pct, ""]}
    vh: {dim: voltage, label: V_high, name: {en: "High level", de: "High-Pegel"}, default: "5 V"}
    vl: {dim: voltage, label: V_low, name: {en: "Low level", de: "Low-Pegel"}, default: 0}
    vavg: {dim: voltage, label: V_avg, name: {en: "Average voltage", de: "Mittelwert"}}
  dof: 3
  rules:
    vavg: ["vl+duty*(vh-vl)"]
    duty: ["(vavg-vl)/(vh-vl)"]
    vh: ["vl+(vavg-vl)/duty"]
    vl: ["(vavg-duty*vh)/(1-duty)"]
  derived:
    vrms: {dim: voltage, label: V_rms, name: {en: "RMS voltage", de: "Effektivwert"}, expr: "sqrt(duty*vh^2+(1-duty)*vl^2)"}
  checks:
    - {when: "if(duty < 0, 1, duty > 1)", warn: {en: "The duty cycle must be between 0 % and 100 %.", de: "Das Tastverhältnis muss zwischen 0 % und 100 % liegen."}}
  formula: ["vavg = vl + duty * (vh - vl)", "vrms = sqrt(duty * vh^2 + (1 - duty) * vl^2)"]

- id: crystal_drift
  kind: calculator
  category: timers
  name: {cs: "Odchylka krystalu (ppm ↔ s/den)", da: "Krystalafvigelse (ppm ↔ s/dag)", de: "Quarzabweichung (ppm ↔ s/Tag)", el: "Απόκλιση κρυστάλλου (ppm ↔ s/ημέρα)", en: "Crystal drift (ppm ↔ s/day)", es: "Desviación del cristal (ppm ↔ s/día)", fr: "Dérive du quartz (ppm ↔ s/jour)", hi: "क्रिस्टल विचलन (ppm ↔ s/दिन)", it: "Deriva del quarzo (ppm ↔ s/giorno)", ja: "水晶の周波数偏差（ppm ↔ 秒/日）", nl: "Kristalafwijking (ppm ↔ s/dag)", no: "Krystallavvik (ppm ↔ s/døgn)", pl: "Odchyłka kwarcu (ppm ↔ s/dobę)", pt: "Desvio do cristal (ppm ↔ s/dia)", sv: "Kristallavvikelse (ppm ↔ s/dygn)", zh: "晶振偏差（ppm ↔ 秒/天）"}
  doc:
    en: "Converts the frequency tolerance of a crystal in ppm (parts per million, 1 ppm = 10⁻⁶) into the error of a clock that counts its oscillator, and back. The relative error is δ = Δf / f₀, so a clock that runs δ too fast gains δ × t_elapsed: Δt = δ × 86 400 s per day. One ppm is 0.0864 s per day. Because the length of a month or a year is a convention, the derived values are labelled with their days: 30 days (2 592 000 s) and 365 days (31 536 000 s). The frequency error is Δf = δ × f₀ at the nominal frequency. Enter the error in ppm or the time error per day (and the nominal frequency for Δf). The result is the magnitude of the error: the sign (a crystal that is too fast makes the clock gain, one that is too slow makes it lose) is not kept. The conversion is exact while δ stays constant over the interval. Temperature, aging and the load capacitance change δ in real life and are not part of this calculator: the value is a tolerance from the datasheet, not the error of a particular day. Example with the defaults: 20 ppm are 1.728 s per day, 51.84 s per 30 days (about a minute per month) and 630.72 s per 365 days, and 0.655 Hz at 32 768 Hz."
    de: "Rechnet die Frequenztoleranz eines Quarzes in ppm (parts per million, 1 ppm = 10⁻⁶) in den Gangfehler einer Uhr um, die seinen Oszillator zählt, und zurück. Der relative Fehler ist δ = Δf / f₀; eine Uhr, die um δ zu schnell läuft, gewinnt δ · t_vergangen: Δt = δ · 86 400 s pro Tag. Ein ppm sind 0,0864 s pro Tag. Weil die Länge eines Monats oder Jahres eine Vereinbarung ist, tragen die abgeleiteten Werte ihre Tage im Namen: 30 Tage (2 592 000 s) und 365 Tage (31 536 000 s). Der Frequenzfehler ist Δf = δ · f₀ bei der Nennfrequenz. Den Fehler in ppm oder den Zeitfehler pro Tag eingeben (und die Nennfrequenz für Δf). Das Ergebnis ist der Betrag des Fehlers: Das Vorzeichen (ein zu schneller Quarz lässt die Uhr vorgehen, ein zu langsamer nachgehen) bleibt nicht erhalten. Die Umrechnung ist exakt, solange δ im Zeitraum konstant bleibt. Temperatur, Alterung und die Lastkapazität verändern δ in der Praxis und gehören nicht zu diesem Rechner: Der Wert ist eine Toleranz aus dem Datenblatt, nicht der Fehler eines bestimmten Tages. Beispiel mit den Standardwerten: 20 ppm sind 1,728 s pro Tag, 51,84 s pro 30 Tage (etwa eine Minute pro Monat) und 630,72 s pro 365 Tage sowie 0,655 Hz bei 32 768 Hz."
  tags: [crystal, quartz, xtal, ppm, frequency tolerance, clock drift, time error, seconds per day, rtc accuracy, rtc, watch crystal, 32.768 kHz, parts per million, quarz, schwingquarz, frequenztoleranz, gangabweichung, ganggenauigkeit, uhrenfehler, sekunden pro tag, echtzeituhr, uhrenquarz, abweichung]
  source: "Definition of the relative frequency error δ = Δf/f₀ in parts per million and of the time error Δt = δ·t (1 ppm = 10⁻⁶); published figures for comparison: Analog Devices (Maxim) note on crystal considerations for real-time clocks (20 ppm is about one minute per month); Seiko Epson RX8900SA/CE application manual ETM45E-10 (frequency characteristics in seconds of month deviation); Texas Instruments SLAA322D, MSP430 32-kHz crystal oscillators (frequency tolerance in Hz at 32 768 Hz)"
  vars:
    ppm: {dim: ratio, label: δ, name: {en: "Frequency error (ppm)", de: "Frequenzfehler (ppm)"}, default: "20 ppm", unit: ppm, units: [ppm, pct, ""]}
    dd: {dim: time, label: Δt_d, name: {en: "Time error per day", de: "Gangfehler pro Tag"}}
    f: {dim: frequency, label: f₀, name: {en: "Nominal frequency", de: "Nennfrequenz"}, default: "32768"}
  dof: 2
  rules:
    dd: ["abs(ppm)*86400"]
    ppm: ["dd/86400"]
  derived:
    dm: {dim: time, label: Δt_30d, name: {en: "Time error per 30 days", de: "Gangfehler pro 30 Tage"}, expr: "abs(ppm)*2592000"}
    dy: {dim: time, label: Δt_365d, name: {en: "Time error per 365 days", de: "Gangfehler pro 365 Tage"}, expr: "abs(ppm)*31536000"}
    df: {dim: frequency, label: Δf, name: {en: "Frequency error at the nominal frequency", de: "Frequenzfehler bei der Nennfrequenz"}, expr: "abs(ppm)*f"}
  checks:
    - {when: "abs(ppm) > 0.01", warn: {en: "More than 10 000 ppm (1 %) is not a crystal tolerance; check the unit.", de: "Mehr als 10 000 ppm (1 %) ist keine Quarztoleranz; Einheit prüfen."}}
  formula: ["dd = abs(ppm) * 86400", "dm = abs(ppm) * 2592000", "dy = abs(ppm) * 31536000", "df = abs(ppm) * f"]

- id: avr_timer
  kind: calculator
  category: timers
  name: {cs: "Časovač AVR: srovnávací hodnota (CTC)", da: "AVR-timer: sammenligningsværdi (CTC)", de: "AVR-Timer-Vergleichswert (CTC)", el: "Χρονιστής AVR: τιμή σύγκρισης (CTC)", en: "AVR timer compare value (CTC)", es: "Temporizador AVR: valor de comparación (CTC)", fr: "Minuterie AVR : valeur de comparaison (CTC)", hi: "AVR टाइमर: तुलना मान (CTC)", it: "Timer AVR: valore di confronto (CTC)", ja: "AVRタイマー：比較値（CTC）", nl: "AVR-timer: vergelijkingswaarde (CTC)", no: "AVR-timer: sammenligningsverdi (CTC)", pl: "Timer AVR: wartość porównania (CTC)", pt: "Temporizador AVR: valor de comparação (CTC)", sv: "AVR-timer: jämförvärde (CTC)", zh: "AVR定时器：比较值（CTC）"}
  doc:
    en: "Compare value OCR of an AVR timer (ATmega328P family) in CTC mode (clear timer on compare match). The counter runs from 0 up to OCR and starts again, so one cycle takes OCR + 1 timer clocks of f_clk / N (N = prescaler). A toggled output pin needs two compare matches per period: f = f_clk / (2 × N × (1 + OCR)). The compare-match interrupt (or the cycle rate) runs twice as fast: f = f_clk / (N × (1 + OCR)); this rate follows from the same counting sequence, the datasheet prints the equation for the toggled pin. Enter f_clk (normally F_CPU) and the wanted frequency, and choose the mode and the counter width (8 bit: Timer0 and Timer2, TOP = 255; 16 bit: Timer1, TOP = 65 535). The calculator rounds the exact value f_clk / (k × N × f) to the nearest whole number of timer clocks (k = 2 or 1), subtracts the 1 and shows the real frequency and its error. The prescaler is either picked automatically (the smallest of 1, 8, 64, 256 and 1024 whose OCR fits the counter; if even 1024 is too small the warning says so) or fixed. The list 1, 8, 64, 256, 1024 is valid for Timer0 and Timer1 and also exists on Timer2; Timer2 additionally has the prescalers 32 and 128, which are not offered here. Forgetting the +1 makes the period one timer clock too long: with a 32.768 kHz crystal, prescaler 1024 and an interrupt every second the correct value is OCR = 31 (32 clocks); OCR = 32 gives 33 clocks, 1.03125 s. OCR is assumed static and the timer clock to be the I/O clock (a Timer2 in asynchronous mode runs from the crystal frequency instead). Example with the defaults: 16 MHz and 1 kHz on a toggled pin (8 bit) pick prescaler 64 and OCR = 124: 16 000 000 / (2 × 64 × 125) = 1000 Hz."
    de: "Vergleichswert OCR eines AVR-Timers (ATmega328P-Familie) im CTC-Modus (Clear Timer on Compare Match). Der Zähler läuft von 0 bis OCR und beginnt von vorn, ein Zyklus dauert also OCR + 1 Timertakte von f_clk / N (N = Vorteiler). Ein umschaltender Ausgangspin braucht zwei Compare-Match-Ereignisse pro Periode: f = f_clk / (2 · N · (1 + OCR)). Der Compare-Match-Interrupt (oder die Zyklusrate) läuft doppelt so schnell: f = f_clk / (N · (1 + OCR)); diese Rate folgt aus derselben Zählfolge, das Datenblatt druckt die Gleichung für den umschaltenden Pin. f_clk (normalerweise F_CPU) und die gewünschte Frequenz eingeben sowie Modus und Zählerbreite wählen (8 Bit: Timer0 und Timer2, TOP = 255; 16 Bit: Timer1, TOP = 65 535). Der Rechner rundet den genauen Wert f_clk / (k · N · f) auf die nächste ganze Zahl von Timertakten (k = 2 oder 1), zieht die 1 ab und zeigt die tatsächliche Frequenz mit ihrem Fehler. Der Vorteiler wird entweder automatisch gewählt (der kleinste von 1, 8, 64, 256 und 1024, dessen OCR in den Zähler passt; reicht selbst 1024 nicht, sagt es die Warnung) oder fest vorgegeben. Die Liste 1, 8, 64, 256, 1024 gilt für Timer0 und Timer1 und gibt es auch bei Timer2; Timer2 hat zusätzlich die Vorteiler 32 und 128, die hier nicht angeboten werden. Wer die +1 vergisst, macht die Periode einen Timertakt zu lang: Mit einem 32,768-kHz-Quarz, Vorteiler 1024 und einem Interrupt pro Sekunde ist OCR = 31 richtig (32 Takte); OCR = 32 ergibt 33 Takte, 1,03125 s. OCR gilt als statisch und der Timertakt als I/O-Takt (ein Timer2 im asynchronen Modus läuft stattdessen mit der Quarzfrequenz). Beispiel mit den Standardwerten: 16 MHz und 1 kHz an einem umschaltenden Pin (8 Bit) wählen Vorteiler 64 und OCR = 124: 16 000 000 / (2 · 64 · 125) = 1000 Hz."
  tags: [avr, atmega328p, arduino, timer, counter, ctc, ocr, ocr1a, prescaler, compare match, interrupt frequency, toggle pin, timer1, timer2, timer0, microcontroller, zähler, vorteiler, vergleichswert, interruptfrequenz, timerberechnung, mikrocontroller]
  source: "Microchip (Atmel) ATmega328P datasheet 7810D-AVR-01/15: CTC mode of Timer/Counter0, Timer/Counter1 and Timer/Counter2, toggled output f_OCnx = f_clk_I/O / (2·N·(1 + OCRnx)) with the prescalers N = 1, 8, 64, 256, 1024 (Timer2 also 32 and 128); the compare-match interrupt rate f_clk_I/O / (N·(1 + OCR)) follows from the same counting sequence 0 … OCR; the rounding of OCR to the nearest value is the choice of this calculator"
  vars:
    fclk: {dim: frequency, label: f_clk, name: {en: "Timer clock (F_CPU)", de: "Timertakt (F_CPU)"}, default: "16 MHz"}
    f: {dim: frequency, label: f, name: {en: "Wanted frequency", de: "Gewünschte Frequenz"}, default: "1 kHz"}
  choices:
    prescaler:
      name: {cs: "Předdělička", da: "Forskaler", de: "Vorteiler", el: "Προδιαιρέτης", en: "Prescaler", es: "Preescalador", fr: "Prédiviseur", hi: "प्रीस्केलर", it: "Prescaler", ja: "プリスケーラ", nl: "Prescaler", no: "Forskaler", pl: "Dzielnik wstępny", pt: "Pré-escalador", sv: "Förskalare", zh: "预分频器"}
      default: auto
      options:
        auto:
          name: {cs: "Automaticky", da: "Automatisk", de: "Automatisch", el: "Αυτόματα", en: "Automatic (smallest that fits)", es: "Automático", fr: "Automatique", hi: "स्वचालित", it: "Automatico", ja: "自動", nl: "Automatisch", no: "Automatisk", pl: "Automatycznie", pt: "Automático", sv: "Automatiskt", zh: "自动"}
          consts: {n: 0}
        p1:
          name: {cs: "1", da: "1", de: "1", el: "1", en: "1", es: "1", fr: "1", hi: "1", it: "1", ja: "1", nl: "1", no: "1", pl: "1", pt: "1", sv: "1", zh: "1"}
          consts: {n: 1}
        p8:
          name: {cs: "8", da: "8", de: "8", el: "8", en: "8", es: "8", fr: "8", hi: "8", it: "8", ja: "8", nl: "8", no: "8", pl: "8", pt: "8", sv: "8", zh: "8"}
          consts: {n: 8}
        p64:
          name: {cs: "64", da: "64", de: "64", el: "64", en: "64", es: "64", fr: "64", hi: "64", it: "64", ja: "64", nl: "64", no: "64", pl: "64", pt: "64", sv: "64", zh: "64"}
          consts: {n: 64}
        p256:
          name: {cs: "256", da: "256", de: "256", el: "256", en: "256", es: "256", fr: "256", hi: "256", it: "256", ja: "256", nl: "256", no: "256", pl: "256", pt: "256", sv: "256", zh: "256"}
          consts: {n: 256}
        p1024:
          name: {cs: "1024", da: "1024", de: "1024", el: "1024", en: "1024", es: "1024", fr: "1024", hi: "1024", it: "1024", ja: "1024", nl: "1024", no: "1024", pl: "1024", pt: "1024", sv: "1024", zh: "1024"}
          consts: {n: 1024}
    mode:
      name: {cs: "Výstup CTC", da: "CTC-udgang", de: "CTC-Ausgabe", el: "Έξοδος CTC", en: "CTC output", es: "Salida CTC", fr: "Sortie CTC", hi: "CTC आउटपुट", it: "Uscita CTC", ja: "CTC出力", nl: "CTC-uitgang", no: "CTC-utgang", pl: "Wyjście CTC", pt: "Saída CTC", sv: "CTC-utgång", zh: "CTC输出"}
      default: toggle
      options:
        toggle:
          name: {cs: "Pin se přepíná (obdélník)", da: "Ben skifter (firkantsignal)", de: "Pin schaltet um (Rechteck)", el: "Ο ακροδέκτης εναλλάσσεται (τετραγωνικός παλμός)", en: "Pin toggles (square wave)", es: "El pin conmuta (onda cuadrada)", fr: "La broche bascule (signal carré)", hi: "पिन टॉगल होता है (वर्ग तरंग)", it: "Il pin commuta (onda quadra)", ja: "ピンがトグル（方形波）", nl: "Pin wisselt (blokgolf)", no: "Pinnen veksler (firkantbølge)", pl: "Pin przełącza się (fala prostokątna)", pt: "O pino alterna (onda quadrada)", sv: "Stiftet växlar (fyrkantsvåg)", zh: "引脚翻转（方波）"}
          consts: {k: 2}
        interrupt:
          name: {cs: "Frekvence přerušení při shodě", da: "Afbrydelsesrate ved sammenligning", de: "Interrupt-Rate bei Compare-Match", el: "Ρυθμός διακοπής σε ταύτιση σύγκρισης", en: "Compare-match interrupt rate", es: "Frecuencia de interrupción por coincidencia", fr: "Fréquence d'interruption de comparaison", hi: "तुलना-मैच इंटरप्ट दर", it: "Frequenza dell'interrupt di confronto", ja: "コンペアマッチ割り込み周期", nl: "Interruptfrequentie bij compare-match", no: "Avbruddsrate ved sammenlikning", pl: "Częstotliwość przerwania porównania", pt: "Frequência da interrupção por comparação", sv: "Avbrottsfrekvens vid jämförelse", zh: "比较匹配中断频率"}
          consts: {k: 1}
    width:
      name: {cs: "Šířka čítače", da: "Tællerbredde", de: "Zählerbreite", el: "Πλάτος μετρητή", en: "Counter width", es: "Ancho del contador", fr: "Largeur du compteur", hi: "काउंटर चौड़ाई", it: "Larghezza del contatore", ja: "カウンタのビット幅", nl: "Tellerbreedte", no: "Tellerbredde", pl: "Szerokość licznika", pt: "Largura do contador", sv: "Räknarbredd", zh: "计数器位宽"}
      default: bits8
      options:
        bits8:
          name: {cs: "8 bitů (Timer0, Timer2)", da: "8 bit (Timer0, Timer2)", de: "8 Bit (Timer0, Timer2)", el: "8 bit (Timer0, Timer2)", en: "8 bit (Timer0, Timer2)", es: "8 bits (Timer0, Timer2)", fr: "8 bits (Timer0, Timer2)", hi: "8 बिट (Timer0, Timer2)", it: "8 bit (Timer0, Timer2)", ja: "8ビット（Timer0、Timer2）", nl: "8 bit (Timer0, Timer2)", no: "8 bit (Timer0, Timer2)", pl: "8 bitów (Timer0, Timer2)", pt: "8 bits (Timer0, Timer2)", sv: "8 bitar (Timer0, Timer2)", zh: "8位（Timer0、Timer2）"}
          consts: {top: 255}
        bits16:
          name: {cs: "16 bitů (Timer1)", da: "16 bit (Timer1)", de: "16 Bit (Timer1)", el: "16 bit (Timer1)", en: "16 bit (Timer1)", es: "16 bits (Timer1)", fr: "16 bits (Timer1)", hi: "16 बिट (Timer1)", it: "16 bit (Timer1)", ja: "16ビット（Timer1）", nl: "16 bit (Timer1)", no: "16 bit (Timer1)", pl: "16 bitów (Timer1)", pt: "16 bits (Timer1)", sv: "16 bitar (Timer1)", zh: "16位（Timer1）"}
          consts: {top: 65535}
  dof: 2
  derived:
    tot: {dim: number, label: "f_clk/(k·f)", name: {en: "Exact timer clocks per period (N × (1 + OCR), unrounded)", de: "Genaue Timertakte pro Periode (N × (1 + OCR), ungerundet)"}, expr: "fclk/(k*f)"}
    nsel: {dim: integer, label: N, name: {en: "Prescaler used", de: "Verwendeter Vorteiler"}, expr: "if(n,n,if(round(tot)<=top+1,1,if(round(tot/8)<=top+1,8,if(round(tot/64)<=top+1,64,if(round(tot/256)<=top+1,256,1024)))))", unit: dec}
    ocr: {dim: integer, label: OCR, name: {en: "Compare value OCR", de: "Vergleichswert OCR"}, expr: "max(round(tot/nsel)-1,0)", unit: dec}
    fact: {dim: frequency, label: f_act, name: {en: "Real frequency", de: "Tatsächliche Frequenz"}, expr: "fclk/(k*nsel*(ocr+1))"}
    err: {dim: ratio, label: Error, name: {en: "Frequency error", de: "Frequenzfehler"}, expr: "(fact-f)/f", unit: pct, units: [pct, ppm, ""]}
  checks:
    - {when: "ocr > top", warn: {en: "The compare value does not fit the timer; choose a larger prescaler or the 16-bit timer.", de: "Der Vergleichswert passt nicht in den Timer; größeren Vorteiler oder den 16-Bit-Timer wählen."}}
    - {when: "tot/nsel < 0.5", warn: {en: "The target frequency is above the maximum for this prescaler (f_clk / (k × N)).", de: "Die Zielfrequenz liegt über dem Maximum für diesen Vorteiler (f_clk / (k × N))."}}
    - {when: "abs(err) > 0.01", warn: {en: "The real frequency deviates by more than 1 %; try another prescaler.", de: "Die tatsächliche Frequenz weicht um mehr als 1 % ab; anderen Vorteiler probieren."}}
  formula: ["tot = fclk / (k * f)", "ocr = round(tot / nsel) - 1", "fact = fclk / (k * nsel * (ocr + 1))", "err = (fact - f) / f"]
