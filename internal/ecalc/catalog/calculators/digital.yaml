  checks:
    - {when: "nmh < 0", warn: {en: "HIGH is not reliably recognised: V_OH(min) of the driver is below V_IH(min) of the receiver. Use a receiver with TTL-level inputs (such as 74HCT) or a level shifter.", de: "HIGH wird nicht sicher erkannt: V_OH(min) des Treibers liegt unter V_IH(min) des Empfängers. Einen Empfänger mit TTL-Pegel-Eingängen (etwa 74HCT) oder einen Pegelwandler verwenden."}}
    - {when: "nml < 0", warn: {en: "LOW is not reliably recognised: V_OL(max) of the driver is above V_IL(max) of the receiver.", de: "LOW wird nicht sicher erkannt: V_OL(max) des Treibers liegt über V_IL(max) des Empfängers."}}
