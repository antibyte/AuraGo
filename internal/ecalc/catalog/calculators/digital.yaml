  rules:
    nmh: ["voh-vih"]
    nml: ["vil-vol"]
  derived:
    oh: {dim: voltage, label: V_OH, name: {en: "HIGH output level of the driver, V_OH(min)", de: "HIGH-Ausgangspegel des Treibers, V_OH(min)"}, expr: "voh"}
    ol: {dim: voltage, label: V_OL, name: {en: "LOW output level of the driver, V_OL(max)", de: "LOW-Ausgangspegel des Treibers, V_OL(max)"}, expr: "vol"}
    ih: {dim: voltage, label: V_IH, name: {en: "HIGH input threshold of the receiver, V_IH(min)", de: "HIGH-Eingangsschwelle des Empfängers, V_IH(min)"}, expr: "vih"}
    il: {dim: voltage, label: V_IL, name: {en: "LOW input threshold of the receiver, V_IL(max)", de: "LOW-Eingangsschwelle des Empfängers, V_IL(max)"}, expr: "vil"}
