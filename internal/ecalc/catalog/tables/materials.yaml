    - {id: rho20_min, name: {en: "Resistivity, lowest value in the sources", de: "Spezifischer Widerstand, niedrigster Quellenwert"}, dim: resistivity, unit: ohmmm2m, units: [ohmmm2m, ""], label: "ρ20_min"}
    - {id: rho20_max, name: {en: "Resistivity, highest value in the sources", de: "Spezifischer Widerstand, höchster Quellenwert"}, dim: resistivity, unit: ohmmm2m, units: [ohmmm2m, ""], label: "ρ20_max"}
    - {id: alpha, name: {en: "Temperature coefficient α near 20 °C", de: "Temperaturkoeffizient α um 20 °C"}, dim: tempco, units: ["", pctK, ppmK], label: "α"}
    - {id: alpha_min, name: {en: "α, lower limit of the band", de: "α, untere Bandgrenze"}, dim: tempco, units: ["", pctK, ppmK], label: "α_min"}
    - {id: alpha_max, name: {en: "α, upper limit of the band", de: "α, obere Bandgrenze"}, dim: tempco, units: ["", pctK, ppmK], label: "α_max"}
    - {id: alpha_basis, name: {en: "Validity of α", de: "Gültigkeit von α"}, dim: text}
    - {id: note, name: {en: Note, de: Hinweis}, dim: text}
