    - [{en: "Copper, pure (handbook)", de: "Kupfer, rein (Tabellenwert)"}, {en: "Cu (high-purity)", de: "Cu (hochrein)"}, {en: "pure metal", de: "reines Metall"}, 0.01678, null, null, 0.0040, null, null, {en: "local value at 20 °C", de: "lokaler Wert bei 20 °C"}, {en: "Purer than the IACS reference; commercial copper is closer to 0.01724.", de: "Reiner als der IACS-Bezug; handelsübliches Kupfer liegt näher an 0,01724."}]
