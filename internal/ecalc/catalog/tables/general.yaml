    - ["Γ", "γ", {en: "gamma", de: "Gamma"}, {en: "Γ: reflection coefficient; γ: electrical conductivity (German usage)", de: "Γ: Reflexionsfaktor; γ: elektrische Leitfähigkeit (deutscher Gebrauch)"}]
    - ["Δ", "δ", {en: "delta", de: "Delta"}, {en: "Δ: difference/change (ΔU, ΔT); δ: loss angle (tan δ); skin depth", de: "Δ: Differenz/Änderung (ΔU, ΔT); δ: Verlustwinkel (tan δ); Eindringtiefe (Skineffekt)"}]
