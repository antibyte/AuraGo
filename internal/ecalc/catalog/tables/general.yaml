    - ["Μ", "μ µ", {en: "mu", de: "My"}, {en: "µ: prefix micro (10⁻⁶); permeability (µ0, µr); amplification factor", de: "µ: Vorsatz Mikro (10⁻⁶); Permeabilität (µ0, µr); Verstärkungsfaktor"}]
    - ["Ν", "ν", {en: "nu", de: "Ny"}, {en: "ν: frequency (physics)", de: "ν: Frequenz (Physik)"}]
