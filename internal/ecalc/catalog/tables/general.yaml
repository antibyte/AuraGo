- id: ip_codes
  kind: table
  category: tables
  group: general
  guide: true
  name: {cs: "Krytí IP (IEC 60529)", da: "IP-kapslingsklasser (IEC 60529)", de: "IP-Schutzarten (IEC 60529)", el: "Βαθμοί προστασίας IP (IEC 60529)", en: "IP codes (IEC 60529)", es: "Códigos IP (IEC 60529)", fr: "Indices de protection IP (CEI 60529)", hi: "IP कोड (IEC 60529)", it: "Gradi di protezione IP (IEC 60529)", ja: "IPコード (IEC 60529)", nl: "IP-codes (IEC 60529)", no: "IP-koder (IEC 60529)", pl: "Stopnie ochrony IP (IEC 60529)", pt: "Códigos IP (IEC 60529)", sv: "IP-klasser (IEC 60529)", zh: "IP 防护等级 (IEC 60529)"}
  doc: {en: "The first characteristic numeral (solid foreign objects, access) and the second (water) of the IP code, with the short description and the meaning of every degree of protection.", de: "Die erste Kennziffer (Fremdkörper, Berührung) und die zweite (Wasser) des IP-Codes mit Kurzbeschreibung und Bedeutung jedes Schutzgrads."}
  notes: {en: "The two numerals are independent: IPX7 does not imply IPX5 or IPX6 (immersion is not a jet test); a product tested for both is marked e.g. IPX6/IPX7. Numeral 9 exists in IEC 60529 since Amendment 2 (2013); 9K comes from ISO 20653 (road vehicles), not from IEC 60529. The first numeral 2 is 12.5 mm (older texts round to 12 mm). The IP code says nothing about protection against electric shock (see protection classes, IEC 61140) or mechanical impact (IK code, IEC 62262). The test conditions, the additional letters A to D and the supplementary letters H, M, S and W are not listed. The English wording is a translation of the German table of Häwa, checked against Wikipedia; it is not copied from the standard.", de: "Die beiden Kennziffern sind unabhängig: IPX7 schließt IPX5/IPX6 nicht ein (Untertauchen ist keine Strahlwasserprüfung); Geräte mit beiden Prüfungen werden z. B. mit IPX6/IPX7 gekennzeichnet. Die Kennziffer 9 gibt es in IEC 60529 seit Änderung 2 (2013); 9K stammt aus ISO 20653 (Straßenfahrzeuge), nicht aus IEC 60529. Die erste Kennziffer 2 steht für 12,5 mm (ältere Texte runden auf 12 mm). Der IP-Code sagt nichts über den Schutz gegen elektrischen Schlag (siehe Schutzklassen, IEC 61140) oder die Stoßfestigkeit (IK-Code, IEC 62262). Die Prüfbedingungen, die Zusatzbuchstaben A bis D und die ergänzenden Buchstaben H, M, S und W sind nicht aufgeführt. Der deutsche Wortlaut folgt der Tabelle der Häwa GmbH, abgeglichen mit Wikipedia; er ist nicht aus der Norm kopiert."}
  tags: ["ip", "ip code", "ingress protection", "iec 60529", "din en 60529", "dust", "water", "enclosure", "protection degree", "schutzart", "schutzarten", "kennziffer", "staub", "wasser", "gehäuse", "ip65", "ip67"]
  source: "IEC 60529 (IP code) as tabulated by Häwa \"Schutzarten nach DIN EN 60529\" (German), en.wikipedia \"IP code\", BGN ASI 3.10 and FRIWO \"IP-Schutzarten nach DIN 60529\"; the standard itself was not read"
  columns:
    - {id: numeral, name: {en: "Characteristic numeral", de: "Kennziffer"}, dim: text}
    - {id: short, name: {en: "Protection", de: "Schutz"}, dim: text}
    - {id: definition, name: {en: "Meaning", de: "Bedeutung"}, dim: text}
  rows:
    - [{en: "1st numeral: 0", de: "1. Kennziffer: 0"}, {en: "not protected", de: "nicht geschützt"}, {en: "no special protection", de: "kein besonderer Schutz"}]
    - [{en: "1st numeral: 1", de: "1. Kennziffer: 1"}, {en: "protected against solid foreign objects of 50 mm Ø and greater", de: "geschützt gegen feste Fremdkörper 50 mm Durchmesser und größer"}, {en: "the object probe, sphere of 50 mm Ø, shall not fully penetrate (protection against access with the back of a hand)", de: "die Objektsonde, Kugel 50 mm Durchmesser, darf nicht voll eindringen (Schutz gegen Zugang mit dem Handrücken)"}]
    - [{en: "1st numeral: 2", de: "1. Kennziffer: 2"}, {en: "protected against solid foreign objects of 12.5 mm Ø and greater", de: "geschützt gegen feste Fremdkörper 12,5 mm Durchmesser und größer"}, {en: "the object probe, sphere of 12.5 mm Ø, shall not fully penetrate (protection against access with a finger)", de: "die Objektsonde, Kugel 12,5 mm Durchmesser, darf nicht voll eindringen (Schutz gegen Zugang mit dem Finger)"}]
    - [{en: "1st numeral: 3", de: "1. Kennziffer: 3"}, {en: "protected against solid foreign objects of 2.5 mm Ø and greater", de: "geschützt gegen feste Fremdkörper 2,5 mm Durchmesser und größer"}, {en: "the object probe, sphere of 2.5 mm Ø, shall not penetrate at all (tools, thick wires)", de: "die Objektsonde, Kugel 2,5 mm Durchmesser, darf überhaupt nicht eindringen (Werkzeuge, dicke Drähte)"}]
    - [{en: "1st numeral: 4", de: "1. Kennziffer: 4"}, {en: "protected against solid foreign objects of 1.0 mm Ø and greater", de: "geschützt gegen feste Fremdkörper 1,0 mm Durchmesser und größer"}, {en: "the object probe, sphere of 1.0 mm Ø, shall not penetrate at all (wires)", de: "die Objektsonde, Kugel 1,0 mm Durchmesser, darf überhaupt nicht eindringen (Drähte)"}]
    - [{en: "1st numeral: 5", de: "1. Kennziffer: 5"}, {en: "dust-protected", de: "staubgeschützt"}, {en: "ingress of dust is not totally prevented, but dust shall not penetrate in a quantity that interferes with satisfactory operation or safety", de: "Eindringen von Staub ist nicht vollständig verhindert, aber Staub darf nicht in einer Menge eindringen, die das zufriedenstellende Arbeiten oder die Sicherheit beeinträchtigt"}]
    - [{en: "1st numeral: 6", de: "1. Kennziffer: 6"}, {en: "dust-tight", de: "staubdicht"}, {en: "no ingress of dust", de: "kein Eindringen von Staub"}]
    - [{en: "1st numeral: X", de: "1. Kennziffer: X"}, {en: "not specified", de: "nicht angegeben"}, {en: "numeral not specified (not tested or not required)", de: "Kennziffer nicht angegeben (nicht geprüft oder nicht gefordert)"}]
    - [{en: "2nd numeral: 0", de: "2. Kennziffer: 0"}, {en: "not protected", de: "nicht geschützt"}, {en: "no special protection", de: "kein besonderer Schutz"}]
    - [{en: "2nd numeral: 1", de: "2. Kennziffer: 1"}, {en: "protected against vertically falling water drops", de: "geschützt gegen Tropfwasser"}, {en: "vertically falling drops shall have no harmful effects", de: "senkrecht fallende Tropfen dürfen keine schädlichen Wirkungen haben"}]
    - [{en: "2nd numeral: 2", de: "2. Kennziffer: 2"}, {en: "protected against vertically falling water drops when the enclosure is tilted up to 15°", de: "geschützt gegen Tropfwasser, wenn das Gehäuse bis zu 15° geneigt ist"}, {en: "vertically falling drops shall have no harmful effects when the enclosure is tilted at any angle up to 15° on either side of the vertical", de: "senkrecht fallende Tropfen dürfen keine schädlichen Wirkungen haben, wenn das Gehäuse um einen Winkel bis zu 15° beiderseits der Senkrechten geneigt ist"}]
    - [{en: "2nd numeral: 3", de: "2. Kennziffer: 3"}, {en: "protected against spraying water", de: "geschützt gegen Sprühwasser"}, {en: "water sprayed at an angle up to 60° on either side of the vertical shall have no harmful effects", de: "Wasser, das in einem Winkel bis zu 60° beiderseits der Senkrechten gesprüht wird, darf keine schädlichen Wirkungen haben"}]
    - [{en: "2nd numeral: 4", de: "2. Kennziffer: 4"}, {en: "protected against splashing water", de: "geschützt gegen Spritzwasser"}, {en: "water splashed against the enclosure from any direction shall have no harmful effects", de: "Wasser, das aus jeder Richtung gegen das Gehäuse spritzt, darf keine schädlichen Wirkungen haben"}]
    - [{en: "2nd numeral: 5", de: "2. Kennziffer: 5"}, {en: "protected against water jets", de: "geschützt gegen Strahlwasser"}, {en: "water projected in jets against the enclosure from any direction shall have no harmful effects", de: "Wasser, das aus jeder Richtung als Strahl gegen das Gehäuse gerichtet ist, darf keine schädlichen Wirkungen haben"}]
    - [{en: "2nd numeral: 6", de: "2. Kennziffer: 6"}, {en: "protected against powerful water jets", de: "geschützt gegen starkes Strahlwasser"}, {en: "water projected in powerful jets against the enclosure from any direction shall have no harmful effects", de: "Wasser, das aus jeder Richtung als starker Strahl gegen das Gehäuse gerichtet ist, darf keine schädlichen Wirkungen haben"}]
    - [{en: "2nd numeral: 7", de: "2. Kennziffer: 7"}, {en: "protected against the effects of temporary immersion in water", de: "geschützt gegen die Wirkungen beim zeitweiligen Untertauchen in Wasser"}, {en: "ingress of water in harmful quantity shall not be possible when the enclosure is temporarily immersed under standardised conditions of pressure and time", de: "Wasser darf nicht in schädlicher Menge eintreten, wenn das Gehäuse unter genormten Druck- und Zeitbedingungen zeitweilig untergetaucht ist"}]
    - [{en: "2nd numeral: 8", de: "2. Kennziffer: 8"}, {en: "protected against the effects of continuous immersion in water", de: "geschützt gegen die Wirkungen beim dauernden Untertauchen in Wasser"}, {en: "ingress of water in harmful quantity shall not be possible when continuously immersed under conditions agreed between manufacturer and user, more severe than for numeral 7", de: "Wasser darf nicht in schädlicher Menge eintreten, wenn das Gehäuse dauernd untergetaucht ist, unter zwischen Hersteller und Anwender vereinbarten Bedingungen, die schwieriger sein müssen als für Kennziffer 7"}]
    - [{en: "2nd numeral: 9", de: "2. Kennziffer: 9"}, {en: "protected against high-pressure and high-temperature water jets", de: "geschützt gegen Hochdruck und hohe Strahlwassertemperaturen"}, {en: "water directed at high pressure and high temperature against the enclosure from any direction shall have no harmful effects", de: "Wasser, das bei hohem Druck und hohen Temperaturen aus allen Richtungen gegen das Gehäuse gerichtet ist, darf keine schädlichen Wirkungen haben"}]
    - [{en: "2nd numeral: X", de: "2. Kennziffer: X"}, {en: "not specified", de: "nicht angegeben"}, {en: "numeral not specified (not tested or not required)", de: "Kennziffer nicht angegeben (nicht geprüft oder nicht gefordert)"}]
    - [{en: "2nd numeral: 9K", de: "2. Kennziffer: 9K"}, {en: "high-pressure / steam-jet cleaning (ISO 20653, road vehicles; not IEC 60529)", de: "Hochdruck-/Dampfstrahlreinigung (ISO 20653, Straßenfahrzeuge; nicht IEC 60529)"}, {en: "defined in ISO 20653 (formerly DIN 40050-9), not in IEC 60529", de: "definiert in ISO 20653 (früher DIN 40050-9), nicht in IEC 60529"}]

