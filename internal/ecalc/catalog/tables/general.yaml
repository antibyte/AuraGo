    - ["II", {en: "double or reinforced insulation between live and accessible parts; no protective-earth connection", de: "doppelte oder verstärkte Isolierung zwischen aktiven und berührbaren Teilen; kein Schutzleiteranschluss"}, {en: "no", de: "nein"}, {en: "two concentric squares", de: "zwei ineinanderliegende Quadrate"}, "5172", null]
    - ["III", {en: "supply only from safety extra-low voltage (SELV) or protective extra-low voltage (PELV) sources", de: "Betrieb nur mit Sicherheitskleinspannung (SELV) oder Schutzkleinspannung (PELV)"}, {en: "no", de: "nein"}, {en: "roman numeral III in a diamond", de: "römische III in einer Raute"}, "5180", {en: "connect only to SELV/PELV sources such as a safety transformer or battery", de: "Anschluss nur an SELV-/PELV-Quellen, z. B. Sicherheitstransformator oder Batterie"}]

