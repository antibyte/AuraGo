    - {id: v_max, name: {en: "Voltage to", de: "Spannung bis"}, dim: voltage, units: [""], label: "U"}
    - {id: b1, name: {en: "B1: internal conductors", de: "B1: Innenlagen"}, dim: length, unit: mm, units: [mm, mil], label: "s"}
    - {id: b2, name: {en: "B2: external, uncoated, up to 3050 m", de: "B2: außen, unbeschichtet, bis 3050 m"}, dim: length, unit: mm, units: [mm, mil], label: "s"}
    - {id: b3, name: {en: "B3: external, uncoated, above 3050 m or vacuum", de: "B3: außen, unbeschichtet, über 3050 m oder Vakuum"}, dim: length, unit: mm, units: [mm, mil], label: "s"}
    - {id: b4, name: {en: "B4: external, polymer coating (solder-mask type)", de: "B4: außen, Polymerbeschichtung (Lötstopplack-Art)"}, dim: length, unit: mm, units: [mm, mil], label: "s"}
    - {id: b5, name: {en: "B5 (formerly A5): external, conformal coating", de: "B5 (früher A5): außen, Schutzlack"}, dim: length, unit: mm, units: [mm, mil], label: "s"}
    - {id: a6, name: {en: "A6: component lead, coated, any elevation", de: "A6: Bauteilanschluss, beschichtet, jede Höhe"}, dim: length, unit: mm, units: [mm, mil], label: "s"}
    - {id: a7, name: {en: "A7: component lead, uncoated, up to 3050 m", de: "A7: Bauteilanschluss, unbeschichtet, bis 3050 m"}, dim: length, unit: mm, units: [mm, mil], label: "s"}
    - {id: a8, name: {en: "A8: component lead, uncoated, above 3050 m or vacuum", de: "A8: Bauteilanschluss, unbeschichtet, über 3050 m oder Vakuum"}, dim: length, unit: mm, units: [mm, mil], label: "s"}
    - {id: per_volt, name: {en: "Per-volt row (1: values are mm per volt)", de: "Zeile je Volt (1: Werte in mm je Volt)"}, dim: number}
