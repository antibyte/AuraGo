- id: ipc2221c_conductor_spacing
  kind: table
  category: tables
  group: conductors
  finder: {calc: trace_spacing_finder, column: v_min, var: band_min, choices: {revision: c}}
  name: {cs: "Vzdálenosti vodičů na DPS podle napětí (IPC-2221C)", da: "Lederafstand på print efter spænding (IPC-2221C)", de: "Leiterabstände auf Leiterplatten nach Spannung (IPC-2221C)", el: "Αποστάσεις αγωγών PCB ανά τάση (IPC-2221C)", en: "PCB conductor spacing by voltage (IPC-2221C)", es: "Separación de conductores en PCB según la tensión (IPC-2221C)", fr: "Distances entre conducteurs d'un circuit imprimé selon la tension (IPC-2221C)", hi: "वोल्टेज के अनुसार पीसीबी चालक दूरी (IPC-2221C)", it: "Distanza tra i conduttori del PCB in base alla tensione (IPC-2221C)", ja: "電圧別のプリント基板導体間隔 (IPC-2221C)", nl: "Geleiderafstand op pcb per spanning (IPC-2221C)", no: "Lederavstand på kretskort etter spenning (IPC-2221C)", pl: "Odstępy między ścieżkami PCB według napięcia (IPC-2221C)", pt: "Distância entre condutores em PCB por tensão (IPC-2221C)", sv: "Ledaravstånd på kretskort efter spänning (IPC-2221C)", zh: "按电压的 PCB 导体间距 (IPC-2221C)"}
  doc: {en: "Minimum spacing between conductors on a printed board by the voltage between them (DC or AC peak), for internal and external conductors and component leads (IPC-2221C table 6-1, December 2023).", de: "Mindestabstand zwischen Leitern auf einer Leiterplatte nach der Spannung zwischen ihnen (DC oder AC-Scheitelwert), für Innen- und Außenlagen und Bauteilanschlüsse (IPC-2221C Tabelle 6-1, Dezember 2023)."}
  notes: {en: "IPC-2221 spacing is functional spacing for printed boards; for mains or safety isolation use the creepage and clearance of IEC 60664-1 and IEC 62368-1. The bands use whole volts, so a voltage between two bands (15.5 V) belongs to the next band up. The last row (above 500 V, per volt; marked 1 in the per-volt column) holds millimetres (or mil) per volt, not a spacing: for a voltage above 500 V add them for every volt above 500 V to the value of the 301 to 500 V row. It belongs to no voltage band (its voltage from and to are empty), so a lookup by voltage never selects it; select it with per_volt = 1. Column B5 was designated A5 before; the old A6 values now appear in A7 and the old A7 values (except 251 to 300 V) in A6; A8 is new. The values were read from the published table and agree in two sources; the wording of the columns B4, A6, A7 and A8 comes from one source only (the pcb-toolkit crate) and has not been checked against IPC-2221C section 6.3.", de: "IPC-2221 gibt Funktionsabstände für Leiterplatten an; für Netz- bzw. Schutztrennung gelten die Kriech- und Luftstrecken nach IEC 60664-1 und IEC 62368-1. Die Bänder verwenden ganze Volt; eine Spannung zwischen zwei Bändern (15,5 V) gehört zum nächsthöheren Band. Die letzte Zeile (über 500 V, je Volt; in der Spalte je Volt mit 1 markiert) enthält Millimeter (oder mil) je Volt und keinen Abstand: Für eine Spannung über 500 V werden sie für jedes Volt über 500 V zum Wert der Zeile 301 bis 500 V addiert. Sie gehört zu keinem Spannungsband (Spannung ab und bis sind leer), eine Suche nach der Spannung trifft sie deshalb nie; sie wird mit je Volt = 1 gewählt. Die Spalte B5 hieß früher A5; die alten A6-Werte stehen jetzt in A7 und die alten A7-Werte (außer 251 bis 300 V) in A6; A8 ist neu. Die Werte wurden der veröffentlichten Tabelle entnommen und stimmen in zwei Quellen überein; der Wortlaut der Spalten B4, A6, A7 und A8 stammt nur aus einer Quelle (dem Crate pcb-toolkit) und wurde nicht mit IPC-2221C Abschnitt 6.3 verglichen."}
  tags: [ipc-2221, pcb, spacing, clearance, creepage, conductor spacing, voltage, isolation, leiterplatte, abstand, leiterabstand, spannung, kriechstrecke, luftstrecke, ipc-2221c]
  source: "IPC-2221C (December 2023) table 6-1 (electrical conductor spacing), read from the figure in the Siemens EDA article by S. V. Chavez (2025) and checked against the constants of the pcb-toolkit crate"
  guide: true
  key: band
  columns:
    - {id: band, name: {en: "Voltage band", de: "Spannungsband"}, dim: text}
