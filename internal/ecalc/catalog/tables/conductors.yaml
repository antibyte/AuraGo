- id: ipc2221b_conductor_spacing
  kind: table
  category: tables
  group: conductors
  finder: {calc: trace_spacing_finder, column: v_min, var: band_min, choices: {revision: b}}
  name: {cs: "Vzdálenosti vodičů na DPS podle napětí (IPC-2221B)", da: "Lederafstand på print efter spænding (IPC-2221B)", de: "Leiterabstände auf Leiterplatten nach Spannung (IPC-2221B)", el: "Αποστάσεις αγωγών PCB ανά τάση (IPC-2221B)", en: "PCB conductor spacing by voltage (IPC-2221B)", es: "Separación de conductores en PCB según la tensión (IPC-2221B)", fr: "Distances entre conducteurs d'un circuit imprimé selon la tension (IPC-2221B)", hi: "वोल्टेज के अनुसार पीसीबी चालक दूरी (IPC-2221B)", it: "Distanza tra i conduttori del PCB in base alla tensione (IPC-2221B)", ja: "電圧別のプリント基板導体間隔 (IPC-2221B)", nl: "Geleiderafstand op pcb per spanning (IPC-2221B)", no: "Lederavstand på kretskort etter spenning (IPC-2221B)", pl: "Odstępy między ścieżkami PCB według napięcia (IPC-2221B)", pt: "Distância entre condutores em PCB por tensão (IPC-2221B)", sv: "Ledaravstånd på kretskort efter spänning (IPC-2221B)", zh: "按电压的 PCB 导体间距 (IPC-2221B)"}
  doc: {en: "Minimum spacing between conductors on a printed board by the voltage between them (DC or AC peak), for internal and external conductors and component leads (IPC-2221B table 6-1, the same table as in IPC-2221A).", de: "Mindestabstand zwischen Leitern auf einer Leiterplatte nach der Spannung zwischen ihnen (DC oder AC-Scheitelwert), für Innen- und Außenlagen und Bauteilanschlüsse (IPC-2221B Tabelle 6-1, dieselbe Tabelle wie in IPC-2221A)."}
  notes: {en: "IPC-2221 spacing is functional spacing for printed boards; for mains or safety isolation use the creepage and clearance of IEC 60664-1 and IEC 62368-1. The bands use whole volts, so a voltage between two bands (15.5 V) belongs to the next band up. The last row (above 500 V, per volt; marked 1 in the per-volt column) holds millimetres (or mil) per volt, not a spacing: for a voltage above 500 V add them for every volt above 500 V to the value of the 301 to 500 V row. It belongs to no voltage band (its voltage from and to are empty), so a lookup by voltage never selects it; select it with per_volt = 1. Solder resist does not count as a coating for B2 and B3. One reproduction of the table printed 2.5 mm instead of 1.25 mm for B2 at 251 to 300 V; 1.25 mm agrees with the remark that IPC gives 1.25 mm at 300 V and 2.5 mm at 301 V and with IPC-2221C. IPC-2221C (2023) revised the table, see its own table.", de: "IPC-2221 gibt Funktionsabstände für Leiterplatten an; für Netz- bzw. Schutztrennung gelten die Kriech- und Luftstrecken nach IEC 60664-1 und IEC 62368-1. Die Bänder verwenden ganze Volt; eine Spannung zwischen zwei Bändern (15,5 V) gehört zum nächsthöheren Band. Die letzte Zeile (über 500 V, je Volt; in der Spalte je Volt mit 1 markiert) enthält Millimeter (oder mil) je Volt und keinen Abstand: Für eine Spannung über 500 V werden sie für jedes Volt über 500 V zum Wert der Zeile 301 bis 500 V addiert. Sie gehört zu keinem Spannungsband (Spannung ab und bis sind leer), eine Suche nach der Spannung trifft sie deshalb nie; sie wird mit je Volt = 1 gewählt. Lötstopplack gilt für B2 und B3 nicht als Beschichtung. Eine Wiedergabe der Tabelle nannte für B2 bei 251 bis 300 V 2,5 mm statt 1,25 mm; 1,25 mm passt zur Angabe, dass IPC bei 300 V 1,25 mm und bei 301 V 2,5 mm nennt, und zu IPC-2221C. IPC-2221C (2023) hat die Tabelle überarbeitet, siehe die eigene Tabelle."}
  tags: [ipc-2221, pcb, spacing, clearance, creepage, conductor spacing, voltage, isolation, leiterplatte, abstand, leiterabstand, spannung, kriechstrecke, luftstrecke, ipc-2221b]
  source: "IPC-2221B table 6-1 (electrical conductor spacing), read from the Altium Resources and P. McGaw reproductions and checked against smps.us and the Siemens EDA article by S. V. Chavez (2025)"
  guide: true
  key: band
  columns:
