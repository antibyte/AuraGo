    - {id: t_designation, name: {en: "Commercial thickness designation", de: "Handelsübliche Dickenbezeichnung"}, dim: length, units: ["", mil], label: "T"}
    - {id: t_137mil, name: {en: "Thickness by the 1.37 mil rule", de: "Dicke nach der Regel 1,37 mil"}, dim: length, unit: mil, units: [mil, ""], label: "T"}
