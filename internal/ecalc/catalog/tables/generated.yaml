  name: {cs: "Drátové rozměry AWG", da: "AWG-trådstørrelser", de: "AWG-Leitergrößen", el: "Μεγέθη αγωγών AWG", en: "AWG wire gauges", es: "Calibres de cable AWG", fr: "Calibres de fil AWG", hi: "AWG तार गेज", it: "Calibri dei fili AWG", ja: "AWG ワイヤゲージ", nl: "AWG-draaddiktes", no: "AWG-trådstørrelser", pl: "Rozmiary przewodów AWG", pt: "Calibres de fio AWG", sv: "AWG-trådstorlekar", zh: "AWG 线规"}
  doc: {en: "American Wire Gauge from 4/0 to AWG 40: diameter and cross-section of the bare wire and the DC resistance of 1 km of annealed copper at 20 °C.", de: "American Wire Gauge von 4/0 bis AWG 40: Durchmesser und Querschnitt des blanken Drahts und Gleichstromwiderstand von 1 km geglühtem Kupfer bei 20 °C."}
  notes: {en: "The diameter follows ASTM B258: 0.127 mm × 92^((36 - n)/39), with AWG 4/0 as n = -3 and AWG 1/0 as n = 0. The resistance uses 1/58 Ω·mm²/m for annealed copper at 20 °C and ignores stranding, insulation and temperature.", de: "Der Durchmesser folgt ASTM B258: 0,127 mm × 92^((36 - n)/39), AWG 4/0 ist n = -3 und AWG 1/0 ist n = 0. Der Widerstand rechnet mit 1/58 Ω·mm²/m für geglühtes Kupfer bei 20 °C und lässt Litzenaufbau, Isolation und Temperatur außer Acht."}
  tags: [awg, american wire gauge, wire, gauge, diameter, cross-section, copper, conductor, draht, drahtstärke, querschnitt, kupfer]
  source: "ASTM B258 (diameters and cross-sections of AWG sizes); IEC 60028 (resistivity of annealed copper, 1/58 Ω·mm²/m at 20 °C)"

- id: ipc2221
  kind: table
  category: tables
  group: conductors
  generate: ipc2221
  guide: true
  name: {cs: "Šířka vodivé cesty DPS (IPC-2221)", da: "Printbanebredde (IPC-2221)", de: "Leiterbahnbreite (IPC-2221)", el: "Πλάτος αγωγού PCB (IPC-2221)", en: "PCB trace width (IPC-2221)", es: "Ancho de pista de PCB (IPC-2221)", fr: "Largeur de piste de circuit imprimé (IPC-2221)", hi: "पीसीबी ट्रेस की चौड़ाई (IPC-2221)", it: "Larghezza delle piste PCB (IPC-2221)", ja: "プリント基板のパターン幅 (IPC-2221)", nl: "Printbaanbreedte (IPC-2221)", no: "Ledningsbredde på kretskort (IPC-2221)", pl: "Szerokość ścieżki PCB (IPC-2221)", pt: "Largura de pista de PCB (IPC-2221)", sv: "Ledarbredd på kretskort (IPC-2221)", zh: "PCB 走线宽度 (IPC-2221)"}
  doc: {en: "Trace width that carries a given current at a given temperature rise, from the IPC-2221 equation, for outer and inner layers in 1 oz and 2 oz copper.", de: "Leiterbahnbreite für einen Strom bei vorgegebener Erwärmung nach der IPC-2221-Gleichung, für Außen- und Innenlagen in 1-oz- und 2-oz-Kupfer."}
  notes: {en: "I = k · ΔT^0.44 · A^0.725 with the cross-section A in mil², k = 0.048 for outer and 0.024 for inner layers, and 35 µm of copper per oz. A first estimate: neighbouring traces, vias, air flow and planes change the real temperature rise, so test high currents.", de: "I = k · ΔT^0,44 · A^0,725 mit dem Querschnitt A in mil², k = 0,048 für Außen- und 0,024 für Innenlagen und 35 µm Kupfer je oz. Eine erste Abschätzung: Nachbarbahnen, Durchkontaktierungen, Luftströmung und Flächen verändern die reale Erwärmung, hohe Ströme deshalb prüfen."}
