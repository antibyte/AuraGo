  guide: true
  key: name
  name: {cs: "Souosé napájecí konektory (DC jack)", da: "DC-stik (hulstik)", de: "Hohlstecker (DC-Koaxialstecker)", el: "Ομοαξονικά βύσματα τροφοδοσίας DC", en: "DC barrel connectors (power plugs)", es: "Conectores de alimentación DC tipo barril", fr: "Connecteurs d'alimentation DC coaxiaux (jack)", hi: "DC बैरल कनेक्टर (पावर प्लग)", it: "Connettori di alimentazione DC coassiali (jack)", ja: "DCバレルコネクタ(電源プラグ)", nl: "DC-connectoren (coaxiale voedingsstekkers)", no: "DC-kontakter (hulplugger)", pl: "Wtyki zasilania DC (koncentryczne)", pt: "Conectores de alimentação DC (plugue barril)", sv: "DC-kontakter (koaxiella strömkontakter)", zh: "DC 圆柱电源插头"}
  doc: {en: "Sizes of DC barrel (coaxial power) plugs: outer and inner diameter, centre pin, voltage class and rated current. The five JEITA RC-5320A types plus the common sizes 5.5 × 2.1, 5.5 × 2.5 and 3.5 × 1.35 mm.", de: "Größen von DC-Hohlsteckern (Koaxial-Netzsteckern): Außen- und Innendurchmesser, Mittelstift, Spannungsklasse und Bemessungsstrom. Die fünf JEITA-RC-5320A-Typen und die verbreiteten Größen 5,5 × 2,1, 5,5 × 2,5 und 3,5 × 1,35 mm."}
  notes: {en: "Barrel size does not define voltage, current or polarity except for the JEITA RC-5320A types, whose size encodes the voltage class so that a higher-voltage plug does not fit a lower-voltage jack. Centre-positive is the most common polarity, but check the symbol on the device. Inner diameter = diameter of the jack's centre pin. For EIAJ-04 the sources give the inner diameter as 3.3 mm (Lumberg drawing, Wikipedia EIAJ connector) or 3.4 mm; 3.3 mm is shown. For EIAJ-05 the inner diameter is left empty because the sources give 4.3 mm and 4.4 mm. For the common sizes the current is that of the cited Lumberg and Schurter plugs (0.5 A); plugs of the same size can be rated higher. The 2.5 × 0.7 mm plug is not listed because only one source was found. The standard itself (JEITA RC-5320A) was not read.", de: "Die Hohlsteckergröße legt Spannung, Strom und Polarität nicht fest, außer bei den JEITA-RC-5320A-Typen, deren Größe die Spannungsklasse kodiert, damit ein Stecker höherer Spannung nicht in eine Buchse niedrigerer Spannung passt. Plus innen ist am verbreitetsten, das Symbol am Gerät aber immer prüfen. Innendurchmesser = Durchmesser des Mittelstifts der Buchse. Bei EIAJ-04 nennen die Quellen den Innendurchmesser 3,3 mm (Lumberg-Zeichnung, Wikipedia EIAJ connector) oder 3,4 mm; angezeigt wird 3,3 mm. Bei EIAJ-05 bleibt der Innendurchmesser leer, weil die Quellen 4,3 mm und 4,4 mm nennen. Bei den verbreiteten Größen ist der Strom der der zitierten Lumberg- und Schurter-Stecker (0,5 A); Stecker gleicher Größe können höher belastbar sein. Der Stecker 2,5 × 0,7 mm ist nicht aufgeführt, weil nur eine Quelle gefunden wurde. Die Norm selbst (JEITA RC-5320A) wurde nicht gelesen."}
  tags: ["dc", "barrel", "jack", "plug", "connector", "power", "5.5x2.1", "5.5x2.5", "3.5x1.35", "eiaj", "rc-5320a", "jeita", "hohlstecker", "netzteil", "stecker", "buchse", "koaxial"]
  source: "JEITA (EIAJ) RC-5320A types 1 to 5 as in the Lumberg datasheets 1636 01 to 1636 05 and Wikipedia \"EIAJ connector\"; Lumberg NES/J 210 and NES/J 135, Schurter 4840.5210; Wikipedia \"Coaxial power connector\" (the standard itself was not read)"
