    - ["1206", "3216", 3.2, 1.6, 0.25, 200, 0.25, 200, 0.25, 200, 0.25, 200, {en: "Yageo body 3.10 mm long; Yageo also 1/2 W type; Panasonic ERJ-8EN is NRFND", de: "Yageo-Körper 3,10 mm lang; Yageo auch 1/2-W-Typ; Panasonic ERJ-8EN ist NRFND"}]
    - ["1210", "3225", 3.2, 2.5, 0.5, 200, 0.5, 200, 0.5, 200, 0.5, 200, {en: "Yageo body 3.10 x 2.60 mm; Panasonic ERJ-14N is NRFND", de: "Yageo-Körper 3,10 x 2,60 mm; Panasonic ERJ-14N ist NRFND"}]
    - ["1812", "4532", 4.5, 3.2, 0.75, 200, null, null, null, null, 0.75, 200, {en: "Common MLCC size; resistor rating from Panasonic ERJ-12N only (NRFND)", de: "Übliche MLCC-Größe; Widerstandswerte nur von Panasonic ERJ-12N (NRFND)"}]
    - ["2010", "5025", 5.0, 2.5, 0.75, 200, 0.75, 200, 0.75, 400, 0.75, 200, {en: "Vishay allows 400 V; Panasonic ERJ-12S is NRFND", de: "Vishay erlaubt 400 V; Panasonic ERJ-12S ist NRFND"}]
