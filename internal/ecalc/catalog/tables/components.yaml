  notes: {en: "Dimensions are maximum outline values; real cells are slightly smaller. Li-ion sizes (14500, 18650, 21700, 26650) are named after their nominal diameter and length in mm; they say nothing about chemistry or voltage. A 14500 Li-ion cell fits an AA holder but has 3.6–3.7 V and can destroy 1.5 V devices. ANSI designations are listed for AA only, where two sources agree; the dimensions and voltage of the 14500 come from a single source and are left empty. AAAA, CR2025, CR2016, CR1220, CR123A, LR44, 4.5 V flat packs, 10440 and 16340 are not listed.", de: "Maße sind maximale Außenmaße; reale Zellen sind etwas kleiner. Li-Ion-Größen (14500, 18650, 21700, 26650) sind nach Nenndurchmesser und -länge in mm benannt; sie sagen nichts über Chemie oder Spannung. Eine 14500-Li-Ion-Zelle passt in einen AA-Halter, hat aber 3,6–3,7 V und kann 1,5-V-Geräte zerstören. ANSI-Bezeichnungen stehen nur für AA, wo zwei Quellen übereinstimmen; Maße und Spannung der 14500 stammen aus nur einer Quelle und bleiben leer. AAAA, CR2025, CR2016, CR1220, CR123A, LR44, 4,5-V-Flachbatterien, 10440 und 16340 sind nicht aufgeführt."}
