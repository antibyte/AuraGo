  name: {cs: "Převod logických úrovní: metody a obvody", da: "Niveauomsætning af logik: metoder og kredse", de: "Pegelwandlung zwischen Logikspannungen: Methoden und Bausteine", el: "Μετατροπή λογικών στάθμεων: μέθοδοι και εξαρτήματα", en: "Logic level shifting: methods and parts", es: "Conversión de niveles lógicos: métodos y componentes", fr: "Adaptation de niveaux logiques : méthodes et composants", hi: "लॉजिक लेवल शिफ्टिंग: तरीके और पार्ट्स", it: "Conversione dei livelli logici: metodi e componenti", ja: "ロジックレベル変換:方式と部品", nl: "Logische niveaus omzetten: methoden en onderdelen", no: "Nivåkonvertering for logikk: metoder og komponenter", pl: "Konwersja poziomów logicznych: metody i układy", pt: "Conversão de níveis lógicos: métodos e componentes", sv: "Nivåomvandling för logik: metoder och kretsar", zh: "逻辑电平转换:方法与器件"}
  doc: {en: "Ten ways to connect logic signals of two different voltages (for example 3.3 V and 5 V, or 1.8 V and 3.3 V): resistor divider, series resistor, discrete MOSFET, pass-gate and auto-direction translators, direction-controlled dual-supply buffers and single-supply buffers. For each: the direction it supports, whether it suits open-drain and push-pull signals, the maximum data rate as the maker states it, the supply ranges and the control pin.", de: "Zehn Wege, Logiksignale zweier unterschiedlicher Spannungen zu verbinden (zum Beispiel 3,3 V und 5 V oder 1,8 V und 3,3 V): Spannungsteiler, Vorwiderstand, diskreter MOSFET, Durchlassschalter- und Auto-Richtungs-Wandler, richtungsgesteuerte Puffer mit zwei Versorgungen und Puffer mit einer Versorgung. Je Verfahren: unterstützte Richtung, Eignung für Open-Drain- und Gegentaktsignale, maximale Datenrate laut Hersteller, Versorgungsbereiche und Steuerpin."}
  notes: {en: "Guide values: the rates are the best-case figures the makers print, for the supply pair named in the condition column; they depend on supply pair, load and driver, so always check the data sheet of the actual part. Check both directions of every signal: an output's VOH/VOL must meet the receiver's VIH/VIL (see the logic levels table), and no input may see more than its absolute maximum unless the data sheet calls it tolerant. Auto-direction translators (TXS, TXB) are sensitive to load, trace length and external resistors; TXB parts must not be used on I²C. A one-way or direction-controlled translator cannot by design pass a bidirectional open-drain bus such as I²C, because such a bus needs both directions without a direction signal; for these rows the open-drain cell is empty, because no maker document states it (it is our own reasoning, not a source). Empty rate cells mean no cross-checked figure: no maker states a rate for the divider, the series resistor, the 74AHCT/HCT and the 74LVC125A, the makers disagree on the PCA9306 (more than 2 MHz at NXP, more than 100 MHz at TI) and on the LVC8T245 (420 Mbit/s at Nexperia, 320 Mbit/s in the TI buying guide), and the discrete MOSFET is described by its maker document for open-drain I²C only, so its push-pull cell is empty. Where the makers print different supply ranges (PCA9306, LVC1T45, LVC8T245, LVC125A) both are shown. BSS138 and 2N7002 are examples of the discrete MOSFET with the threshold voltages of the onsemi data sheets (BSS138 0.8 to 1.5 V, 2N7002 1 to 2.5 V); the application note AN10441 itself names only \"a discrete N-channel enhancement MOSFET\". The divider and series-resistor methods rest on a single maker document (Microchip DS41285A). Supply columns name the lower- and the higher-voltage side; for single-supply methods they name the receiving and the driving logic.", de: "Richtwerte: Die Raten sind die Bestwerte, die die Hersteller drucken, für das in der Bedingungsspalte genannte Versorgungspaar; sie hängen von Versorgungspaar, Last und Treiber ab, daher immer das Datenblatt des konkreten Bausteins prüfen. Jedes Signal in beiden Richtungen prüfen: VOH/VOL des Ausgangs müssen VIH/VIL des Empfängers erfüllen (siehe Tabelle der Logikpegel), und kein Eingang darf mehr als seinen Grenzwert sehen, außer das Datenblatt nennt ihn tolerant. Pegelwandler mit automatischer Richtungserkennung (TXS, TXB) reagieren empfindlich auf Last, Leitungslänge und externe Widerstände; TXB-Bausteine nicht an I²C verwenden. Ein Wandler, der nur in einer Richtung arbeitet oder per Richtungspin gesteuert wird, kann einen bidirektionalen Open-Drain-Bus wie I²C konstruktionsbedingt nicht durchleiten, weil ein solcher Bus beide Richtungen ohne Richtungssignal braucht; bei diesen Zeilen ist die Open-Drain-Zelle leer, weil kein Herstellerdokument sie nennt (es ist unsere eigene Überlegung, keine Quelle). Leere Ratenzellen bedeuten: keine abgeglichene Angabe. Für Spannungsteiler, Vorwiderstand, 74AHCT/HCT und 74LVC125A nennt kein Hersteller eine Rate, beim PCA9306 widersprechen sich die Hersteller (über 2 MHz bei NXP, über 100 MHz bei TI) und beim LVC8T245 ebenso (420 Mbit/s bei Nexperia, 320 Mbit/s in der TI-Auswahlhilfe); der diskrete MOSFET wird in seinem Herstellerdokument nur für Open-Drain-I²C beschrieben, daher ist seine Gegentakt-Zelle leer. Wo die Hersteller unterschiedliche Versorgungsbereiche drucken (PCA9306, LVC1T45, LVC8T245, LVC125A), stehen beide da. BSS138 und 2N7002 sind Beispiele für den diskreten MOSFET mit den Schwellspannungen der onsemi-Datenblätter (BSS138 0,8 bis 1,5 V, 2N7002 1 bis 2,5 V); die Applikationsschrift AN10441 nennt selbst nur „a discrete N-channel enhancement MOSFET“. Spannungsteiler und Vorwiderstand stützen sich auf nur ein Herstellerdokument (Microchip DS41285A). Die Versorgungsspalten nennen die Seite mit der niedrigeren und die mit der höheren Spannung; bei Verfahren mit einer Versorgung die empfangende und die treibende Logik."}
