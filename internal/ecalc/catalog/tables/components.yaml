# Reference tables of the components group (SMD chip sizes, ceramic dielectrics, fuses, batteries, DC barrel plugs).
# Every table is transcribed from the research of phase 3 and cross-checked against the sources named in `source`.
# Cells that no second source confirmed are empty (null) and the notes of the table say so. The E-series tables of this
# group (eseries_e24, eseries_e192) are generated by the engine and live in generated.yaml.
# A text cell is a plain string (the same in every language) or {en, de}. Numbers are written in the unit of their
# column; a time is in seconds, a temperature in degC.
- id: smd_chip_sizes
  kind: table
  category: tables
  group: components
  key: imperial
  name: {cs: "Velikosti SMD čipů (rezistory, kondenzátory)", da: "SMD-chipstørrelser (modstande, kondensatorer)", de: "SMD-Chip-Bauformen (Widerstände, Kondensatoren)", el: "Μεγέθη SMD chip (αντιστάσεις, πυκνωτές)", en: "SMD chip sizes (resistors, capacitors)", es: "Tamaños de chip SMD (resistencias, condensadores)", fr: "Tailles de puces CMS (résistances, condensateurs)", hi: "SMD चिप आकार (रेज़िस्टर, संधारित्र)", it: "Dimensioni dei chip SMD (resistori, condensatori)", ja: "SMDチップサイズ(抵抗・コンデンサ)", nl: "SMD-chipmaten (weerstanden, condensatoren)", no: "SMD-brikkestørrelser (motstander, kondensatorer)", pl: "Rozmiary obudów SMD (rezystory, kondensatory)", pt: "Tamanhos de chip SMD (resistores, capacitores)", sv: "SMD-chipstorlekar (motstånd, kondensatorer)", zh: "SMD 贴片尺寸(电阻、电容)"}
  doc: {en: "Sizes of SMD chip resistors and capacitors: EIA (inch) and metric size codes, body length and width, and the typical rated power and working voltage of thick-film chip resistors with the values of three makers.", de: "Baugrößen von SMD-Chipwiderständen und -kondensatoren: EIA-(Zoll-) und metrische Baugrößencodes, Länge und Breite des Körpers sowie typische Nennleistung und Betriebsspannung von Dickschicht-Chipwiderständen mit den Werten dreier Hersteller."}
  notes: {en: "Ratings are for general-purpose thick-film chip resistors at 70 °C ambient; above 70 °C derate linearly to zero at the maximum film temperature (155 °C for most series, 125 °C for Yageo RC0075–RC0201 and Panasonic ERJ-XG/1G). The continuous working voltage is the lower of √(P·R) and the maximum working voltage. The typical columns show the value that most makers share for the standard type; where the makers differ (power at 0402, voltage at 2010 and 2512, body size of 2512) the maker columns and the remark show the spread. Capacitor (MLCC) bodies use the same size codes, but thickness and tolerances are maker-specific. Panasonic marks some sizes and parts NRFND (not recommended for new designs). Beware of mixed-up codes: 0402 and 0603 exist in both systems (imperial 0402 = metric 1005, metric 0402 = imperial 01005; imperial 0603 = metric 1608, metric 0603 = imperial 0201).", de: "Die Werte gelten für Standard-Dickschicht-Chipwiderstände bei 70 °C Umgebung; darüber linear bis null bei der maximalen Schichttemperatur abwerten (155 °C bei den meisten Reihen, 125 °C bei Yageo RC0075–RC0201 und Panasonic ERJ-XG/1G). Die Dauerbetriebsspannung ist der kleinere Wert aus √(P·R) und der maximalen Betriebsspannung. Die typischen Spalten zeigen den Wert, den die meisten Hersteller für den Standardtyp gemeinsam haben; wo die Hersteller abweichen (Leistung bei 0402, Spannung bei 2010 und 2512, Körpermaß bei 2512), zeigen die Herstellerspalten und die Bemerkung die Streuung. MLCC-Körper verwenden dieselben Baugrößencodes, Dicke und Toleranzen sind aber herstellerabhängig. Panasonic markiert einige Größen und Typen als NRFND (nicht für Neuentwicklungen empfohlen). Vorsicht bei verwechselten Codes: 0402 und 0603 gibt es in beiden Systemen (Zoll 0402 = metrisch 1005, metrisch 0402 = Zoll 01005; Zoll 0603 = metrisch 1608, metrisch 0603 = Zoll 0201)."}
  tags: ["smd", "chip", "package", "footprint", "case size", "0402", "0603", "0805", "1206", "resistor", "capacitor", "eia", "imperial", "metric", "baugröße", "bauform", "gehäuse", "widerstand", "kondensator", "metrisch"]
  source: "Yageo RC_L series product specification (V.11); Vishay Dale D/CRCW e3 datasheet (document 20035); Panasonic ERJ precision thick film chip resistors; KEMET C0G/X7R and TDK MLCC size code tables"
