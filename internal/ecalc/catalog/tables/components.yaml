  rows:
    - ["EIAJ-01 (JSAP1)", "JEITA RC-5320A type 1", 2.35, 0.7, null, 0, 3.15, 2, {en: "Voltage class up to 3.15 V", de: "Spannungsklasse bis 3,15 V"}]
    - ["EIAJ-02 (JSAP2)", "JEITA RC-5320A type 2", 4.0, 1.7, null, 3.15, 6.3, 2, {en: "Voltage class 3.15–6.3 V; = the common 4.0 × 1.7 plug (e.g. Sony PSP charger)", de: "Spannungsklasse 3,15–6,3 V; = der verbreitete 4,0 × 1,7 (z. B. Sony-PSP-Ladegerät)"}]
    - ["EIAJ-03 (JSAP3)", "JEITA RC-5320A type 3", 4.75, 1.7, null, 6.3, 10.5, 2, {en: "Voltage class 6.3–10.5 V", de: "Spannungsklasse 6,3–10,5 V"}]
    - ["EIAJ-04 (JSBP4)", "JEITA RC-5320A type 4", 5.5, 3.3, 1.0, 10.5, 13.5, 2, {en: "Voltage class 10.5–13.5 V; plug has its own centre pin", de: "Spannungsklasse 10,5–13,5 V; Stecker hat eigenen Mittelstift"}]
    - ["EIAJ-05 (JSBP5)", "JEITA RC-5320A type 5", 6.5, null, 1.4, 13.5, 18, 2, {en: "Voltage class 13.5–18 V; plug has its own centre pin; inner diameter left empty because the sources give 4.3 mm and 4.4 mm", de: "Spannungsklasse 13,5–18 V; Stecker hat eigenen Mittelstift; Innendurchmesser bleibt leer, weil die Quellen 4,3 mm und 4,4 mm nennen"}]
    - ["5.5 × 2.1", "common (IEC 60130-10 type A per Wikipedia)", 5.5, 2.1, null, null, null, 0.5, {en: "Very common (e.g. Arduino adapters, guitar effects pedals); current rating depends on the part (Lumberg NES/J 210: 0.5 A, 12 V)", de: "Sehr verbreitet (z. B. Arduino-Netzteile, Gitarren-Effektgeräte); Strombelastbarkeit je nach Typ (Lumberg NES/J 210: 0,5 A, 12 V)"}]
    - ["5.5 × 2.5", "common (IEC 60130-10 type A per Wikipedia)", 5.5, 2.5, null, null, null, 0.5, {en: "Looks like 5.5 × 2.1 but needs a 2.5 mm jack pin; a 2.1 plug does not fit a 2.5 jack pin, a 2.5 plug fits loosely on 2.1; Schurter 4840.5210: 0.5 A, 12 V", de: "Sieht aus wie 5,5 × 2,1, braucht aber 2,5-mm-Stift; 2,1er-Stecker passt nicht auf 2,5er-Stift, 2,5er sitzt locker auf 2,1er; Schurter 4840.5210: 0,5 A, 12 V"}]
    - ["3.5 × 1.35", "common", 3.5, 1.35, null, null, null, 0.5, {en: "Small devices and chargers (e.g. Canon CA-570, 8.4 V); Lumberg sells the size as 3.4 × 1.4 mm (NES/J 135: 0.5 A, 12 V)", de: "Kleingeräte und Ladegeräte (z. B. Canon CA-570, 8,4 V); Lumberg führt die Größe als 3,4 × 1,4 mm (NES/J 135: 0,5 A, 12 V)"}]
