    - {id: yageo_rc_v, name: {en: "Yageo RC_L: max. working voltage", de: "Yageo RC_L: max. Betriebsspannung"}, dim: voltage, units: [""]}
    - {id: vishay_crcw_p_w, name: {en: "Vishay D/CRCW e3: rated power P70 (standard mode)", de: "Vishay D/CRCW e3: Nennleistung P70 (Standardbetrieb)"}, dim: power, units: [""]}
    - {id: vishay_crcw_v, name: {en: "Vishay D/CRCW e3: max. voltage (standard mode)", de: "Vishay D/CRCW e3: max. Spannung (Standardbetrieb)"}, dim: voltage, units: [""]}
    - {id: panasonic_erj_p_w, name: {en: "Panasonic ERJ: rated power at 70 °C", de: "Panasonic ERJ: Nennleistung bei 70 °C"}, dim: power, units: [""]}
    - {id: panasonic_erj_v, name: {en: "Panasonic ERJ: limiting element voltage", de: "Panasonic ERJ: Grenzspannung (limiting element voltage)"}, dim: voltage, units: [""]}
    - {id: note, name: {en: "Remarks", de: "Bemerkungen"}, dim: text}
  rows:
    - ["01005", "0402", 0.4, 0.2, 0.031, 15, 0.03125, 15, null, null, 0.031, 15, {en: "Yageo calls this size 0100 (RC0100 = 1/32 W)", de: "Yageo nennt diese Größe 0100 (RC0100 = 1/32 W)"}]
    - ["0201", "0603", 0.6, 0.3, 0.05, 25, 0.05, 25, null, null, 0.05, 25, {en: "Vishay CRCW0201 is a separate datasheet, not read", de: "Vishay CRCW0201 steht in einem eigenen Datenblatt, nicht gelesen"}]
    - ["0402", "1005", 1.0, 0.5, 0.0625, 50, 0.0625, 50, 0.063, 50, 0.1, 50, {en: "Power varies by maker: 1/16 W (Yageo, Vishay standard) or 0.1 W (Panasonic ERJ-2R, Vishay extended mode 0.10 W/75 V); Yageo also offers a 1/8 W type", de: "Leistung je Hersteller: 1/16 W (Yageo, Vishay Standard) oder 0,1 W (Panasonic ERJ-2R, Vishay erweitert 0,10 W/75 V); Yageo hat auch einen 1/8-W-Typ"}]
    - ["0603", "1608", 1.6, 0.8, 0.1, 75, 0.1, 75, 0.1, 75, 0.1, 75, {en: "Vishay extended mode 0.125 W; Yageo also 1/5 W type; Vishay body 1.55 x 0.85 mm", de: "Vishay erweitert 0,125 W; Yageo auch 1/5-W-Typ; Vishay-Körper 1,55 x 0,85 mm"}]
