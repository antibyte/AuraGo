    - {id: v_min, name: {en: "Voltage class from", de: "Spannungsklasse ab"}, dim: voltage, units: [""]}
    - {id: v_max, name: {en: "Rated voltage (class upper end)", de: "Bemessungsspannung (Klassenobergrenze)"}, dim: voltage, units: [""]}
    - {id: i_max_a, name: {en: "Rated current of the cited plugs", de: "Bemessungsstrom der zitierten Stecker"}, dim: current, units: [""]}
    - {id: use, name: {en: "Use / remarks", de: "Verwendung / Bemerkungen"}, dim: text}
  rows:
    - ["EIAJ-01 (JSAP1)", "JEITA RC-5320A type 1", 2.35, 0.7, null, 0, 3.15, 2, {en: "Voltage class up to 3.15 V", de: "Spannungsklasse bis 3,15 V"}]
    - ["EIAJ-02 (JSAP2)", "JEITA RC-5320A type 2", 4.0, 1.7, null, 3.15, 6.3, 2, {en: "Voltage class 3.15–6.3 V; = the common 4.0 × 1.7 plug (e.g. Sony PSP charger)", de: "Spannungsklasse 3,15–6,3 V; = der verbreitete 4,0 × 1,7 (z. B. Sony-PSP-Ladegerät)"}]
    - ["EIAJ-03 (JSAP3)", "JEITA RC-5320A type 3", 4.75, 1.7, null, 6.3, 10.5, 2, {en: "Voltage class 6.3–10.5 V", de: "Spannungsklasse 6,3–10,5 V"}]
    - ["EIAJ-04 (JSBP4)", "JEITA RC-5320A type 4", 5.5, 3.3, 1.0, 10.5, 13.5, 2, {en: "Voltage class 10.5–13.5 V; plug has its own centre pin", de: "Spannungsklasse 10,5–13,5 V; Stecker hat eigenen Mittelstift"}]
    - ["EIAJ-05 (JSBP5)", "JEITA RC-5320A type 5", 6.5, null, 1.4, 13.5, 18, 2, {en: "Voltage class 13.5–18 V; plug has its own centre pin; inner diameter left empty because the sources give 4.3 mm and 4.4 mm", de: "Spannungsklasse 13,5–18 V; Stecker hat eigenen Mittelstift; Innendurchmesser bleibt leer, weil die Quellen 4,3 mm und 4,4 mm nennen"}]
    - ["5.5 × 2.1", "common (IEC 60130-10 type A per Wikipedia)", 5.5, 2.1, null, null, null, 0.5, {en: "Very common (e.g. Arduino adapters, guitar effects pedals); current rating depends on the part (Lumberg NES/J 210: 0.5 A, 12 V)", de: "Sehr verbreitet (z. B. Arduino-Netzteile, Gitarren-Effektgeräte); Strombelastbarkeit je nach Typ (Lumberg NES/J 210: 0,5 A, 12 V)"}]
    - ["5.5 × 2.5", "common (IEC 60130-10 type A per Wikipedia)", 5.5, 2.5, null, null, null, 0.5, {en: "Looks like 5.5 × 2.1 but needs a 2.5 mm jack pin; a 2.1 plug does not fit a 2.5 jack pin, a 2.5 plug fits loosely on 2.1; Schurter 4840.5210: 0.5 A, 12 V", de: "Sieht aus wie 5,5 × 2,1, braucht aber 2,5-mm-Stift; 2,1er-Stecker passt nicht auf 2,5er-Stift, 2,5er sitzt locker auf 2,1er; Schurter 4840.5210: 0,5 A, 12 V"}]
    - ["3.5 × 1.35", "common", 3.5, 1.35, null, null, null, 0.5, {en: "Small devices and chargers (e.g. Canon CA-570, 8.4 V); Lumberg sells the size as 3.4 × 1.4 mm (NES/J 135: 0.5 A, 12 V)", de: "Kleingeräte und Ladegeräte (z. B. Canon CA-570, 8,4 V); Lumberg führt die Größe als 3,4 × 1,4 mm (NES/J 135: 0,5 A, 12 V)"}]

- id: blade_fuses
  kind: table
  category: tables
  group: components
  guide: true
  key: id
  name: {cs: "Automobilní nožové pojistky: jmenovité proudy a barvy", da: "Fladsikringer til biler: mærkestrømme og farver", de: "Kfz-Flachsicherungen: Nennströme und Farben", el: "Ασφάλειες λεπίδας αυτοκινήτου: ονομαστικά ρεύματα και χρώματα", en: "Automotive blade fuses: ratings and colours", es: "Fusibles de cuchilla para automoción: corrientes y colores", fr: "Fusibles plats automobiles : courants et couleurs", hi: "ऑटोमोटिव ब्लेड फ़्यूज़: रेटिंग और रंग", it: "Fusibili a lama per auto: correnti e colori", ja: "自動車用ブレードヒューズ:定格電流と色", nl: "Autoplatsteekzekeringen: nominale stromen en kleuren", no: "Flatsikringer til biler: merkestrømmer og farger", pl: "Bezpieczniki samochodowe płytkowe: prądy znamionowe i kolory", pt: "Fusíveis de lâmina automotivos: correntes e cores", sv: "Billamellsäkringar: märkströmmar och färger", zh: "汽车插片式熔断器:额定电流与颜色"}
  doc: {en: "Rated current and housing colour of automotive blade fuses: 13 ratings from 1 to 40 A of the colour code shared by the Micro2, Micro3, low-profile Mini, Mini and regular (ATO, ATC, ATOF) formats, and 10 ratings from 20 to 100 A of the MAXI format, whose colours differ. The formats column shows where at least two makers offer the rating.", de: "Nennstrom und Gehäusefarbe von Kfz-Flachsicherungen: 13 Nennströme von 1 bis 40 A im gemeinsamen Farbcode der Bauformen Micro2, Micro3, Mini Low Profile, Mini und Standard (ATO, ATC, ATOF) sowie 10 Nennströme von 20 bis 100 A der Bauform Maxi, deren Farben abweichen. Die Spalte Bauformen zeigt, wo mindestens zwei Hersteller den Nennstrom anbieten."}
  notes: {en: "The colour only helps to identify the rating; what counts is the rating marked on the fuse. Always replace a fuse with one of the same rating and type and never fit a higher rating, because the fuse protects the wiring. MAXI fuses use a different colour code: a green MAXI is 30 A like a green Mini, but a brown MAXI is 35 A while a brown Mini is 7.5 A. The formats differ mechanically (Micro2 has two blades, Micro3 three blades with two fuse elements, the low-profile Mini a lower body than the Mini); the same colour does not make them interchangeable. The colours rest on five maker catalogues (Littelfuse, Bussmann, OptiFuse, HELLA, MTA); ISO 8820-3 itself was not read, only the makers state conformity to it. Colour names vary by maker (tan or beige, natural, clear or white); the English cell shows the majority name and the variants in brackets, and the German names are translations. Ratings that only one maker lists are left out: 12 A (light pink, OptiFuse APR only) and 120 A MAXI (pink, OptiFuse APX only). A rating offered in a format by only one maker is not listed under formats and is named in the remark instead (1 A Mini, 3 A Micro2 and Micro3). The MAXI time characteristic is not part of this table.", de: "Die Farbe dient nur zum Erkennen des Nennstroms; maßgeblich ist der auf der Sicherung aufgedruckte Wert. Eine Sicherung immer durch eine gleichen Nennstroms und gleicher Bauform ersetzen, nie durch eine stärkere, denn die Sicherung schützt die Leitung. Maxi-Sicherungen haben einen eigenen Farbcode: Grün ist bei Maxi wie bei Mini 30 A, Braun aber bei Maxi 35 A und bei Mini 7,5 A. Die Bauformen sind mechanisch verschieden (Micro2 mit zwei Kontaktmessern, Micro3 mit drei Kontaktmessern und zwei Schmelzleitern, Mini Low Profile flacher als Mini); gleiche Farbe heißt nicht austauschbar. Die Farben stützen sich auf fünf Herstellerkataloge (Littelfuse, Bussmann, OptiFuse, HELLA, MTA); ISO 8820-3 selbst wurde nicht gelesen, nur die Hersteller geben Konformität an. Die Farbnamen schwanken je nach Hersteller (tan oder beige, natur, klar oder weiß); die englische Zelle zeigt den häufigsten Namen mit den Varianten in Klammern, die deutschen Namen sind Übersetzungen. Nennströme, die nur ein Hersteller aufführt, fehlen: 12 A (hellrosa, nur OptiFuse APR) und 120 A Maxi (rosa, nur OptiFuse APX). Ein Nennstrom, den in einer Bauform nur ein Hersteller anbietet, steht nicht bei den Bauformen, sondern im Hinweis (1 A Mini, 3 A Micro2 und Micro3). Die Zeitcharakteristik der Maxi-Sicherungen gehört nicht in diese Tabelle."}
  tags: ["fuse", "blade fuse", "automotive", "car", "colour code", "ato", "atc", "atof", "mini", "maxi", "micro2", "micro3", "low profile", "iso 8820-3", "sae j1284", "sicherung", "flachsicherung", "kfz", "kfz-sicherung", "farbcode", "nennstrom", "steckersicherung"]
  source: "Littelfuse catalogue section Blade Terminal & Special Purpose Fuses (2005) and aftermarket catalogue page FUSES 5, and the current ATOF, MINI, LP-MINI, MICRO2, MICRO3 and MAXI datasheets (2024/2025, colours as swatches only); Eaton Bussmann full line catalog 1007 (2018); OptiFuse datasheets APR, APM, APS, APT, ANK and APX; HELLA Brief information Blade fuses (2026); MTA Automotive Fuses 2018 (ISO 8820-3 itself was not read)"
