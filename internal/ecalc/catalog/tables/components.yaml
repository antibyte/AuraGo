- id: mlcc_dielectrics
  kind: table
  category: tables
  group: components
  key: code
  name: {cs: "Dielektrika keramických kondenzátorů (C0G, X7R …)", da: "Dielektrika i keramiske kondensatorer (C0G, X7R …)", de: "Keramikkondensator-Dielektrika (C0G, X7R …)", el: "Διηλεκτρικά κεραμικών πυκνωτών (C0G, X7R …)", en: "Ceramic capacitor dielectrics (C0G, X7R …)", es: "Dieléctricos de condensadores cerámicos (C0G, X7R …)", fr: "Diélectriques des condensateurs céramiques (C0G, X7R …)", hi: "सिरेमिक संधारित्र डाइइलेक्ट्रिक (C0G, X7R …)", it: "Dielettrici dei condensatori ceramici (C0G, X7R …)", ja: "セラミックコンデンサの誘電体(C0G、X7R など)", nl: "Diëlektrica van keramische condensatoren (C0G, X7R …)", no: "Dielektrika i keramiske kondensatorer (C0G, X7R …)", pl: "Dielektryki kondensatorów ceramicznych (C0G, X7R …)", pt: "Dielétricos de capacitores cerâmicos (C0G, X7R …)", sv: "Dielektrikum i keramiska kondensatorer (C0G, X7R …)", zh: "陶瓷电容介质(C0G、X7R 等)"}
  doc: {en: "EIA temperature-characteristic codes of ceramic capacitors (C0G, X7R, X5R, Y5V …): temperature range, temperature coefficient or maximum capacitance change, and typical use.", de: "EIA-Temperaturkennlinien-Codes von Keramikkondensatoren (C0G, X7R, X5R, Y5V …): Temperaturbereich, Temperaturkoeffizient bzw. maximale Kapazitätsänderung und typische Anwendung."}
  notes: {en: "Code reading (class II/III): 1st letter = lower temperature (X −55 °C, Y −30 °C, Z +10 °C), digit = upper temperature (5 +85, 6 +105, 7 +125, 8 +150 °C), last letter = max. capacitance change (R ±15 %, S ±22 %, T +22/−33 %, V +22/−82 %). Class II/III capacitors also lose capacitance with applied DC voltage and with age (ageing); the temperature code says nothing about DC bias. Some makers (e.g. KEMET) call Y5V \"Class III\"; in IEC terms it is a class 2 dielectric. The IEC 60384-8/-9 equivalents are not listed because only one source gives them. The use texts of X8R, X7S, X7T and X6S are editorial wording derived from the code meaning, not taken from a source.", de: "Code-Lesart (Klasse II/III): 1. Buchstabe = untere Temperatur (X −55 °C, Y −30 °C, Z +10 °C), Ziffer = obere Temperatur (5 +85, 6 +105, 7 +125, 8 +150 °C), letzter Buchstabe = max. Kapazitätsänderung (R ±15 %, S ±22 %, T +22/−33 %, V +22/−82 %). Klasse-II/III-Kondensatoren verlieren zusätzlich Kapazität mit angelegter Gleichspannung und mit der Zeit (Alterung); der Temperaturcode sagt nichts über den DC-Bias. Manche Hersteller (z. B. KEMET) nennen Y5V „Klasse III“; nach IEC ist es ein Klasse-2-Dielektrikum. Die IEC-60384-8/-9-Entsprechungen sind nicht aufgeführt, weil nur eine Quelle sie nennt. Die Anwendungstexte von X8R, X7S, X7T und X6S sind redaktionelle Formulierungen aus der Bedeutung des Codes, keine Quellenangabe."}
  tags: ["mlcc", "ceramic capacitor", "dielectric", "c0g", "np0", "x7r", "x5r", "y5v", "eia", "temperature coefficient", "class 1", "class 2", "keramikkondensator", "dielektrikum", "temperaturkoeffizient", "klasse 1", "klasse 2"]
  source: "EIA RS-198 temperature codes as printed in the KEMET datasheets C1003 (C0G), C1002 (X7R), C1006 (X5R) and C1005 (Y5V) and the TDK MLCC Product Guide; code reading after Wikipedia \"Ceramic capacitor\""
  columns:
    - {id: code, name: {en: "Temperature code", de: "Temperaturcode"}, dim: text}
    - {id: alias, name: {en: "Other name", de: "Andere Bezeichnung"}, dim: text}
    - {id: eia_class, name: {en: "EIA class", de: "EIA-Klasse"}, dim: text}
    - {id: t_min_c, name: {en: "Lower temperature limit", de: "Untere Temperaturgrenze"}, dim: temperature, unit: degC, units: ["degC", "degF"]}
    - {id: t_max_c, name: {en: "Upper temperature limit", de: "Obere Temperaturgrenze"}, dim: temperature, unit: degC, units: ["degC", "degF"]}
    - {id: tc_ppm_k, name: {en: "Temperature coefficient (class I)", de: "Temperaturkoeffizient (Klasse I)"}, dim: tempco, unit: ppmK, units: ["ppmK"]}
    - {id: tc_tol_ppm_k, name: {en: "Tolerance of the temperature coefficient (±)", de: "Toleranz des Temperaturkoeffizienten (±)"}, dim: tempco, unit: ppmK, units: ["ppmK"]}
    - {id: dc_min_pct, name: {en: "Max. capacitance change, lower bound (class II/III)", de: "Max. Kapazitätsänderung, untere Grenze (Klasse II/III)"}, dim: ratio, unit: pct, units: ["pct", ""]}
    - {id: dc_max_pct, name: {en: "Max. capacitance change, upper bound (class II/III)", de: "Max. Kapazitätsänderung, obere Grenze (Klasse II/III)"}, dim: ratio, unit: pct, units: ["pct", ""]}
    - {id: use, name: {en: "Typical use", de: "Typische Anwendung"}, dim: text}
  rows:
    - ["C0G", "NP0", "I", -55, 125, 0, 30, null, null, {en: "Resonant circuits, filters, timing, where Q and capacitance stability matter; no ageing, no DC-bias effect", de: "Schwingkreise, Filter, Zeitglieder, wo Güte und Kapazitätsstabilität zählen; keine Alterung, kein DC-Bias-Effekt"}]
    - ["X8R", null, "II", -55, 150, null, null, -15, 15, {en: "Decoupling/bypass at high temperature (e.g. automotive)", de: "Abblocken/Entkoppeln bei hoher Temperatur (z. B. Automobil)"}]
    - ["X7R", null, "II", -55, 125, null, null, -15, 15, {en: "General-purpose bypass, decoupling and filtering where Q and stability are not critical", de: "Allgemeines Abblocken, Entkoppeln und Filtern, wo Güte und Stabilität unkritisch sind"}]
    - ["X7S", null, "II", -55, 125, null, null, -22, 22, {en: "Decoupling with higher capacitance per size than X7R, wider tolerance", de: "Entkoppeln mit mehr Kapazität je Baugröße als X7R, weitere Toleranz"}]
    - ["X7T", null, "II", -55, 125, null, null, -33, 22, {en: "High-capacitance decoupling; large negative change at temperature extremes", de: "Entkoppeln mit hoher Kapazität; starke negative Änderung an den Temperaturgrenzen"}]
    - ["X6S", null, "II", -55, 105, null, null, -22, 22, {en: "High-capacitance decoupling up to 105 °C", de: "Entkoppeln mit hoher Kapazität bis 105 °C"}]
    - ["X5R", null, "II", -55, 85, null, null, -15, 15, {en: "High-capacitance decoupling and bypass up to 85 °C", de: "Entkoppeln und Abblocken mit hoher Kapazität bis 85 °C"}]
    - ["Y5V", null, "III (KEMET)", -30, 85, null, null, -82, 22, {en: "Low-cost bypass/decoupling where stability does not matter; avoid where temperature varies", de: "Billiges Abblocken/Entkoppeln, wo Stabilität egal ist; bei schwankender Temperatur meiden"}]

- id: fuse_speed_classes
  kind: table
  category: tables
  group: components
  key: code
  name: {cs: "Charakteristiky pojistek (FF, F, M, T, TT)", da: "Sikringers karakteristikker (FF, F, M, T, TT)", de: "Sicherungs-Kennlinien (FF, F, M, T, TT)", el: "Χαρακτηριστικές ασφαλειών (FF, F, M, T, TT)", en: "Fuse time-current characteristics (FF, F, M, T, TT)", es: "Características de los fusibles (FF, F, M, T, TT)", fr: "Caractéristiques des fusibles (FF, F, M, T, TT)", hi: "फ्यूज़ की विशेषताएँ (FF, F, M, T, TT)", it: "Caratteristiche dei fusibili (FF, F, M, T, TT)", ja: "ヒューズの動作特性(FF、F、M、T、TT)", nl: "Smeltkarakteristieken van zekeringen (FF, F, M, T, TT)", no: "Sikringers karakteristikker (FF, F, M, T, TT)", pl: "Charakterystyki bezpieczników (FF, F, M, T, TT)", pt: "Características dos fusíveis (FF, F, M, T, TT)", sv: "Säkringars karakteristik (FF, F, M, T, TT)", zh: "熔断器特性(FF、F、M、T、TT)"}
  doc: {en: "The characteristic letters of miniature fuses (FF, F, M, T, TT) with their names and speed order, and the maximum pre-arcing time at 10 times the rated current for two of the classes.", de: "Die Kennbuchstaben von Geräteschutzsicherungen (FF, F, M, T, TT) mit Bezeichnung und Reihenfolge der Trägheit sowie die maximale Schmelzzeit beim 10-fachen Nennstrom für zwei der Klassen."}
  notes: {en: "The letter is printed on the end cap of the fuse together with rated current, rated voltage and breaking capacity (e.g. L = low, H = high, as used by Schurter). The exact pre-arcing limits depend on the standard sheet (size, breaking capacity), see the table of IEC 60127-2 pre-arcing times. Never replace a fuse with a slower class or a higher rating. The meaning texts are short editorial wording, not quotations from a standard, and the inrush examples are general engineering guidance. The 10 × In example exists only for F and T, the two classes with a sourced value; FF, M and TT are left empty.", de: "Der Buchstabe steht mit Nennstrom, Nennspannung und Schaltvermögen (z. B. L = niedrig, H = hoch, wie bei Schurter) auf der Kappe. Die genauen Schmelzzeitgrenzen hängen vom Normblatt (Bauform, Schaltvermögen) ab, siehe die Tabelle der Schmelzzeiten nach IEC 60127-2. Eine Sicherung nie durch eine trägere Klasse oder einen höheren Nennstrom ersetzen. Die Bedeutungstexte sind kurze redaktionelle Formulierungen, keine Zitate aus einer Norm, und die Einschaltstrom-Beispiele sind allgemeine Ingenieurspraxis. Das Beispiel bei 10 × In gibt es nur für F und T, die beiden Klassen mit belegtem Wert; FF, M und TT bleiben leer."}
  tags: ["fuse", "fast", "slow blow", "time-lag", "quick-acting", "ff", "tt", "iec 60127", "characteristic", "sicherung", "flink", "träge", "superflink", "superträge", "kennlinie", "geräteschutzsicherung"]
  source: "IEC 60127 characteristic letters (names from DIN EN 60127-4 and DIN 41571-2); 10 × In values from the Schurter FSF/FST 5x20 and Littelfuse 217/218 datasheets"
  columns:
    - {id: code, name: {en: "Marking", de: "Kennbuchstabe"}, dim: text}
    - {id: name, name: {en: "Name", de: "Bezeichnung"}, dim: text}
    - {id: speed_rank, name: {en: "Speed rank (1 = fastest)", de: "Rang (1 = am schnellsten)"}, dim: number}
    - {id: meaning, name: {en: "Meaning", de: "Bedeutung"}, dim: text}
    - {id: example_10x_max, name: {en: "Example: max. pre-arcing time at 10 × In (5×20 mm, 0.125–6.3 A)", de: "Beispiel: max. Schmelzzeit bei 10 × In (5×20 mm, 0,125–6,3 A)"}, dim: time}
  rows:
    - ["FF", {en: "very quick-acting", de: "superflink"}, 1, {en: "Interrupts overcurrents fastest; for protecting sensitive semiconductors", de: "Schaltet Überströme am schnellsten ab; zum Schutz empfindlicher Halbleiter"}, null]
    - ["F", {en: "quick-acting", de: "flink"}, 2, {en: "Fast response to overload and short circuit; general protection of electronics without inrush", de: "Schnelle Reaktion auf Überlast und Kurzschluss; allgemeiner Elektronikschutz ohne Einschaltstrom"}, 0.02]
    - ["M", {en: "medium time-lag", de: "mittelträge"}, 3, {en: "Between quick-acting and time-lag; tolerates small inrush peaks", de: "Zwischen flink und träge; verträgt kleine Einschaltspitzen"}, null]
    - ["T", {en: "time-lag", de: "träge"}, 4, {en: "Tolerates inrush currents (transformers, motors, capacitor charging) but still clears sustained overload", de: "Verträgt Einschaltströme (Trafos, Motoren, Kondensatorladen), löst bei Dauerüberlast aber aus"}, 0.3]
    - ["TT", {en: "long time-lag", de: "superträge"}, 5, {en: "Slowest class; for very high or long inrush currents", de: "Langsamste Klasse; für sehr hohe oder lange Einschaltströme"}, null]

