<!DOCTYPE html>
<html lang="{{.Lang}}" data-theme="dark" data-i18n-page-section="common.page_plans">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="AuraGo" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <title>AuraGo</title>
  <meta name="description" content="AuraGo - Autonomous AI agent for home lab environments">
  <meta property="og:title" content="AuraGo">
  <meta property="og:description" content="Autonomous AI agent for home lab environments">
  <meta property="og:image" content="/aurago_logo_dark.png">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="/shared-variables.css?v={{.BuildVersion}}">
  <link rel="stylesheet" href="/shared-utilities.css?v={{.BuildVersion}}">
  <link rel="stylesheet" href="/shared-components.css?v={{.BuildVersion}}">
  <link rel="stylesheet" href="/shared-animations.css?v={{.BuildVersion}}">
  <link rel="stylesheet" href="/css/tokens.css?v={{.BuildVersion}}">
    <script src="/js/shared/prepaint-theme.js?v={{.BuildVersion}}" data-theme-scope="workspace"></script>
  <script type="application/json" id="aurago-template-data">{{.TemplateDataJSON}}</script>
  <script src="/js/shared/template-data.js?v={{.BuildVersion}}"></script>
  <script src="/js/shared/shared-core.js?v={{.BuildVersion}}"></script>
  <script src="/js/shared/shared-chat.js?v={{.BuildVersion}}"></script>
  <link href="/fonts/fonts.css?v={{.BuildVersion}}" rel="stylesheet">
  <link rel="stylesheet" href="/css/plans.css?v={{.BuildVersion}}">
  <link rel="stylesheet" href="/css/enhancements.css?v={{.BuildVersion}}">
  <link rel="stylesheet" href="/css/precision-workspace.css?v={{.BuildVersion}}">
  <link rel="stylesheet" href="/css/precision-pages.css?v={{.BuildVersion}}">
</head>
<body class="pw-page pw-operational-page" data-workspace-page="plans" data-density="comfortable">
  <a href="#main-content" class="skip-link" data-i18n="common.skip_to_content"></a>
  {{template "app-header" .}}


  <main class="plans-page pw-page-frame" id="main-content">
    <header class="page-header pw-page-heading">
      <div class="pw-page-heading-copy">
        <h1 class="pw-page-title" data-i18n="common.page_plans"></h1>
        <p class="pw-page-description" data-i18n="plans.page_description"></p>
      </div>
    </header>

    <section class="plans-toolbar pw-toolbar">
      <div class="plans-toolbar-group pw-toolbar-group">
        <label for="session-id" data-i18n="plans.session_label"></label>
        <input id="session-id" type="text" value="default">
      </div>
      <div class="plans-toolbar-group pw-toolbar-group">
        <label for="status-filter" data-i18n="plans.status_label"></label>
        <select id="status-filter">
          <option value="all" data-i18n="plans.status_all"></option>
          <option value="draft" data-i18n="plans.status_draft"></option>
          <option value="active" data-i18n="plans.status_active"></option>
          <option value="paused" data-i18n="plans.status_paused"></option>
          <option value="blocked" data-i18n="plans.status_blocked"></option>
          <option value="completed" data-i18n="plans.status_completed"></option>
          <option value="cancelled" data-i18n="plans.status_cancelled"></option>
        </select>
      </div>
      <label class="plans-check" for="include-archived">
        <input id="include-archived" type="checkbox">
        <span data-i18n="plans.show_archived"></span>
      </label>
      <span class="pw-toolbar-spacer"></span>
      <button id="refresh-btn" type="button" class="btn btn-primary" data-i18n="plans.refresh"></button>
    </section>

    <section class="plans-layout">
      <aside class="plans-sidebar panel">
        <div class="panel-header">
          <h2 data-i18n="plans.list_title"></h2>
        </div>
        <div id="plan-list" class="plan-list" aria-live="polite" aria-busy="true">
          <div class="pw-loading-state" role="status">
            <span class="pw-skeleton skeleton" aria-hidden="true"></span>
            <span data-i18n="common.loading"></span>
          </div>
        </div>
      </aside>

      <section class="plans-detail panel">
        <div id="plan-detail" class="plan-detail empty-state" data-i18n="plans.empty_detail"></div>
      </section>
    </section>
  </main>

  <div class="modal-overlay" id="blocker-modal" role="dialog" aria-modal="true" aria-labelledby="blocker-modal-title">
    <div class="modal plan-modal">
      <div class="modal-header">
        <h2 id="blocker-modal-title" class="modal-title" data-i18n="plans.block_modal_title"></h2>
        <button type="button" class="modal-close" data-i18n-aria-label="common.close" data-close-modal>&times;</button>
      </div>
      <div class="modal-body">
        <label for="blocker-reason" class="plan-field-label" data-i18n="plans.block_prompt"></label>
        <textarea id="blocker-reason" class="inline-note"></textarea>
      </div>
      <div class="modal-actions">
        <button id="blocker-cancel" type="button" class="btn btn-secondary" data-i18n="common.btn_cancel"></button>
        <button id="blocker-confirm" type="button" class="btn btn-primary" data-i18n="common.btn_ok"></button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="split-modal" role="dialog" aria-modal="true" aria-labelledby="split-modal-title">
    <div class="modal plan-modal">
      <div class="modal-header">
        <h2 id="split-modal-title" class="modal-title" data-i18n="plans.split_modal_title"></h2>
        <button type="button" class="modal-close" data-i18n-aria-label="common.close" data-close-modal>&times;</button>
      </div>
      <div class="modal-body">
        <label for="split-items" class="plan-field-label" data-i18n="plans.split_prompt"></label>
        <textarea id="split-items" class="inline-note" data-i18n-placeholder="plans.split_placeholder" placeholder=""></textarea>
      </div>
      <div class="modal-actions">
        <button id="split-cancel" type="button" class="btn btn-secondary" data-i18n="common.btn_cancel"></button>
        <button id="split-confirm" type="button" class="btn btn-primary" data-i18n="plans.split"></button>
      </div>
    </div>
  </div>

  <script src="/js/precision/workspace.js?v={{.BuildVersion}}"></script>
  <script src="/js/plans/main.js?v={{.BuildVersion}}"></script>
</body>
</html>
