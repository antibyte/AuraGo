{{define "dash-section-llm"}}
<section class="dash-section" id="sec-llm" data-section="llm" aria-labelledby="sec-llm-title" hidden>
  <header class="dash-section-header">
    <div class="dash-section-heading">
      <h2 class="dash-section-title" id="sec-llm-title" tabindex="-1" data-i18n="dashboard.section.llm.title"></h2>
      <p class="dash-section-desc" data-i18n="dashboard.section.llm.desc"></p>
    </div>
    <div class="dash-section-meta">
      <span class="dash-section-updated" data-section-updated="llm"></span>
      <button type="button" class="dash-section-refresh" data-section-refresh="llm" data-i18n-title="dashboard.section.refresh" data-i18n-aria-label="dashboard.section.refresh"><svg class="dash-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><polyline points="21 3 21 8 16 8"/></svg></button>
    </div>
  </header>
  <div class="dash-grid">
    <div class="dash-card span-8" id="card-budget">
      <div class="dash-card-header"><svg class="dash-ic card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20"/><circle cx="17" cy="15" r="1.5" fill="currentColor" stroke="none"/></svg> <h3 class="dash-card-title" data-i18n="dashboard.budget_title"></h3> <button type="button" class="collapse-toggle" data-card="card-budget" data-i18n-title="dashboard.activity_collapse" title="" aria-expanded="true">▼</button></div>
      <div class="dash-card-body">
        <div id="budget-content">
          <div class="budget-badges" id="budget-badges"></div>
          <div class="budget-layout">
            <div class="budget-doughnut-wrap">
              <canvas id="budget-chart"></canvas>
              <div class="budget-center">
                <div class="amount" id="budget-spent">$0.00</div>
                <div class="sublabel" id="budget-sublabel">of $0.00</div>
              </div>
            </div>
            <div class="budget-bar-wrap">
              <canvas id="budget-models-chart"></canvas>
            </div>
          </div>
          <div class="budget-reset" id="budget-reset"></div>
          <div class="credits-row" id="credits-row">
            <span data-i18n="dashboard.budget_openrouter_credits"></span>
            <span class="credits-val" id="credits-balance">—</span>
          </div>
          <!-- Per-LLM average token consumption -->
          <div id="budget-llm-avg-wrap" class="mt-sm">
            <h4 class="dash-subheading" data-i18n="dashboard.budget_llm_avg_title"></h4>
            <div class="chart-wrap-sm">
              <canvas id="budget-llm-avg-chart"></canvas>
            </div>
          </div>
        </div>
        <div id="budget-disabled" class="empty-state is-hidden" data-i18n="dashboard.budget_disabled"></div>
      </div>
    </div>

    <div class="dash-card span-4" id="card-llm-router">
      <div class="dash-card-header"><svg class="dash-ic card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="19" cy="5" r="2"/><circle cx="19" cy="19" r="2"/><path d="M7 12h4l6-6M11 12l6 6"/></svg> <h3 class="dash-card-title" data-i18n="common.llm_router.title"></h3> <button type="button" class="collapse-toggle" data-card="card-llm-router" data-i18n-title="dashboard.activity_collapse" title="" aria-expanded="true">▼</button></div>
      <div class="dash-card-body" id="llm-router-stats" role="status"></div>
    </div>

    <div class="dash-card span-12" id="card-helper-llm">
      <div class="dash-card-header"><svg class="dash-ic card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 4c-4 0-9 2-12 5l-4 4v3l4-1c3-3 5-7 5-11z" fill="none"/><path d="M16 8L8 16M14 10l-4 4M12 12l-2 2" stroke-linecap="round"/></svg> <h3 class="dash-card-title" data-i18n="dashboard.helper_llm_title"></h3> <button type="button" class="collapse-toggle" data-card="card-helper-llm" data-i18n-title="dashboard.activity_collapse" title="" aria-expanded="true">▼</button></div>
      <div class="dash-card-body">
        <div id="helper-llm-status"></div>
        <div id="helper-llm-metrics"></div>
        <div id="helper-llm-operations" class="mt-sm"></div>
      </div>
    </div>
  </div>
</section>
{{end}}
