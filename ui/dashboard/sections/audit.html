{{define "dash-section-audit"}}
<section class="dash-section" id="sec-audit" data-section="audit" aria-labelledby="sec-audit-title" hidden>
  <header class="dash-section-header">
    <div class="dash-section-heading">
      <h2 class="dash-section-title" id="sec-audit-title" tabindex="-1" data-i18n="dashboard.section.audit.title"></h2>
      <p class="dash-section-desc" data-i18n="dashboard.section.audit.desc"></p>
    </div>
    <div class="dash-section-meta">
      <span class="dash-section-updated" data-section-updated="audit"></span>
      <button type="button" class="dash-section-refresh" data-section-refresh="audit" data-i18n-title="dashboard.section.refresh" data-i18n-aria-label="dashboard.section.refresh"><svg class="dash-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><polyline points="21 3 21 8 16 8"/></svg></button>
    </div>
  </header>
  <div class="dash-grid">
    <div class="dash-card span-12" id="card-audit-log">
      <div class="dash-card-header">
        <svg class="dash-ic card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" fill="none"/><path d="M14 2v6h6" stroke-linecap="round"/><path d="M8 13h8M8 17h5" stroke-linecap="round"/></svg>
        <h3 class="dash-card-title" data-i18n="dashboard.audit_title"></h3>
        <button type="button" class="collapse-toggle" data-card="card-audit-log" data-i18n-title="dashboard.activity_collapse" title="" aria-expanded="true">▼</button>
      </div>
      <div class="dash-card-body">
        <div class="audit-controls">
          <input type="search" id="audit-search" class="profile-search pw-search" data-i18n-placeholder="dashboard.audit_search_placeholder" placeholder="">
          <select id="audit-source-filter" class="audit-select">
            <option value="" data-i18n="dashboard.audit_filter_all_sources"></option>
            <option value="agent_tool" data-i18n="dashboard.audit_source_agent_tool"></option>
            <option value="mission" data-i18n="dashboard.audit_source_mission"></option>
            <option value="heartbeat" data-i18n="dashboard.audit_source_heartbeat"></option>
            <option value="remote" data-i18n="dashboard.audit_source_remote"></option>
            <option value="system" data-i18n="dashboard.audit_source_system"></option>
          </select>
          <select id="audit-status-filter" class="audit-select">
            <option value="" data-i18n="dashboard.audit_filter_all_statuses"></option>
            <option value="running" data-i18n="dashboard.audit_status_running"></option>
            <option value="success" data-i18n="dashboard.audit_status_success"></option>
            <option value="error" data-i18n="dashboard.audit_status_error"></option>
            <option value="warning" data-i18n="dashboard.audit_status_warning"></option>
            <option value="blocked" data-i18n="dashboard.audit_status_blocked"></option>
            <option value="sanitized" data-i18n="dashboard.audit_status_sanitized"></option>
          </select>
          <select id="audit-type-filter" class="audit-select">
            <option value="" data-i18n="dashboard.audit_filter_all_types"></option>
            <option value="tool_call" data-i18n="dashboard.audit_type_tool_call"></option>
            <option value="agent_action" data-i18n="dashboard.audit_type_agent_action"></option>
            <option value="mission_run" data-i18n="dashboard.audit_type_mission_run"></option>
            <option value="heartbeat_run" data-i18n="dashboard.audit_type_heartbeat_run"></option>
            <option value="remote_heartbeat" data-i18n="dashboard.audit_type_remote_heartbeat"></option>
            <option value="remote_command" data-i18n="dashboard.audit_type_remote_command"></option>
            <option value="remote_connect" data-i18n="dashboard.audit_type_remote_connect"></option>
            <option value="remote_disconnect" data-i18n="dashboard.audit_type_remote_disconnect"></option>
            <option value="flow_create" data-i18n="dashboard.audit_type_flow_create"></option>
            <option value="flow_import" data-i18n="dashboard.audit_type_flow_import"></option>
            <option value="flow_publish" data-i18n="dashboard.audit_type_flow_publish"></option>
            <option value="flow_enable" data-i18n="dashboard.audit_type_flow_enable"></option>
            <option value="flow_disable" data-i18n="dashboard.audit_type_flow_disable"></option>
            <option value="flow_delete" data-i18n="dashboard.audit_type_flow_delete"></option>
            <option value="flow_secret_set" data-i18n="dashboard.audit_type_flow_secret_set"></option>
            <option value="flow_secret_delete" data-i18n="dashboard.audit_type_flow_secret_delete"></option>
            <option value="flow_run_cancel" data-i18n="dashboard.audit_type_flow_run_cancel"></option>
          </select>
          <input type="datetime-local" id="audit-from-filter" class="audit-date-input" data-i18n-title="dashboard.audit_filter_from" title="">
          <input type="datetime-local" id="audit-to-filter" class="audit-date-input" data-i18n-title="dashboard.audit_filter_to" title="">
          <button type="button" id="audit-refresh" class="log-btn" data-i18n="dashboard.audit_refresh"></button>
          <button type="button" id="audit-clear-filtered" class="log-btn audit-danger-btn" data-i18n="dashboard.audit_clear_filtered"></button>
        </div>
        <div id="audit-content" class="audit-table-wrap">
          <table class="audit-table">
            <thead>
              <tr>
                <th data-i18n="dashboard.audit_col_time"></th>
                <th data-i18n="dashboard.audit_col_source"></th>
                <th data-i18n="dashboard.audit_col_type"></th>
                <th data-i18n="dashboard.audit_col_target"></th>
                <th data-i18n="dashboard.audit_col_status"></th>
                <th data-i18n="dashboard.audit_col_summary"></th>
                <th data-i18n="dashboard.audit_col_duration"></th>
                <th data-i18n="dashboard.audit_col_actions"></th>
              </tr>
            </thead>
            <tbody id="audit-tbody"></tbody>
          </table>
          <div id="audit-empty" class="empty-state" data-i18n="dashboard.audit_empty"></div>
          <div class="audit-pager">
            <button type="button" id="audit-prev" class="mh-more-btn" data-i18n="dashboard.audit_prev"></button>
            <span id="audit-page-meta" class="audit-page-meta"></span>
            <button type="button" id="audit-next" class="mh-more-btn" data-i18n="dashboard.audit_next"></button>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{{end}}
