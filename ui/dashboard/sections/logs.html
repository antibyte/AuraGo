{{define "dash-section-logs"}}
<section class="dash-section" id="sec-logs" data-section="logs" aria-labelledby="sec-logs-title" hidden>
  <header class="dash-section-header">
    <div class="dash-section-heading">
      <h2 class="dash-section-title" id="sec-logs-title" tabindex="-1" data-i18n="dashboard.section.logs.title"></h2>
      <p class="dash-section-desc" data-i18n="dashboard.section.logs.desc"></p>
    </div>
    <div class="dash-section-meta">
      <span class="dash-section-updated" data-section-updated="logs"></span>
      <button type="button" class="dash-section-refresh" data-section-refresh="logs" data-i18n-title="dashboard.section.refresh" data-i18n-aria-label="dashboard.section.refresh"><svg class="dash-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><polyline points="21 3 21 8 16 8"/></svg></button>
    </div>
  </header>
  <div class="dash-grid">
    <div class="dash-card span-12" id="card-logs">
      <div class="dash-card-header"><svg class="dash-ic card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2"/></svg> <h3 class="dash-card-title" data-i18n="dashboard.logs_title"></h3> <button type="button" class="collapse-toggle" data-card="card-logs" data-i18n-title="dashboard.activity_collapse" title="" aria-expanded="true">▼</button></div>
      <div class="dash-card-body">
        <div class="log-controls">
          <input type="text" id="log-filter" class="pw-search" data-i18n-placeholder="dashboard.logs_filter_placeholder" placeholder="">
          <button class="log-btn" id="log-scroll-btn" data-i18n-title="dashboard.logs_scroll_to_bottom_title" title=""><svg class="dash-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="6 13 12 19 18 13"/></svg> <span data-i18n="dashboard.logs_scroll_to_bottom"></span></button>
          <button class="log-btn" id="log-refresh-btn" data-i18n-title="dashboard.logs_refresh_title" title=""><svg class="dash-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8" fill="none"/><polyline points="21 3 21 8 16 8"/></svg> <span data-i18n="dashboard.logs_refresh"></span></button>
        </div>
        <div class="log-viewer" id="log-viewer">
          <div class="log-line text-secondary" data-i18n="dashboard.logs_loading"></div>
        </div>
        <div class="log-meta" id="log-meta"></div>
      </div>
    </div>
  </div>
</section>
{{end}}
