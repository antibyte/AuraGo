{{define "dash-section-knowledge"}}
<section class="dash-section" id="sec-knowledge" data-section="knowledge" aria-labelledby="sec-knowledge-title" hidden>
  <header class="dash-section-header">
    <div class="dash-section-heading">
      <h2 class="dash-section-title" id="sec-knowledge-title" tabindex="-1" data-i18n="dashboard.section.knowledge.title"></h2>
      <p class="dash-section-desc" data-i18n="dashboard.section.knowledge.desc"></p>
    </div>
    <div class="dash-section-meta">
      <span class="dash-section-updated" data-section-updated="knowledge"></span>
      <button type="button" class="dash-section-refresh" data-section-refresh="knowledge" data-i18n-title="dashboard.section.refresh" data-i18n-aria-label="dashboard.section.refresh"><svg class="dash-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><polyline points="21 3 21 8 16 8"/></svg></button>
    </div>
  </header>
  <div class="dash-grid">
    <div class="dash-card span-12" id="card-knowledge-graph-summary">
      <div class="dash-card-header"><svg class="dash-ic card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="2"/><circle cx="5" cy="5" r="1.5"/><circle cx="19" cy="5" r="1.5"/><circle cx="5" cy="19" r="1.5"/><circle cx="19" cy="19" r="1.5"/><line x1="6.5" y1="6.5" x2="10.5" y2="10.5"/><line x1="13.5" y1="10.5" x2="17.5" y2="6.5"/><line x1="6.5" y1="17.5" x2="10.5" y2="13.5"/><line x1="13.5" y1="13.5" x2="17.5" y2="17.5"/></svg> <h3 class="dash-card-title" data-i18n="dashboard.knowledge_title"></h3> <button type="button" class="collapse-toggle" data-card="card-knowledge-graph-summary" data-i18n-title="dashboard.activity_collapse" title="" aria-expanded="true">▼</button></div>
      <div class="dash-card-body">
        <div class="knowledge-summary-grid" id="knowledge-summary-grid"></div>
        <div id="knowledge-filter-bar" class="knowledge-filter-bar mt-sm"></div>
        <div class="knowledge-search-row mt-sm">
          <input type="text" id="knowledge-search-input" class="profile-search knowledge-search-input pw-search" data-i18n-placeholder="dashboard.knowledge_search_placeholder" placeholder="">
          <button type="button" id="knowledge-search-button" class="btn btn-primary knowledge-search-button" data-i18n="dashboard.knowledge_search_button"></button>
        </div>
        <div id="knowledge-search-meta" class="knowledge-search-meta"></div>
      </div>
    </div>

    <div class="dash-card span-8" id="card-knowledge-graph-visual">
      <div class="dash-card-header"><svg class="dash-ic card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3L3 6v15l6-3 6 3 6-3V3l-6 3-6-3z" fill="none"/><line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/></svg> <h3 class="dash-card-title" data-i18n="dashboard.knowledge_visual_title"></h3> <button type="button" class="collapse-toggle" data-card="card-knowledge-graph-visual" data-i18n-title="dashboard.activity_collapse" title="" aria-expanded="true">▼</button></div>
      <div class="dash-card-body">
        <div class="knowledge-visual-toolbar">
          <div class="knowledge-visual-meta">
            <div id="knowledge-graph-mode" class="knowledge-visual-mode" data-i18n="dashboard.knowledge_visual_overview"></div>
            <div id="knowledge-graph-caption" class="knowledge-visual-caption" data-i18n="dashboard.knowledge_visual_empty"></div>
          </div>
          <div class="knowledge-visual-actions">
            <div class="kg-view-toggle" id="knowledge-graph-view-toggle" role="group" data-i18n-aria-label="dashboard.knowledge_visual_view_label">
              <button type="button" class="kg-view-btn" data-kg-view="2d" aria-pressed="false" data-i18n-title="dashboard.knowledge_visual_view_2d_title">2D</button>
              <button type="button" class="kg-view-btn" data-kg-view="3d" aria-pressed="true" data-i18n-title="dashboard.knowledge_visual_view_3d_title">3D</button>
            </div>
            <button type="button" id="knowledge-graph-reset" class="btn btn-secondary btn-sm is-hidden" data-i18n="dashboard.knowledge_visual_reset"></button>
          </div>
        </div>
        <div id="knowledge-graph-legend" class="knowledge-graph-legend"></div>
        <div id="knowledge-graph-visual" class="knowledge-visual-wrap">
          <div class="empty-state" data-i18n="dashboard.knowledge_visual_empty"></div>
        </div>
      </div>
    </div>

    <div class="dash-card span-4" id="card-knowledge-graph-results">
      <div class="dash-card-header"><svg class="dash-ic card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="16" y1="16" x2="21" y2="21" stroke-linecap="round"/></svg> <h3 class="dash-card-title" data-i18n="dashboard.knowledge_results_title"></h3> <button type="button" class="collapse-toggle" data-card="card-knowledge-graph-results" data-i18n-title="dashboard.activity_collapse" title="" aria-expanded="true">▼</button></div>
      <div class="dash-card-body">
        <div class="knowledge-grid">
          <div class="knowledge-section">
            <h4 class="card-section-title" data-i18n="dashboard.knowledge_search_results"></h4>
            <div id="knowledge-search-results" class="knowledge-list">
              <div class="empty-state" data-i18n="dashboard.knowledge_no_search"></div>
            </div>
          </div>
          <div class="knowledge-section">
            <h4 class="card-section-title" data-i18n="dashboard.knowledge_recent_nodes"></h4>
            <div id="knowledge-node-list" class="knowledge-list">
              <div class="empty-state" data-i18n="dashboard.knowledge_empty"></div>
            </div>
          </div>
          <div class="knowledge-section">
            <h4 class="card-section-title" data-i18n="dashboard.knowledge_recent_edges"></h4>
            <div id="knowledge-edge-list" class="knowledge-list">
              <div class="empty-state" data-i18n="dashboard.knowledge_empty"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="dash-card span-6" id="card-knowledge-graph-health">
      <div class="dash-card-header"><svg class="dash-ic card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 3v6a5 5 0 0 0 10 0V3" stroke-linecap="round"/><circle cx="19" cy="14" r="3"/><path d="M9 14v3a4 4 0 0 0 4 4" stroke-linecap="round"/></svg> <h3 class="dash-card-title" data-i18n="dashboard.knowledge_health_title"></h3> <button type="button" class="collapse-toggle" data-card="card-knowledge-graph-health" data-i18n-title="dashboard.activity_collapse" title="" aria-expanded="true">▼</button></div>
      <div class="dash-card-body">
        <div id="knowledge-health-metrics" class="knowledge-quality-metrics"></div>
        <div id="knowledge-health-status" class="knowledge-health-status"></div>
        <div class="knowledge-quality-section">
          <h4 class="card-section-title" data-i18n="dashboard.knowledge_health_consistency_title"></h4>
          <div id="knowledge-health-consistency" class="knowledge-list">
            <div class="empty-state" data-i18n="dashboard.knowledge_health_consistency_ok"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="dash-card span-6" id="card-knowledge-graph-quality">
      <div class="dash-card-header"><svg class="dash-ic card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v.5A3.5 3.5 0 0 0 5.5 9c0 1 .4 1.9 1 2.5A3.5 3.5 0 0 0 5 15.5c0 1.9 1.3 3.5 3 3.8V21a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-1.7c1.7-.3 3-1.9 3-3.8a3.5 3.5 0 0 0-1.5-4c.6-.6 1-1.5 1-2.5A3.5 3.5 0 0 0 15 5.5V5a3 3 0 0 0-3-3z"/></svg> <h3 class="dash-card-title" data-i18n="dashboard.knowledge_quality_title"></h3> <button type="button" class="collapse-toggle" data-card="card-knowledge-graph-quality" data-i18n-title="dashboard.activity_collapse" title="" aria-expanded="true">▼</button></div>
      <div class="dash-card-body">
        <div id="knowledge-quality-metrics" class="knowledge-quality-metrics"></div>
        <div id="knowledge-quality-grid" class="knowledge-quality-grid">
          <div class="knowledge-quality-section">
            <h4 class="card-section-title" data-i18n="dashboard.knowledge_quality_isolated_title"></h4>
            <div id="knowledge-quality-isolated" class="knowledge-list">
              <div class="empty-state" data-i18n="dashboard.knowledge_quality_empty_isolated"></div>
            </div>
          </div>
          <div class="knowledge-quality-section">
            <h4 class="card-section-title" data-i18n="dashboard.knowledge_quality_untyped_title"></h4>
            <div id="knowledge-quality-untyped" class="knowledge-list">
              <div class="empty-state" data-i18n="dashboard.knowledge_quality_empty_untyped"></div>
            </div>
          </div>
          <div class="knowledge-quality-section">
            <h4 class="card-section-title" data-i18n="dashboard.knowledge_quality_generic_title"></h4>
            <div id="knowledge-quality-generic" class="knowledge-list">
              <div class="empty-state" data-i18n="dashboard.knowledge_quality_empty_generic"></div>
            </div>
          </div>
          <div class="knowledge-quality-section">
            <h4 class="card-section-title" data-i18n="dashboard.knowledge_quality_label_duplicates_title"></h4>
            <div id="knowledge-quality-duplicates" class="knowledge-list">
              <div class="empty-state" data-i18n="dashboard.knowledge_quality_empty_duplicates"></div>
            </div>
          </div>
          <div class="knowledge-quality-section">
            <h4 class="card-section-title" data-i18n="dashboard.knowledge_quality_id_duplicates_title"></h4>
            <div id="knowledge-quality-id-duplicates" class="knowledge-list">
              <div class="empty-state" data-i18n="dashboard.knowledge_quality_empty_id_duplicates"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{{end}}
