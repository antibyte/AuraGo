{{define "dash-section-user"}}
<section class="dash-section" id="sec-user" data-section="user" aria-labelledby="sec-user-title" hidden>
  <header class="dash-section-header">
    <div class="dash-section-heading">
      <h2 class="dash-section-title" id="sec-user-title" tabindex="-1" data-i18n="dashboard.section.user.title"></h2>
      <p class="dash-section-desc" data-i18n="dashboard.section.user.desc"></p>
    </div>
    <div class="dash-section-meta">
      <span class="dash-section-updated" data-section-updated="user"></span>
      <button type="button" class="dash-section-refresh" data-section-refresh="user" data-i18n-title="dashboard.section.refresh" data-i18n-aria-label="dashboard.section.refresh"><svg class="dash-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><polyline points="21 3 21 8 16 8"/></svg></button>
    </div>
  </header>
  <div class="dash-grid">
    <div class="dash-card span-6" id="card-profile">
      <div class="dash-card-header"><svg class="dash-ic card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0 1 14 0v1"/></svg> <h3 class="dash-card-title" data-i18n="dashboard.profile_title"></h3> <button type="button" class="collapse-toggle" data-card="card-profile" data-i18n-title="dashboard.activity_collapse" title="" aria-expanded="true">▼</button></div>
      <div class="dash-card-body">
        <input type="text" class="profile-search pw-search" id="profile-search" data-i18n-placeholder="dashboard.profile_search_placeholder" placeholder="">
        <div class="profile-scroll" id="profile-content"></div>
      </div>
    </div>

    <div class="dash-card span-6" id="card-activity-overview">
      <div class="dash-card-header"><svg class="dash-ic card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/></svg> <h3 class="dash-card-title" data-i18n="dashboard.activity_overview_title"></h3> <button type="button" class="collapse-toggle" data-card="card-activity-overview" data-i18n-title="dashboard.activity_collapse" title="" aria-expanded="true">▼</button></div>
      <div class="dash-card-body">
        <div id="activity-overview-summary" class="journal-summary"></div>
        <div id="activity-overview-highlights" class="journal-summary mt-xs"></div>
        <div id="activity-overview-pending" class="journal-summary mt-xs"></div>
        <div id="activity-overview-days" class="journal-timeline">
          <div class="empty-state" data-i18n="dashboard.activity_overview_empty"></div>
        </div>
      </div>
    </div>

    <div class="dash-card span-8" id="card-journal">
      <div class="dash-card-header"><svg class="dash-ic card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" fill="none"/></svg> <h3 class="dash-card-title" data-i18n="dashboard.journal_title"></h3> <button type="button" class="collapse-toggle" data-card="card-journal" data-i18n-title="dashboard.activity_collapse" title="" aria-expanded="true">▼</button></div>
      <div class="dash-card-body">
        <div class="journal-summary" id="journal-summary"></div>
        <!-- Sentiment Trend -->
        <div id="journal-sentiment-wrap" class="mt-xs">
          <h4 class="card-section-title" data-i18n="dashboard.journal_sentiment_trend"></h4>
          <div class="journal-sentiment-row" id="journal-sentiment-row"></div>
          <div id="journal-key-topics-wrap" class="mt-xs"></div>
        </div>
        <div class="journal-timeline" id="journal-timeline">
          <div class="empty-state" data-i18n="dashboard.journal_empty"></div>
        </div>
      </div>
    </div>

    <div class="dash-card span-4" id="card-newspaper">
      <div class="dash-card-header"><svg class="dash-ic card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 4h18v16H3zM7 8h4v4H7zM14 8h4M14 11h4M7 16h11"/></svg> <h3 class="dash-card-title" data-i18n="dashboard.newspaper_title"></h3> <button type="button" class="collapse-toggle" data-card="card-newspaper" data-i18n-title="dashboard.activity_collapse" title="" aria-expanded="true">▼</button></div>
      <div class="dash-card-body"><p id="newspaper-dashboard-status" class="dash-card-desc" data-i18n="dashboard.newspaper_loading"></p><p id="newspaper-dashboard-next" class="dash-card-desc"></p><a class="btn btn-primary" href="/desktop?app=newspaper" data-i18n="dashboard.newspaper_open"></a></div>
    </div>
  </div>
</section>
{{end}}
