# Optional host Docker access. See documentation/docker_installation.md.
services:
  aurago:
    environment:
      - DOCKER_HOST=tcp://docker-proxy:2375
    depends_on:
      docker-proxy:
        condition: service_healthy
    networks:
      - docker-control

  # ============================================================================
  # Docker Socket Proxy  (ACTIVE — safer alternative to mounting the socket)
  # ============================================================================
  # Instead of mounting /var/run/docker.sock directly into the AuraGo container
  # (which grants root-equivalent host access), this proxy only exposes the API
  # subset needed by the opt-in Docker features.
  #
  # SECURITY NOTES:
  #   - The proxy filters API paths, not request bodies. It reduces attack surface
  #     but does not contain a compromised AuraGo: container create with host
  #     binds is allowed. Keep the docker-control network private.
  #   - The proxy is isolated on the docker-control network, shared only with AuraGo
  #   - POST=1 allows create/start/stop/remove (managed sidecars, Software Store, Invasion Control)
  #   - IMAGES=1 + POST=1 allow AuraGo to pull pinned managed sidecar images
  #     such as go2rtc, Code Studio, and the optional llama.cpp GPU embedding probes
  #   - BUILD=0 keeps Docker build API access disabled; Code Studio and most managed
  #     sidecars pull published images. Images AuraGo builds through the Engine API
  #     (the Homepage dev image on first use, the CommandCode fallback build, local
  #     Code Studio runtime images, the security proxy's rate-limit Caddy image when
  #     rate limiting is on) need BUILD=1 or must already exist on the host.
  #     The browser-automation auto-build needs the Docker CLI, which the AuraGo
  #     image does not include; build that image on the host if you need it.
  #   - EXEC=1 is used by the agent's Docker exec, the Homepage tool, Code Studio
  #     terminals, the built-in OpenSCAD compiler container, the CYD Creator
  #     builder, Web UI container
  #     terminals (including the CommandCode Store terminal), the code sandbox
  #     and security-proxy reloads; see documentation/docker_installation.md §4
  #     before setting 0
  #
  docker-proxy:
    # Pinned release tag plus multi-arch index digest; update both together
    # (refresh procedure: documentation/docker_installation.md §4).
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: aurago_docker_proxy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro  # :ro is no security gain: API calls still pass through the socket
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - NETWORKS=1
      - VOLUMES=1
      - INFO=1          # passive runtime inventory (including NVIDIA container runtime availability)
      - VERSION=1       # negotiate a mutually supported Engine API before operations
      - POST=1          # allow create/start/stop/remove (managed sidecars, Software Store, Invasion Control)
      - BUILD=0          # Docker build API stays disabled; images AuraGo builds itself need BUILD=1 (see SECURITY NOTES)
      - COMMIT=0
      - EXEC=1          # agent Docker exec, Homepage tool, Code Studio, OpenSCAD compiler, CYD Creator builder, container terminals, code sandbox, security-proxy reloads; see documentation/docker_installation.md §4 before setting 0
      - SWARM=0
    healthcheck:
      # Enhanced healthcheck: verify both ping and container list API work
      test: ["CMD-SHELL", "wget -q --spider http://localhost:2375/_ping && wget -q --spider http://localhost:2375/containers/json?limit=1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - docker-control

networks:
  docker-control:
    internal: true
